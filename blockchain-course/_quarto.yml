project:
  type: website
  output-dir: _site
  resources:
    - _extensions/aci/logos/
    - assets/labs
    - assets/vendor
    - assets/mindmap.html
    - glossary/index.pdf
    - glossary/terms.json
  post-render:
    - scripts/patch_quarto_output.py
  preview:
    port: 9001

website:
  title: "Blockchain Intelligence Analysis"
  search: 
    location: navbar
    type: overlay
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: primer.qmd
        text: Primer
      - href: glossary/index.qmd
        text: Glossary
      - href: assets/mindmap.html
        text: Mind map
      - href: run-labs.qmd
        text: Run labs
      - href: explorers.qmd
        text: Explorers

# Run on every page. cite-notes moves a lesson slide's citations into its speaker notes (RevealJS only), before
# Quarto's own filters; asof shows a tagged "as of" date, `[11 Nov 2026]{.asof}`, in parentheses.
filters:
  - at: pre-ast
    path: filters/cite-notes.lua
  - filters/asof.lua

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    html-math-method: mathml
    toc: true
