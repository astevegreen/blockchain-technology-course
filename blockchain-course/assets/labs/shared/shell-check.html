<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shell check</title>
<link rel="stylesheet" href="look.css">
</head>
<body>
<div data-lab-root></div>
<script src="shell.js"></script>
<script>
/* A check of the shell, not a lab: it walks all seven steps with placeholder content so a builder can see each
   step work (projector mode, Restart, a reload that resumes). Real labs follow a design card in docs/lab-cards/. */
LabShell.start({
  id: "shell-check",
  title: "Shell check",
  slide: { title: "The lab look", href: "index.html" },
  steps: {
    "case": { html: "<p>This page checks the lab shell. Each step below is a placeholder that shows what the step does.</p>" },
    commit: {
      question: "When you press the button on the next step, which result will it show?",
      choices: ["Result A", "Result B"]
    },
    "do": {
      render: function (el, api) {
        el.appendChild(api.el("p", null, "A lab's own interaction goes here. This one has a single button."));
        el.appendChild(api.el("div", { class: "tx" },
          api.el("div", { class: "ins" }, api.coin({ role: "input", amount: "0.50", who: "A" })),
          api.el("div", { class: "arrow", "aria-hidden": "true" }, "→"),
          api.el("div", { class: "outs" },
            api.coin({ role: "output", amount: "0.30", who: "B" }),
            api.coin({ role: "change", amount: "0.19", who: "A" }),
            api.coin({ role: "fee", amount: "0.01", who: "fee" }))));
        el.appendChild(api.el("p", null, api.el("button", { class: "btn", type: "button",
          onclick: function () { api.finish({ choice: 0, note: "<p>The button always shows Result A.</p>" }); } }, "Press")));
      }
    },
    name: { term: "shell", parts: "shell: the frame around the lab", plain: "<p>One step names one term, with its parts and its plain meaning.</p>" },
    explorer: { html: "<p>The same thing as an analyst would meet it in an explorer: <span class=\"hash\">" + LabShell.short("3f9a1c0d77b2e8f1c4a9e04b") + "</span></p>" },
    twist: {
      html: "<p>Change one thing: the button now shows Result B.</p>",
      question: "Which result will it show now?",
      choices: ["Result A", "Result B"],
      answer: 1,
      why: "<p>The changed fact decides it.</p>"
    },
    tell: {
      prompt: "<p>Write one sentence for an agent, with a confidence word.</p>",
      example: "The shell works on this machine, with High confidence: every step ran."
    }
  }
});
</script>
</body>
</html>
