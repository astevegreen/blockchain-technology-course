<style>
  .block-head { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; align-items: center; padding: 0.6rem 0.8rem; border: 2px solid var(--rule); border-radius: 8px; background: var(--panel); margin: 0.6rem 0; }
  .lbl { font-size: 0.8rem; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }
  .pays { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; padding: 0; list-style: none; }

  .nodes { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.6rem 0; }
  button.node { font: inherit; background: none; border: 0; padding: 2px; cursor: pointer; border-radius: 6px; }
  button.node:disabled { cursor: default; opacity: 0.55; }
  button.node:focus-visible { outline: 3px solid var(--ink); }
  button.node:not(:disabled):hover .hash { background: var(--accent-tint); border-color: var(--accent-strong); }
  .climb { display: grid; gap: 0.4rem; margin: 0.6rem 0; padding: 0; list-style: none; }
  .climb li { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; padding: 0.4rem 0.6rem; border: 2px solid var(--rule); border-radius: 8px; background: var(--panel); }
  .climb li.bad { border-color: var(--private-key); background: var(--private-key-tint); }
  .hash.bad { border-color: var(--private-key); background: var(--private-key-tint); color: #7a3300; }
  .hash.ok { border-color: var(--output); background: var(--output-tint); color: #064d39; }
  .hash.pickd { border-color: var(--input); background: var(--input-tint); }
  .flag { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 4px; font-weight: 800; border: 2px solid; }
  .flag.ok { border-color: var(--output); background: var(--output-tint); color: #064d39; }
  .flag.ok::before { content: "\2713  "; }
  .flag.bad { border-color: var(--private-key); background: var(--private-key-tint); color: #7a3300; }
  .flag.bad::before { content: "\2717  "; }
  .row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; margin: 0.6rem 0; }
  .made { font-size: 0.85rem; color: var(--ink-soft); }
  .size-row input[type=range] { flex: 1 1 14rem; }
  .proofcol { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.5rem 0; }
  .proofcol .hash { font-size: 0.8em; padding: 0.1em 0.4em; }

    var all = [leaves];
    function up(cur) {
      if (cur.length === 1) return Promise.resolve(all);
      var jobs = [];
      for (var i = 0; i < cur.length; i += 2) jobs.push(pair(cur[i], cur[i + 1 < cur.length ? i + 1 : i]));
      return Promise.all(jobs).then(function (next) { all.push(next); return up(next); });
    }
    return up(leaves);
  }

  function walk(start, steps) { // steps: [{ hash, left }]; returns every hash on the way up, start first
    var out = [start];
    return steps.reduce(function (p, s) {
      return p.then(function (cur) { return (s.left ? pair(s.hash, cur) : pair(cur, s.hash)).then(function (n) { out.push(n); return n; }); });
    }, Promise.resolve(start)).then(function () { return out; });
  }

  function chip(api, hex, cls) { return api.el("span", { class: "hash" + (cls ? " " + cls : ""), title: hex }, api.short(hex, 4)); }

  function render(box, api) {
    var el = api.el;
    if (!SUBTLE) { box.appendChild(el("p", { class: "made" }, "This page needs the browser's built-in hashing (Web Crypto). Open it from the course site or a local file in a current browser.")); return; }
    var tree, anaLeaf, tamperLeaf;
    var picks = [];      // [{ level, index }]
    var path = null;     // hashes climbed with the picks
    var phase = "pick";  // pick, result, ask, rechecked
    var guess = null;
    var redo = null;     // the recheck climb with 3.00 BTC
    var sliderAt = 3, reached = false, busy = false;

    function status(t) { api.say(t); }

    function pickedSteps() {
      return picks.map(function (p) { return { hash: tree[p.level][p.index], left: p.index < (ANA >> p.level) }; });
    }

    function onPick(level, index) {
      if (busy) return;
      busy = true;
      picks.push({ level: level, index: index });
      walk(anaLeaf, pickedSteps()).then(function (p) {
        path = p; busy = false;
        if (picks.length === 3) { phase = "result"; }
        draw();
      });
    }

    function root() { return tree[3][0]; }

    function drawBlock(parent, withRoot) {
      parent.appendChild(el("p", { class: "made" }, "A made-up block of eight payments, for this lab. Each payment's hash is a leaf of the tree."));
      var ul = el("ul", { class: "pays", "aria-label": "The block's eight payments" });
      PAYS.forEach(function (t, i) {
        var tampered = phase === "ask" || phase === "rechecked";
        ul.appendChild(el("li", { class: i === ANA ? "mine" : "" }, i === ANA ? el("span", { class: "lbl" }, "your payment ") : null, i === ANA && tampered ? TAMPERED : t));
      });
      parent.appendChild(ul);
      if (withRoot) parent.appendChild(el("div", { class: "block-head" }, el("span", { class: "lbl" }, "header root"), chip(api, toHex(root())),
        el("span", { class: "made" }, "printed on the block's header before you start; nothing you do changes it")));
    }

    function climbList(hashes, bad) {
      var ol = el("ol", { class: "climb", "aria-label": "The climb, bottom up" });
      for (var i = 0; i < picks.length; i++) {
        var p = picks[i];
        ol.appendChild(el("li", { class: bad ? "bad" : "" },
          el("span", { class: "lbl" }, "level " + (i + 1)),
          chip(api, toHex(hashes[i]), bad ? "bad" : ""), "+", chip(api, toHex(tree[p.level][p.index]), "pickd"), "→", chip(api, toHex(hashes[i + 1]), bad ? "bad" : "ok")));
      }
      return ol;
    }

    function draw() {
      box.innerHTML = "";
      var live = el("div", { "aria-live": "polite" });
      if (phase === "pick") {
        box.appendChild(el("p", null, "A made-up block holds eight payments, and one is Ana's 0.30 BTC to Ben. You hold Ana's payment and the block's header. Prove it is inside: at each level, click the hash that pairs with yours."));
        drawBlock(box, true);
        var lv = picks.length;
        if (lv > 0) { box.appendChild(el("p", null, el("span", { class: "lbl" }, "so far (your hash climbs)")));
          box.appendChild(climbList(path)); }
        box.appendChild(el("p", null, el("strong", null, "Level " + (lv + 1) + " of 3: "), "click the hash that pairs with yours."));
        var row = el("div", { class: "nodes", role: "group", "aria-label": "Hashes at this level" });
        tree[lv].forEach(function (h, i) {
          var isMine = toHex(path ? path[lv] : anaLeaf) === toHex(h);
          var label = isMine ? "Yours" : "Hash " + (i + 1) + " of " + tree[lv].length;
          row.appendChild(el("button", { type: "button", class: "node", disabled: isMine, "aria-label": label + ": " + toHex(h).slice(0, 8),
            onclick: function () { onPick(lv, i); } },
            el("span", { class: "hash" + (isMine ? " pickd" : "") }, (isMine ? "yours " : "") + api.short(toHex(h), 4))));
        });
        box.appendChild(row);
        status("Pick the hash that pairs with yours. The page hashes the pair and the result climbs.");
        return;
      }
      drawBlock(box, true);
      var match = toHex(path[3]) === toHex(root());
      if (phase === "result") {
        box.appendChild(climbList(path, !match));
        box.appendChild(el("div", { class: "block-head" }, el("span", { class: "lbl" }, "climbed to"), chip(api, toHex(path[3]), match ? "ok" : "bad"),
          el("span", { class: "lbl" }, "header root"), chip(api, toHex(root())),
          el("span", { class: "flag " + (match ? "ok" : "bad") }, match ? "Match: proof accepted" : "Rejected: the root does not match")));
        if (!match) {
          box.appendChild(el("p", null, "At least one hash you picked sits on a different branch: a cousin, not the sibling. The pair you hash must be the two children of the same parent. Try again."));
          box.appendChild(el("button", { class: "btn primary", type: "button", onclick: function () { picks = []; path = null; phase = "pick"; draw(); } }, "Try again"));
          status("Rejected. Try again.");
        } else {
          box.appendChild(el("p", null, "Three hashes were enough: one per level, not the other seven payments' worth. These three are the proof."));
          box.appendChild(el("button", { class: "btn primary", type: "button", onclick: function () { phase = "ask"; draw(); } }, "Now change Ana's payment to 3.00 BTC"));
          status("Accepted.");
        }
        return;
      }
      // ask / rechecked: Ana's payment is now 3.00 BTC, same three hashes
      box.appendChild(el("p", null, "Ana's payment is now ", el("strong", null, "0.30 → 3.00 BTC"), ". Same three proof hashes, same header."));
      var q = el("fieldset", { class: "choices" }, el("legend", null, "Same three hashes: does it still pass? (not scored)"));
      ["Yes, it still passes.", "No, it is rejected."].forEach(function (t, i) {
        q.appendChild(el("label", { class: "choice" }, el("input", { type: "radio", name: "same3", value: i, checked: guess === i, disabled: phase === "rechecked",
          onchange: function () { guess = i; draw(); } }), el("span", null, t)));
      });
      box.appendChild(q);
      if (phase === "ask") {
        box.appendChild(el("button", { class: "btn primary", type: "button", disabled: guess === null, onclick: function () {
          if (busy) return; busy = true;
          walk(tamperLeaf, pickedSteps()).then(function (r) { redo = r; phase = "rechecked"; busy = false; draw(); });
        } }, "Recheck the proof"));
        status(guess === null ? "Say yes or no first; it is not scored." : "Recheck when you are ready.");
        return;
      }
      box.appendChild(climbList(redo, true));
      box.appendChild(el("div", { class: "block-head" }, el("span", { class: "lbl" }, "climbed to"), chip(api, toHex(redo[3]), "bad"),
        el("span", { class: "lbl" }, "header root"), chip(api, toHex(root())), el("span", { class: "flag bad" }, "Rejected: the root does not match")));
      box.appendChild(el("p", null, "Every level turned red: one changed payment changes its hash, and every hash above it. The three proof hashes cannot hide that."));
      drawSlider(box);
    }

    function drawSlider(parent) {
      var n = Math.pow(2, sliderAt);
      parent.appendChild(el("h3", null, "Now make the block bigger"));
      var input = el("input", { type: "range", min: "3", max: "11", step: "1", value: String(sliderAt), id: "size", "aria-valuetext": n.toLocaleString("en-US") + " transactions, " + sliderAt + " proof hashes",
        oninput: function () { sliderAt = Number(input.value); update(); } });
      var out = el("div", { "aria-live": "polite" });
      var col = el("div");
      parent.appendChild(el("div", { class: "row size-row" }, el("label", { for: "size" }, "Transactions in the block: "), input));
      parent.appendChild(out); parent.appendChild(col);
      function update() {
        var k = sliderAt, size = Math.pow(2, k);
        out.innerHTML = ""; col.innerHTML = "";
        out.appendChild(el("p", null, el("strong", null, size.toLocaleString("en-US") + " transactions"), " need ", el("strong", null, k + " proof hashes"), ". ",
          size > 8 ? "The tree is no longer drawn: it does not fit." : "The block you just used."));
        var pc = el("div", { class: "proofcol", role: "list", "aria-label": "The proof column" });
        for (var i = 0; i < k; i++) pc.appendChild(el("span", { class: "hash", role: "listitem" }, "hash " + (i + 1)));
        col.appendChild(el("span", { class: "lbl" }, "proof"));
        col.appendChild(pc);
        if (k === 11 && !reached) {
          reached = true;
          api.finish({ choice: 3, note: "<p>The proof needs <strong>11</strong> hashes for a block of 2,048 transactions. Each doubling of the block adds one hash, and 2,048 is 2<sup>11</sup>.</p><p>Your first check passed with three hashes for eight payments; a wrong sibling or a changed payment sent the root off and the proof was rejected.</p><p class=\"src\">Sources: <code>@narayanan_bitcoincryptocurrencytechnologies_2016</code> (a proof grows by one hash each time the block doubles). The block of eight is made up.</p>" });
        }
      }
      update();
    }

    Promise.all(PAYS.map(leaf).concat([leaf(TAMPERED)])).then(function (all) {
      tamperLeaf = all.pop();
      anaLeaf = all[ANA];
      return levelsOf(all);
    }).then(function (t) { tree = t; draw(); });
  }

  function explorer(box, api) {
    var el = api.el;
    var ids = []; for (var i = 0; i < TXIDS.length; i += 64) ids.push(TXIDS.substr(i, 64));
    box.appendChild(el("p", null, "Alice's payment from day 1, ", el("span", { class: "hash" }, "0627052b…c2f2"),
      ", is in block 277,316, which holds " + ids.length + " transactions. The block's page shows one Merkle root for all " + ids.length + "."));
    if (!SUBTLE) { box.appendChild(el("p", null, "Needs the browser's built-in hashing to rebuild the root.")); return; }
    var at = ids.indexOf(ALICE);
    var out = el("div", { "aria-live": "polite" }, el("p", { class: "made" }, "Rebuilding the root…"));
    box.appendChild(out);
    var level = ids.map(function (h) { return rev(fromHex(h)); });
    var steps = [], idx = at;
    function climb(cur) {
      if (cur.length === 1) return Promise.resolve(cur[0]);
      if (cur.length % 2) cur = cur.concat([cur[cur.length - 1]]);
      var sib = idx % 2 ? idx - 1 : idx + 1;
      steps.push(cur[sib]);
      var jobs = []; for (var j = 0; j < cur.length; j += 2) jobs.push(pair(cur[j], cur[j + 1]));
      return Promise.all(jobs).then(function (next) { idx = idx >> 1; return climb(next); });
    }
    climb(level).then(function (r) {
      var rebuilt = toHex(rev(r));
      var ok = rebuilt === REAL_ROOT;
      out.innerHTML = "";
      out.appendChild(el("p", null, "The page built Alice's proof from the block's " + ids.length + " transaction IDs: ", el("strong", null, steps.length + " hashes"),
        ", since 2",
        el("sup", null, String(steps.length)), " = " + Math.pow(2, steps.length) + " is the first power of two that holds " + ids.length + "."));
      var pc = el("div", { class: "proofcol", "aria-label": "Alice's proof" }, el("span", { class: "lbl" }, "proof "));
      steps.forEach(function (s) { pc.appendChild(chip(api, toHex(rev(s)))); });
      out.appendChild(pc);
      out.appendChild(el("div", { class: "block-head" }, el("span", { class: "lbl" }, "rebuilt root"), chip(api, rebuilt, ok ? "ok" : "bad"),
        el("span", { class: "lbl" }, "explorer's root"), chip(api, REAL_ROOT),
        el("span", { class: "flag " + (ok ? "ok" : "bad") }, ok ? "Match" : "No match")));
      out.appendChild(el("p", null, "Lightweight (SPV) wallets check their payments this way: a few hashes and the block header, not the block."));
      out.appendChild(el("p", { class: "src", html: "Sources: <code>@antonopoulos_masteringbitcoinprogramming_2017</code> and <code>@mempoolspace_transaction0627052b_2013</code> (Alice's payment is in block 277,316, as of 31 Oct 2026); <code>@mempoolspace_block277316_2026</code> (419 transactions, as of 10 Nov 2026); <code>@mempoolspace_block277316txids_2026</code> (the 419 txids and the root, captured 11 Nov 2026); <code>@bitcoin.orgdevelopers_operatingmodesdeveloper_2024</code> and <code>@nakamoto_bitcoinpeertopeerelectronic_2008</code> (SPV)." }));
    });
  }

  LabShell.start({
    id: "merkle-trees",
    title: "Prove it is in the block",
    slide: { title: "A Merkle proof shows a tx is in a block",
      href: "../../../lessons/bitcoin/02-BF-transactions_and_mining.html#/a-merkle-proof-shows-a-tx-is-in-a-block" },
    steps: {
      "case": { html: "<p>An informant tells an agent that a payment is in a block, and sends a short file of hashes as proof. The agent has none of the block's transactions.</p><p><strong>Is a short file enough to check, or is it missing most of the block?</strong></p>" },
      commit: {
        question: "A block holds 2,048 transactions. You have one payment's transaction ID and the block's header. How many other hashes do you need to prove the payment is inside?",
        choices: ["About 2,048: all the others.", "About 1,000: half of them.", "About 45.", "11."]
      },
      "do": { render: render },
      name: { term: "Merkle proof", parts: "Merkle + proof: Ralph Merkle, who described trees of hashes + the hashes beside one transaction's path to the root",
        plain: "<p>The few hashes that, with one transaction, rebuild the root in a block's header. Change one byte of the transaction, or use one wrong hash, and the root does not match.</p>" +
          "<p>A block's transaction IDs are hashed in pairs, up to a single root in the header; an odd one is hashed with a copy of itself. Bitcoin hashes each pair twice with SHA-256.</p><p class=\"src\">Sources: <code>@bitcoin.orgdevelopers_blockchaindeveloper_2024</code> (pairs up to one root; the odd one pairs with a copy of itself; a proof is the hashes beside one transaction's path); <code>@antonopoulos_masteringbitcoinprogramming_2017</code> (double SHA-256); <code>@merkle_digitalsignaturebased_1988</code> (Ralph Merkle, trees of hashes).</p>" },
      explorer: { render: explorer },
      twist: {
        html: "<p>A proof checks green. But the person who sent it also sent the header. Here it is done: a made-up block of eight with a payment that never happened, <strong>Mal pays Ana 5.00 BTC</strong>, built into its own tree and its own header (all made up for this lab).</p>" +
          "<div class=\"block-head\"><span class=\"lbl\">payment</span><span class=\"hash\">0cf02f…0e18</span><span class=\"lbl\">header root (Mal's own)</span><span class=\"hash\">943c9b…1eaa</span><span class=\"flag ok\">Match: proof accepted</span></div>",
        question: "Does the green check show the payment is on Bitcoin?",
        choices: ["Yes: the root matched.", "Yes, if the hashes look real.", "No: the header must be one the chain holds, read from your own node or explorer.", "No: only a full node can check a proof."],
        answer: 2,
        why: "<p>A proof only ties a transaction to a header. Anyone can build a tree and a header around a made-up payment, so the header must be one the chain holds. An SPV wallet trusts only headers from the longest proof-of-work chain.</p><p class=\"src\">Source: <code>@nakamoto_bitcoinpeertopeerelectronic_2008</code> (section 8). The fake block is made up.</p>"
      },
      tell: {
        prompt: "<p>An informant says a payment is in block 277,316 and sends a short file of hashes as proof. Tell the agent what the proof shows, in one sentence with a confidence word.</p>",
        example: "Transaction 0627052b…c2f2 is in block 277,316 (High confidence: its nine proof hashes rebuild the Merkle root in that block's header, which we read from our own explorer, not from the informant's file). The proof shows only that the payment is in the block, not who controls the paying address."
      }
    }
  });
})();
