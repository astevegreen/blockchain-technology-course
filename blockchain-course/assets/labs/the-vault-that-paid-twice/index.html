<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The vault that paid twice</title>
<link rel="stylesheet" href="../shared/look.css">
<style>
.panel { border: 1px solid var(--rule); border-radius: 6px; padding: .5em .8em; margin: .8em 0; }
.panel h3 { margin: 0 0 .3em; font-size: 1em; }
.facts td, .facts th { padding: .15em .8em .15em 0; text-align: left; vertical-align: top; }
.tree, .tree ul { list-style: none; margin: .2em 0; padding-left: 0; }
.tree ul { padding-left: 1.4em; border-left: 2px solid var(--rule); }
.call { margin: .25em 0; display: flex; flex-wrap: wrap; gap: .4em; align-items: center; }
.call .fn { font-family: var(--mono); font-size: .92em; }
.ledger { display: flex; gap: 1.2em; flex-wrap: wrap; margin: .6em 0; font-variant-numeric: tabular-nums; }
.ledger div { border: 2px solid var(--ink); border-radius: 4px; padding: .2em .7em; background: var(--panel); }
.ledger .loss { border-color: var(--private-key); background: var(--private-key-tint); }
.ops td, .ops th { padding: .12em .7em .12em 0; text-align: left; }
.nolog { color: var(--ink-soft); font-size: .9em; }
</style>
</head>
<body>
<div data-lab-root></div>
<script src="../shared/shell.js"></script>
<script>
/* Design card: docs/lab-cards/the-vault-that-paid-twice.md. The vaults, balances, addresses, transaction hashes
   and the protocol's message are made up for this lab. The call trace is the one such a vault and such an
   attacker contract produce: the vault pays before it updates its records and writes an event only on a
   deposit. It is stored here as data, written by hand: no anvil run was available at build, so it has not been recorded from the EVM (docs/follow-ups.md). The page adds nothing to it. */
var VAULT = "0x7d1e5a90c2b84f36e1a07d93bc5f28e4a6d0a3f2";
var ATTACKER = "0xc0de4b71a93e58d20f6b8c14e7a52d90f3e6b17a";
var TX = "0x3b9e07a4d15c82f6e0b93a7d41c85e2f96a0d7b3c18e4f52a9d60b7e3c5ac4d1";
var DEPTH = 5;   // withdraw is called five times, each inside the vault's last payment

/* The call tree of the drain, outside in; depth is the nesting. A payment is a call that carries ETH, and
   it has no log. */
function buildTrace() {
  var nodes = [
    { depth: 0, from: "wallet", to: "attacker", fn: "attack()", eth: 1, kind: "in", log: false, note: "the one transaction; it carries 1 ETH" },
    { depth: 1, from: "attacker", to: "vault", fn: "deposit()", eth: 1, kind: "in", log: true, note: "1 ETH in, recorded to the attacker's contract; the vault logs a Deposit" }
  ];
  for (var level = 1; level <= DEPTH; level++) {
    nodes.push({ depth: 2 * level - 1, from: "attacker", to: "vault", fn: "withdraw()", eth: 0, log: false, level: level,
      note: level === 1 ? "asks for its 1 ETH back" : "called again from inside the last payment" });
    nodes.push({ depth: 2 * level, from: "vault", to: "attacker", fn: "(plain payment)", eth: 1, kind: "out", pay: true, log: false, level: level,
      note: level < DEPTH ? "1 ETH sent before the vault updates its records, so the attacker's contract runs and asks again"
        : "1 ETH sent; this time the attacker's contract does not call back, and the calls unwind" });
  }
  return nodes;
}
var TRACE = buildTrace();
var PAYMENTS = TRACE.filter(function (n) { return n.pay; }).length;   // 5

function who(api, name) {
  return name === "vault" ? api.el("span", { class: "addr", title: VAULT }, "vault " + api.short(VAULT, 4))
    : name === "attacker" ? api.el("span", { class: "addr", title: ATTACKER }, "attacker " + api.short(ATTACKER, 4))
    : api.el("span", null, "attacker's wallet");
}

/** Put li at the given nesting depth under root; stack remembers the open node at each depth. */
function place(api, root, stack, li, depth) {
  stack.length = depth;
  if (depth === 0) root.appendChild(li);
  else {
    var parent = stack[depth - 1];
    var ul = parent.querySelector(":scope > ul");
    if (!ul) { ul = api.el("ul"); parent.appendChild(ul); }
    ul.appendChild(li);
  }
  stack.push(li);
}

LabShell.start({
  id: "the-vault-that-paid-twice",
  title: "The vault that paid twice",
  slide: { title: "Reading a reentrancy: one call nested in itself", href: "../../../lessons/forensics/10-FO-flash_loans_reentrancy_oracles.html#/reading-a-reentrancy-one-call-nested-in-itself" },
  steps: {
    "case": { html:
      "<p>An agent forwards a screenshot from a protocol's support channel: " +
      "<em>\"Our vault shows zero. The explorer shows one small deposit and nothing leaving. Where did the money go?\"</em> " +
      "The transaction is attached.</p>" +
      "<p>The protocol, the vault and the message are made up for this lab.</p>" },
    commit: {
      question: "The vault held 4 ETH of its depositors' money. One transaction later it holds nothing. Its Logs tab shows a single entry: a deposit of 1 ETH. Where did the 4 ETH go?",
      choices: [
        "Nowhere that can be traced: no log, no record.",
        "The logs were deleted after the theft.",
        "Out in payments that the logs do not record, so open the calls.",
        "Out in another transaction, signed with a stolen key."
      ]
    },
    "do": { render: function (el, api) {
      var shown = 0, paid = 0, finished = false, stack = [];
      var list = api.el("ul", { class: "tree" });
      var inn = api.el("output", null, "0 ETH"), out = api.el("output", null, "0 ETH"), loss = api.el("output", null, "0 ETH");
      var nextBtn = api.el("button", { class: "btn primary", type: "button" }, "Open the first call");
      var status = api.el("p", { role: "status" });

      el.appendChild(api.el("table", { class: "facts" },
        api.el("tr", null, api.el("th", null, "Vault"), api.el("td", null, api.el("span", { class: "addr", title: VAULT }, api.short(VAULT, 4)))),
        api.el("tr", null, api.el("th", null, "Balance"), api.el("td", null, "0 ETH")),
        api.el("tr", null, api.el("th", null, "Transactions"), api.el("td", null, "1: ", api.el("span", { class: "hash", title: TX }, api.short(TX, 4)))),
        api.el("tr", null, api.el("th", null, "Logs"), api.el("td", null, "1: a deposit of 1 ETH"))));
      el.appendChild(api.el("p", null, "Start at the drained vault and open the transaction's calls from the outside in, one at a time. The counter adds each payment the vault makes as it opens. Open every call: Next unlocks when the last one is open."));
      el.appendChild(api.el("div", { class: "ledger" },
        api.el("div", null, "Paid in: ", inn), api.el("div", null, "Paid out by the vault: ", out), api.el("div", { class: "loss" }, "Loss: ", loss)));
      el.appendChild(nextBtn);
      el.appendChild(status);
      el.appendChild(list);

      function open() {
        if (shown >= TRACE.length) return;
        var n = TRACE[shown++];
        var li = api.el("li", null,
          api.el("div", { class: "call" }, who(api, n.from), " calls ", who(api, n.to), " ",
            api.el("span", { class: "fn" }, n.fn), " ",
            n.eth ? api.coin({ role: n.kind === "out" ? "output" : "input", amount: n.eth + " ETH", who: n.kind === "out" ? "paid out" : "paid in" }) : api.el("span", { class: "nolog" }, "0 ETH"),
            " ", api.el("span", { class: "nolog" }, n.log ? "(log: Deposit, 1 ETH)" : "(no log)")),
          api.el("div", { class: "nolog" }, n.note));
        place(api, list, stack, li, n.depth);
        if (n.fn === "deposit()") inn.textContent = "1 ETH";
        if (n.pay) { paid += n.eth; status.textContent = "Payment " + n.level + " of " + PAYMENTS + ": the vault sent 1 ETH and no log says so."; }
        out.textContent = paid + " ETH";
        loss.textContent = Math.max(0, paid - 1) + " ETH";
        if (shown < TRACE.length) { nextBtn.textContent = "Open the call inside"; return; }
        nextBtn.disabled = true;
        nextBtn.textContent = "All calls open";
        el.appendChild(api.el("details", { class: "panel" }, api.el("summary", null, "The raw fields of the last payment"),
          api.el("table", { class: "facts" },
            api.el("tr", null, api.el("th", null, "From"), api.el("td", null, api.el("span", { class: "addr", title: VAULT }, api.short(VAULT, 4)))),
            api.el("tr", null, api.el("th", null, "To"), api.el("td", null, api.el("span", { class: "addr", title: ATTACKER }, api.short(ATTACKER, 4)))),
            api.el("tr", null, api.el("th", null, "Value"), api.el("td", null, "1 ETH")),
            api.el("tr", null, api.el("th", null, "Input data"), api.el("td", null, "none: a plain payment")),
            api.el("tr", null, api.el("th", null, "Logs written"), api.el("td", null, "0")))));

        status.textContent = PAYMENTS + " ETH paid out against 1 ETH paid in: a loss of " + (PAYMENTS - 1) + " ETH. Every payment is in the calls and none is in the logs.";
        if (!finished) {
          finished = true;
          api.finish({ choice: 2, note: "<p>The 4 ETH left in payments that the logs do not record, nested inside one another, and you opened every one. Answers (a) and (b) fail in front of you: every payment is there, in the calls. (d) fails too: there is one transaction, sent from the attacker's own wallet to its contract, and the drain happens inside it.</p><p class=\"src\">Sources: <code>@otterscan_otsnamespace_2026</code> (internal transfers are \"only unveiled by examining the internal calls\"); <code>@solidityteam_securityconsiderations_2026</code>.</p>" });
        }
      }
      nextBtn.addEventListener("click", open);
    } },
    name: {
      term: "reentrancy",
      parts: "re- (again) + entry",
      plain: "<p>A contract is called again before its first call has finished, and the second call sees the records the first had not yet updated. Here the vault paid before it updated its records, so each nested call still saw 1 ETH in the attacker's name.</p><p class=\"src\">Sources: <code>@solidityteam_securityconsiderations_2026</code>; <code>@ethereum.org_smartcontractsecurity_2026</code>; <code>@l34_ethereum_dao_vulnerability_2016</code>.</p>"
    },
    explorer: { render: function (el, api) {
      el.appendChild(api.el("p", null, "The same transaction in Otterscan, as an analyst meets it (a copy made up for this lab, not a live page). Three tabs, one after another."));
      el.appendChild(api.el("div", { class: "panel" }, api.el("h3", null, "Logs"),
        api.el("p", null, "1 entry: ", api.el("code", null, "Deposit"), ", 1 ETH, from the attacker's contract."),
        api.el("p", { class: "nolog" }, "A log exists only when the contract's code writes one. A plain ETH payment is the value a call carries, and the vault's code writes nothing when it pays.")));
      var tree = api.el("ul", { class: "tree" }), stack = [];
      TRACE.forEach(function (n) {
        var label = n.fn === "attack()" ? "attacker.attack()" : n.to === "vault" ? "vault." + n.fn : "attacker.receive()";
        place(api, tree, stack, api.el("li", null, api.el("div", { class: "call" },
          api.el("span", { class: "fn" }, label), " ",
          n.eth ? api.coin({ role: n.kind === "out" ? "output" : "input", amount: n.eth + " ETH" }) : "")), n.depth);
      });
      el.appendChild(api.el("div", { class: "panel" }, api.el("h3", null, "Trace"),
        api.el("p", { class: "nolog" }, "A call tree: withdraw nested inside itself, with a 1 ETH payment at each level."), tree));
      var ops = api.el("table", { class: "ops" }, api.el("tr", null, api.el("th", null, "#"), api.el("th", null, "From"), api.el("th", null, "To"), api.el("th", null, "Value")));
      for (var i = 1; i <= PAYMENTS; i++) ops.appendChild(api.el("tr", null, api.el("td", null, String(i)), api.el("td", null, "vault"), api.el("td", null, "attacker"), api.el("td", null, "1 ETH")));
      el.appendChild(api.el("div", { class: "panel" }, api.el("h3", null, "Internal operations"), ops));
      el.appendChild(api.el("p", null, "These are the slide's four rows: one transaction, a contract caller, withdraw and pay nested, and a loss beyond the deposit."));
      el.appendChild(api.el("p", { class: "src", style: "color:var(--ink-soft);font-size:0.85rem" }, "Sources: @otterscan_otterscan_2025 (Otterscan 2.11.0, as of 23 Oct 2026); @otterscan_otsnamespace_2026 (its trace is a call tree; internal ETH transfers show only in the internal calls); @solidityteam_securityconsiderations_2026 (an ether transfer hands control to the receiver, which can call back); @ethereum.org_smartcontractsecurity_2026 (the balance is updated only after the call); @l34_ethereum_dao_vulnerability_2016 (the DAO's repeated calls); @odni_icd203_2015 (confidence words). The vaults and transactions are made up for this lab."));
    } },
    twist: {
      html: "<p>A second transaction, on another vault, shows the same nesting, three levels deep, from a contract that deposited 3 ETH. The vault paid back 3 ETH, and still holds everyone else's funds.</p>" +
        "<div class=\"panel\"><h3>Another vault (made up for this lab)</h3><table class=\"facts\">" +
        "<tr><th>Paid in</th><td>3 ETH, by a contract</td></tr>" +
        "<tr><th>Calls</th><td><code>withdraw</code> nested three levels deep, 1 ETH paid at each</td></tr>" +
        "<tr><th>Paid out</th><td>3 ETH</td></tr>" +
        "<tr><th>Vault balance</th><td>everyone else's funds untouched</td></tr></table></div>",
      question: "Is this a reentrancy theft?",
      choices: [
        "Yes: the nesting proves it.",
        "No: it is a callback, and no loss shows.",
        "It cannot be read without the source code.",
        "Yes, but a smaller one."
      ],
      answer: 1,
      why: "<p>Some contracts call back legitimately, so nesting alone is not theft. The loss beyond the deposit is what makes it one, and here the vault paid back exactly what was put in. Low confidence as an attack. This is the slide's Ask.</p><p class=\"src\">Sources: <code>@l34_ethereum_dao_vulnerability_2016</code>; <code>@ethereum.org_smartcontractsecurity_2026</code>; the slide \"Reading a reentrancy: one call nested in itself\". Confidence words: <code>@odni_icd203_2015</code>.</p>"
    },
    tell: {
      prompt: "<p>Tell the agent where the vault's 4 ETH went. One sentence, with a confidence word.</p>",
      example: "Transaction 0x3b9e…c4d1 emptied the vault by reentrancy: the attacker's contract deposited 1 ETH and called withdraw five times, each call nested inside the vault's last payment, and took out 5 ETH, its own 1 and the depositors' 4 (Moderate confidence from the trace alone; the payments appear in the call trace, not the logs)."
    }
  }
});
</script>
</body>
</html>
