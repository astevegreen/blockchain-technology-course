<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ethereum PoS Security Console</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --panel-3: #f8fafc;
      --line: #e5e7eb;
      --line-soft: #e2e8f0;
      --text: #0f172a;
      --muted: #475569;
      --green: #16a34a;
      --green-soft: #f0fdf4;
      --blue: #2563eb;
      --blue-soft: #eff6ff;
      --yellow: #ca8a04;
      --yellow-soft: #fefce8;
      --red: #b91c1c;
      --red-soft: #fef2f2;
      --violet: #7c3aed;
      --violet-soft: #f5f3ff;
      --orange: #ea580c;
      --cyan: #0891b2;
      --shadow: none;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    button, select, input {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      max-width: 1120px;
      margin: 32px auto;
      padding: 0 16px;
      min-height: 0;
    }

    .sidebar {
      background: var(--panel-2);
      border-radius: 14px;
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(420px, 1.8fr);
      gap: 14px;
      align-items: start;
      min-height: 0;
    }

    .brand {
      display: grid;
      gap: 5px;
      grid-column: 1 / -1;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    h3 {
      margin: 0;
      font-size: 13px;
      color: var(--text);
      letter-spacing: 0;
    }

    p { margin: 0; }

    .small {
      font-size: 12px;
      color: var(--muted);
      overflow-wrap: anywhere;
    }

    .micro {
      font-size: 11px;
      color: var(--muted);
    }

    .panel {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .panel.quiet {
      background: var(--panel-3);
      box-shadow: none;
    }

    .stack {
      display: grid;
      gap: 10px;
    }

    .label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .select, .btn, .range {
      width: 100%;
    }

    .select, .btn {
      min-height: 38px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
      padding: 8px 10px;
    }

    .btn {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      user-select: none;
    }

    .btn:hover {
      border-color: #cbd5e1;
      background: #f8fafc;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
    }

    .btn.success {
      background: var(--green);
      border-color: var(--green);
      color: #ffffff;
    }

    .btn.warn {
      background: var(--yellow-soft);
      border-color: #facc15;
      color: #713f12;
    }

    .btn.danger {
      background: var(--red-soft);
      border-color: #fecaca;
      color: var(--red);
    }

    .btn-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .action-card {
      display: grid;
      gap: 6px;
      background: #ffffff;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 8px;
    }

    .action-card .btn {
      min-height: 42px;
    }

    .action-card p {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .main {
      min-width: 0;
      padding: 0;
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .title-block {
      display: grid;
      gap: 4px;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(280px, 0.7fr);
      gap: 14px;
    }

    .scenario-brief {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 0.7fr);
      gap: 14px;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      align-items: start;
      min-width: 0;
    }

    .brief-copy {
      display: grid;
      gap: 8px;
    }

    .brief-copy p {
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .reminder {
      background: #ffffff;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .outcome {
      background: var(--blue-soft);
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 10px;
      display: grid;
      gap: 4px;
    }

    .outcome strong {
      font-size: 12px;
      color: var(--blue);
    }

    .outcome p {
      color: var(--text);
      font-size: 13px;
    }

    .step-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .step-list li {
      display: grid;
      grid-template-columns: 26px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      background: #ffffff;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 9px;
      color: var(--muted);
      font-size: 12px;
      min-width: 0;
    }

    .step-list .num {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: var(--blue-soft);
      color: var(--blue);
      font-weight: 700;
      font-size: 12px;
    }

    .view {
      min-width: 0;
      min-height: 0;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .side-view {
      min-width: 0;
      min-height: 0;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      background: #ffffff;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 10px;
      min-height: 68px;
      display: grid;
      gap: 4px;
    }

    .metric .value {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 3px 9px;
      font-size: 12px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: #ffffff;
      white-space: nowrap;
    }

    .status-pill.good {
      background: var(--green-soft);
      border-color: #bbf7d0;
      color: #166534;
    }

    .status-pill.warn {
      background: var(--yellow-soft);
      border-color: #fde68a;
      color: #713f12;
    }

    .status-pill.bad {
      background: var(--red-soft);
      border-color: #fecaca;
      color: var(--red);
    }

    .timeline {
      display: grid;
      grid-template-columns: repeat(32, minmax(18px, 1fr));
      gap: 4px;
    }

    .timeline-explain {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .timeline-explain .phase {
      background: #ffffff;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 8px;
      display: grid;
      gap: 3px;
      font-size: 12px;
      color: var(--muted);
    }

    .timeline-explain strong {
      color: var(--text);
      font-size: 12px;
    }

    .epoch-track {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 8px;
    }

    .epoch-marker {
      background: #ffffff;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 9px;
      min-height: 78px;
      display: grid;
      gap: 4px;
      align-content: start;
    }

    .epoch-marker strong {
      color: var(--text);
      font-size: 13px;
    }

    .epoch-marker span {
      color: var(--muted);
      font-size: 12px;
    }

    .epoch-marker.finalized {
      background: var(--green-soft);
      border-color: #bbf7d0;
    }

    .epoch-marker.delayed {
      background: var(--red-soft);
      border-color: #fecaca;
    }

    .epoch-marker.recovering {
      background: var(--yellow-soft);
      border-color: #fde68a;
    }

    .epoch-marker.ready {
      background: var(--blue-soft);
      border-color: #bfdbfe;
    }

    .slot {
      min-height: 46px;
      border: 1px solid var(--line-soft);
      border-radius: 6px;
      background: #ffffff;
      display: grid;
      place-items: center;
      font-size: 10px;
      color: var(--muted);
      position: relative;
    }

    .slot.active {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: #1d4ed8;
    }

    .slot.fork-a {
      border-color: var(--blue);
      background: var(--blue-soft);
      color: #1d4ed8;
    }

    .slot.fork-b {
      border-color: var(--violet);
      background: var(--violet-soft);
      color: #5b21b6;
    }

    .slot.vote {
      border-color: var(--green);
      background: var(--green-soft);
      color: #166534;
    }

    .slot.justified {
      border-color: var(--yellow);
      color: #713f12;
    }

    .slot.finalized {
      border-color: var(--green);
      color: #166534;
    }

    .fork-tree {
      overflow-x: auto;
      max-width: 100%;
      min-width: 0;
      padding-bottom: 4px;
      display: grid;
      gap: 10px;
    }

    .gasper-tree {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 0.8fr) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
    }

    .gasper-side,
    .gasper-center {
      min-width: 0;
    }

    .gasper-center .block {
      min-height: 118px;
      box-shadow: inset 0 0 0 1px rgba(37, 99, 235, 0.06);
    }

    .gasper-center h3,
    .gasper-side h3 {
      font-size: 13px;
    }

    .branch-row {
      min-width: min(660px, 100%);
      display: grid;
      grid-template-columns: minmax(180px, 0.9fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      align-items: stretch;
    }

    .block {
      border: 1px solid var(--line-soft);
      background: #ffffff;
      border-radius: 10px;
      padding: 10px;
      min-height: 92px;
      min-width: 0;
      display: grid;
      gap: 5px;
      align-content: start;
      position: relative;
    }

    .block.head {
      border-color: var(--blue);
      box-shadow: inset 3px 0 0 var(--blue);
    }

    .block.finalized {
      border-color: var(--green);
      background: var(--green-soft);
    }

    .block.justified {
      border-color: var(--yellow);
      background: var(--yellow-soft);
    }

    .block.fake {
      border-color: #fecaca;
      background: var(--red-soft);
    }

    .block.synced {
      border-color: var(--blue);
      box-shadow: inset 3px 0 0 var(--blue);
    }

    .block .name {
      font-weight: 700;
      font-size: 14px;
    }

    .block .root {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      word-break: break-all;
    }

    .block .weight-bar {
      width: 100%;
    }

    .weight-bar {
      height: 9px;
      border-radius: 999px;
      overflow: hidden;
      background: #f1f5f9;
      border: 1px solid var(--line-soft);
    }

    .weight-fill {
      height: 100%;
      background: var(--blue);
      width: 0;
    }

    .validator-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
      gap: 6px;
      max-height: 300px;
      overflow: auto;
      padding-right: 2px;
    }

    .validator {
      min-height: 42px;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 6px;
      background: #ffffff;
      display: grid;
      gap: 1px;
    }

    .validator.a { border-color: #bfdbfe; background: var(--blue-soft); }
    .validator.b { border-color: #ddd6fe; background: var(--violet-soft); }
    .validator.offline { border-color: #fecaca; background: var(--red-soft); }

    details.compact-details {
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      background: #ffffff;
      padding: 8px 10px;
    }

    details.compact-details summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .bar-stack {
      display: grid;
      gap: 8px;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
      min-width: 0;
    }

    .bar-label span {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .bar-label span:last-child {
      text-align: right;
      white-space: normal;
      flex: 0 1 auto;
    }

    .block .bar-label {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2px;
    }

    .block .bar-label span:last-child {
      text-align: left;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
    }

    .participation {
      height: 28px;
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      border: 1px solid var(--line-soft);
      background: #ffffff;
    }

    .part-online {
      background: var(--green);
      min-width: 0;
    }

    .part-offline {
      background: var(--red);
      min-width: 0;
    }

    .threshold-line {
      position: relative;
      height: 14px;
      border-bottom: 1px solid var(--line-soft);
    }

    .threshold-line::before {
      content: "";
      position: absolute;
      left: 66.666%;
      top: 0;
      bottom: -6px;
      width: 2px;
      background: var(--yellow);
    }

    .threshold-line span {
      position: absolute;
      left: calc(66.666% + 7px);
      top: -3px;
      font-size: 11px;
      color: var(--yellow);
    }

    .evidence {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .message-card {
      background: #ffffff;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 10px;
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .kv {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      gap: 4px 8px;
      font-size: 12px;
    }

    .kv div:nth-child(odd) {
      color: var(--muted);
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .chain-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .chain-row .block {
      min-width: 118px;
      min-height: 82px;
    }

    .log {
      min-height: 132px;
      max-height: 160px;
      overflow: auto;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px;
    }

    .log-wrap {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #ffffff;
      padding: 8px;
    }

    .log-wrap > summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      padding: 2px 4px;
    }

    .log-item {
      padding: 6px 8px;
      border-radius: 6px;
      margin: 4px 0;
      font-size: 12px;
      background: var(--panel-2);
      border: 1px solid var(--line-soft);
      color: var(--text);
    }

    .log-item.good {
      background: var(--green-soft);
      border-color: #bbf7d0;
      color: #166534;
    }

    .log-item.warn {
      background: var(--yellow-soft);
      border-color: #fde68a;
      color: #713f12;
    }

    .log-item.bad {
      background: var(--red-soft);
      border-color: #fecaca;
      color: var(--red);
    }

    .checklist {
      display: grid;
      gap: 7px;
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    .plain-list {
      margin: 0;
      padding-left: 18px;
      color: var(--muted);
      font-size: 12px;
      display: grid;
      gap: 6px;
    }

    .source-list {
      display: grid;
      gap: 5px;
      margin: 0;
      padding-left: 18px;
      font-size: 11px;
      color: var(--muted);
    }

    .source-list a {
      color: var(--blue);
      text-decoration: none;
    }

    .source-list a:hover {
      text-decoration: underline;
    }

    .result-box {
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 10px;
      background: #ffffff;
      min-height: 68px;
    }

    .result-box.good {
      background: var(--green-soft);
      border-color: #bbf7d0;
    }

    .result-box.warn {
      background: var(--yellow-soft);
      border-color: #fde68a;
    }

    .result-box.bad {
      background: var(--red-soft);
      border-color: #fecaca;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 1060px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { grid-template-columns: 1fr; }
      .brand { grid-column: auto; }
      .workspace { grid-template-columns: 1fr; }
      .scenario-brief { grid-template-columns: 1fr; }
    }

    @media (max-width: 620px) {
      .app { margin: 24px auto; padding: 0 12px; }
      .main, .sidebar { padding: 0; }
      .header { display: grid; }
      .metric-grid { grid-template-columns: 1fr; }
      .btn-row { grid-template-columns: 1fr; }
      .action-grid { grid-template-columns: 1fr; }
      .evidence { grid-template-columns: 1fr; }
      .timeline { grid-template-columns: repeat(16, minmax(18px, 1fr)); }
      .timeline-explain { grid-template-columns: 1fr; }
      .branch-row { grid-template-columns: 1fr; min-width: 0; }
      .branch-row > div:empty { display: none; }
      .gasper-tree { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <main class="main">
      <div class="brand">
        <h1>Ethereum PoS Security Console</h1>
        <p class="small">A static, classroom-scale model for applying the lesson's PoS consensus and security concepts.</p>
      </div>

      <section class="scenario-brief">
        <div class="brief-copy">
          <div class="header">
            <div class="title-block">
              <h2 id="scenarioTitle">Gasper: Head and Finality</h2>
              <p id="scenarioDesc"></p>
            </div>
            <span id="scenarioStatus" class="status-pill">Ready</span>
          </div>
          <div class="outcome">
            <strong>Learning outcome</strong>
            <p id="scenarioOutcome"></p>
          </div>
          <p id="scenarioReminder" class="reminder"></p>
        </div>
        <div>
          <h3>Activity</h3>
          <ol id="scenarioSteps" class="step-list"></ol>
        </div>
      </section>

      <section class="panel quiet stack controls-panel">
        <div>
          <div class="label">Scenario</div>
          <select id="scenarioSelect" class="select">
            <option value="gasper">Gasper: Head and Finality</option>
            <option value="delay">Finality Delay</option>
            <option value="slashing">Slashing Evidence</option>
            <option value="weak">Weak Subjectivity</option>
          </select>
        </div>
        <div id="scenarioControls" class="stack"></div>
      </section>

      <section id="selfTestPanel" class="panel quiet stack hidden">
        <h3>Self-Tests</h3>
        <button id="selfTestBtn" class="btn success">Run Self-Tests</button>
        <p class="micro">Visible only when the URL contains <span class="mono">?run_self_checks</span>.</p>
      </section>

      <section class="workspace">
        <div id="primaryView" class="view"></div>
        <div id="sideView" class="side-view"></div>
      </section>

      <details class="log-wrap" id="logWrap">
        <summary>Event log</summary>
        <section class="log" id="eventLog" aria-live="polite"></section>
      </details>
    </main>
  </div>

  <script>
    const ETH = {
      slotsPerEpoch: 32,
      validatorCount: 64,
      effectiveBalance: 32,
      threshold: 2 / 3
    };

    const SOURCES = [
      ['Ethereum PoS', 'https://ethereum.org/developers/docs/consensus-mechanisms/pos/'],
      ['Block proposal', 'https://ethereum.org/developers/docs/consensus-mechanisms/pos/block-proposal/'],
      ['Attack and defense', 'https://ethereum.org/developers/docs/consensus-mechanisms/pos/attack-and-defense/'],
      ['Merkle Patricia Trie', 'https://ethereum.org/developers/docs/data-structures-and-encoding/patricia-merkle-trie/']
    ];

    const $ = (selector) => document.querySelector(selector);

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function clear(node) {
      while (node.firstChild) node.removeChild(node.firstChild);
    }

    function pct(value) {
      return (value * 100).toFixed(1) + '%';
    }

    function rootFor(label) {
      let h = 2166136261;
      for (let i = 0; i < label.length; i++) {
        h ^= label.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return '0x' + (h >>> 0).toString(16).padStart(8, '0') + label.replace(/[^a-zA-Z0-9]/g, '').slice(0, 8).padEnd(8, '0');
    }

    function timeLabel() {
      return new Date().toLocaleTimeString();
    }

    let gasperTimer = null;

    function stopGasperTimer() {
      if (gasperTimer) {
        clearInterval(gasperTimer);
        gasperTimer = null;
      }
    }

    function scheduleGasperTimer() {
      stopGasperTimer();
      gasperTimer = setInterval(() => {
        if (app.scenario !== 'gasper' || (!app.gasper.running && !app.gasper.growing)) {
          stopGasperTimer();
          return;
        }
        if (app.gasper.finalizedRoot) {
          if (!app.gasper.growing || app.gasper.growthCount >= app.gasper.maxGrowthBlocks) {
            app.gasper.growing = false;
            app.gasper.actionNote = 'Post-finality growth paused after ' + app.gasper.growthCount + ' new blocks. Restart the scenario to try locking the other branch.';
            stopGasperTimer();
            renderControls();
            render();
            return;
          }
          growFinalizedBranch(app.gasper);
          render();
          return;
        }
        advanceGasperOscillation(app.gasper);
        render();
      }, 1600);
    }

    function log(message, type = '') {
      const item = el('div', 'log-item ' + type);
      const stamp = el('strong', '', '[' + timeLabel() + '] ');
      item.append(stamp, document.createTextNode(message));
      $('#eventLog').appendChild(item);
      $('#eventLog').scrollTop = $('#eventLog').scrollHeight;
      const method = type === 'warn' ? 'warn' : 'log';
      console[method](message);
    }

    function makeValidators() {
      return Array.from({ length: ETH.validatorCount }, (_, index) => ({
        id: index,
        balance: ETH.effectiveBalance,
        label: 'V' + index.toString().padStart(2, '0')
      }));
    }

    function totalStake(validators) {
      return validators.reduce((sum, validator) => sum + validator.balance, 0);
    }

    function descendantsOf(blocks, rootId) {
      return blocks.filter((block) => isDescendant(blocks, block.id, rootId)).map((block) => block.id);
    }

    function isDescendant(blocks, candidateId, ancestorId) {
      let current = blocks.find((block) => block.id === candidateId);
      while (current) {
        if (current.id === ancestorId) return true;
        current = blocks.find((block) => block.id === current.parent);
      }
      return false;
    }

    function childBlocks(blocks, parentId) {
      return blocks.filter((block) => block.parent === parentId);
    }

    function voteWeightForSubtree(state, blockId) {
      const ids = new Set(descendantsOf(state.blocks, blockId));
      let weight = 0;
      for (const [validatorId, latestBlock] of Object.entries(state.latestVotes)) {
        if (ids.has(latestBlock)) {
          const validator = state.validators[Number(validatorId)];
          weight += validator ? validator.balance : 0;
        }
      }
      return weight;
    }

    function voteWeightForBlock(state, blockId) {
      let weight = 0;
      for (const [validatorId, latestBlock] of Object.entries(state.latestVotes)) {
        if (latestBlock === blockId) {
          const validator = state.validators[Number(validatorId)];
          weight += validator ? validator.balance : 0;
        }
      }
      return weight;
    }

    function computeLmdGhostHead(state) {
      let cursor = state.justifiedRoot;
      while (true) {
        const children = childBlocks(state.blocks, cursor);
        if (!children.length) return cursor;
        let best = children[0];
        let bestWeight = voteWeightForSubtree(state, best.id);
        for (const child of children.slice(1)) {
          const weight = voteWeightForSubtree(state, child.id);
          if (weight > bestWeight || (weight === bestWeight && child.id < best.id)) {
            best = child;
            bestWeight = weight;
          }
        }
        if (bestWeight === 0) return cursor;
        cursor = best.id;
      }
    }

    function branchHead(state, branch) {
      const branchBlocks = state.blocks.filter((block) => block.branch === branch);
      return branchBlocks.reduce((head, block) => block.slot > head.slot ? block : head, branchBlocks[0]).id;
    }

    function voteCountForBlock(state, blockId) {
      return Math.round(voteWeightForBlock(state, blockId) / ETH.effectiveBalance);
    }

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function assignVoteSplit(state, aCount, bCount, aBlockId = branchHead(state, 'A'), bBlockId = branchHead(state, 'B')) {
      state.latestVotes = {};
      const total = state.validators.length;
      for (let i = 0; i < total; i++) {
        if (i < aCount) state.latestVotes[i] = aBlockId;
        else if (i < aCount + bCount) state.latestVotes[i] = bBlockId;
        else state.latestVotes[i] = 'J0';
      }
    }

    function resetGasperCheckpointState(state, message = 'No finality lock has happened yet.') {
      state.justifiedEpoch = 0;
      state.finalizedEpoch = -1;
      state.justifiedRoot = 'J0';
      state.finalizedRoot = null;
      state.finalizedBranch = null;
      state.targetRoot = null;
      state.checkpointProcessed = false;
      state.checkpointMessage = message;
    }

    function makeGasperState() {
      const validators = makeValidators();
      const state = {
        validators,
        blocks: [
          { id: 'J0', parent: null, label: 'Epoch 0 checkpoint', slot: 0, epoch: 0, branch: 'checkpoint', root: rootFor('J0') },
          { id: 'A1', parent: 'J0', label: 'Branch A slot 1', slot: 1, epoch: 1, branch: 'A', root: rootFor('A1') },
          { id: 'A2', parent: 'A1', label: 'Branch A head', slot: 9, epoch: 1, branch: 'A', root: rootFor('A2') },
          { id: 'B1', parent: 'J0', label: 'Branch B slot 2', slot: 2, epoch: 1, branch: 'B', root: rootFor('B1') },
          { id: 'B2', parent: 'B1', label: 'Branch B head', slot: 10, epoch: 1, branch: 'B', root: rootFor('B2') }
        ],
        latestVotes: {},
        justifiedEpoch: 0,
        finalizedEpoch: -1,
        justifiedRoot: 'J0',
        finalizedRoot: null,
        finalizedBranch: null,
        targetEpoch: 1,
        targetRoot: null,
        checkpointProcessed: false,
        running: false,
        growing: false,
        bounceCount: 0,
        growthCount: 0,
        maxGrowthBlocks: 5,
        actionNote: 'Click Start Scenario. Latest votes will drift between the branches until you lock finality.',
        checkpointMessage: 'No finality lock has happened yet.'
      };
      assignVoteSplit(state, 32, 32);
      state.actionNote = 'Ready to start. The running scenario will keep shifting latest vote weight between A and B, and the branch you lock depends on the state at that instant.';
      return state;
    }

    function processGasperCheckpoint(state, forceLock = false) {
      const targetRoot = computeLmdGhostHead(state);
      const support = voteWeightForSubtree(state, targetRoot);
      const needed = totalStake(state.validators) * ETH.threshold;
      const supportCount = Math.round(support / ETH.effectiveBalance);
      const neededCount = Math.ceil(needed / ETH.effectiveBalance);
      const target = state.blocks.find((block) => block.id === targetRoot);
      state.targetRoot = targetRoot;
      if (support >= needed || forceLock) {
        state.justifiedEpoch = target.epoch;
        state.justifiedRoot = targetRoot;
        state.finalizedEpoch = target.epoch;
        state.finalizedRoot = targetRoot;
        state.finalizedBranch = target.branch;
        state.checkpointProcessed = true;
        state.checkpointMessage = support >= needed
          ? 'Finality locked ' + targetRoot + ': it had ' + supportCount + ' validators, meeting the ' + neededCount + '-validator threshold. Future head choice starts from this finalized branch.'
          : 'Finality locked ' + targetRoot + ' for this activity. The current head had ' + supportCount + ' latest votes; in real Ethereum, finality votes are a separate supermajority checkpoint vote, not just the latest-message head tally.';
        return { ok: true, support, needed };
      }
      state.checkpointProcessed = true;
      state.checkpointMessage = 'Finality did not lock: ' + targetRoot + ' has ' + supportCount + ' validators, but needs at least ' + neededCount + ' of ' + state.validators.length + '.';
      return { ok: false, support, needed };
    }

    function growFinalizedBranch(state) {
      const branch = state.finalizedBranch;
      if (!branch) return null;
      const parentId = branchHead(state, branch);
      const parent = state.blocks.find((block) => block.id === parentId);
      const nextIndex = state.blocks.filter((block) => block.branch === branch).length + 1;
      const nextSlot = Math.max(...state.blocks.map((block) => block.slot)) + 1;
      const id = branch + nextIndex;
      const block = {
        id,
        parent: parentId,
        label: 'Growth after finality',
        slot: nextSlot,
        epoch: parent.epoch + 1,
        branch,
        root: rootFor(id)
      };
      state.blocks.push(block);
      state.growthCount += 1;
      if (branch === 'A') assignVoteSplit(state, 50, 14, id, branchHead(state, 'B'));
      else assignVoteSplit(state, 14, 50, branchHead(state, 'A'), id);
      state.actionNote = 'A new block was added to finalized Branch ' + branch + '. Because the finalized root is ' + state.finalizedRoot + ', the old competing branch is no longer a valid place for this node to build.';
      state.checkpointMessage = 'Finality remains locked on Branch ' + branch + '; growth now extends that branch.';
      return block;
    }

    function advanceGasperOscillation(state, rng = Math.random) {
      if (state.finalizedRoot) return 'finalized';
      const aHead = branchHead(state, 'A');
      const bHead = branchHead(state, 'B');
      const aVotes = voteCountForBlock(state, aHead);
      const bVotes = voteCountForBlock(state, bHead);
      const totalVotes = aVotes + bVotes;
      const magnitude = 1 + Math.floor(rng() * 5);
      const skew = aVotes - bVotes;
      const towardA = skew < -2 ? true : skew > 2 ? false : rng() < 0.5;
      const direction = towardA ? 1 : -1;
      let nextA = clamp(aVotes + direction * magnitude, 0, totalVotes);
      if (nextA === aVotes) nextA = clamp(aVotes + (direction > 0 ? 1 : -1), 0, totalVotes);
      const nextB = totalVotes - nextA;
      assignVoteSplit(state, nextA, nextB, aHead, bHead);
      state.running = true;
      state.bounceCount += 1;
      const head = computeLmdGhostHead(state);
      const lead = head === aHead ? 'Branch A' : 'Branch B';
      state.actionNote = 'Latest votes drifted by ' + Math.abs(nextA - aVotes) + ' validators toward ' + (nextA > aVotes ? 'Branch A' : 'Branch B') + '. ' + lead + ' is head right now.';
      return head === aHead ? 'head_a' : 'head_b';
    }

    function lockGasperFinality(state) {
      const result = processGasperCheckpoint(state, true);
      if (!result.ok) {
        state.actionNote = 'The current head did not have enough support to lock finality.';
        return 'not_finalized';
      }
      state.running = false;
      state.growing = true;
      const lockedRoot = state.finalizedRoot;
      const lockedBranch = state.finalizedBranch;
      state.actionNote = 'You locked finality while ' + lockedRoot + ' on Branch ' + lockedBranch + ' was the head. New blocks will now start growing from that finalized branch.';
      state.checkpointMessage = 'Finality locked ' + lockedRoot + '. Watch the next blocks extend Branch ' + lockedBranch + ' from that anchor.';
      return lockedBranch === 'A' ? 'finalized_a' : 'finalized_b';
    }

    function makeDelayState(offlinePercent = 40) {
      const total = ETH.validatorCount * ETH.effectiveBalance;
      const offlineStake = total * offlinePercent / 100;
      const onlineStake = total - offlineStake;
      return {
        epoch: 0,
        producedBlocks: 0,
        onlineStake,
        offlineStake,
        initialTotal: total,
        justifiedEpoch: 0,
        finalizedEpoch: -1,
        finalityDelay: 0,
        leakActive: false,
        recoveryRate: 0.12,
        history: [{ epoch: 0, status: 'finalized', note: 'Starting checkpoint', participation: onlineStake / total }],
        lastAction: 'Ready'
      };
    }

    function delayParticipation(state) {
      return state.onlineStake / (state.onlineStake + state.offlineStake);
    }

    function stepDelayEpoch(state) {
      state.epoch += 1;
      state.producedBlocks += ETH.slotsPerEpoch;
      const participation = delayParticipation(state);
      if (participation >= ETH.threshold) {
        state.justifiedEpoch = state.epoch;
        if (state.epoch > 0) state.finalizedEpoch = state.epoch - 1;
        state.finalityDelay = 0;
        state.leakActive = false;
        state.lastAction = 'Checkpoint justified and previous checkpoint finalized.';
        state.history.push({ epoch: state.epoch, status: 'finalized', note: 'Finality resumed', participation });
        return 'finalized';
      }
      state.finalityDelay += 1;
      const recoveredStake = state.offlineStake * state.recoveryRate;
      state.onlineStake += recoveredStake;
      state.offlineStake -= recoveredStake;
      if (state.finalityDelay >= 4) {
        state.leakActive = true;
        state.offlineStake *= 0.96;
      }
      const nextParticipation = delayParticipation(state);
      if (nextParticipation >= ETH.threshold) {
        state.lastAction = 'Blocks continued without finality. Some validators recovered, so the next epoch can finalize.';
        state.history.push({ epoch: state.epoch, status: 'ready', note: 'Recovered; next epoch can finalize', participation: nextParticipation });
        return 'ready';
      }
      state.lastAction = 'Blocks continued, but participation stayed below two-thirds. This scenario assumes some offline validators recover before the next epoch.';
      state.history.push({ epoch: state.epoch, status: state.leakActive ? 'recovering' : 'delayed', note: state.leakActive ? 'Delay plus inactivity leak' : 'Finality delayed', participation: nextParticipation });
      return state.leakActive ? 'leak' : 'delayed';
    }

    const evidenceCases = {
      doubleProposal: {
        expected: 'double_proposal',
        messages: [
          { kind: 'proposal', validator: 12, slot: 96, blockRoot: '0xa10f...', signingRoot: '0x91aa...' },
          { kind: 'proposal', validator: 12, slot: 96, blockRoot: '0xb90c...', signingRoot: '0x77cf...' }
        ],
        explanation: 'Both messages are proposals from the same validator for the same slot, but they point to different block roots.'
      },
      doubleAttestation: {
        expected: 'double_attestation',
        messages: [
          { kind: 'attestation', validator: 7, sourceEpoch: 4, targetEpoch: 5, headRoot: '0xaaa1...', signingRoot: '0x21ad...' },
          { kind: 'attestation', validator: 7, sourceEpoch: 4, targetEpoch: 5, headRoot: '0xbbb2...', signingRoot: '0x45de...' }
        ],
        explanation: 'Both messages are attestations from the same validator with the same target epoch, but the signed data differs.'
      },
      surround: {
        expected: 'surround_vote',
        messages: [
          { kind: 'attestation', validator: 19, sourceEpoch: 2, targetEpoch: 8, headRoot: '0x1919...', signingRoot: '0x8899...' },
          { kind: 'attestation', validator: 19, sourceEpoch: 3, targetEpoch: 7, headRoot: '0x2020...', signingRoot: '0xaa33...' }
        ],
        explanation: 'The first attestation source-target range strictly contains the second range.'
      },
      safe: {
        expected: 'not_slashable',
        messages: [
          { kind: 'attestation', validator: 22, sourceEpoch: 5, targetEpoch: 6, headRoot: '0x5555...', signingRoot: '0x1212...' },
          { kind: 'attestation', validator: 22, sourceEpoch: 6, targetEpoch: 7, headRoot: '0x6666...', signingRoot: '0x3434...' }
        ],
        explanation: 'These are sequential attestations. The target epochs differ, and neither source-target range surrounds the other.'
      }
    };

    function shuffled(array) {
      const copy = [...array];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
      }
      return copy;
    }

    function randomizedEvidenceOrder() {
      const original = Object.keys(evidenceCases);
      for (let attempt = 0; attempt < 20; attempt += 1) {
        const order = shuffled(original);
        if (order.every((id, index) => id !== original[index])) return order;
      }
      return [...original.slice(1), original[0]];
    }

    function makeSlashingState() {
      const caseOrder = randomizedEvidenceOrder();
      return {
        caseOrder,
        caseId: caseOrder[0],
        lastAnswer: null
      };
    }

    function slashingCaseLabel(state, id) {
      const index = Math.max(0, state.caseOrder.indexOf(id));
      return 'Evidence Set ' + String.fromCharCode(65 + index);
    }

    function classifyEvidence(messages) {
      const [a, b] = messages;
      if (!a || !b || a.validator !== b.validator) return 'not_slashable';
      if (a.kind === 'proposal' && b.kind === 'proposal') {
        if (a.slot === b.slot && a.blockRoot !== b.blockRoot) return 'double_proposal';
      }
      if (a.kind === 'attestation' && b.kind === 'attestation') {
        const differentData = a.headRoot !== b.headRoot || a.signingRoot !== b.signingRoot;
        if (a.targetEpoch === b.targetEpoch && differentData) return 'double_attestation';
        const aSurroundsB = a.sourceEpoch < b.sourceEpoch && b.targetEpoch < a.targetEpoch;
        const bSurroundsA = b.sourceEpoch < a.sourceEpoch && a.targetEpoch < b.targetEpoch;
        if (aSurroundsB || bSurroundsA) return 'surround_vote';
      }
      return 'not_slashable';
    }

    function makeWeakState() {
      const honest = Array.from({ length: 11 }, (_, epoch) => ({
        id: 'H' + epoch,
        epoch,
        root: rootFor('honest-' + epoch),
        checkpoint: epoch === 6
      }));
      const fake = Array.from({ length: 13 }, (_, epoch) => ({
        id: 'F' + epoch,
        epoch,
        root: rootFor('fake-' + epoch),
        checkpoint: false
      }));
      return {
        honest,
        fake,
        trustedEpoch: 6,
        trustedRoot: honest[6].root,
        syncedChain: null,
        rejectedChain: null,
        result: 'No sync attempt yet.',
        conclusion: 'Choose a sync method to see what this node would believe.'
      };
    }

    function syncWeakSubjectivity(state, useCheckpoint) {
      if (!useCheckpoint) {
        const chosen = state.fake.length > state.honest.length ? 'fake' : 'honest';
        state.syncedChain = chosen;
        state.rejectedChain = null;
        state.result = chosen === 'fake'
          ? 'Unsafe sync accepted the longer-looking fake history as this node\'s local view.'
          : 'Unsafe sync followed the honest history.';
        state.conclusion = chosen === 'fake'
          ? 'Wrong conclusion: this node now serves the fake finalized root and fake execution state. A wallet, bridge monitor, or exchange dashboard using only this node could trust deposits, balances, or contract state that canonical Ethereum does not recognize.'
          : 'The node happened to choose the honest history, but it still had no trusted finalized root to prove that choice.';
        return chosen;
      }
      const fakeCheckpoint = state.fake.find((block) => block.epoch === state.trustedEpoch);
      if (!fakeCheckpoint || fakeCheckpoint.root !== state.trustedRoot) {
        state.syncedChain = 'honest';
        state.rejectedChain = 'fake';
        state.result = 'Checkpoint sync rejected the fake history at epoch ' + state.trustedEpoch + ' and continued from the trusted finalized root.';
        state.conclusion = 'Protected conclusion: the node anchors on the expected finalized root, rejects the conflicting history, and serves the canonical state from that checkpoint forward.';
        return 'rejected';
      }
      state.syncedChain = 'fake';
      state.rejectedChain = null;
      state.result = 'Checkpoint matched; node can continue normal validation.';
      state.conclusion = 'The supplied checkpoint matched this history, so the node can continue normal validation from that anchor.';
      return 'accepted';
    }

    const app = {
      scenario: 'gasper',
      gasper: makeGasperState(),
      delay: makeDelayState(40),
      slashing: makeSlashingState(),
      weak: makeWeakState()
    };

    const scenarioMeta = {
      gasper: {
        title: 'Gasper: Head and Finality',
        desc: 'A short fork appears after the last justified checkpoint. Start the scenario and latest attestation weight will move between branches; lock finality whenever you want to freeze the branch that is currently head.',
        outcome: 'See that LMD-GHOST can move the head with latest votes, while finality anchors the branch future blocks build from.',
        reminder: 'Gasper combines LMD-GHOST head choice with Casper-FFG checkpoint finality. This is a classroom simplification: the running scenario oscillates latest attestation weight, and the lock button represents a checkpoint on the current head receiving at least two-thirds support.',
        steps: [
          'Click Start Scenario and watch the head move as latest vote weight bounces between branches.',
          'Click Lock Finality Now at any moment.',
          'Observe whether Branch A or Branch B was finalized, then see the next block grow from that branch.'
        ]
      },
      delay: {
        title: 'Finality Delay',
        desc: 'A client or network problem knocks some validators offline. Blocks can still be proposed, but checkpoints need enough active stake to finalize.',
        outcome: 'Separate liveness from finality during an Ethereum outage.',
        reminder: 'Finality requires at least two-thirds of effective stake voting for checkpoints. In this simplified scenario, we assume some affected validators come back online each epoch as operators recover their nodes.',
        steps: [
          'Set how much stake is offline.',
          'Step through epochs and watch blocks continue while finality is delayed.',
          'Keep stepping until the timeline turns blue, then step once more to process the checkpoint and finalize.'
        ]
      },
      slashing: {
        title: 'Slashing Evidence',
        desc: 'You are given two signed messages from one validator. Your job is to decide whether the pair proves a slashable offense.',
        outcome: 'Recognize slashable proof-of-stake behavior from objective evidence.',
        reminder: 'Slashing is not about guessing intent. Ethereum clients can punish a validator only when signed messages prove a specific conflict, such as two proposals for one slot or conflicting attestations.',
        steps: [
          'Read both signed messages.',
          'Compare the fields that matter: validator, slot, source epoch, and target epoch.',
          'Choose the slashable offense, or mark the pair not slashable.'
        ]
      },
      weak: {
        title: 'Weak Subjectivity',
        desc: 'A new node sees an honest history and a longer-looking fake history. You will decide whether it syncs from old signatures alone or anchors on a recent finalized checkpoint.',
        outcome: 'Explain why new Ethereum PoS nodes need a recent trusted checkpoint.',
        reminder: 'Long-range attackers can use old validator keys to build a fake finalized-looking history after those validators have exited. A weak-subjectivity checkpoint gives a new node a recent finalized root to compare against before it trusts the state it is serving.',
        steps: [
          'Try syncing from genesis only and inspect which chain the node serves.',
          'Reset and sync again with the trusted checkpoint.',
          'Compare the local outcome: unsafe fake state versus checkpoint-protected state.'
        ]
      }
    };

    function setScenario(id) {
      stopGasperTimer();
      app.scenario = id;
      const meta = scenarioMeta[id];
      $('#scenarioTitle').textContent = meta.title;
      $('#scenarioDesc').textContent = meta.desc;
      $('#scenarioOutcome').textContent = meta.outcome;
      $('#scenarioReminder').textContent = meta.reminder;
      $('#scenarioStatus').textContent = 'Ready';
      $('#scenarioStatus').className = 'status-pill';
      clear($('#scenarioSteps'));
      for (const [index, step] of meta.steps.entries()) {
        const item = el('li');
        item.append(el('span', 'num', String(index + 1)), el('span', '', step));
        $('#scenarioSteps').appendChild(item);
      }
      renderControls();
      render();
      if (id === 'gasper' && (app.gasper.running || app.gasper.growing)) scheduleGasperTimer();
      log('Loaded scenario: ' + meta.title);
    }

    function setStatus(text, type = '') {
      $('#scenarioStatus').textContent = text;
      $('#scenarioStatus').className = 'status-pill ' + type;
    }

    function actionControl(label, description, className, onClick, actionId = '') {
      const card = el('div', 'action-card');
      const button = el('button', 'btn ' + (className || ''), label);
      button.type = 'button';
      if (actionId) button.dataset.action = actionId;
      button.onclick = onClick;
      card.appendChild(button);
      if (description) card.appendChild(el('p', '', description));
      return card;
    }

    function renderControls() {
      const controls = $('#scenarioControls');
      clear(controls);

      if (app.scenario === 'gasper') {
        const state = app.gasper;
        if (state.finalizedRoot) {
          const restart = actionControl('Restart scenario', 'Reset the fork, latest votes, and finality anchor.', 'primary', () => {
            stopGasperTimer();
            app.gasper = makeGasperState();
            log('Head and finality scenario restarted.');
            renderControls();
            render();
          }, 'gasper-restart');
          controls.appendChild(restart);
          return;
        }
        if (!state.running) {
          const start = actionControl('Start scenario', 'Begin the running scenario. Latest attestation weight will drift between Branch A and Branch B until you stop it by locking finality.', 'primary', () => {
            app.gasper.running = true;
            log('Scenario started: latest votes will now drift organically between Branch A and Branch B.', 'good');
            scheduleGasperTimer();
            renderControls();
            render();
          }, 'gasper-start');
          controls.appendChild(start);
          return;
        }
        const lock = actionControl('Lock finality now', 'Freeze the current head as the finalized checkpoint. The selected branch depends on where the latest vote weight is right now.', 'success', () => {
          const result = lockGasperFinality(app.gasper);
          log(result === 'finalized_a' ? 'Finality locked Branch A.' : 'Finality locked Branch B.', 'good');
          scheduleGasperTimer();
          renderControls();
          render();
        }, 'gasper-lock');
        controls.appendChild(lock);
      }

      if (app.scenario === 'delay') {
        const wrapper = el('div', 'stack');
        const label = el('div', 'label', 'Offline stake: ');
        const value = el('span', '', Math.round(app.delay.offlineStake / (app.delay.onlineStake + app.delay.offlineStake) * 100) + '%');
        label.appendChild(value);
        const range = el('input', 'range');
        range.type = 'range';
        range.min = '0';
        range.max = '70';
        range.value = String(Math.round(app.delay.offlineStake / (app.delay.onlineStake + app.delay.offlineStake) * 100));
        range.oninput = () => {
          app.delay = makeDelayState(Number(range.value));
          value.textContent = range.value + '%';
          render();
        };
        wrapper.append(label, range);

        const actions = el('div', 'action-grid');
        const step = actionControl('Step one epoch', 'Move time forward. If participation is below two-thirds, blocks keep appearing and some offline validators recover. If participation is already back above two-thirds, the next checkpoint can finalize.', 'primary', () => {
          const result = stepDelayEpoch(app.delay);
          if (result === 'finalized') log('Epoch ' + app.delay.epoch + ': finality resumed.', 'good');
          else if (result === 'ready') log('Epoch ' + app.delay.epoch + ': validators recovered enough for the next epoch to finalize.', 'good');
          else if (result === 'leak') log('Epoch ' + app.delay.epoch + ': inactivity leak applied.', 'warn');
          else log('Epoch ' + app.delay.epoch + ': finality delayed; blocks still produced.', 'warn');
          render();
        });
        const run = actionControl('Run to recovery', 'Advance through recovery epochs until participation is high enough, then run one more epoch to finalize.', 'success', () => {
          let guard = 0;
          while (delayParticipation(app.delay) < ETH.threshold && guard < 80) {
            stepDelayEpoch(app.delay);
            guard += 1;
          }
          if (delayParticipation(app.delay) >= ETH.threshold) stepDelayEpoch(app.delay);
          log('Ran finality-delay scenario for ' + guard + ' epochs.', app.delay.finalizedEpoch >= 0 ? 'good' : 'warn');
          render();
        });
        actions.append(step, run);
        const reset = el('button', 'btn', 'Reset Scenario');
        reset.onclick = () => {
          app.delay = makeDelayState(40);
          log('Finality delay scenario reset.');
          renderControls();
          render();
        };
        controls.append(wrapper, actions, reset);
      }

      if (app.scenario === 'slashing') {
        const selector = el('select', 'select');
        for (const id of app.slashing.caseOrder) {
          const option = el('option', '', slashingCaseLabel(app.slashing, id));
          option.value = id;
          selector.appendChild(option);
        }
        selector.value = app.slashing.caseId;
        selector.onchange = () => {
          app.slashing.caseId = selector.value;
          app.slashing.lastAnswer = null;
          render();
        };
        controls.appendChild(selector);

        const actions = el('div', 'action-grid');

        const answer = (kind) => {
          app.slashing.lastAnswer = kind;
          const expected = evidenceCases[app.slashing.caseId].expected;
          if (kind === expected) {
            log('Correct classification: ' + kind.replace(/_/g, ' ') + '.', 'good');
          } else {
            log('Incorrect classification. Expected ' + expected.replace(/_/g, ' ') + '.', 'bad');
          }
          render();
        };
        actions.append(
          actionControl('Double proposal', '', '', () => answer('double_proposal')),
          actionControl('Double attestation', '', '', () => answer('double_attestation')),
          actionControl('Surround vote', '', '', () => answer('surround_vote')),
          actionControl('Not slashable', '', '', () => answer('not_slashable'))
        );
        controls.append(actions);
      }

      if (app.scenario === 'weak') {
        const actions = el('div', 'action-grid');
        const unsafe = actionControl('Sync from genesis only', 'Unsafe path: this node evaluates the old histories without a recent finalized checkpoint anchor.', 'warn', () => {
          const result = syncWeakSubjectivity(app.weak, false);
          log('Genesis-only sync result: ' + result + '.', result === 'fake' ? 'bad' : 'good');
          render();
        });
        const checkpoint = actionControl('Sync with checkpoint', 'Protected path: the node checks candidate histories against the trusted finalized root before serving state.', 'success', () => {
          const result = syncWeakSubjectivity(app.weak, true);
          log('Checkpoint sync result: ' + result + '.', result === 'rejected' ? 'good' : 'warn');
          render();
        });
        actions.append(unsafe, checkpoint);
        const reset = el('button', 'btn', 'Reset Scenario');
        reset.onclick = () => {
          app.weak = makeWeakState();
          log('Weak subjectivity scenario reset.');
          render();
        };
        controls.append(actions, reset);
      }
    }

    function render() {
      clear($('#primaryView'));
      clear($('#sideView'));
      if (app.scenario === 'gasper') renderGasper();
      if (app.scenario === 'delay') renderDelay();
      if (app.scenario === 'slashing') renderSlashing();
      if (app.scenario === 'weak') renderWeakSubjectivity();
    }

    function renderGasper() {
      const state = app.gasper;
      const head = computeLmdGhostHead(state);
      const total = totalStake(state.validators);
      const aWeight = voteWeightForSubtree(state, 'A1');
      const bWeight = voteWeightForSubtree(state, 'B1');
      const headWeight = voteWeightForSubtree(state, head);
      const aValidators = Math.round(aWeight / ETH.effectiveBalance);
      const bValidators = Math.round(bWeight / ETH.effectiveBalance);
      const headValidators = Math.round(headWeight / ETH.effectiveBalance);
      const headBlock = state.blocks.find((block) => block.id === head);
      const headReason = aValidators === bValidators
        ? 'The latest-message tally is tied right now, so this simplified model breaks ties toward Branch A.'
        : headBlock.branch === 'A'
          ? 'Branch A has the heavier latest-message subtree right now.'
          : 'Branch B has the heavier latest-message subtree right now.';

      const metrics = el('section', 'metric-grid');
      metrics.append(
        metric('LMD-GHOST head', head, aValidators === bValidators
          ? 'Tie: A latest votes ' + aValidators + ', B latest votes ' + bValidators
          : headBlock.branch === 'A'
            ? 'A latest votes ' + aValidators + ' vs B ' + bValidators
            : 'B latest votes ' + bValidators + ' vs A ' + aValidators),
        metric('Current head votes', headValidators + ' validators', 'Live latest-message weight for the head branch'),
        metric('Finality anchor', state.finalizedRoot || 'Not locked', state.finalizedRoot ? 'Growth starts from Branch ' + state.finalizedBranch : 'Last justified root: J0')
      );
      $('#primaryView').appendChild(metrics);

      const treePanel = el('section', 'panel stack');
      treePanel.appendChild(el('h3', '', 'Fork and Growth View'));
      treePanel.appendChild(gasperForkView(state, head));
      $('#primaryView').appendChild(treePanel);

      const votePanel = el('section', 'panel stack');
      votePanel.appendChild(el('h3', '', 'Head Choice and Finality'));
      const barStack = el('div', 'bar-stack');
      barStack.append(weightBar('Branch A subtree', aWeight, total), weightBar('Branch B subtree', bWeight, total));
      votePanel.appendChild(barStack);
      votePanel.appendChild(statusLine('Current step', state.actionNote, state.finalizedRoot ? 'good' : headBlock.branch === 'B' ? 'warn' : ''));
      votePanel.appendChild(statusLine(
        state.finalizedRoot ? 'Finality effect' : state.running ? 'Lock option' : 'Before start',
        state.finalizedRoot
          ? state.checkpointMessage
          : state.running
            ? 'If you lock now, the current head is ' + head + '. The activity treats your click as the checkpoint finality event for that head, then future blocks grow from that branch.'
            : 'Click Start Scenario to begin the oscillation. Lock Finality Now appears while the latest votes are moving.',
        state.finalizedRoot || state.running ? 'good' : 'warn'
      ));
      const summary = el('ul', 'plain-list');
      summary.append(
        el('li', '', 'Head choice uses the latest-message tally. Branch A has ' + aValidators + ' validators and Branch B has ' + bValidators + '.'),
        el('li', '', 'Finality locks the branch that is head at the moment you click. In Ethereum, that lock comes from checkpoint votes; here the click triggers that event so you can see the consequence.'),
        el('li', '', state.finalizedRoot ? 'After finality, new growth slowly extends Branch ' + state.finalizedBranch + '.' : state.running ? 'While the scenario is running, the head can still jump as latest votes drift.' : 'The scenario has not started yet. Click Start Scenario to begin the drift.')
      );
      votePanel.appendChild(summary);
      $('#sideView').appendChild(votePanel);

      const notes = el('section', 'panel quiet stack');
      notes.append(
        el('h3', '', 'Plain-language readout'),
        el('p', 'small', 'Current head: ' + head + ' on Branch ' + headBlock.branch + '. ' + headReason),
        el('p', 'small', state.finalizedRoot
          ? 'Finality locked Branch ' + state.finalizedBranch + '. The competing branch can still be displayed, but it is no longer the branch this node builds from.'
          : !state.running
            ? 'Click Start Scenario to let latest vote weight drift between A and B. Then lock finality when the current head looks right.'
            : 'Click Lock Finality Now to finalize whichever branch is head at this instant. The next blocks will grow from that branch.')
      );
      $('#sideView').appendChild(notes);

      setStatus(state.finalizedRoot ? state.growing ? 'Growing' : 'Finalized' : state.running ? 'Running' : 'Ready', state.finalizedRoot ? 'good' : state.running ? 'warn' : '');
    }

    function gasperForkView(state, head) {
      const wrap = el('div', 'gasper-tree');
      const left = el('div', 'gasper-side stack');
      left.append(
        el('h3', '', 'Branch A'),
        el('p', 'micro', 'Fork from J0'),
        ...state.blocks.filter((block) => block.branch === 'A').sort((a, b) => a.slot - b.slot).map((block) => blockCard(state, block.id, head))
      );
      const center = el('div', 'gasper-center stack');
      center.append(
        el('h3', '', 'J0'),
        blockCard(state, 'J0', head),
        el('p', 'micro', 'Last justified checkpoint')
      );
      const right = el('div', 'gasper-side stack');
      right.append(
        el('h3', '', 'Branch B'),
        el('p', 'micro', 'Fork from J0'),
        ...state.blocks.filter((block) => block.branch === 'B').sort((a, b) => a.slot - b.slot).map((block) => blockCard(state, block.id, head))
      );
      wrap.append(left, center, right);
      return wrap;
    }

    function blockCard(state, blockId, head) {
      const block = state.blocks.find((item) => item.id === blockId);
      const card = el('div', 'block');
      const weight = voteWeightForSubtree(state, blockId);
      if (blockId === head) card.classList.add('head');
      if (state.finalizedRoot === blockId) card.classList.add('finalized');
      else if (state.justifiedRoot === blockId) card.classList.add('justified');
      card.append(
        el('div', 'name', block.id + ' - ' + block.label),
        el('div', 'root', block.root),
        el('div', 'small', 'slot ' + block.slot + ', epoch ' + block.epoch),
        weightBar('subtree support', weight, totalStake(state.validators))
      );
      return card;
    }

    function metric(label, value, note) {
      const item = el('div', 'metric');
      item.append(el('div', 'small', label), el('div', 'value', value), el('div', 'micro', note));
      return item;
    }

    function weightBar(label, value, max) {
      const wrapper = el('div', 'stack');
      wrapper.style.gap = '4px';
      const top = el('div', 'bar-label');
      top.append(el('span', '', label), el('span', '', Math.round(value) + ' / ' + Math.round(max) + ' ETH'));
      const bar = el('div', 'weight-bar');
      const fill = el('div', 'weight-fill');
      fill.style.width = Math.max(0, Math.min(100, value / max * 100)).toFixed(1) + '%';
      bar.appendChild(fill);
      wrapper.append(top, bar);
      return wrapper;
    }

    function renderDelay() {
      const state = app.delay;
      const participation = delayParticipation(state);
      const onlinePct = participation * 100;
      const offlinePct = 100 - onlinePct;
      const finalityLabel = state.finalizedEpoch >= 0
        ? 'Finalized E' + state.finalizedEpoch
        : participation >= ETH.threshold
          ? 'Ready next epoch'
          : 'Delayed';
      const metrics = el('section', 'metric-grid');
      metrics.append(
        metric('Epoch', String(state.epoch), state.producedBlocks + ' slot windows elapsed'),
        metric('Participation', pct(participation), participation >= ETH.threshold ? 'Enough to finalize' : 'Below two-thirds'),
        metric('Finality', finalityLabel, 'Delay counter: ' + state.finalityDelay)
      );
      $('#primaryView').appendChild(metrics);

      const panel = el('section', 'panel stack');
      panel.appendChild(el('h3', '', 'Participation and Finality Threshold'));
      const labels = el('div', 'bar-label');
      labels.append(el('span', '', 'Online effective balance'), el('span', '', onlinePct.toFixed(1) + '% online / ' + offlinePct.toFixed(1) + '% offline'));
      const part = el('div', 'participation');
      const online = el('div', 'part-online');
      const offline = el('div', 'part-offline');
      online.style.width = onlinePct + '%';
      offline.style.width = offlinePct + '%';
      part.append(online, offline);
      const threshold = el('div', 'threshold-line');
      threshold.appendChild(el('span', '', '2/3 threshold'));
      panel.append(labels, part, threshold);
      panel.appendChild(el('p', 'small', state.lastAction));
      panel.appendChild(el('p', 'small', 'Classroom assumption: each step represents another epoch of operators restoring affected validator nodes. Real incidents can recover through operators fixing clients, restarting nodes, and, during prolonged outages, inactivity leak changing effective balances.'));
      $('#primaryView').appendChild(panel);

      const timelinePanel = el('section', 'panel stack');
      timelinePanel.appendChild(el('h3', '', 'Epoch Recovery Timeline'));
      const track = el('div', 'epoch-track');
      const displayHistory = state.history.slice(-8);
      const latestEntry = displayHistory[displayHistory.length - 1];
      if (state.finalizedEpoch < 0 && participation >= ETH.threshold && latestEntry?.status !== 'ready') {
        displayHistory.push({
          epoch: state.epoch + 1,
          status: 'ready',
          note: 'Enough online now; step once to finalize',
          participation
        });
      }
      for (const entry of displayHistory.slice(-8)) {
        const marker = el('div', 'epoch-marker ' + entry.status);
        const label = entry.status === 'finalized'
          ? 'Finalized'
          : entry.status === 'ready'
            ? 'Ready next'
            : entry.status === 'recovering'
              ? 'Recovering'
              : 'Delayed';
        marker.append(
          el('strong', '', 'Epoch ' + entry.epoch),
          el('span', '', label),
          el('span', '', pct(entry.participation) + ' online'),
          el('span', '', entry.note)
        );
        track.appendChild(marker);
      }
      timelinePanel.appendChild(track);
      const timelineHint = state.finalizedEpoch >= 0
        ? 'The green marker shows the epoch where the next checkpoint vote finalized the previous checkpoint.'
        : participation >= ETH.threshold
          ? 'The blue marker means finality is now available: click "Step one epoch" to process the next checkpoint.'
          : 'Red means blocks continued but checkpoints could not finalize. Yellow appears after a sustained delay when the inactivity-leak simplification is also active.';
      timelinePanel.appendChild(el('p', 'small', timelineHint));
      $('#primaryView').appendChild(timelinePanel);

      const side = el('section', 'panel stack');
      side.append(
        el('h3', '', 'Operational Reading'),
        statusLine('Liveness', 'Blocks continue while proposers are online.', 'good'),
        statusLine('Finality', state.finalizedEpoch >= 0 ? 'A checkpoint finalized.' : participation >= ETH.threshold ? 'Recovered enough; the next epoch can finalize.' : 'Checkpoint cannot finalize yet.', participation >= ETH.threshold ? 'good' : 'bad'),
        statusLine('Recovery assumption', 'Each step slowly moves some offline stake back online so students can see finality resume.', participation >= ETH.threshold ? 'good' : 'warn'),
        statusLine('Inactivity leak', state.leakActive ? 'Also active after sustained delay.' : 'Not active yet in this simplified run.', state.leakActive ? 'warn' : '')
      );
      $('#sideView').appendChild(side);
      setStatus(state.finalizedEpoch >= 0 ? 'Finalized' : participation >= ETH.threshold ? 'Can finalize' : 'Finality delayed', participation >= ETH.threshold ? 'good' : 'bad');
    }

    function statusLine(label, text, type) {
      const row = el('div', 'result-box ' + type);
      row.append(el('strong', '', label), el('p', 'small', text));
      return row;
    }

    function renderSlashing() {
      const current = evidenceCases[app.slashing.caseId];
      const detected = classifyEvidence(current.messages);
      const panel = el('section', 'panel stack');
      panel.append(
        el('h3', '', slashingCaseLabel(app.slashing, app.slashing.caseId)),
        el('p', 'small', 'Compare the two signed messages. Use validator, slot, source epoch, target epoch, and roots to decide whether this is slashable evidence.')
      );
      const evidence = el('div', 'evidence');
      evidence.append(messageCard('Message 1', current.messages[0]), messageCard('Message 2', current.messages[1]));
      panel.appendChild(evidence);
      $('#primaryView').appendChild(panel);

      const answerBox = el('section', 'panel stack');
      answerBox.appendChild(el('h3', '', 'Classification Result'));
      if (app.slashing.lastAnswer) {
        const correct = app.slashing.lastAnswer === current.expected;
        answerBox.appendChild(statusLine(correct ? 'Correct' : 'Incorrect', 'Selected: ' + app.slashing.lastAnswer.replace(/_/g, ' ') + '. Expected: ' + current.expected.replace(/_/g, ' ') + '.', correct ? 'good' : 'bad'));
        answerBox.appendChild(el('p', 'small', 'Why: ' + current.explanation));
        answerBox.appendChild(el('p', 'small', 'Rule result: ' + detected.replace(/_/g, ' ') + '.'));
      } else {
        answerBox.appendChild(statusLine('Awaiting answer', 'Choose the classification that the message fields prove. The answer is not shown until after you submit.', ''));
      }
      $('#primaryView').appendChild(answerBox);

      const side = el('section', 'panel stack');
      side.append(
        el('h3', '', 'Rule Guide'),
        statusLine('Double proposal', 'A proposer gets one block for a slot. Signing two different block roots for that same slot helps create competing histories, and the two signed headers are objective evidence.', ''),
        statusLine('Double attestation', 'An attestation is a vote used by head choice and finality. Two conflicting attestations for the same target epoch let one validator support incompatible views of the same checkpoint.', ''),
        statusLine('Surround vote', 'Casper-FFG needs validators to move checkpoints forward consistently. A vote whose source-target range surrounds another can help finalize conflicting checkpoint histories, so signed surround evidence is slashable.', ''),
        statusLine('Not slashable', 'Validators normally sign many messages over time. Use this when the pair can both be valid, such as sequential attestations that move from one target epoch to the next.', '')
      );
      $('#sideView').appendChild(side);
      setStatus(app.slashing.lastAnswer ? (app.slashing.lastAnswer === current.expected ? 'Correct' : 'Review') : 'Classify', app.slashing.lastAnswer === current.expected ? 'good' : app.slashing.lastAnswer ? 'bad' : '');
    }

    function messageCard(title, message) {
      const card = el('div', 'message-card');
      card.appendChild(el('h3', '', title));
      const kv = el('div', 'kv');
      for (const [key, value] of Object.entries(message)) {
        kv.append(el('div', '', key), el('div', key.toLowerCase().includes('root') ? 'mono' : '', String(value)));
      }
      card.appendChild(kv);
      return card;
    }

    function renderWeakSubjectivity() {
      const state = app.weak;
      const syncedBlocks = state.syncedChain === 'fake' ? state.fake : state.syncedChain === 'honest' ? state.honest : null;
      const metrics = el('section', 'metric-grid');
      metrics.append(
        metric('Trusted checkpoint', 'Epoch ' + state.trustedEpoch, state.trustedRoot),
        metric('Honest history', String(state.honest.length) + ' blocks', 'Contains the trusted checkpoint root'),
        metric('Fake history', String(state.fake.length) + ' blocks', 'Longer-looking but checkpoint mismatch')
      );
      $('#primaryView').appendChild(metrics);

      const chainPanel = el('section', 'panel stack');
      chainPanel.appendChild(el('h3', '', 'Candidate Histories'));
      chainPanel.appendChild(el('p', 'small', 'Both histories can look internally signed to a new node. The trusted checkpoint root is the external fact that lets the node reject the wrong history.'));
      chainPanel.appendChild(chainView('Honest history', state.honest, 'honest', state.trustedRoot, state.syncedChain, state.rejectedChain));
      chainPanel.appendChild(chainView('Fake long-range history', state.fake, 'fake', state.trustedRoot, state.syncedChain, state.rejectedChain));
      $('#primaryView').appendChild(chainPanel);

      if (syncedBlocks) {
        const syncedPanel = el('section', 'panel stack');
        syncedPanel.append(
          el('h3', '', 'Node Local View After Sync'),
          el('p', 'small', state.syncedChain === 'fake'
            ? 'This is the harmful path: the node is now serving a fake history as if it were finalized Ethereum.'
            : 'This is the protected path: the node serves the history that contains the trusted finalized checkpoint.'),
          chainView(state.syncedChain === 'fake' ? 'Synced fake chain' : 'Synced honest chain', syncedBlocks, state.syncedChain, state.trustedRoot, state.syncedChain, null)
        );
        $('#primaryView').appendChild(syncedPanel);
      }

      const result = el('section', 'panel stack');
      const resultType = state.result.includes('rejected') ? 'good' : state.result.includes('fake') ? 'bad' : '';
      result.append(
        el('h3', '', 'Sync Decision'),
        statusLine('Current result', state.result, resultType),
        statusLine(state.syncedChain === 'fake' ? 'Harmful outcome' : state.syncedChain === 'honest' ? 'Protected outcome' : 'Awaiting choice', state.conclusion, resultType)
      );
      $('#sideView').appendChild(result);

      const side = el('section', 'panel quiet stack');
      side.append(
        el('h3', '', 'Reality Check'),
        el('p', 'small', 'This does not rewrite canonical Ethereum. It shows a local failure mode: a node without a recent trusted finalized root can follow a fake long-range history and give downstream users or systems a false view of finalized state.')
      );
      $('#sideView').appendChild(side);
      setStatus(state.result.includes('rejected') ? 'Protected' : state.result.includes('fake') ? 'Unsafe sync' : 'Ready', state.result.includes('rejected') ? 'good' : state.result.includes('fake') ? 'bad' : '');
    }

    function chainView(title, blocks, kind, trustedRoot, syncedKind = null, rejectedKind = null) {
      const wrapper = el('div', 'stack');
      wrapper.appendChild(el('h3', '', title));
      const row = el('div', 'chain-row');
      for (const block of blocks) {
        const card = el('div', 'block ' + (kind === 'fake' ? 'fake' : ''));
        if (syncedKind === kind && block === blocks[blocks.length - 1]) card.classList.add('synced');
        if (block.root === trustedRoot) card.classList.add('finalized');
        const note = block.root === trustedRoot
          ? 'trusted checkpoint'
          : syncedKind === kind && block === blocks[blocks.length - 1]
            ? 'node local head'
            : rejectedKind === kind && block.epoch === 6
              ? 'checkpoint mismatch'
              : '';
        card.append(
          el('div', 'name', block.id),
          el('div', 'small', 'epoch ' + block.epoch),
          el('div', 'root', block.root),
          el('div', 'micro', note)
        );
        row.appendChild(card);
      }
      wrapper.appendChild(row);
      return wrapper;
    }

    function sourceList() {
      const list = el('ul', 'source-list');
      for (const [title, href] of SOURCES) {
        const li = el('li', '');
        const a = el('a', '', title);
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener';
        li.appendChild(a);
        list.appendChild(li);
      }
      return list;
    }

    async function runSelfTests() {
      const results = [];
      const check = (name, condition) => {
        results.push(Boolean(condition));
        log((condition ? 'PASS ' : 'FAIL ') + name, condition ? 'good' : 'bad');
      };

      const gasper = makeGasperState();
      check('LMD-GHOST starts from justified root and selects Branch A', computeLmdGhostHead(gasper) === 'A2');
      lockGasperFinality(gasper);
      check('Finality locks the current head even from a balanced live tally', gasper.finalizedRoot === 'A2' && gasper.growing && gasper.growthCount === 0);
      growFinalizedBranch(gasper);
      check('Post-finality growth adds a block after the lock event', computeLmdGhostHead(gasper) === 'A3' && gasper.growthCount === 1);
      const gasperDrift = makeGasperState();
      advanceGasperOscillation(gasperDrift, (() => {
        const values = [0.9, 0.9];
        let index = 0;
        return () => values[index++];
      })());
      check('Running scenario can move head to Branch B', computeLmdGhostHead(gasperDrift) === 'B2');
      const gasperB = makeGasperState();
      assignVoteSplit(gasperB, 30, 34);
      check('Manual state can make Branch B the current head without supermajority support', computeLmdGhostHead(gasperB) === 'B2' && voteCountForBlock(gasperB, 'B2') < 43);
      lockGasperFinality(gasperB);
      check('Finality can lock Branch B when B is current head', gasperB.finalizedRoot === 'B2' && gasperB.finalizedBranch === 'B' && gasperB.growing);
      growFinalizedBranch(gasperB);
      check('Post-finality growth extends locked Branch B', computeLmdGhostHead(gasperB) === 'B3');
      const gasperA = makeGasperState();
      advanceGasperOscillation(gasperA, (() => {
        const values = [0.9, 0.1];
        let index = 0;
        return () => values[index++];
      })());
      check('Running scenario can move head to Branch A', computeLmdGhostHead(gasperA) === 'A2');
      assignVoteSplit(gasperA, 34, 30);
      check('Manual state can make Branch A the current head without supermajority support', computeLmdGhostHead(gasperA) === 'A2' && voteCountForBlock(gasperA, 'A2') < 43);
      lockGasperFinality(gasperA);
      check('Finality can lock Branch A when A is current head', gasperA.finalizedRoot === 'A2' && gasperA.finalizedBranch === 'A' && gasperA.growing);
      growFinalizedBranch(gasperA);
      check('Post-finality growth extends locked Branch A', computeLmdGhostHead(gasperA) === 'A3');

      const delayLow = makeDelayState(40);
      stepDelayEpoch(delayLow);
      check('Finality pauses below two-thirds participation', delayLow.finalizedEpoch === -1);
      const delayHigh = makeDelayState(25);
      stepDelayEpoch(delayHigh);
      check('Finality resumes above two-thirds participation', delayHigh.finalizedEpoch === 0);
      const leak = makeDelayState(45);
      let guard = 0;
      while (delayParticipation(leak) < ETH.threshold && guard < 80) {
        stepDelayEpoch(leak);
        guard += 1;
      }
      check('Slow recovery can restore supermajority share', delayParticipation(leak) >= ETH.threshold);

      for (const [id, item] of Object.entries(evidenceCases)) {
        check('Slashing classifier: ' + id, classifyEvidence(item.messages) === item.expected);
      }
      const slashingOrder = makeSlashingState().caseOrder;
      const originalOrder = Object.keys(evidenceCases);
      check('Slashing evidence order is not the answer order', slashingOrder.every((id, index) => id !== originalOrder[index]));

      const weak = makeWeakState();
      check('Genesis-only sync can be deceived by longer fake history', syncWeakSubjectivity(weak, false) === 'fake');
      check('Unsafe weak-subjectivity path serves fake local view', weak.syncedChain === 'fake' && weak.conclusion.includes('Wrong conclusion'));
      const weak2 = makeWeakState();
      check('Weak-subjectivity checkpoint rejects fake history', syncWeakSubjectivity(weak2, true) === 'rejected');
      check('Checkpoint path serves honest local view', weak2.syncedChain === 'honest' && weak2.conclusion.includes('Protected conclusion'));

      const text = document.body.innerText || '';
      check('Deprecated mining cue removed', !text.includes('Mine Block'));
      check('Learning tips panel removed', !text.includes('Tips to maximize'));

      const passed = results.filter(Boolean).length;
      const total = results.length;
      log('Self-tests complete: ' + passed + ' / ' + total + ' passed.', passed === total ? 'good' : 'warn');
      return { passed, total, ok: passed === total };
    }

    $('#scenarioSelect').addEventListener('change', (event) => {
      setScenario(event.target.value);
    });

    if (new URLSearchParams(window.location.search).has('run_self_checks')) {
      $('#selfTestPanel').classList.remove('hidden');
      $('#logWrap').open = true;
    }

    $('#selfTestBtn').addEventListener('click', () => {
      runSelfTests();
    });

    window.runSelfTests = runSelfTests;
    window.__ethLab = {
      ETH,
      makeGasperState,
      computeLmdGhostHead,
      processGasperCheckpoint,
      advanceGasperOscillation,
      lockGasperFinality,
      growFinalizedBranch,
      makeDelayState,
      stepDelayEpoch,
      delayParticipation,
      classifyEvidence,
      makeSlashingState,
      makeWeakState,
      syncWeakSubjectivity
    };

    setScenario('gasper');
  </script>
</body>
