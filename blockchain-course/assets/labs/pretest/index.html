<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pretest: Blockchain Intelligence Analysis</title>
<link rel="stylesheet" href="../shared/look.css">
<style>
  .pretest-label { display: block; margin: 0.8rem 0 0.3rem; font-weight: 700; }
  #pretest-name { width: min(100%, 28rem); padding: 0.5em; border: 2px solid var(--rule); border-radius: 6px; font: inherit; }
  .pretest-item { padding: 0.8rem 0 1rem; border-top: 1px solid var(--rule); }
  .pretest-item:first-of-type { border-top: 0; }
  .pretest-item h3 { margin: 0 0 0.4rem; font-size: 1rem; color: var(--ink-soft); }
  .pretest-code { overflow-x: auto; padding: 0.7em 0.9em; border-radius: 6px; background: var(--hash-tint); font-size: 0.9em; }
  .pretest-written, .pretest-preview { width: 100%; padding: 0.6em; border: 2px solid var(--rule); border-radius: 6px; font: inherit; }
  .pretest-preview { font-family: var(--mono); font-size: 0.85em; margin-top: 0.5rem; }
  .pretest-clear { font-size: 0.85rem; padding: 0.2em 0.7em; }
  .pretest-send { flex-wrap: wrap; justify-content: flex-start; }
  .pretest-restart { margin-top: 1.5rem; }
</style>
</head>
<body>
<main class="lab">
  <header class="lab-bar">
    <h1>Pretest</h1>
    <p class="from">Blockchain Intelligence Analysis: before day 1</p>
  </header>
  <div id="pretest"><noscript><p class="lab-error">The pretest needs JavaScript turned on.</p></noscript></div>
</main>
<script src="items.js"></script>
<script src="pretest.js"></script>
</body>
</html>
