lesson_id: "02-DS"
lesson_title: "Peer-to-Peer Design"
source_path: "lessons/distributed_primitives/02-DS-p2p_design.qmd"
terms:
  - term: "Peer-to-peer design"
    modifier: null
    aliases: ["P2P design", "P2P network design"]
    definition: "The engineering of how peers discover each other, route messages, maintain membership, and resist manipulation without a central coordinator."
    context: "The lesson shifts from naming P2P architectures to understanding the mechanisms that make decentralized networks work."
    slide_heading: "From P2P Models to P2P Design"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Peer discovery"
    modifier: null
    aliases: ["peer finding", "node discovery"]
    definition: "The process a peer uses to find other peers it can connect to in a decentralized network."
    context: "Peer discovery is one of the core plumbing problems behind blockchain networking and decentralized storage."
    slide_heading: "From P2P Models to P2P Design"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Overlay network"
    modifier: null
    aliases: ["overlay", "logical topology"]
    definition: "A logical network built on top of the physical internet that defines which peers know about each other and how application messages move."
    context: "Students need the overlay concept before comparing random gossip meshes with structured DHT routing."
    slide_heading: "What is an \"Overlay Network?\""
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Physical topology"
    modifier: null
    aliases: ["physical network topology"]
    definition: "The underlying internet connectivity beneath an overlay, such as routers, links, and physical network paths."
    context: "The lesson contrasts physical topology with the software-defined neighbor relationships that P2P systems actually use."
    slide_heading: "What is an \"Overlay Network?\""
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Unstructured overlay network"
    modifier: null
    aliases: ["unstructured overlay", "random mesh"]
    definition: "A P2P overlay where peers form mostly random neighbor connections rather than maintaining a precise searchable structure."
    context: "Unstructured overlays provide the simple baseline for understanding flooding, gossip, and churn tolerance."
    slide_heading: "Unstructured Overlay Networks"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Flooding"
    modifier: "P2P routing"
    aliases: ["flood", "flooded query", "flooding search"]
    definition: "A search or propagation method where a peer sends a message to all neighbors and each neighbor forwards it onward."
    context: "Flooding explains why simple P2P discovery can spread quickly but create duplicate traffic and poor scalability."
    slide_heading: "Unstructured Overlay Networks"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Gossip"
    modifier: "P2P propagation"
    aliases: ["gossiping", "gossip protocol"]
    definition: "A decentralized propagation style where peers spread information by forwarding it through their neighbor connections."
    context: "The lesson uses gossip as the unstructured pattern for broadcasting new information across a blockchain-like network."
    slide_heading: "Unstructured Overlay Networks"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Broadcast storm"
    modifier: null
    aliases: ["broadcast storms"]
    definition: "A failure mode where repeated forwarding creates excessive duplicate messages that overwhelm the network."
    context: "Broadcast storms are the main cost of relying on naive flooding in large unstructured overlays."
    slide_heading: "Unstructured Overlay Networks"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Structured overlay network"
    modifier: null
    aliases: ["structured overlay"]
    definition: "A P2P overlay that deliberately organizes peers and data so lookups can move toward a target instead of broadcasting everywhere."
    context: "Structured overlays introduce the organized alternative to flooding and prepare students for DHT examples."
    slide_heading: "Structured Overlay Networks"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Exact lookup"
    modifier: null
    aliases: ["exact-match search", "key-based lookup"]
    definition: "A search for one specific item using its known key, hash, or identifier."
    context: "The lesson distinguishes exact lookup from broad broadcast because structured overlays are efficient only when the target identifier is known."
    slide_heading: "Structured Overlay Networks"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Distributed hash table"
    modifier: null
    aliases: ["DHT", "DHTs"]
    definition: "A structured P2P system that maps keys to responsible peers so data can be found through efficient routing."
    context: "DHTs are the main family of structured overlays used to explain Chord, CAN, Pastry, Kademlia, and decentralized storage."
    slide_heading: "Structured Overlay Networks"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Routing state"
    modifier: "P2P overlay"
    aliases: ["routing information", "routing table state"]
    definition: "The local neighbor and shortcut information a peer maintains so it can forward messages toward useful next hops."
    context: "Structured overlays depend on fresh routing state; if it becomes stale, efficient lookup breaks down."
    slide_heading: "Structured Overlay Networks"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Linear cost"
    modifier: "network scalability"
    aliases: ["O(N)", "linear message cost"]
    definition: "A scaling pattern where message cost grows roughly in proportion to the number of peers."
    context: "The lesson uses O(N) to show why flooding becomes expensive as a P2P network grows."
    slide_heading: "Scalability Challenges{.smaller}"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Logarithmic cost"
    modifier: "network scalability"
    aliases: ["O(log N)", "logarithmic routing cost"]
    definition: "A scaling pattern where each network doubling adds only a small number of extra routing hops."
    context: "The lesson uses O(log N) to explain why DHT routing can remain practical in very large networks."
    slide_heading: "Scalability Challenges{.smaller}"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Supernode hierarchy"
    modifier: null
    aliases: ["supernodes", "supernode model"]
    definition: "A P2P design where more capable peers form a higher-capacity backbone that helps weaker peers route or search."
    context: "The lesson uses Gnutella's supernode fix to show one way unstructured systems reduce flooding pressure."
    slide_heading: "Scalability Challenges{.smaller}"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Chord"
    modifier: "DHT"
    aliases: []
    definition: "A ring-based distributed hash table where hashed peers and keys are arranged in identifier order and lookups follow shortcut links."
    context: "Chord is the lesson's canonical example for successor-based placement and finger-table routing."
    slide_heading: "DHT Example: Chord"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Logical ring"
    modifier: "Chord"
    aliases: ["ring", "clock"]
    definition: "Chord's circular identifier space where peers and keys are placed according to hash-derived IDs."
    context: "The ring gives students the visual model for understanding successor ownership and shortcut routing."
    slide_heading: "DHT Example: Chord"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Successor"
    modifier: "Chord"
    aliases: ["successor node"]
    definition: "The first peer at or after a key's identifier on the Chord ring, responsible for storing or answering for that key."
    context: "The successor rule explains how Chord decides which peer owns a piece of data."
    slide_heading: "DHT Example: Chord"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Finger table"
    modifier: "Chord"
    aliases: ["finger tables", "shortcuts"]
    definition: "A Chord node's list of shortcut peers used to jump across the ring toward a target identifier."
    context: "Finger tables are the mechanism that lets Chord avoid a slow neighbor-by-neighbor walk."
    slide_heading: "DHT Example: Chord"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Content-Addressable Network"
    modifier: null
    aliases: ["CAN"]
    definition: "A DHT design that maps peers and keys into a virtual coordinate space divided into node-owned zones."
    context: "CAN shows that structured overlays can use geometries other than Chord's ring."
    slide_heading: "DHT Example: CAN"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Virtual coordinate space"
    modifier: "CAN"
    aliases: ["coordinate space", "logical map", "grid"]
    definition: "CAN's logical map where keys hash to coordinates and peers own regions of the space."
    context: "The coordinate-space model explains how CAN assigns data responsibility and routes geographically within the overlay."
    slide_heading: "DHT Example: CAN"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Greedy routing"
    modifier: "CAN"
    aliases: ["greedy walk"]
    definition: "A forwarding rule that sends a query to the neighboring zone that appears closest to the target coordinate."
    context: "Greedy routing is the routing intuition behind CAN's map-based lookup example."
    slide_heading: "DHT Example: CAN"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Pastry"
    modifier: "DHT"
    aliases: []
    definition: "A structured overlay that routes toward a target by matching more digits of the target identifier at each hop."
    context: "Pastry introduces prefix-based routing, which connects to later systems such as Kademlia."
    slide_heading: "DHT Example: Pastry"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Prefix matching"
    modifier: "DHT routing"
    aliases: ["prefix-based routing"]
    definition: "A routing strategy where each hop chooses a peer whose identifier shares a longer prefix with the target."
    context: "Prefix matching is the central idea in Pastry-style routing and in Kademlia-like systems used by decentralized applications."
    slide_heading: "DHT Example: Pastry"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Leaf set"
    modifier: "Pastry"
    aliases: []
    definition: "A Pastry node's set of numerically nearby peers used to finish routing once a lookup reaches the target neighborhood."
    context: "The leaf set turns a close prefix match into the exact responsible peer in the lookup example."
    slide_heading: "DHT Example: Pastry"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Kademlia"
    modifier: null
    aliases: []
    definition: "A DHT design family that uses prefix-like distance logic for efficient peer and content lookup."
    context: "The lesson links Kademlia-style routing to practical systems such as IPFS and Ethereum node discovery."
    slide_heading: "The Blockchain Link: Efficient Routing"
    tags: ["distributed-systems", "ethereum", "real-world"]
    confidence: "high"
  - term: "InterPlanetary File System"
    modifier: null
    aliases: ["IPFS"]
    definition: "A decentralized storage system that uses DHT-style lookup to find content by identifiers rather than by one central server."
    context: "IPFS is the lesson's example of structured routing supporting blockchain-adjacent storage, including NFT data."
    slide_heading: "The Blockchain Link: Efficient Routing"
    tags: ["distributed-systems", "real-world"]
    confidence: "high"
  - term: "Ethereum Discovery v5"
    modifier: null
    aliases: ["Discovery v5", "Ethereum node discovery"]
    definition: "Ethereum's peer discovery protocol, based on Kademlia-like ideas for finding nodes in the P2P layer."
    context: "Discovery v5 shows that modern blockchain networks rely on structured peer-finding logic, not only transaction gossip."
    slide_heading: "The Blockchain Link: Efficient Routing"
    tags: ["distributed-systems", "ethereum"]
    confidence: "high"
  - term: "Churn"
    modifier: "P2P membership"
    aliases: ["membership churn"]
    definition: "The normal pattern of peers joining, leaving, crashing, and reconnecting in a P2P network."
    context: "Churn explains why overlays need constant maintenance and why peers cannot assume neighbors will remain available."
    slide_heading: "Membership and \"Churn\""
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Overlay maintenance"
    modifier: null
    aliases: ["background maintenance", "self-healing"]
    definition: "The recurring protocol work peers perform to repair neighbor links, refresh routing information, and preserve data availability."
    context: "Maintenance tasks are presented as the reason efficient DHT routing can survive constant peer turnover."
    slide_heading: "The \"Self-Healing\" Solutions"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Stabilize"
    modifier: "Chord maintenance"
    aliases: ["stabilize()", "stabilization"]
    definition: "A maintenance task where peers check nearby neighbors so successor links stay correct as membership changes."
    context: "Stabilization is one of the concrete self-healing actions that repairs a structured overlay after churn."
    slide_heading: "The \"Self-Healing\" Solutions"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Fix fingers"
    modifier: "Chord maintenance"
    aliases: ["fix_fingers()", "finger repair"]
    definition: "A maintenance task where peers refresh shortcut entries that may have become stale after other peers leave or join."
    context: "Fixing fingers keeps Chord's routing shortcuts useful rather than pointing at departed peers."
    slide_heading: "The \"Self-Healing\" Solutions"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Replication"
    modifier: "P2P storage"
    aliases: ["replicate", "data replication"]
    definition: "Copying important data to multiple peers so one peer's departure does not immediately erase the data."
    context: "Replication is the lesson's main defense against data loss under churn in structured overlays."
    slide_heading: "The \"Self-Healing\" Solutions"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Network partition"
    modifier: null
    aliases: ["partition", "partitions", "partitioning"]
    definition: "A split where parts of a P2P network become isolated islands that cannot communicate with one another."
    context: "Partitions connect overlay failures to serious blockchain risks such as inconsistent views, forks, and double-spend opportunities."
    slide_heading: "Partitions & Healing"
    tags: ["distributed-systems", "consensus"]
    confidence: "high"
  - term: "Routing bias"
    modifier: null
    aliases: []
    definition: "A connection-selection flaw that makes peers over-connect within one region or group and under-connect to the rest of the network."
    context: "Routing bias is one accidental way an overlay can split into disconnected islands."
    slide_heading: "Partitions & Healing"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Gossip membership"
    modifier: null
    aliases: ["peer-list gossip", "membership gossip"]
    definition: "A maintenance technique where peers exchange small samples of known peers to keep neighbor lists fresh."
    context: "Gossip membership is how unstructured overlays stay connected and well mixed without maintaining a precise DHT shape."
    slide_heading: "The P2P Playbook: Surviving Churn"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Fork"
    modifier: "blockchain partition"
    aliases: ["blockchain fork"]
    definition: "A divergence where separated parts of a blockchain network extend different versions of the chain."
    context: "The lesson uses forks to show why network partitions are security-critical for blockchains rather than merely inconvenient."
    slide_heading: "The Blockchain Link"
    tags: ["distributed-systems", "consensus"]
    confidence: "high"
  - term: "Partition resistance"
    modifier: "blockchain networking"
    aliases: ["partition-resistant"]
    definition: "A design goal of keeping blockchain peers connected enough that the network avoids isolated islands and inconsistent chain views."
    context: "Partition resistance is why blockchain P2P protocols emphasize robust discovery, routing diversity, and connectivity."
    slide_heading: "The Blockchain Link"
    tags: ["distributed-systems", "consensus"]
    confidence: "high"
  - term: "Sybil attack"
    modifier: null
    aliases: ["Sybil attacks", "fake identities"]
    definition: "An attack where one adversary creates many fake peer identities to distort peer selection, routing, or consensus influence."
    context: "Sybil attacks expose the danger of open P2P membership when identity creation is cheap."
    slide_heading: "The Great P2P Weakness: Sybil & Eclipse Attacks"
    tags: ["distributed-systems", "consensus"]
    confidence: "high"
  - term: "Free identity"
    modifier: "P2P security"
    aliases: ["identity is free", "cheap identity"]
    definition: "The condition in an open P2P network where creating new peer identities has little or no cost."
    context: "Free identity is the root assumption that makes Sybil attacks possible in naive P2P systems."
    slide_heading: "The Great P2P Weakness: Sybil & Eclipse Attacks"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Eclipse attack"
    modifier: null
    aliases: ["eclipse attacks", "peer isolation attack"]
    definition: "An attack where adversary-controlled peers surround a victim so the victim's view of the network is controlled or distorted."
    context: "The eclipse attack connects P2P neighbor manipulation to fake blockchain views, censorship, and follow-on consensus attacks."
    slide_heading: "The Great P2P Weakness: Sybil & Eclipse Attacks"
    tags: ["distributed-systems", "consensus"]
    confidence: "high"
  - term: "Neighbor list"
    modifier: "P2P node"
    aliases: ["peer list", "peer table"]
    definition: "The set of peers a node currently knows about or connects to for sending and receiving network information."
    context: "The eclipse attack works by filling a victim's neighbor list with attacker-controlled peers."
    slide_heading: "The Eclipse Attack"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Peer diversity"
    modifier: "P2P security"
    aliases: ["connection diversity", "diverse peers"]
    definition: "The practice of maintaining varied peer connections so one attacker, region, or failure mode is less likely to dominate a node's view."
    context: "The notes identify peer diversity and connection hygiene as practical defenses against eclipse-style isolation."
    slide_heading: "The Eclipse Attack"
    tags: ["distributed-systems"]
    confidence: "high"
