lesson_id: "04-CP"
lesson_title: "Asymmetric Encryption & Digital Signatures"
source_path: "lessons/primitives/04-CP-asymmetric_encryption_and_digital_signatures.qmd"
terms:
  - term: "Key distribution problem"
    modifier: null
    aliases: ["key-distribution problem", "key distribution crisis"]
    definition: "The challenge of securely sharing secret keys with many parties before encrypted communication can begin."
    context: "The lesson opens with this scaling problem to motivate why public-key cryptography was needed."
    slide_heading: "The Impossible Secret"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Symmetric cryptography"
    modifier: null
    aliases: ["symmetric encryption", "symmetric crypto"]
    definition: "A cryptographic approach where the same shared secret key is used for both encryption and decryption."
    context: "The lesson contrasts symmetric systems' speed with their poor scaling when many unique shared keys are required."
    slide_heading: "The Key-Distribution Crisis"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Shared key"
    modifier: null
    aliases: ["shared secret key", "pre-shared secret", "unique shared key"]
    definition: "A secret key known to the communicating parties and used to protect their messages."
    context: "The combinatorial growth of pairwise shared keys is the operational burden that asymmetric cryptography helps solve."
    slide_heading: "The Key-Distribution Crisis"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Asymmetric cryptography"
    modifier: null
    aliases: ["public-key cryptography", "public key cryptography"]
    definition: "A cryptographic model that uses a mathematically linked public key and private key for different operations."
    context: "The locked mailbox analogy introduces asymmetric cryptography as a way for public information to enable private communication."
    slide_heading: "The Locked Mailbox Analogy"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Encryption"
    modifier: "asymmetric cryptography"
    aliases: ["encrypt"]
    definition: "The process of using a recipient's public key to transform a message so only the matching private key can recover it."
    context: "The lesson uses encryption first to explain confidentiality before flipping the key roles for signatures."
    slide_heading: "The Locked Mailbox Analogy"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Decryption"
    modifier: "asymmetric cryptography"
    aliases: ["decrypt"]
    definition: "The process of using a private key to recover a message that was encrypted with the matching public key."
    context: "Decryption is the private-key operation in the mailbox model and in RSA's confidentiality workflow."
    slide_heading: "The Locked Mailbox Analogy"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Public key"
    modifier: null
    aliases: []
    definition: "The shareable half of an asymmetric key pair used for encryption or signature verification."
    context: "Students need the public key role to understand both secure message delivery and public verification of signatures."
    slide_heading: "The Locked Mailbox Analogy"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Private key"
    modifier: null
    aliases: []
    definition: "The secret half of an asymmetric key pair used for decryption or digital signing."
    context: "The lesson repeatedly ties control, secrecy, and blockchain ownership to keeping the private key protected."
    slide_heading: "The Locked Mailbox Analogy"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Key pair"
    modifier: "asymmetric cryptography"
    aliases: ["public/private key pair", "public-private key pair"]
    definition: "A matched public key and private key whose mathematical relationship enables asymmetric cryptographic operations."
    context: "RSA, ECC, signatures, PKI certificates, and blockchain wallets all rely on the key-pair model."
    slide_heading: "Enter Public-Key Cryptography"
    tags: ["cryptography"]
    confidence: "high"
  - term: "One-way function"
    modifier: "public-key cryptography"
    aliases: ["mathematical one-way function", "one-way property"]
    definition: "A function that is efficient to compute forward but infeasible to reverse without additional secret information."
    context: "The comparison slide frames asymmetric security around easy forward computation and hard reversal."
    slide_heading: "Symmetric vs Asymmetric Comparison"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Hybrid cryptosystem"
    modifier: null
    aliases: ["hybrid system", "hybrid cryptographic system"]
    definition: "A design that uses asymmetric cryptography to establish trust or keys and symmetric cryptography for fast bulk encryption."
    context: "The lesson notes that real protocols usually combine the two approaches rather than choosing only one."
    slide_heading: "Symmetric vs Asymmetric Comparison"
    tags: ["cryptography", "real-world"]
    confidence: "high"
  - term: "Trapdoor function"
    modifier: null
    aliases: ["trapdoor one-way function"]
    definition: "A function that is easy to compute in one direction but infeasible to reverse unless the secret trapdoor information is known."
    context: "Trapdoor functions provide the mathematical abstraction behind public encryption and private decryption."
    slide_heading: "Trapdoor Functions"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Diffie-Hellman key exchange"
    modifier: null
    aliases: ["Diffie-Hellman", "DH", "Diffie–Hellman key exchange"]
    definition: "A protocol that lets two parties derive the same shared secret over an insecure channel without sending the secret itself."
    context: "The lesson presents Diffie-Hellman as a practical answer to the key-distribution problem."
    slide_heading: "Diffie–Hellman Key Exchange Concept"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Shared secret"
    modifier: "Diffie-Hellman"
    aliases: ["shared value", "shared key"]
    definition: "A secret value independently derived by both parties from their private exponents and exchanged public values."
    context: "The Diffie-Hellman walkthrough shows how both sides compute the same secret without exposing their private exponents."
    slide_heading: "Diffie–Hellman Key Exchange Concept"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Modular exponentiation"
    modifier: null
    aliases: ["exponentiation modulo n", "modular power"]
    definition: "The operation of raising a value to an exponent and reducing the result modulo a chosen number."
    context: "The lesson uses modular exponentiation as the shared mathematical engine behind RSA and Diffie-Hellman."
    slide_heading: "Mathematical Backdrop: Modular Exponentiation"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Modular arithmetic"
    modifier: null
    aliases: ["modulo arithmetic", "mod arithmetic"]
    definition: "Arithmetic where results wrap around after division by a fixed modulus."
    context: "Students need modular arithmetic to read RSA and Diffie-Hellman formulas without treating them as black boxes."
    slide_heading: "Mathematical Backdrop: Modular Exponentiation"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Computational hardness assumption"
    modifier: null
    aliases: ["hardness assumption", "hard problem"]
    definition: "An assumption that a mathematical problem has no efficient known solution for properly chosen parameters."
    context: "The lesson emphasizes that public-key security rests on specific hard problems, not on hidden algorithms."
    slide_heading: "Computational Hardness Assumptions"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Integer factorization"
    modifier: null
    aliases: ["factoring", "factorization"]
    definition: "The problem of recovering the prime factors of a composite number."
    context: "RSA's security depends on factoring large products of secret primes being infeasible for attackers."
    slide_heading: "Computational Hardness Assumptions"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Discrete logarithm problem"
    modifier: null
    aliases: ["discrete log", "DLP"]
    definition: "The problem of finding an exponent from a base, modulus, and resulting modular power."
    context: "Diffie-Hellman security depends on observers being unable to recover private exponents from public values."
    slide_heading: "Computational Hardness Assumptions"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Elliptic-curve discrete logarithm problem"
    modifier: null
    aliases: ["elliptic curve DL", "ECDLP", "elliptic-curve discrete log"]
    definition: "The problem of finding the scalar that maps one elliptic-curve point to another by point multiplication."
    context: "ECC relies on this problem to provide comparable security with much smaller keys than RSA."
    slide_heading: "Computational Hardness Assumptions"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Shor's algorithm"
    modifier: null
    aliases: ["Shor's quantum algorithm"]
    definition: "A quantum algorithm that can solve integer factorization and discrete logarithm problems efficiently on sufficiently capable quantum computers."
    context: "The lesson uses Shor's algorithm to preview why current RSA, Diffie-Hellman, and ECC systems may need migration."
    slide_heading: "Computational Hardness Assumptions"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Post-quantum cryptography"
    modifier: null
    aliases: ["PQC", "quantum-safe cryptography"]
    definition: "Cryptography designed around hard problems believed to resist attacks by both classical and quantum computers."
    context: "The lesson introduces post-quantum cryptography as the replacement direction for public-key systems threatened by Shor's algorithm."
    slide_heading: "Computational Hardness Assumptions"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Digital signature"
    modifier: null
    aliases: ["signature"]
    definition: "A cryptographic value produced with a private key that lets others verify message origin and integrity with the public key."
    context: "The lesson shifts from encryption to signatures because blockchains rely on signatures to authorize transactions."
    slide_heading: "From Encryption to Signing"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Authenticity"
    modifier: null
    aliases: ["authentication"]
    definition: "The security property that a message or action came from the claimed source."
    context: "Digital signatures provide authenticity by linking an approved message to the holder of a private key."
    slide_heading: "From Encryption to Signing"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Integrity"
    modifier: null
    aliases: ["message integrity", "data integrity"]
    definition: "The security property that data has not been altered from the version that was signed or verified."
    context: "The signature workflow fails if a message changes, making integrity visible to students in the microlab."
    slide_heading: "From Encryption to Signing"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Non-repudiation"
    modifier: null
    aliases: []
    definition: "The property that a signer cannot plausibly deny a valid signature made with their private key."
    context: "The lesson distinguishes non-repudiation from secrecy when explaining what signatures prove."
    slide_heading: "From Encryption to Signing"
    tags: ["cryptography"]
    confidence: "high"
  - term: "RSA"
    modifier: null
    aliases: ["Rivest-Shamir-Adleman"]
    definition: "A public-key cryptosystem based on the difficulty of factoring large composite numbers."
    context: "RSA is presented as the first widely deployed asymmetric system for both encryption and digital signatures."
    slide_heading: "RSA Emerges"
    tags: ["cryptography", "real-world"]
    confidence: "high"
  - term: "RSA modulus"
    modifier: null
    aliases: ["modulus n", "n"]
    definition: "The public composite number produced by multiplying RSA's two secret primes."
    context: "The modulus is public, but recovering its factors would reveal information needed to compute the private exponent."
    slide_heading: "RSA Key Generation Overview"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Public exponent"
    modifier: "RSA"
    aliases: ["e"]
    definition: "The RSA public-key exponent chosen to work with the private exponent and the modulus."
    context: "The public exponent appears in RSA encryption and signature verification formulas."
    slide_heading: "RSA Key Generation Overview"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Private exponent"
    modifier: "RSA"
    aliases: ["d"]
    definition: "The RSA private-key exponent computed from the public exponent and phi of the modulus."
    context: "The private exponent is what enables RSA decryption and signing, so it must remain secret."
    slide_heading: "RSA Key Generation Overview"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Euler's theorem"
    modifier: "RSA intuition"
    aliases: []
    definition: "A number-theoretic result used to explain why correctly chosen RSA exponents return a value to its original form."
    context: "The lesson uses Euler's theorem to separate RSA correctness from the hardness assumption that protects the private key."
    slide_heading: "Why RSA Works (Intuition)"
    tags: ["cryptography"]
    confidence: "high"
  - term: "RSA padding"
    modifier: null
    aliases: ["OAEP", "RSA-PSS", "padding scheme"]
    definition: "A structured encoding added around RSA inputs so real deployments avoid the weaknesses of raw textbook RSA equations."
    context: "The notes warn that secure RSA encryption and signatures require padding schemes rather than only the simplified classroom formulas."
    slide_heading: "RSA Encryption & Decryption"
    tags: ["cryptography", "real-world"]
    confidence: "high"
  - term: "Elliptic curve cryptography"
    modifier: null
    aliases: ["ECC"]
    definition: "A public-key approach that uses arithmetic on elliptic-curve points to create compact keys and signatures."
    context: "The lesson introduces ECC as the modern efficient alternative used by many blockchain and mobile systems."
    slide_heading: "Elliptic Curve Cryptography (ECC)"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Scalar multiplication"
    modifier: "ECC"
    aliases: ["point multiplication", "kP"]
    definition: "The elliptic-curve operation of repeatedly adding a point to itself according to a private integer."
    context: "ECC public keys are generated by scalar multiplication, while reversing that operation is assumed hard."
    slide_heading: "Elliptic Curve Cryptography (ECC)"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Digital signature workflow"
    modifier: null
    aliases: ["sign-and-verify workflow"]
    definition: "The process of hashing a message, signing the digest with a private key, and verifying the result with a public key."
    context: "The workflow gives students the generic pattern behind software updates, TLS, and blockchain transactions."
    slide_heading: "Digital Signature Workflow"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Message hash"
    modifier: "digital signatures"
    aliases: ["message digest", "digest", "hash"]
    definition: "A fixed-length digest of a message that is signed instead of signing the entire raw message directly."
    context: "The lesson explains that signatures usually protect hashes to standardize input size and make signing efficient."
    slide_heading: "Digital Signature Workflow"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Signature verification"
    modifier: null
    aliases: ["verify", "verification"]
    definition: "The public-key check that confirms whether a signature matches a message and the claimed signer's public key."
    context: "Verification is the public operation that lets anyone test authenticity and integrity without knowing the private key."
    slide_heading: "Digital Signature Workflow"
    tags: ["cryptography"]
    confidence: "high"
  - term: "RSA signature"
    modifier: null
    aliases: ["RSA digital signature"]
    definition: "An RSA-based signature that applies the private exponent to a message digest and is checked with the public exponent."
    context: "The example shows the signature-side mirror of RSA encryption and reinforces the reversal of key roles."
    slide_heading: "Example: RSA Signature"
    tags: ["cryptography"]
    confidence: "high"
