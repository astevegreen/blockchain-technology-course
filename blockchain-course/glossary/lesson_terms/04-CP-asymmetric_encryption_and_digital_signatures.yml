lesson_id: "04-CP"
lesson_title: "Keys, secp256k1 and Addresses"
source_path: "lessons/primitives/04-CP-asymmetric_encryption_and_digital_signatures.qmd"
terms:
  - term: "Asymmetric cryptography"
    modifier: null
    aliases: ["public-key cryptography", "public key cryptography"]
    definition: "Cryptography that uses a matched pair of keys: a secret private key, and a public key computed from it that anyone can use to check the private key's work."
    context: "The lesson builds the key pair on secp256k1, the curve Bitcoin, Ethereum and Tron all use, and ties control of funds to the private key."
    slide_heading: "A private key is a number that controls coins"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Public key"
    modifier: null
    aliases: []
    definition: "The shareable half of a key pair: on secp256k1, a point on the curve computed from the private key, used to verify signatures."
    context: "The lesson derives the public key as K = k × G and then hashes it into an address on each course chain."
    slide_heading: "A private key is a number that controls coins"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Private key"
    modifier: null
    aliases: []
    definition: "A random 256-bit number that signs transactions; whoever holds it can spend the coins it controls."
    context: "The lesson stresses that there is no account name, password reset or bank behind a private key."
    slide_heading: "A private key is a number that controls coins"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Key pair"
    modifier: "asymmetric cryptography"
    aliases: ["public/private key pair", "public-private key pair"]
    definition: "A private key and the public key computed from it."
    context: "The lesson builds the key pair on secp256k1: a random private number and the public point derived from it."
    slide_heading: "A private key is a number that controls coins"
    tags: ["cryptography"]
    confidence: "high"
  - term: "One-way function"
    modifier: "public-key cryptography"
    aliases: ["mathematical one-way function", "one-way property"]
    definition: "A function that is quick to compute forward but infeasible to reverse."
    context: "The lesson shows one-way behavior twice: a hash digest cannot be run backwards, only guessed, and a public key cannot be turned back into its private key."
    slide_heading: "You cannot run a hash backwards, only guess"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Elliptic-curve discrete logarithm problem"
    modifier: null
    aliases: ["elliptic curve DL", "ECDLP", "elliptic-curve discrete log"]
    definition: "The problem of working back from a public key, a point on an elliptic curve, to the private key, the number that multiplied the curve's fixed point G."
    context: "The lesson names it as the reason a secp256k1 public key does not give up its private key: no known computer can solve it for curves this size."
    slide_heading: "A private key is a number that controls coins"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Shor's algorithm"
    modifier: null
    aliases: ["Shor's quantum algorithm"]
    definition: "A quantum algorithm that would break ECDSA, working out a private key from a public key, on a large enough quantum computer."
    context: "The lesson notes that no machine large enough exists yet, and that keys already shown on chain are the most exposed."
    slide_heading: "Keys fail through people and bad randomness"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Post-quantum cryptography"
    modifier: null
    aliases: ["PQC", "quantum-safe cryptography"]
    definition: "Cryptography designed to replace schemes that a large quantum computer could break."
    context: "The lesson notes that NIST published the ML-KEM (FIPS 203) and ML-DSA (FIPS 204) standards on 13 Aug 2024, while Bitcoin, Ethereum and Tron still sign with secp256k1 keys (as of 24 Oct 2026)."
    slide_heading: "Keys fail through people and bad randomness"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Digital signature"
    modifier: null
    aliases: ["signature"]
    definition: "A value made with a private key over a transaction's hash that anyone can check with the matching public key; change one byte and it no longer verifies."
    context: "The lesson stresses that a signature proves the key approved these exact bytes, not who held the key."
    slide_heading: "A signature binds the key to these exact bytes"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Integrity"
    modifier: null
    aliases: ["message integrity", "data integrity"]
    definition: "The security property that data has not been altered from the version that was signed or verified."
    context: "The lesson shows that changing one byte of a signed transaction makes its signature fail to verify."
    slide_heading: "A signature binds the key to these exact bytes"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Elliptic curve cryptography"
    modifier: null
    aliases: ["ECC"]
    definition: "Public-key cryptography built on arithmetic with points on an elliptic curve."
    context: "The lesson derives the public key as a curve point and notes that Bitcoin, Ethereum and Tron all use one curve, secp256k1 (as of 24 Oct 2026)."
    slide_heading: "A private key is a number that controls coins"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Scalar multiplication"
    modifier: "ECC"
    aliases: ["point multiplication", "kP"]
    definition: "Multiplying the curve's fixed point G by the private key k to get the public key point, K = k × G."
    context: "The lesson shows the forward step is quick, while reversing it is the elliptic-curve discrete logarithm problem."
    slide_heading: "A private key is a number that controls coins"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Digital signature workflow"
    modifier: null
    aliases: ["sign-and-verify workflow"]
    definition: "Hashing a transaction, signing the hash with the private key and a fresh random nonce, and letting anyone verify the result with the public key."
    context: "The lesson walks through these ECDSA steps, which Bitcoin, Ethereum and Tron all use, and warns that a reused nonce exposes the private key."
    slide_heading: "A signature binds the key to these exact bytes"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Message hash"
    modifier: "digital signatures"
    aliases: ["message digest", "digest", "hash"]
    definition: "The fixed-length hash of a transaction, which is what the private key actually signs."
    context: "In the lesson's ECDSA steps, the signer hashes the transaction first and then signs the hash."
    slide_heading: "A signature binds the key to these exact bytes"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Signature verification"
    modifier: null
    aliases: ["verify", "verification"]
    definition: "The public-key check that confirms whether a signature matches a transaction's hash and the signer's public key."
    context: "The lesson stresses that verification needs only public information, so no one has to be trusted."
    slide_heading: "A signature binds the key to these exact bytes"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Blockchain address"
    modifier: null
    aliases: ["address", "wallet address", "account address"]
    definition: "A public identifier built from a public key, usually by hashing it; each chain hashes and encodes it differently."
    context: "The lesson derives Bitcoin, Ethereum and Tron addresses from public keys and shows how to read Bitcoin's prefixes."
    slide_heading: "A Bitcoin address is a hash of the public key"
    tags: ["cryptography", "bitcoin", "ethereum"]
    confidence: "high"
  - term: "Pseudonymity"
    modifier: "blockchain"
    aliases: ["pseudonymous identity", "ownership without identity"]
    definition: "A privacy model where activity is linked to a key-derived identifier rather than directly to a real-world identity."
    context: "The lesson stresses that an address carries no name but its whole history is public, so patterns can link addresses and one identified address can name many."
    slide_heading: "A signature authorizes; it doesn't identify"
    tags: ["cryptography", "distributed-systems"]
    confidence: "high"
  - term: "Private-key compromise"
    modifier: null
    aliases: ["key compromise", "compromised private key"]
    definition: "A failure state where an attacker obtains a private key and can act as the key holder."
    context: "The lesson shows keys lost through weak randomness (Milk Sad) and theft (Bitfinex), and notes that a stolen key cannot be revoked."
    slide_heading: "Keys fail through people and bad randomness"
    tags: ["cryptography", "real-world"]
    confidence: "high"
  - term: "ML-KEM"
    modifier: null
    aliases: ["FIPS 203"]
    definition: "NIST's post-quantum standard for setting up a shared key, published as FIPS 203 on 13 Aug 2024."
    context: "With ML-DSA it shows the replacements for quantum-vulnerable curves are already standardized."
    slide_heading: "Keys fail through people and bad randomness"
    tags: ["cryptography"]
    confidence: "high"
  - term: "ML-DSA"
    modifier: null
    aliases: ["FIPS 204"]
    definition: "NIST's post-quantum digital signature standard, published as FIPS 204 on 13 Aug 2024."
    context: "As of 24 Oct 2026, Bitcoin, Ethereum and Tron still sign with secp256k1 keys, not ML-DSA."
    slide_heading: "Keys fail through people and bad randomness"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Base58Check"
    modifier: null
    aliases: ["Base58"]
    definition: "An encoding with a checksum that turns address bytes into text; Tron applies it to the 0x41 prefix plus Ethereum's 20 bytes, giving a 34-character address starting with T."
    context: "The same 20 bytes on Ethereum and Tron mean the same key: a lead to confirm, not a finding."
    slide_heading: "Worked: one key, two addresses, one signature"
    tags: ["cryptography", "forensics"]
    confidence: "high"
