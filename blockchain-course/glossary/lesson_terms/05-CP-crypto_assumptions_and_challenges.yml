  - term: "Security margin"
    modifier: "cryptography"
    aliases: ["security margins"]
    definition: "The gap between the best known attack cost and the level of effort a system is meant to withstand."
    context: "The notes emphasize that margins shrink when cryptanalysis improves or computation becomes cheaper."
