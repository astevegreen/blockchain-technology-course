  - term: "Collision resistance"
    modifier: null
    aliases: []
    definition: "The hash property that it should be infeasible to find two different inputs with the same digest."
    context: "The lesson uses broken collision resistance to show how an old hash can invalidate higher-level systems that trust signed digests."
    slide_heading: "Hash Fragility: Collision Resistance Isn’t Forever"
