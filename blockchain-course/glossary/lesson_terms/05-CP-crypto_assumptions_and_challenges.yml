  - term: "Algorithm deprecation"
    modifier: "cryptography"
    aliases: ["cryptographic deprecation", "deprecated algorithm"]
    definition: "The process of retiring an algorithm from trusted use because its security margin or standard status is no longer adequate."
    context: "SHA-1's path from standard to deprecated shows why protocols need planned replacement mechanisms."
