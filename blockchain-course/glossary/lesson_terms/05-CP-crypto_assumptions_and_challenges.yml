  - term: "Hash collision"
    modifier: null
    aliases: ["collision", "collisions"]
    definition: "A case where two different inputs produce the same hash output."
    context: "The SHA-1 example shows how a benign file and malicious file can share one digest and therefore one validating signature."
    slide_heading: "Hash Fragility: Collision Resistance Isn’t Forever"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Chosen collision"
    modifier: "hashing"
    aliases: ["chosen-prefix collision", "crafted collision"]
    definition: "A collision attack where the attacker deliberately constructs different inputs that hash to the same digest."
    context: "The speaker notes stress that practical collisions become dangerous when attackers can craft malicious twins for signed content."
    slide_heading: "Hash Fragility: Collision Resistance Isn’t Forever"
    tags: ["cryptography", "real-world"]
    confidence: "high"
