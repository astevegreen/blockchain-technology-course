    definition: "The post-World War II monetary system in which the U.S. dollar was convertible to gold and other major currencies were pegged to the dollar."
    context: "The lesson presents Bretton Woods as the old institutional anchor that ended before the modern fiat era."
    slide_heading: "The Turning Point: Ending Bretton Woods"
