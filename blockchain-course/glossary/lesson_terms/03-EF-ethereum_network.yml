lesson_id: "03-EF"
lesson_title: "Mempool, MEV and DEX Trades"
source_path: "lessons/ethereum/03-EF-ethereum_network.qmd"
terms:
  - term: "Ethereum transaction"
    modifier: "Ethereum"
    aliases: ["transaction"]
    definition: "A signed instruction from an account, which anyone watching the network can read before a block includes it."
    context: "Before a block includes it, anyone watching the network can read a pending transaction's sender, nonce, fee caps, target, value and call data; after inclusion the receipt adds status, gas used and logs."
    slide_heading: "A DEX trade is visible before it lands"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Peer-to-peer gossip"
    modifier: "Ethereum"
    aliases: ["P2P gossip", "gossip"]
    definition: "A propagation pattern where Ethereum nodes forward transactions or blocks through direct peer connections."
    context: "Nodes gossip new transactions to their peers, so most nodes hold a similar view within seconds, but each keeps its own mempool and there is no single official queue."
    slide_heading: "The mempool is public, so pending trades show"
    tags: ["ethereum", "distributed-systems"]
    confidence: "high"
  - term: "Mempool"
    modifier: "Ethereum"
    aliases: ["memory pool", "pending transaction pool"]
    definition: "A node's local collection of pending Ethereum transactions that may be selected for future block inclusion."
    context: "A DEX trade waits in the mempool until a block includes it, and anyone watching can read it there, including bots that profit from where it lands in the block."
    slide_heading: "A DEX trade is visible before it lands"
    tags: ["ethereum", "distributed-systems"]
    confidence: "high"
  - term: "Validator"
    modifier: "Ethereum PoS"
    aliases: ["validators"]
    definition: "An Ethereum participant whose duty is to propose blocks."
    context: "Under proposer-builder separation, validators still propose blocks, but they run MEV-Boost to pick the best builder bid and sign its header."
    slide_heading: "Searchers, builders and relays set the order"
    tags: ["ethereum", "consensus"]
    confidence: "high"
  - term: "Block builder"
    modifier: "Ethereum"
    aliases: ["builder"]
    definition: "A specialist that combines ordinary transactions and searchers' bundles into full blocks, choosing their order."
    context: "Builders favor the transactions that pay them most, so the order of a block, and a trade's place in it, is the builder's choice, often made to pay a searcher."
    slide_heading: "A DEX trade is visible before it lands"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "Transaction receipt"
    modifier: "Ethereum"
    aliases: ["receipt"]
    definition: "The record produced after Ethereum transaction execution that reports status, gas used, and emitted logs."
    context: "An included swap leaves token Transfer logs and the pool's Swap event in its receipt, which the analyst reads to say who traded what."
    slide_heading: "A DEX trade is visible before it lands"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Event log"
    modifier: "Ethereum"
    aliases: ["logs", "emitted logs"]
    definition: "Structured output emitted during transaction execution and recorded in the transaction receipt."
    context: "A Uniswap V2 swap leaves two token Transfer logs plus the pool's Sync and Swap events; the analyst turns them into one plain sentence about who traded what."
    slide_heading: "A DEX trade is visible before it lands"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Nonce"
    modifier: "Ethereum account"
    aliases: ["account nonce", "sequence number"]
    definition: "A per-account counter that orders Ethereum transactions and prevents replay or skipped execution."
    context: "An account's transactions run in nonce order, so a gap holds later ones back whatever they pay, and resending with the same nonce and a higher fee replaces a stuck transaction."
    slide_heading: "A DEX trade is visible before it lands"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Max fee per gas"
    modifier: "Ethereum fee market"
    aliases: ["maxFeePerGas", "max_fee_per_gas", "max fee"]
    definition: "The sender's ceiling on the total per-gas price they are willing to pay for a transaction."
    context: "A pending transaction shows its fee caps before inclusion; the unused headroom under maxFeePerGas is not charged."
    slide_heading: "A pending transaction already shows the trade"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Max priority fee per gas"
    modifier: "Ethereum fee market"
    aliases: ["maxPriorityFeePerGas", "max_priority_fee_per_gas", "priority fee", "tip"]
    definition: "The sender's maximum per-gas tip, paid to the block's fee recipient for including the transaction."
    context: "Builders favor the transactions that pay them most, so the tip a sender offers sets where a pending transaction lands in the queue."
    slide_heading: "A pending transaction already shows the trade"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Effective gas price"
    modifier: "Ethereum fee market"
    aliases: ["actual per-unit fee"]
    definition: "The actual per-gas price paid after applying the sender's fee ceiling, the base fee, and the priority fee."
    context: "Effective gas price is the lower of maxFeePerGas and the base fee plus the tip: with a 50 gwei cap, a 2 gwei tip and a 30 gwei base fee, the sender pays 32 gwei."
    slide_heading: "Fees set the queue: base fee burned, tip paid"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Digital signature"
    modifier: "Ethereum transaction"
    aliases: ["signature", "signed payload"]
    definition: "Cryptographic evidence that the holder of an account's private key authorized a specific transaction payload."
    context: "A transaction is a signed instruction from an account, and its from field names who signed."
    slide_heading: "A pending transaction already shows the trade"
    tags: ["ethereum", "cryptography"]
    confidence: "high"
  - term: "EIP-1559 fee mechanism"
    modifier: "Ethereum fee market"
    aliases: ["EIP-1559", "Ethereum Improvement Proposal 1559"]
    definition: "Ethereum's fee model that combines an automatically adjusted base fee with a user-selected priority tip and fee ceiling."
    context: "The lesson uses EIP-1559 to explain how fees set the queue: the base fee is burned and the tip pays for inclusion."
    slide_heading: "Fees set the queue: base fee burned, tip paid"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Base fee"
    modifier: "Ethereum fee market"
    aliases: ["base_fee"]
    definition: "The protocol-set per-gas fee that adjusts with block demand and is burned rather than paid to the proposer."
    context: "The base fee rises when blocks run above the target, half the block gas limit, and falls when they run below it, by at most one eighth per block."
    slide_heading: "Fees set the queue: base fee burned, tip paid"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Priority fee"
    modifier: "Ethereum fee market"
    aliases: ["tip", "max priority fee"]
    definition: "The per-gas tip paid to the block's fee recipient: the proposer, or an outside builder that pays the proposer in a last transaction."
    context: "An unusually high tip on a transaction placed right before or after a large trade is a sign of a bot buying position."
    slide_heading: "Fees set the queue: base fee burned, tip paid"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Revert"
    modifier: "Ethereum execution"
    aliases: ["transaction revert", "reverted transaction"]
    definition: "A contract refusing a call, so the intended change does not happen."
    context: "The router reverts a swap if the output would fall below the trader's minimum or the deadline has passed, which caps what a sandwich can take."
    slide_heading: "A DEX swaps against a pool, not a person"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Maximal Extractable Value"
    modifier: "Ethereum block production"
    aliases: ["MEV"]
    definition: "The value that can be extracted from block production, beyond the block reward and gas fees, by including, leaving out or reordering transactions."
    context: "Daian and colleagues named it in 2019, as miner extractable value, after watching bots front-run DEX trades; arbitrage, liquidation and sandwiches are the common types."
    slide_heading: "A DEX trade is visible before it lands"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "Public mempool"
    modifier: "Ethereum"
    aliases: ["public pending transaction pool"]
    definition: "The default state in which pending Ethereum transactions can be observed by anyone running appropriate node infrastructure."
    context: "Public visibility lets searchers detect arbitrage, liquidation, and sandwich opportunities before transactions are included."
    slide_heading: "A DEX trade is visible before it lands"
    tags: ["ethereum", "distributed-systems"]
    confidence: "high"
  - term: "Private transaction submission"
    modifier: "Ethereum"
    aliases: ["direct submission", "private submission"]
    definition: "Sending a transaction to a private service, such as a private mempool, instead of broadcasting it through the public mempool."
    context: "Flashbots Protect sends transactions to a private Flashbots mempool, hidden from front-running and sandwich bots, but a block builder still decides the order."
    slide_heading: "The mempool is public, so pending trades show"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "Replacement transaction"
    modifier: "Ethereum"
    aliases: ["transaction replacement", "replace-by-fee"]
    definition: "A transaction that reuses the same account nonce with a higher fee to supersede an earlier pending transaction."
    context: "Replacement unsticks a pending transaction, and the replaced one leaves no on-chain record, because the chain keeps only what was included."
    slide_heading: "The mempool is public, so pending trades show"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Searcher"
    modifier: "MEV"
    aliases: ["MEV searcher", "searchers"]
    definition: "An off-chain actor that scans pending transactions and market state for profitable MEV opportunities."
    context: "Searchers watch the public mempool, use bots to submit the profitable transactions, and send bundles with a bid to builders."
    slide_heading: "The mempool is public, so pending trades show"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "Block proposer"
    modifier: "Ethereum PoS"
    aliases: ["proposer"]
    definition: "The validator whose duty is to propose a block; under proposer-builder separation it picks the best builder bid and signs that block's header."
    context: "The tip goes to the proposer's address, or to an outside builder that pays the proposer in a last transaction."
    slide_heading: "Fees set the queue: base fee burned, tip paid"
    tags: ["ethereum", "consensus"]
    confidence: "high"
  - term: "Arbitrage"
    modifier: "MEV"
    aliases: []
    definition: "An MEV strategy that profits from price differences for the same asset across venues such as decentralized exchanges."
    context: "Searchers watch the mempool for arbitrage chances; an arbitrage bot buys a token on the DEX where it is cheaper and sells it on the one where it is dearer."
    slide_heading: "The mempool is public, so pending trades show"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "Liquidation"
    modifier: "DeFi"
    aliases: ["liquidations"]
    definition: "The closing of an undercollateralized loan position, for which a lending protocol pays the liquidator a reward."
    context: "Liquidation is one of the common MEV chances searchers watch the mempool for."
    slide_heading: "The mempool is public, so pending trades show"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "Sandwich attack"
    modifier: "MEV"
    aliases: ["sandwiching", "front/back-run"]
    definition: "An MEV strategy that places transactions before and after a user's swap to profit from the induced price movement."
    context: "On chain, a sandwich is three swaps in one pool in consecutive block positions, the outer two by the same bot; the victim's amountOutMin caps the damage."
    slide_heading: "A DEX trade is visible before it lands"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "Decentralized exchange"
    modifier: "DeFi"
    aliases: ["DEX", "DEXes"]
    definition: "An on-chain marketplace where users trade tokens through smart contracts rather than a centralized exchange operator."
    context: "A DEX trade is a public call to a contract that swaps against a pool's reserves, so the counterparty is code, not a person."
    slide_heading: "A DEX trade is visible before it lands"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "Proposer-builder separation"
    modifier: "Ethereum MEV"
    aliases: ["PBS"]
    definition: "A block production design that separates the validator duty of proposing a block from the specialized work of building it."
    context: "Under PBS a builder, often paying a searcher, chooses the order of a block's transactions, so a transaction's position next to a trade is not evidence of a link to it."
    slide_heading: "Searchers, builders and relays set the order"
    tags: ["ethereum", "consensus", "real-world"]
    confidence: "high"
  - term: "Transaction bundle"
    modifier: "MEV"
    aliases: ["bundle", "bundles"]
    definition: "A group of ordered transactions submitted together to a builder with an associated bid or value estimate."
    context: "Bundles are how searchers package MEV strategies for builders to combine into full blocks."
    slide_heading: "Searchers, builders and relays set the order"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "MEV relay"
    modifier: "Ethereum MEV"
    aliases: ["relay", "relays"]
    definition: "An off-chain coordination service that checks built blocks and forwards blinded bids from builders to validators."
    context: "Relays let validators compare block bids while delaying disclosure of full block contents until after signing."
    slide_heading: "Searchers, builders and relays set the order"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "MEV-Boost"
    modifier: "Ethereum MEV"
    aliases: []
    definition: "Validator-side software commonly used to receive builder bids through relays in the MEV block-building workflow."
    context: "Validators running MEV-Boost pick the best bid and sign the header, and the relay then releases the full block."
    slide_heading: "Searchers, builders and relays set the order"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "Blinded block header"
    modifier: "Ethereum MEV"
    aliases: ["blinded bid", "blinded header"]
    definition: "A block header and bid value forwarded without revealing the full transaction body before validator selection."
    context: "Blinded headers allow validators to choose profitable bids while keeping a builder's transaction ordering private until commitment."
    slide_heading: "Searchers, builders and relays set the order"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "DEX aggregator"
    modifier: null
    aliases: ["aggregator", "aggregators"]
    definition: "A service that routes one trade through many pools for the best price, such as 1inch; like a router, it is only in the path."
    context: "Follow the Transfer logs to whoever received the output, not to the router or aggregator."
    slide_heading: "Routers and aggregators are only in the path"
    tags: ["ethereum", "forensics"]
    confidence: "high"
  - term: "Account abstraction"
    modifier: null
    aliases: ["ERC-4337", "UserOperation", "bundler", "EntryPoint"]
    definition: "ERC-4337's design in which a user signs a UserOperation and a bundler packs operations into one transaction to the EntryPoint contract's handleOps, so the transaction's sender is the bundler, not the actor."
    context: "The account that paid the gas is a service; the actor is the smart account."
    slide_heading: "Paymasters and relayers pay gas, not the bill"
    tags: ["ethereum", "forensics"]
    confidence: "high"
  - term: "Paymaster"
    modifier: null
    aliases: ["paymasters"]
    definition: "Under ERC-4337, a contract that pays the gas for a user's operation instead of the user."
    context: "A paymaster pays the gas, not the bill: it is a service, not the actor."
    slide_heading: "Paymasters and relayers pay gas, not the bill"
    tags: ["ethereum", "forensics"]
    confidence: "high"
  - term: "Meta-transaction"
    modifier: null
    aliases: ["ERC-2771", "gas relay", "trusted forwarder", "meta-transactions"]
    definition: "ERC-2771's design in which a user signs a request, a gas relay pays to send it, and a trusted forwarder passes on the signer's address, which the receiving contract treats as the caller."
    context: "The relay that paid the gas is a service; the actor is the signer."
    slide_heading: "Paymasters and relayers pay gas, not the bill"
    tags: ["ethereum", "forensics"]
    confidence: "high"
