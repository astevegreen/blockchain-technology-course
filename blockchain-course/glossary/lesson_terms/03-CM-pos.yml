    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Stake"
    modifier: "PoS"
    aliases: ["staked collateral", "staked capital"]
    definition: "Locked value that gives a validator weight in consensus and can be reduced if the validator violates protocol rules."
    context: "Stake determines both selection probability and the financial exposure that makes validator behavior accountable."
    slide_heading: "Orientation: Proof of Work vs Proof of Stake"
    tags: ["consensus"]
