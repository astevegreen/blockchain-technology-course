  - term: "Proof of Stake"
    modifier: "consensus"
    aliases: ["PoS"]
    definition: "A consensus approach where validators lock capital and risk penalties while proposing, voting on, and finalizing blocks."
    context: "The entire lesson explains how PoS replaces energy-based leader election with stake-weighted selection, duties, and punishments."
    slide_heading: "Orientation: Proof of Work vs Proof of Stake"
    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Security budget"
    modifier: "PoS"
    aliases: []
    definition: "The economic resources that make attacking the network expensive, measured in PoS by the stake and rewards at risk."
    context: "The lesson contrasts PoW energy costs with PoS capital exposure as different ways to buy consensus honesty."
