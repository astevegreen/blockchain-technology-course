  - term: "Nothing-at-stake"
    modifier: "PoS attack incentive"
    aliases: ["nothing at stake"]
    definition: "The incentive problem where validators can cheaply sign multiple competing forks unless penalties make that behavior costly."
    context: "Nothing-at-stake motivates slashing as a necessary economic countermeasure in cheap-signature consensus."
    slide_heading: "Nothing-at-Stake"
    tags: ["consensus"]
    confidence: "high"
  - term: "Staking rewards"
    modifier: "PoS incentives"
    aliases: ["validator rewards"]
    definition: "Protocol payments that compensate validators for participating honestly and performing assigned duties."
    context: "Rewards are one side of the lesson's economic security model, paired with penalties for misbehavior or inactivity."
    slide_heading: "Nothing-at-Stake and Economic Security"
    tags: ["consensus"]
    confidence: "high"
  - term: "Inactivity leak"
    modifier: "PoS penalty"
    aliases: ["inactivity penalty"]
    definition: "A mechanism that gradually reduces the balances of offline validators during extended non-participation so the chain can recover liveness."
    context: "The lesson presents inactivity leaks as a way to restore progress when many validators are offline during partitions or failures."
    slide_heading: "Nothing-at-Stake and Economic Security"
    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Penalty calibration"
    modifier: "PoS protocol design"
    aliases: ["penalty tuning"]
    definition: "The process of setting rewards and punishments strong enough to deter attacks without making honest operation too risky."
    context: "Penalty calibration shows that PoS security depends on parameter choices, not just the existence of slashing."
    slide_heading: "Nothing-at-Stake and Economic Security"
    tags: ["consensus"]
