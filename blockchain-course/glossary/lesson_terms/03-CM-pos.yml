  - term: "Weak subjectivity"
    modifier: "PoS bootstrapping"
    aliases: []
    definition: "The PoS property that new or long-offline nodes need a recent trusted checkpoint to identify the canonical chain safely."
    context: "Weak subjectivity explains why PoS nodes cannot always choose the right history from genesis using cryptography alone."
    slide_heading: "Weak Subjectivity"
    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Long-range attack"
    modifier: "PoS"
    aliases: ["fabricated alternative history", "old-key attack"]
    definition: "An attack where old validator keys are used to sign an alternative chain history after those validators have exited."
    context: "Long-range attacks are the concrete threat behind weak subjectivity and the need for recent checkpoints."
    slide_heading: "Weak Subjectivity"
    tags: ["consensus", "cryptography"]
    confidence: "high"
  - term: "Trusted checkpoint"
    modifier: "PoS bootstrapping"
    aliases: ["recent trusted checkpoint", "checkpoint hash"]
    definition: "A recent finalized block reference obtained from trusted or diverse sources before syncing a PoS node."
    context: "Trusted checkpoints are the practical anchor that lets new or returning nodes avoid attacker-supplied alternative histories."
    slide_heading: "Weak Subjectivity"
    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Censorship"
    modifier: "PoS attack"
    aliases: ["transaction censorship"]
    definition: "A proposer or validator strategy that deliberately omits or delays selected transactions from the chain."
    context: "The lesson treats censorship as a risk created by temporary proposer discretion over transaction inclusion."
    slide_heading: "Censorship, Bribery, and Eclipse"
    tags: ["consensus", "policy"]
