    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Activation queue"
    modifier: "PoS validator lifecycle"
    aliases: ["activation epoch"]
    definition: "The waiting process a staked node passes through before becoming an active validator."
    context: "The activation queue helps the protocol manage validator churn rather than allowing unlimited instant entry."
    slide_heading: "Proof of Stake: The Full Lifecycle"
    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Stake deposit"
    modifier: "PoS validator lifecycle"
    aliases: ["deposit stake", "validator deposit"]
    definition: "The locked funds a participant provides to enter the validator set and become economically accountable."
    context: "The lifecycle begins with a stake deposit, tying validator participation to capital that can be rewarded or penalized."
