  - term: "Block proposer"
    modifier: "PoS role"
    aliases: ["proposer", "leader"]
    definition: "The validator selected for a slot to choose transactions, build a candidate block, and propose it to the network."
    context: "The proposer role explains who gets temporary control over block construction and transaction ordering in PoS."
    slide_heading: "The Block Proposer: Selection and Building"
    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Stake-weighted selection"
    modifier: "PoS"
    aliases: ["stake-weighted randomness", "stake-weighted lottery"]
    definition: "A selection process where validator assignment is random but the chance of selection is proportional to stake."
    context: "Stake-weighted selection replaces the live proof-of-work race with a deterministic assignment derived from verifiable randomness."
    slide_heading: "The Block Proposer: Selection and Building"
    tags: ["consensus", "cryptography"]
    confidence: "high"
  - term: "Transaction ordering"
    modifier: "block proposal"
    aliases: ["ordering power", "transaction inclusion"]
    definition: "The proposer's ability to decide which pending transactions appear in a block and in what order."
    context: "The lesson flags transaction ordering because proposer discretion creates performance, fairness, censorship, and MEV concerns."
    slide_heading: "The Block Proposer: Selection and Building"
    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Maximal Extractable Value"
    modifier: "block proposal"
    aliases: ["MEV", "maximal extractable value"]
    definition: "Value a block builder or proposer can gain from transaction ordering, inclusion, or exclusion choices."
    context: "The speaker notes connect MEV to the proposer's control over block contents and ordering."
    slide_heading: "The Block Proposer: Selection and Building"
    tags: ["consensus", "ethereum"]
