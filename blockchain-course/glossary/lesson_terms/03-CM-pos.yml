  - term: "Bribery"
    modifier: "PoS attack"
    aliases: ["validator bribery"]
    definition: "An attack where an adversary pays validators to vote for, build, or support a chosen block or chain."
    context: "Bribery tests whether the protocol's stake at risk, reputation pressure, and slashing penalties outweigh external incentives."
    slide_heading: "Censorship, Bribery, and Eclipse"
    tags: ["consensus"]
    confidence: "high"
  - term: "Eclipse attack"
