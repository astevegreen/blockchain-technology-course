  - term: "Capital at risk"
    modifier: "PoS"
    aliases: ["staked capital", "bonded capital", "locked collateral"]
    definition: "Validator funds locked under protocol rules that can be lost or delayed if the validator misbehaves or fails duties."
    context: "Capital at risk is the economic pressure that makes PoS security different from proof-of-work energy expenditure."
    slide_heading: "Orientation: Proof of Work vs Proof of Stake"
    tags: ["consensus"]
    confidence: "high"
  - term: "Public verifiability"
    modifier: "PoS"
    aliases: ["publicly verifiable"]
    definition: "The property that validator assignments, votes, and punishment evidence can be checked by other participants from public protocol data."
    context: "The lesson highlights public verifiability because stake-based selection and penalties only work if others can audit them."
    slide_heading: "Orientation: Proof of Work vs Proof of Stake"
    tags: ["consensus", "cryptography"]
    confidence: "high"
  - term: "Validator"
