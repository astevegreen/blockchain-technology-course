  - term: "Unbonding period"
    modifier: "PoS validator lifecycle"
    aliases: ["unbonding", "cooldown"]
    definition: "A delay after validator exit during which stake remains locked before withdrawal is allowed."
    context: "Unbonding gives the system time to detect and punish old-key or exit-related misbehavior before funds leave."
    slide_heading: "Proof of Stake: The Full Lifecycle"
    tags: ["consensus", "ethereum"]
