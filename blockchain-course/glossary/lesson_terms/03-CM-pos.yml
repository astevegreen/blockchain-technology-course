    aliases: ["eclipse", "network isolation"]
    definition: "An attack that controls or hijacks a validator's network connections so it sees an attacker-shaped view of the chain."
    context: "Eclipse attacks show that PoS security still depends on network hygiene and diverse communication paths, not only on-chain rules."
    slide_heading: "Censorship, Bribery, and Eclipse"
