  - term: "Committee"
    modifier: "PoS validator group"
    aliases: ["validator committee", "committees"]
    definition: "A randomly assigned subset of validators that checks a proposed block and votes on it for a slot or epoch."
    context: "Committees make PoS scalable by letting smaller random groups stand in for the whole validator set."
    slide_heading: "The Committee: Attestation and Validation"
    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Attestation"
    modifier: "PoS vote"
    aliases: ["attestations", "attest", "validator vote"]
    definition: "A stake-weighted validator vote about a block, chain head, or checkpoint relationship."
    context: "Attestations are the evidence committees produce to show that validators have independently checked and endorsed protocol state."
    slide_heading: "The Committee: Attestation and Validation"
    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Quorum Certificate"
    modifier: "PoS vote aggregation"
    aliases: ["QC", "quorum certificate", "aggregate signature", "aggregated signatures"]
    definition: "A compact proof formed by aggregating enough validator attestations to show that a quorum approved a block or checkpoint."
    context: "Quorum certificates turn many individual votes into evidence the rest of the protocol can verify efficiently."
    slide_heading: "The Committee: Attestation and Validation"
    tags: ["consensus", "cryptography"]
    confidence: "high"
  - term: "Canonical block"
    modifier: "PoS"
    aliases: ["canonical acceptance"]
    definition: "A block treated as the accepted branch by the protocol after receiving enough stake-weighted support."
    context: "The committee slide distinguishes a proposed block from one that has sufficient validator endorsement to be considered canonical."
    slide_heading: "The Committee: Attestation and Validation"
    tags: ["consensus"]
    confidence: "high"
  - term: "Checkpoint"
    modifier: "PoS finality"
    aliases: ["epoch checkpoint", "finality anchor"]
    definition: "A block at an epoch boundary used as an anchor for finality votes."
    context: "Checkpoints let the protocol make finality decisions at epoch granularity instead of treating every slot as a separate finality target."
    slide_heading: "Epochs and Checkpoints: Organizing Slots"
    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Justification"
    modifier: "PoS finality"
    aliases: ["justified link", "supermajority vote link"]
    definition: "The state reached when a supermajority of total stake votes for a link between checkpoint epochs."
    context: "Justification is the intermediate endorsement step that precedes irreversible finalization."
    slide_heading: "Justification: Supermajority Vote Links"
    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Source checkpoint"
    modifier: "PoS finality vote"
    aliases: ["source epoch"]
    definition: "The earlier checkpoint named in a validator vote that links one epoch boundary to another."
    context: "Students need source and target checkpoint vocabulary to understand how justification votes are structured."
    slide_heading: "Justification: Supermajority Vote Links"
    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Target checkpoint"
    modifier: "PoS finality vote"
    aliases: ["target epoch"]
    definition: "The later checkpoint named in a validator vote that a source checkpoint is being linked to."
    context: "Target checkpoints complete the source-to-target vote structure used to justify epoch links."
    slide_heading: "Justification: Supermajority Vote Links"
    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Finalization"
    modifier: "PoS finality"
    aliases: ["finality", "finalized checkpoint"]
    definition: "The protocol step that makes a checkpoint and its prior history economically irreversible under the stated assumptions."
    context: "Finalization is the lesson's main bridge from short-term block acceptance to long-term consensus safety."
    slide_heading: "Finalization: Irreversible History"
    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Irreversible history"
    modifier: "PoS finality"
    aliases: ["irreversibility", "finalized history"]
    definition: "Blockchain history that cannot be reverted without large-scale slashable validator misconduct."
    context: "The finalization slides explain why reverting finalized PoS history requires provable conflicting votes from a large amount of stake."
    slide_heading: "Finalization: Irreversible History"
    tags: ["consensus"]
    confidence: "high"
  - term: "Slashing"
    modifier: "PoS penalty"
    aliases: ["slash", "slashed"]
    definition: "A protocol penalty that removes validator stake when cryptographic evidence proves misbehavior."
    context: "Slashing is the enforcement mechanism that turns cheap signatures and validator discretion into financially accountable behavior."
    slide_heading: "Slashing — Making Misbehavior Expensive"
    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Cryptoeconomic penalty"
    modifier: "PoS"
    aliases: ["economic penalty", "protocol penalty"]
    definition: "A punishment that combines cryptographic proof of a rule violation with an economic loss imposed by the protocol."
    context: "The lesson uses cryptoeconomic penalties to show how PoS converts observable misconduct into financial consequences."
    slide_heading: "Slashing — Making Misbehavior Expensive"
    tags: ["consensus", "cryptography"]
    confidence: "high"
  - term: "Equivocation"
    modifier: "PoS offense"
    aliases: ["double vote", "double proposal", "conflicting votes"]
    definition: "Signing conflicting blocks or votes for the same slot, height, or consensus decision."
    context: "Equivocation is the core slashable behavior that would otherwise let validators support multiple competing histories."
    slide_heading: "Slashing — Making Misbehavior Expensive"
    tags: ["consensus", "cryptography"]
    confidence: "high"
  - term: "Surround vote"
    modifier: "PoS offense"
    aliases: ["surround votes", "protocol-violating vote pattern"]
    definition: "A slashable voting pattern where one checkpoint vote improperly surrounds or wraps around a prior vote."
    context: "Surround votes matter because finality rules need to prevent validators from creating conflicting checkpoint histories."
    slide_heading: "Slashing — Making Misbehavior Expensive"
    tags: ["consensus", "ethereum"]
    confidence: "high"
  - term: "Correlated slashing"
    modifier: "PoS penalty"
    aliases: ["correlation penalty"]
    definition: "A penalty design where validators lose more stake when many validators misbehave in the same period or pattern."
    context: "Correlated slashing raises the cost of cartel behavior and coordinated attacks beyond isolated operator mistakes."
    slide_heading: "Slashing — Making Misbehavior Expensive"
    tags: ["consensus"]
    confidence: "high"
  - term: "Signing key"
    modifier: "PoS validator operations"
    aliases: ["validator signing key"]
    definition: "The online key a validator uses to sign block proposals, attestations, and other consensus messages."
    context: "The lesson separates signing keys from withdrawal keys because operational keys must be online and therefore carry different risks."
    slide_heading: "Becoming a Validator"
    tags: ["consensus", "cryptography", "ethereum"]
    confidence: "high"
  - term: "Withdrawal key"
    modifier: "PoS validator operations"
    aliases: ["withdrawal credential"]
    definition: "The offline key or credential used to control validator fund withdrawal and recovery."
    context: "Withdrawal keys show that validator operations separate day-to-day consensus signing from custody of staked funds."
    slide_heading: "Becoming a Validator"
    tags: ["consensus", "cryptography", "ethereum"]
    confidence: "high"
  - term: "Fork choice rule"
    modifier: "PoS consensus"
    aliases: ["fork choice", "fork-choice rule", "fork-choice rules"]
    definition: "The deterministic rule nodes use to choose the current chain head among competing viable branches."
    context: "Fork choice handles temporary divergence before or alongside the stronger commitment provided by finality."
    slide_heading: "Fork Choice Rules"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Chain head"
    modifier: "PoS fork choice"
    aliases: ["head", "current head"]
    definition: "The block a node currently treats as the tip of the best chain to extend."
    context: "The fork choice slide uses chain head selection to distinguish live branch choice from irreversible finality."
    slide_heading: "Fork Choice Rules"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Safety"
    modifier: "consensus"
    aliases: ["consensus safety"]
    definition: "The property that the protocol should not finalize conflicting checkpoints or later roll back committed history."
    context: "The lesson frames PoS safety as an invariant supported by quorum thresholds, slashing, and honest-stake assumptions."
    slide_heading: "Safety and Liveness — PoS Invariants"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Liveness"
    modifier: "consensus"
    aliases: ["consensus liveness"]
    definition: "The property that the protocol eventually continues making progress and finalizing new checkpoints."
    context: "The lesson contrasts liveness with safety to show why PoS may pause under bad network conditions instead of finalizing conflicting history."
    slide_heading: "Safety and Liveness — PoS Invariants"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Eventual synchrony"
    modifier: "distributed-systems assumption"
    aliases: ["eventually synchronous network"]
    definition: "A timing assumption that the network may be unreliable for a while but eventually delivers messages within usable bounds."
    context: "PoS liveness depends on eventual synchrony because validators need a sufficiently healthy network to keep finalizing checkpoints."
    slide_heading: "Safety and Liveness — PoS Invariants"
    tags: ["consensus", "distributed-systems"]
