lesson_id: "12-FO"
lesson_title: "AML Typologies: ATT&CK, the Diamond and AADAPT"
source_path: "lessons/forensics/12-FO-aml_typologies_frameworks.qmd"
terms:
  - term: "AML typology"
    modifier: null
    aliases: ["AML typologies", "laundering typology"]
    definition: "A named pattern of what the funds did, such as a peel chain, CoinJoin, chain-hop, OTC aggregation, scam cash-out or drain. It describes the movement and its on-chain cue; on its own it says nothing about who did it."
    context: "The lesson collects six typologies taught earlier in the course and maps them onto ATT&CK, AADAPT and the Diamond Model."
    slide_heading: "Six typologies you have already met"
    tags: ["forensics"]
    confidence: "high"
  - term: "OTC desk"
    modifier: null
    aliases: ["OTC", "over-the-counter desk", "OTC aggregation"]
    definition: "A service that gathers many small deposits into wholesale amounts and moves them out in a few large transfers. Most desks are legitimate; the aggregation pattern raises a question, not an answer."
    context: "OTC desks are one of the services that cash out pig-butchering proceeds away from exchanges that can freeze."
    slide_heading: "Six typologies you have already met"
    tags: ["forensics", "real-world"]
    confidence: "high"
  - term: "Nested service"
    modifier: null
    aliases: ["nested services", "nested exchange"]
    definition: "A service that operates inside an exchange's cluster. Under co-spending alone it looks like the exchange itself."
    context: "The lesson pairs nested services with OTC desks as one typology; AADAPT has no entry that names either."
    slide_heading: "Six typologies you have already met"
    tags: ["forensics", "bitcoin"]
    confidence: "high"
  - term: "Pig butchering"
    modifier: null
    aliases: ["pig-butchering scam", "pig butchering scam", "crypto investment scam", "investment scam"]
    definition: "A crypto investment scam whose proceeds need an exit that will not freeze them. FinCEN uses the term for the investment scams Huione Group laundered."
    context: "Its cash-out is one of the six typologies; AADAPT covers it only in general terms under the Fraud tactic."
    slide_heading: "Six typologies you have already met"
    tags: ["forensics", "real-world"]
    confidence: "medium"
  - term: "Scam cash-out"
    modifier: null
    aliases: ["pig-butchering cash-out", "scam cash-outs"]
    definition: "The typology in which scam proceeds are routed to laundering networks rather than to exchanges that can freeze them. On chain, victim payments are gathered into a few addresses, sent in many small transfers into an aggregating service, then moved out in a few large ones."
    context: "The analyst says which kind of service the funds reached, because an exchange deposit and an aggregator deposit are different kinds of lead."
    slide_heading: "Scam cash-out: away from what can freeze"
    tags: ["forensics", "real-world"]
    confidence: "high"
  - term: "Drainer"
    modifier: null
    aliases: ["drainer flow", "drainer flows", "drainer kit", "drainer kits"]
    definition: "A rented kit that takes a victim's tokens through approval phishing. A spender, not the owner, moves the tokens, and the same cut goes to the same admin address across victims, which ties drains together."
    context: "The split to the kit's admin address is the drainer's on-chain cue; it ties drains to a kit, not to a person."
    slide_heading: "Six typologies you have already met"
    tags: ["forensics", "ethereum", "security"]
    confidence: "high"
  - term: "Chinese-language laundering networks"
    modifier: null
    aliases: ["Chinese-language money laundering networks"]
    definition: "Laundering networks that Chainalysis reported, as of January 2026, consistently launder over 10% of pig-butchering proceeds while centralized-exchange use declines."
    context: "Chainalysis suggests exchanges can freeze funds as the reason; the lesson presents that as the source's hypothesis."
    slide_heading: "Scam cash-out: away from what can freeze"
    tags: ["forensics", "real-world"]
    confidence: "high"
  - term: "Swapping-as-a-service"
    modifier: null
    aliases: ["swap service"]
    definition: "A service that swaps scam proceeds for other assets, named by Chainalysis beside OTC desks as a cash-out route for pig-butchering funds."
    context: "It is one of the services through which scam proceeds avoid exchanges that can freeze them."
    slide_heading: "Scam cash-out: away from what can freeze"
    tags: ["forensics"]
    confidence: "medium"
  - term: "Huione Group"
    modifier: null
    aliases: ["Huione"]
    definition: "The course's named laundering service for pig-butchering proceeds. FinCEN found it laundered at least $36 million from crypto investment scams between August 2021 and January 2025."
    context: "FinCEN's finding of May 2025 is the lesson's named example of a scam cash-out."
    slide_heading: "Scam cash-out: away from what can freeze"
    tags: ["forensics", "real-world", "policy"]
    confidence: "high"
  - term: "MITRE ATT&CK"
    modifier: null
    aliases: ["ATT&CK", "ATTACK framework"]
    definition: "MITRE's common taxonomy of adversary behavior for offense and defense. It splits what an adversary does into tactics (why), techniques (how) and procedures (how this adversary did it), and records observed behavior rather than everything an attacker could do."
    context: "Cyber analysts, agents and other agencies read its technique IDs the same way, so a finding that names one joins their picture without translation."
    slide_heading: "ATT&CK: tactics are why, techniques how"
    tags: ["security", "forensics"]
    confidence: "high"
  - term: "Tactic"
    modifier: null
    aliases: ["tactics", "ATT&CK tactic"]
    definition: "In ATT&CK and AADAPT, the goal of a step: the why behind a technique, such as Defense Evasion."
    context: "Most laundering typologies fall under the Defense Evasion tactic because laundering hides where the value went."
    slide_heading: "ATT&CK: tactics are why, techniques how"
    tags: ["security", "forensics"]
    confidence: "high"
  - term: "Technique"
    modifier: null
    aliases: ["techniques", "technique ID", "ATT&CK technique"]
    definition: "In ATT&CK and AADAPT, the means an adversary uses to reach a tactic's goal: the how. A technique ID is a shared name other analysts read the same way."
    context: "An AADAPT technique fits the capability vertex of the Diamond Model."
    slide_heading: "ATT&CK: tactics are why, techniques how"
    tags: ["security", "forensics"]
    confidence: "high"
  - term: "Sub-technique"
    modifier: null
    aliases: ["sub-techniques"]
    definition: "A more specific means under a technique, numbered after its parent, such as ADT3028.005 Peel Chains under Siphon Funds. A sub-technique takes its parent's tactics."
    context: "Most of the course's typologies map to AADAPT sub-techniques."
    slide_heading: "ATT&CK: tactics are why, techniques how"
    tags: ["security", "forensics"]
    confidence: "high"
  - term: "Procedure"
    modifier: null
    aliases: ["procedures"]
    definition: "One adversary's specific implementation of a technique, such as a group sending proceeds through Tornado Cash in 100 ETH lots."
    context: "A trace usually establishes the procedure: what this adversary did with these funds."
    slide_heading: "ATT&CK: tactics are why, techniques how"
    tags: ["security", "forensics"]
    confidence: "high"
  - term: "Defense Evasion"
    modifier: null
    aliases: []
    definition: "The ATT&CK and AADAPT tactic under which almost every laundering typology falls, because laundering is the adversary hiding where the value went."
    context: "CoinJoin, tumblers, chain-hopping and peer-to-peer exchanges all sit under Defense Evasion in AADAPT."
    slide_heading: "ATT&CK: tactics are why, techniques how"
    tags: ["security", "forensics"]
    confidence: "high"
  - term: "Resource Hijacking"
    modifier: null
    aliases: ["T1496"]
    definition: "ATT&CK technique T1496, which covers mining on co-opted machines."
    context: "It is the one ATT&CK technique the course met before this lesson, in the cryptojacking lesson."
    slide_heading: "ATT&CK: tactics are why, techniques how"
    tags: ["security", "forensics"]
    confidence: "high"
  - term: "MITRE AADAPT"
    modifier: null
    aliases: ["AADAPT", "Adversarial Actions in Digital Asset Payment Technologies"]
    definition: "MITRE's matrix of adversary techniques against digital assets, modeled after ATT&CK and reported on 14 July 2025. As of 1 November 2026 it holds ten ATT&CK tactics plus a new Fraud tactic, and 33 techniques and 33 sub-techniques numbered ADT."
    context: "Read it from MITRE's public repository file AADAPT.yaml and cite it by the date read; it has no sanctions-evasion technique and no entry for OTC desks or scam cash-outs."
    slide_heading: "AADAPT: ATT&CK's shape for digital assets"
    tags: ["security", "forensics"]
    confidence: "high"
  - term: "Fraud tactic"
    modifier: null
    aliases: ["ADTA0001", "Fraud (AADAPT tactic)"]
    definition: "The one tactic AADAPT adds to ATT&CK's list: the adversary trying to illicitly create, acquire or use value-form. It exists because much digital-asset crime takes value without an intrusion."
    context: "Peel chains and layering fall under both Fraud and Defense Evasion; pig butchering falls under Fraud only in general terms."
    slide_heading: "AADAPT: ATT&CK's shape for digital assets"
    tags: ["security", "forensics"]
    confidence: "high"
  - term: "Value-form"
    modifier: null
    aliases: []
    definition: "AADAPT's word for any form of digital value, coin or token."
    context: "It appears in AADAPT's definition of the Fraud tactic."
    slide_heading: "AADAPT: ATT&CK's shape for digital assets"
    tags: ["forensics", "tokenization"]
    confidence: "high"
  - term: "Siphon Funds"
    modifier: null
    aliases: ["ADT3028"]
    definition: "The AADAPT technique that covers peel chains, layering, anonymous wallets and money mules."
    context: "With Use Anonymizing Services it holds most of the laundering typologies the course teaches."
    slide_heading: "AADAPT names most of the typologies"
    tags: ["forensics", "security"]
    confidence: "high"
  - term: "Use Anonymizing Services"
    modifier: null
    aliases: ["ADT3030"]
    definition: "The AADAPT technique that covers CoinJoin, tumblers and peer-to-peer exchanges, all under Defense Evasion."
    context: "The lesson maps CoinJoin to ADT3030.001, mixers to ADT3030.003 Tumblers and P2P cash-out to ADT3030.002."
    slide_heading: "AADAPT names most of the typologies"
    tags: ["forensics", "security", "privacy"]
    confidence: "high"
  - term: "Evil Contract"
    modifier: null
    aliases: ["ADT3012.002"]
    definition: "The AADAPT sub-technique, under Execution, about phishing users into signing a contract. AADAPT files approval phishing here; it has no entry named for drainer kits."
    context: "It is the AADAPT entry students give when framing a drainer theft."
    slide_heading: "AADAPT names most of the typologies"
    tags: ["forensics", "security", "ethereum"]
    confidence: "high"
  - term: "Approval phishing"
    modifier: null
    aliases: []
    definition: "Tricking a user into signing an approval so that a spender, not the owner, can move their tokens. It is how a drainer takes funds."
    context: "AADAPT files it under Evil Contract (ADT3012.002)."
    slide_heading: "AADAPT names most of the typologies"
    tags: ["forensics", "security", "ethereum"]
    confidence: "high"
  - term: "Diamond Model"
    modifier: null
    aliases: ["the Diamond", "Diamond Model of Intrusion Analysis"]
    definition: "An intrusion-analysis model by Caltagirone, Pendergast and Betz (2013) that frames one event by four core features: adversary, capability, infrastructure and victim. Each feature has its own source and confidence, and an event can be recorded with features unknown."
    context: "It keeps an analyst from collapsing where the funds went into who did it: the adversary vertex is usually filled last, from a quoted attribution."
    slide_heading: "The Diamond: four features of one event"
    tags: ["forensics", "security"]
    confidence: "high"
  - term: "Intrusion event"
    modifier: null
    aliases: ["Diamond event"]
    definition: "In the Diamond Model, one step in which an adversary uses a capability over infrastructure against a victim to produce a result. Not every feature needs to be known to record one."
    context: "Each laundering step after a theft, such as a chain-hop or a tumbler, is its own Diamond event."
    slide_heading: "The Diamond: four features of one event"
    tags: ["forensics", "security"]
    confidence: "high"
  - term: "Capability"
    modifier: null
    aliases: ["capability vertex"]
    definition: "In the Diamond Model, the tools and techniques used in an event. An AADAPT technique fits here."
    context: "For Ronin the capability was spear-phishing followed by five of nine validator keys signing forged withdrawals."
    slide_heading: "The Diamond: four features of one event"
    tags: ["forensics", "security"]
    confidence: "high"
  - term: "Infrastructure"
    modifier: null
    aliases: ["infrastructure vertex"]
    definition: "In the Diamond Model, the structures used to deliver a capability and take the result. On chain these are addresses, contracts, mixers and bridges."
    context: "It is the vertex a blockchain shows most directly, and the usual starting point for pivoting."
    slide_heading: "The Diamond: four features of one event"
    tags: ["forensics", "security"]
    confidence: "high"
  - term: "Victim"
    modifier: null
    aliases: ["victim vertex"]
    definition: "In the Diamond Model, the target of an event, such as the platform or person robbed."
    context: "Victim and the outflows are usually observed directly on chain."
    slide_heading: "The Diamond: four features of one event"
    tags: ["forensics", "security"]
    confidence: "high"
  - term: "Meta-features"
    modifier: null
    aliases: ["meta-feature"]
    definition: "The Diamond Model's extra attributes of an event: timestamp, phase, result, direction, methodology and resources. The lesson uses timestamp and phase only."
    context: "The extended model also ties adversary and victim through a social-political meta-feature, which the lesson leaves out."
    slide_heading: "The Diamond: four features of one event"
    tags: ["forensics", "security"]
    confidence: "high"
  - term: "Pivoting"
    modifier: null
    aliases: ["Diamond pivot"]
    definition: "Taking one data element, such as an address, and using it with other data sources to find related elements. Each edge of the Diamond is a pivot to try, and each pivot gives a lead to test, not a conclusion."
    context: "Infrastructure to adversary is the weakest pivot on chain because it rests on someone else's label or designation."
    slide_heading: "Pivot along an edge to the next lead"
    tags: ["forensics"]
    confidence: "high"
  - term: "Bybit hack"
    modifier: null
    aliases: ["Bybit theft"]
    definition: "The 2025 theft from the Bybit exchange in which stolen tokens were swapped for Ether on decentralized exchanges, likely to avoid freezing, and most of the Ether was then converted to bitcoin."
    context: "This lesson uses it only as a chain-hopping example; the North Korea lesson covers its laundering in depth."
    slide_heading: "Chain-hopping: the trail changes ledgers"
    tags: ["forensics", "real-world", "ethereum"]
    confidence: "high"
  - term: "Timing window"
    modifier: "cross-chain tracing"
    aliases: ["timing windows"]
    definition: "A bounded time interval used to match likely related deposits and withdrawals across chains or services."
    context: "A match inside a timing window is an inference: the deposit and the payout share no transaction, so the link is a lead until a second line supports it."
    slide_heading: "Each hop steps away from what can freeze"
    tags: ["forensics"]
    confidence: "high"
  - term: "Fee-adjusted amount matching"
    modifier: "cross-chain tracing"
    aliases: ["amount matching", "fee-adjusted matching"]
    definition: "A correlation technique that matches likely related transfers after accounting for fees, slippage, or service deductions."
    context: "Paired with a timing window, it links the two sides of a same-coin bridge, where one study found fees typically 0 to 3% of the deposit; across a swap the amounts differ by a price, so it gives only a Low lead."
    slide_heading: "Each hop steps away from what can freeze"
    tags: ["forensics"]
    confidence: "high"
  - term: "Off-chain blind spot"
    modifier: "blockchain forensics"
    aliases: ["private ledger blind spot", "off-chain ledger"]
    definition: "An area of crypto activity recorded inside private systems such as exchanges, swap services or OTC desks rather than on a public blockchain."
    context: "A swap service's own ledger joins its deposit to its payout; the chain does not, so that ledger is the lead to hand on."
    slide_heading: "Each hop steps away from what can freeze"
    tags: ["forensics", "policy"]
    confidence: "high"
  - term: "Attribution uncertainty"
    modifier: "blockchain forensics"
    aliases: ["attribution risk"]
    definition: "The remaining doubt when a transaction trace points to an address or cluster but not yet to a confirmed real-world actor."
    context: "A chain-hop names the flow, not the person: the uncertainty stays until records name who controlled each end."
    slide_heading: "Each hop steps away from what can freeze"
    tags: ["forensics"]
    confidence: "high"
