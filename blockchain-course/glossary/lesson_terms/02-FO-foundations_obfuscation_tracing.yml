    tags: ["forensics"]
    confidence: "high"
  - term: "Consolidation"
    modifier: "blockchain forensics"
    aliases: ["fund aggregation", "UTXO consolidation"]
    definition: "The gathering of funds from many addresses or outputs into a smaller number of controlled destinations."
    context: "The lesson treats consolidation as a signal that can reveal service infrastructure or common control, but also create false clustering risk."
