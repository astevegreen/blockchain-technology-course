lesson_id: "02-FO"
lesson_title: "Blockchain Forensics: Foundations, Obfuscation, and Tracing"
source_path: "lessons/forensics/02-FO-foundations_obfuscation_tracing.qmd"
terms:
  - term: "UTXO Model"
    modifier: "Bitcoin"
    aliases: ["unspent transaction output model", "UTXO"]
    definition: "A ledger model where transactions consume old outputs and create new outputs, making each coin fragment traceable through its spending history."
    context: "The lesson contrasts UTXO tracing with Ethereum account tracing to show why different forensic heuristics apply."
    slide_heading: "Recall: UTXO vs. Account Model"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Account Model"
    modifier: "Ethereum"
    aliases: ["account-based model"]
    definition: "A ledger model where persistent accounts hold balances and transactions update account state rather than consuming discrete coin outputs."
    context: "Students need this distinction because Ethereum evidence often sits in account state, logs, and contract traces instead of input-output chains."
    slide_heading: "Recall: UTXO vs. Account Model"
    tags: ["ethereum", "forensics"]
    confidence: "high"
  - term: "Common-Input-Ownership Heuristic"
    modifier: "Bitcoin forensics"
    aliases: ["CIOH", "common input ownership", "multi-input heuristic"]
    definition: "A clustering heuristic that treats multiple inputs in one Bitcoin transaction as likely controlled by the same entity."
    context: "The lesson uses CIOH as the foundational Bitcoin inference that later privacy tools and counter-heuristics deliberately try to break."
    slide_heading: "Recall: UTXO vs. Account Model"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Event Log"
    modifier: "Ethereum"
    aliases: ["logs", "contract event log", "emitted event"]
    definition: "Contract-emitted data that records token transfers and application activity not visible in the top-level ETH value field."
    context: "Ethereum tracing requires event logs because economically meaningful token movement can be invisible in the main transaction record."
    slide_heading: "Recall: UTXO vs. Account Model"
    tags: ["ethereum", "forensics"]
    confidence: "high"
  - term: "Internal Trace"
    modifier: "Ethereum"
    aliases: ["internal call trace", "contract trace", "internal transaction trace"]
    definition: "A record of contract-to-contract execution steps that occur inside a single Ethereum transaction."
    context: "The lesson stresses traces because smart contracts can move value through many internal calls while the top-level transaction appears simple."
    slide_heading: "Reminder: Ethereum's Account Model"
    tags: ["ethereum", "forensics"]
    confidence: "high"
  - term: "Graph Analysis"
