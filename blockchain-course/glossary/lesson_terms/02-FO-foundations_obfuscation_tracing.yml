    aliases: ["graph thinking", "transaction graph analysis"]
    definition: "The practice of modeling on-chain actors and value flows as nodes and edges to detect patterns of control and movement."
    context: "Graph analysis is the analytic lens the lesson uses for fan-outs, fan-ins, peeling chains, clustering, and attribution."
    slide_heading: "The Analyst's Mindset: Graph Thinking"
    tags: ["forensics", "distributed-systems"]
    confidence: "high"
  - term: "Entity Cluster"
    modifier: "blockchain forensics"
    aliases: ["cluster", "address cluster", "entity"]
    definition: "A set of addresses, UTXOs, or accounts inferred to be controlled by one real-world actor or service."
    context: "The lesson shows analysts collapsing raw addresses into entity clusters before interpreting behavior or seeking attribution."
    slide_heading: "The Analyst's Mindset: Graph Thinking"
    tags: ["forensics"]
    confidence: "high"
  - term: "Graph Motif"
