    slide_heading: "The Analyst's Mindset: Graph Thinking"
    tags: ["forensics"]
    confidence: "high"
  - term: "Fan-Out"
    modifier: "blockchain forensics"
    aliases: ["fan out", "one-to-many flow"]
    definition: "A graph motif where one source distributes value to many destination addresses or accounts."
    context: "The lesson warns that fan-outs can represent benign payouts, laundering, dusting, or service activity depending on context."
