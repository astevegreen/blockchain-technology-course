lesson_id: "02-FO"
lesson_title: "Clustering, Change and Peel Chains"
source_path: "lessons/forensics/02-FO-foundations_obfuscation_tracing.qmd"
terms:
  - term: "UTXO Model"
    modifier: "Bitcoin"
    aliases: ["unspent transaction output model", "UTXO"]
    definition: "A ledger model where transactions consume old outputs and create new outputs, making each coin fragment traceable through its spending history."
    context: "Peel chains are fundamental to UTXO coins because an output cannot be partly spent."
    slide_heading: "A peel chain: a small peel, the rest rolls on"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Common-Input-Ownership Heuristic"
    modifier: "Bitcoin forensics"
    aliases: ["CIOH", "common input ownership", "multi-input heuristic"]
    definition: "A clustering heuristic, called co-spending in the lesson, that treats all inputs to one Bitcoin transaction as controlled by the same user."
    context: "Co-spending is one of the two base heuristics of Bitcoin tracing; alone it rates Moderate, because a CoinJoin is a known false positive."
    slide_heading: "Every hop in your trace names its heuristic"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Entity Cluster"
    modifier: "blockchain forensics"
    aliases: ["cluster", "address cluster", "entity"]
    definition: "A set of addresses the analyst believes one entity controls."
    context: "Co-spending grows a trace from one address to a cluster; a huge cluster is usually a service."
    slide_heading: "Co-spending links inputs, unless it's a CoinJoin"
    tags: ["forensics"]
    confidence: "high"
  - term: "Fan-Out"
    modifier: "blockchain forensics"
    aliases: ["fan out", "one-to-many flow"]
    definition: "A pattern where one source distributes value to many destination addresses."
    context: "A batched payout's many outputs can look like a suspect fanning money out, but a batch most often means a service paying customers."
    slide_heading: "Batched payouts look busy but aren't a peel"
    tags: ["forensics"]
    confidence: "high"
  - term: "Fan-In"
    modifier: "blockchain forensics"
    aliases: ["fan in", "many-to-one flow"]
    definition: "A pattern where value from many sources is gathered into one destination."
    context: "Thieves gathered stolen coins into one address before peeling them off."
    slide_heading: "A peel chain: a small peel, the rest rolls on"
    tags: ["forensics"]
    confidence: "high"
  - term: "Consolidation"
    modifier: "blockchain forensics"
    aliases: ["fund aggregation", "UTXO consolidation"]
    definition: "The gathering of funds from many addresses or outputs into a smaller number of controlled destinations."
    context: "Thieves gathered stolen coins into one address, then peeled; some peeled, re-gathered and peeled again."
    slide_heading: "A peel chain: a small peel, the rest rolls on"
    tags: ["forensics", "bitcoin"]
    confidence: "high"
  - term: "Address Clustering"
    modifier: "blockchain forensics"
    aliases: ["clustering", "address cluster analysis"]
    definition: "The process of grouping addresses or outputs that likely belong to the same actor based on transaction evidence and heuristics."
    context: "Clusters grow by chaining co-spend links, so one false link merges two whole clusters."
    slide_heading: "Co-spending links inputs, unless it's a CoinJoin"
    tags: ["forensics", "bitcoin"]
    confidence: "high"
  - term: "Change Address Detection"
    modifier: "Bitcoin forensics"
    aliases: ["change detection", "change output detection"]
    definition: "A heuristic process for identifying which output in a UTXO transaction likely returns leftover value to the sender."
    context: "The lesson treats change as a guess from several weak clues; one clue alone is Low, several agreeing are Moderate."
    slide_heading: "Every hop in your trace names its heuristic"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Wallet Fingerprinting"
    modifier: "Bitcoin forensics"
    aliases: ["wallet behavior fingerprinting"]
    definition: "Inferring wallet software or behavior from patterns such as output order, script type, or change address habits."
    context: "Every change clue (script type, output position, transaction settings of the next hop) is a wallet habit, so none is proof."
    slide_heading: "Change is a guess from several weak clues"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Peeling Chain"
    modifier: "Bitcoin forensics"
    aliases: ["peeling chains", "peel chain"]
    definition: "A repeated UTXO pattern where small amounts are peeled off to destinations while most funds continue to a new change address."
    context: "Exchanges, mining pools and thieves all make peel chains; the analyst follows the remainder, and the peels are the leads."
    slide_heading: "A peel chain: a small peel, the rest rolls on"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Counter-Heuristic"
    modifier: "blockchain forensics"
    aliases: ["counter heuristic", "anti-clustering technique"]
    definition: "A wallet, protocol, or user behavior designed to break the assumptions behind common forensic heuristics."
    context: "A CoinJoin breaks co-spending on purpose, and randomizing transaction and address features defeats such heuristics."
    slide_heading: "Co-spending links inputs, unless it's a CoinJoin"
    tags: ["forensics", "bitcoin"]
    confidence: "high"
  - term: "False Merge"
    modifier: "blockchain forensics"
    aliases: ["false clustering", "incorrect cluster merge"]
    definition: "An error where unrelated users or addresses are incorrectly combined into one inferred entity."
    context: "Because clusters grow by chaining links, one false link merges two whole clusters; false change links merged Mt. Gox, Instawallet, BitPay and Silk Road into one super-cluster."
    slide_heading: "One false link merges two actors into one"
    tags: ["forensics"]
    confidence: "high"
  - term: "Probabilistic Lead"
    modifier: "blockchain forensics"
    aliases: ["heuristic lead", "investigative lead"]
    definition: "An inference that helps guide an investigation but does not by itself prove ownership, intent, or identity."
    context: "When the clues don't settle which output is change, the analyst keeps both as leads; heuristics are not definitive evidence."
    slide_heading: "Two outputs aren't always payment and change"
    tags: ["forensics"]
    confidence: "high"
  - term: "CoinJoin"
    modifier: "Bitcoin privacy"
    aliases: []
    definition: "A transaction that combines several users' inputs, built to defeat the co-spend heuristic."
    context: "CoinJoin is co-spending's known false positive: in a 2022 test set, all 60 falsely merged clusters held one or more CoinJoins. Spotting one is day 7."
    slide_heading: "Co-spending links inputs, unless it's a CoinJoin"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Mixer"
    modifier: "blockchain forensics"
    aliases: ["tumbler", "mixing service", "crypto mixer"]
    definition: "A service or smart contract that pools deposits and redistributes withdrawals to obscure direct custody links."
    context: "Service-sized clusters include exchanges, hosted wallets, mixers and markets; the backward-trace example asks whether a Mt. Gox withdrawal funded a deposit into the Bitcoin Fog mixer."
    slide_heading: "One false link merges two actors into one"
    tags: ["forensics", "policy"]
    confidence: "high"
  - term: "Attribution"
    modifier: "blockchain forensics"
    aliases: ["identity attribution", "entity attribution"]
    definition: "The process of linking a pseudonymous on-chain cluster to a real-world person, organization, or service."
    context: "The lesson's trace stops at the first service; naming the service that owns a deposit address is attribution, taught on day 6."
    slide_heading: "One false link merges two actors into one"
    tags: ["forensics", "real-world"]
    confidence: "high"
  - term: "Virtual Currency Exchange"
    modifier: "blockchain investigations"
    aliases: ["VCE", "VCEs", "crypto exchange"]
    definition: "A service where users trade or cash out crypto assets and where account records can become attribution evidence."
    context: "Traces typically end at an exchange: huge clusters, batched payouts, and peels reaching Mt. Gox or Bitcoin-24 all point to one."
    slide_heading: "One false link merges two actors into one"
    tags: ["forensics", "policy", "real-world"]
    confidence: "high"
