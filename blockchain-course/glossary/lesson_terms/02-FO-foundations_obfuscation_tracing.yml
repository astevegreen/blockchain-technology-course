    tags: ["forensics"]
    confidence: "high"
  - term: "Fan-In"
    modifier: "blockchain forensics"
    aliases: ["fan in", "many-to-one flow"]
    definition: "A graph motif where value from many sources is gathered into one destination."
    context: "Fan-ins help students recognize aggregation behavior such as service sweeps, laundering preparation, or cash-out staging."
