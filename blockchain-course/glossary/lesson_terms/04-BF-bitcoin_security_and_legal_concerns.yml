    aliases: ["confirmation depth", "required confirmations"]
    definition: "The number of blocks a service waits after a transaction before treating it as sufficiently settled."
    context: "Exchanges responded to Bitcoin Gold's attack by pausing activity and requiring deeper confirmations to reduce double-spend risk."
    slide_heading: "Bitcoin Gold 51% Attack Discovery"
    tags: ["bitcoin", "consensus", "real-world"]
