    slide_heading: "Mitigating Network Deanonymization"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Selfish mining"
    modifier: null
    aliases: []
    definition: "A mining strategy where a miner withholds found blocks and releases them strategically to earn more than its honest hash share would suggest."
    context: "Selfish mining shows that Bitcoin can be attacked at the incentive layer while still producing formally valid blocks."
    slide_heading: "Selfish Mining"
    tags: ["bitcoin", "consensus"]
    confidence: "high"
  - term: "Hash power"
    modifier: "proof of work"
    aliases: ["hash share", "hash rate", "mining power"]
    definition: "The amount or share of proof-of-work computation controlled by a miner, pool, or network."
    context: "The lesson uses hash power to reason about selfish mining thresholds and the feasibility of majority attacks."
    slide_heading: "Selfish Mining"
    tags: ["bitcoin", "consensus"]
    confidence: "high"
  - term: "Mining pool"
    modifier: "Bitcoin"
    aliases: ["pool"]
    definition: "A coordination service where miners combine hash power and share rewards according to contributed work."
    context: "Mining pools matter because concentration can approach incentive-attack thresholds even without proving malicious behavior."
    slide_heading: "Selfish Mining"
    tags: ["bitcoin", "consensus"]
    confidence: "high"
  - term: "Fork race"
    modifier: "proof of work"
    aliases: ["fork-race win", "race between branches"]
    definition: "A competition between competing valid branches where whichever branch spreads and gains work faster becomes the accepted history."
    context: "Selfish mining profitability depends partly on how often the attacker wins these races against honest miners."
    slide_heading: "Selfish Mining"
    tags: ["bitcoin", "consensus", "distributed-systems"]
