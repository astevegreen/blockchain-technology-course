  - term: "Security budget"
    modifier: "proof of work"
    aliases: ["chain security budget"]
    definition: "The economic resources spent to secure a proof-of-work chain, including miner incentives and the cost of matching its hash power."
    context: "The lesson explains that Bitcoin Gold's lower security budget made temporary majority control more plausible than on Bitcoin."
    slide_heading: "Bitcoin Gold 51% Attack Discovery"
