  - term: "Bitcoin overflow bug"
    modifier: null
    aliases: ["2010 overflow bug", "block 74638 overflow bug"]
    definition: "A 2010 Bitcoin implementation flaw that allowed a transaction in block 74638 to create about 184 billion BTC."
    context: "The incident is the lesson's main example of a software failure temporarily violating Bitcoin's intended monetary rules."
    slide_heading: "Bitcoin Overflow Bug"
    tags: ["bitcoin", "real-world"]
    confidence: "high"
  - term: "Integer overflow"
    modifier: "software implementation"
    aliases: ["overflow"]
    definition: "A programming error where a number exceeds the range a field can represent and wraps into an unintended value."
    context: "The overflow bug depended on transaction outputs wrapping around so validation treated an impossible transaction as valid."
    slide_heading: "Bitcoin Overflow Bug"
    tags: ["bitcoin", "real-world"]
    confidence: "high"
  - term: "Transaction validation"
    modifier: "Bitcoin"
    aliases: ["validation logic", "transaction checks"]
    definition: "The software process nodes use to check whether a transaction follows Bitcoin's rules before accepting it."
    context: "The overflow case shows that protocol rules only protect Bitcoin when validation code enforces them correctly."
    slide_heading: "Bitcoin Overflow Bug"
    tags: ["bitcoin", "consensus"]
    confidence: "high"
  - term: "Fixed-supply rule"
    modifier: "Bitcoin"
    aliases: ["supply cap", "capped supply"]
    definition: "Bitcoin's monetary rule that the protocol should not permit creation beyond its capped supply schedule."
    context: "The overflow bug mattered because it directly threatened trust in Bitcoin's monetary integrity."
    slide_heading: "Bitcoin Overflow Bug"
    tags: ["bitcoin", "consensus"]
    confidence: "high"
  - term: "Public ledger"
