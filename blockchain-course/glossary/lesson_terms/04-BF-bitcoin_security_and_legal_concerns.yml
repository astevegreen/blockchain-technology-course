    aliases: ["deep reorg", "multi-block reorganization"]
    definition: "A chain reorganization that replaces many recent blocks rather than only one or two competing tips."
    context: "The Bitcoin Gold attack replaced about 29 blocks, showing why services raise confirmation requirements on weaker chains."
