terms:
  - term: "Double-spend"
    modifier: "Bitcoin"
    aliases: ["double-spending", "double spend"]
    definition: "An attack attempt that uses the same bitcoin value in conflicting payments by reversing, delaying, or replacing a recent transaction."
    context: "The lesson uses double-spends as the clearest fraud goal behind consensus, network, and smaller-chain attacks."
    slide_heading: "Why Attack Bitcoin?"
    tags: ["bitcoin", "consensus"]
    confidence: "high"
  - term: "Transaction censorship"
    modifier: "Bitcoin"
    aliases: ["censorship", "selective censorship"]
    definition: "The deliberate delay or exclusion of selected transactions from relay or confirmation."
    context: "Censorship is framed as a possible attacker objective for states, institutions, or miners seeking policy control rather than immediate theft."
    slide_heading: "Why Attack Bitcoin?"
    tags: ["bitcoin", "policy"]
    confidence: "high"
  - term: "Strategic disruption"
    modifier: null
    aliases: ["economic disruption", "price dislocation"]
    definition: "An attack goal focused on causing instability, fear, or market movement rather than directly stealing coins."
    context: "The lesson broadens adversary motivation beyond profit to include trust erosion and political or economic leverage."
    slide_heading: "Why Attack Bitcoin?"
    tags: ["bitcoin", "real-world"]
    confidence: "high"
  - term: "Consensus attack"
    modifier: "Bitcoin"
    aliases: ["consensus-layer attack"]
    definition: "An attack that tries to manipulate which recent ledger history honest nodes accept as the valid chain."
    context: "Students use this category to connect double-spends, censorship, reorganizations, and ledger splits to Bitcoin's fork-choice behavior."
    slide_heading: "What Can Consensus Attacks Achieve?"
    tags: ["bitcoin", "consensus"]
    confidence: "high"
  - term: "Chain reorganization"
    modifier: "Bitcoin"
    aliases: ["reorg", "block reorganization", "ledger rewrite"]
    definition: "A change in which a competing branch replaces recent blocks that were previously treated as part of the accepted chain."
    context: "The lesson treats short and deep reorganizations as the mechanism that can reverse payments and weaken settlement confidence."
    slide_heading: "What Can Consensus Attacks Achieve?"
    tags: ["bitcoin", "consensus"]
    confidence: "high"
  - term: "Ledger split"
    modifier: "Bitcoin"
    aliases: ["network split", "conflicting ledger views"]
    definition: "A condition where different parts of the network temporarily see incompatible versions of the ledger."
    context: "Ledger splits matter because they create confusion about payment status and undermine confidence in the shared history."
    slide_heading: "What Can Consensus Attacks Achieve?"
    tags: ["bitcoin", "distributed-systems"]
    confidence: "high"
  - term: "Sybil attack"
    modifier: "Bitcoin network"
    aliases: ["Sybil pressure", "fake peer attack"]
    definition: "A network attack where one adversary creates many attacker-controlled identities so a victim is more likely to connect to them."
    context: "The lesson frames Sybil pressure as a way to distort a target node's Bitcoin network view without controlling global hash power."
    slide_heading: "Sybil Attacks"
    tags: ["bitcoin", "distributed-systems"]
    confidence: "high"
  - term: "Eclipse attack"
    modifier: "Bitcoin network"
    aliases: ["eclipse-style isolation"]
    definition: "A targeted attack that surrounds a wallet, merchant, or full node with attacker-controlled peers so it sees a distorted network view."
    context: "Eclipse attacks are the practical goal of many Sybil-style efforts because they enable delayed relay, bad fee estimates, and targeted double-spends."
    slide_heading: "Sybil Attacks"
    tags: ["bitcoin", "distributed-systems"]
    confidence: "high"
  - term: "Peer table"
    modifier: "Bitcoin network"
    aliases: ["peer list", "address table"]
    definition: "A node's local record of known or connected peers used to decide which network connections to maintain."
    context: "Attackers try to fill or bias peer tables so a target reconnects mostly to adversarial peers."
    slide_heading: "Sybil Attacks"
    tags: ["bitcoin", "distributed-systems"]
    confidence: "high"
  - term: "Peer diversity"
    modifier: "Bitcoin network"
    aliases: ["address diversity", "connection diversity"]
    definition: "The practice of connecting across different subnets, providers, regions, and discovery sources so one attacker or network domain cannot dominate a node's view."
    context: "The lesson presents weak peer diversity as an eclipse risk and diverse connectivity as a core mitigation."
    slide_heading: "Sybil Attacks"
    tags: ["bitcoin", "distributed-systems"]
    confidence: "high"
  - term: "51% attack"
    modifier: "proof of work"
    aliases: ["majority attack", "majority hash attack"]
    definition: "A proof-of-work attack where an adversary controls enough mining power to outpace honest miners and influence recent chain history."
    context: "The lesson contrasts this global block-production threat with local network-view attacks and later grounds it in the Bitcoin Gold case study."
    slide_heading: "Sybil Attacks"
    tags: ["bitcoin", "consensus"]
    confidence: "high"
  - term: "Partitioning attack"
    modifier: "Bitcoin network"
    aliases: ["network partition attack", "routing partition"]
    definition: "An attack that splits nodes or miners into different network views so they stop learning about the same blocks at the same time."
    context: "Partitioning shows that Bitcoin security also depends on ordinary Internet routing and topology, not only consensus rules."
    slide_heading: "Partitioning Attacks"
    tags: ["bitcoin", "distributed-systems"]
    confidence: "high"
  - term: "BGP hijack"
    modifier: null
    aliases: ["Border Gateway Protocol hijack", "route hijack"]
    definition: "An Internet routing attack where traffic is redirected by falsely announcing network paths."
    context: "The lesson uses BGP hijacks as a real-world mechanism that could isolate or delay Bitcoin traffic."
    slide_heading: "Partitioning Attacks"
    tags: ["distributed-systems", "real-world"]
    confidence: "high"
  - term: "Route leak"
    modifier: null
    aliases: ["routing leak"]
    definition: "An Internet routing incident where routes are incorrectly propagated, causing traffic to take unintended paths."
    context: "Route leaks illustrate that Bitcoin can be affected by infrastructure failures even when its cryptography remains intact."
    slide_heading: "Partitioning Attacks"
    tags: ["distributed-systems", "real-world"]
    confidence: "high"
  - term: "Autonomous system"
    modifier: "Internet routing"
    aliases: ["AS", "ASN", "autonomous system number"]
    definition: "A routing domain on the Internet, usually controlled by one organization, that announces paths for reaching networks."
    context: "The lesson mentions AS-level attackers because mining and relay traffic can concentrate around routing domains that matter disproportionately."
    slide_heading: "Partitioning Attacks"
    tags: ["distributed-systems", "real-world"]
    confidence: "high"
  - term: "Block relay"
    modifier: "Bitcoin network"
    aliases: ["block propagation", "block broadcast"]
    definition: "The process by which newly found blocks spread among Bitcoin nodes and miners."
    context: "Delays in block relay can waste mining effort, create temporary competing tips, and support targeted fraud."
    slide_heading: "Partitioning Attacks"
    tags: ["bitcoin", "distributed-systems", "consensus"]
    confidence: "high"
  - term: "Timing attack"
    modifier: "Bitcoin network"
    aliases: ["latency attack", "timing and latency attack"]
    definition: "An attack that exploits when transactions or blocks are first observed to infer origin, gain advantage, or affect confidence."
    context: "The lesson emphasizes that milliseconds and seconds of propagation advantage can matter for privacy, stale-block risk, and settlement confidence."
    slide_heading: "Timing & Latency Attacks"
    tags: ["bitcoin", "distributed-systems", "forensics"]
    confidence: "high"
  - term: "First-spy heuristic"
    modifier: "Bitcoin forensics"
    aliases: ["first spy", "first-spy"]
    definition: "A deanonymization method that treats the first peer observed relaying a transaction as the best guess for its source."
    context: "Students use this heuristic to understand how network observation can weaken Bitcoin privacy even without breaking signatures."
    slide_heading: "Timing & Latency Attacks"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Inventory message"
    modifier: "Bitcoin network"
    aliases: ["inv", "inv(tx)"]
    definition: "A peer-to-peer relay message that announces known transaction or block identifiers to other nodes."
    context: "The lesson uses inv(tx) sightings to show how observers can timestamp relay events and infer likely transaction origin."
    slide_heading: "Timing & Latency Attacks"
    tags: ["bitcoin", "distributed-systems", "forensics"]
    confidence: "high"
  - term: "Network deanonymization"
    modifier: "Bitcoin"
    aliases: ["deanonymization", "transaction-origin deanonymization"]
    definition: "The process of linking a Bitcoin transaction to the node, IP address, user, or service that likely created it."
    context: "The lesson distinguishes network-level metadata leaks from on-chain address pseudonymity."
    slide_heading: "Mitigating Network Deanonymization"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Dandelion-style relay"
    modifier: "Bitcoin privacy"
    aliases: ["Dandelion relay", "stem-and-fluff relay"]
    definition: "A transaction relay approach that first sends a transaction along a short random path before broadcasting it widely."
    context: "The lesson presents Dandelion-style relay as a way to hide the apparent origin of a transaction from timing observers."
    slide_heading: "Mitigating Network Deanonymization"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Anonymity layer"
    modifier: "network privacy"
    aliases: ["anonymity network", "privacy routing layer"]
    definition: "A network routing tool or service that obscures a user's real network address from the peers they contact."
    context: "Tor and VPN routing are presented as partial mitigations for peers learning a user's real network location."
    slide_heading: "Mitigating Network Deanonymization"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "CoinJoin"
    modifier: null
    aliases: []
    definition: "A collaborative transaction technique that combines multiple users' inputs and outputs to make ownership links harder to trace."
    context: "The lesson mentions CoinJoin because network privacy is weaker if the transaction graph remains easy to analyze."
    slide_heading: "Mitigating Network Deanonymization"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "On-chain linkability"
    modifier: "Bitcoin"
    aliases: ["linkability"]
    definition: "The ability to connect addresses, inputs, outputs, or transactions using patterns visible on the public ledger."
    context: "The lesson links on-chain linkability to deanonymization because traffic privacy alone does not hide traceable transaction behavior."
    slide_heading: "Mitigating Network Deanonymization"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Transaction graph"
    modifier: "Bitcoin"
    aliases: ["on-chain graph", "payment graph"]
