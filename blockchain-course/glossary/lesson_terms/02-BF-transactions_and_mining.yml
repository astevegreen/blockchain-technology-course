lesson_id: "02-BF"
lesson_title: "Bitcoin — Reading a Transaction"
source_path: "lessons/bitcoin/02-BF-transactions_and_mining.qmd"
terms:
  - term: "Bitcoin transaction"
    modifier: null
    aliases: ["transaction", "tx"]
    definition: "A signed data structure that consumes existing UTXOs and creates new outputs to move bitcoin value."
    context: "Every hop in a trace is one transaction, so the lesson reads one transaction completely: inputs, outputs, fee rate, block and coinbase."
    slide_heading: "A trace is read one transaction at a time"
    tags: ["bitcoin"]
    confidence: "high"
  - term: "Mining"
    modifier: "Bitcoin"
    aliases: ["Bitcoin mining"]
    definition: "The process where miners assemble transactions into candidate blocks and search for proof-of-work that lets a valid block be accepted."
    context: "Proof of work was day 1; here mining matters only as the source of newly mined coins and the payer of fees."
    slide_heading: "A trace is read one transaction at a time"
    tags: ["bitcoin", "consensus"]
    confidence: "high"
  - term: "Block"
    modifier: "Bitcoin"
    aliases: []
    definition: "A Bitcoin data container that includes a header and a list of transactions accepted as the next part of the chain."
    context: "For every hop the analyst records the block height and block time: when it happened, and how sure."
    slide_heading: "A trace is read one transaction at a time"
    tags: ["bitcoin", "consensus"]
    confidence: "high"
  - term: "Wallet"
    modifier: "Bitcoin"
    aliases: ["Bitcoin wallet"]
    definition: "Software or hardware that manages keys, signs transactions, tracks spendable UTXOs, and applies spending policy for a user."
    context: "The lesson reads wallet choices (script type, fee rate, replace-by-fee signal, change) as clues to which kind of wallet paid."
    slide_heading: "A trace is read one transaction at a time"
    tags: ["bitcoin", "cryptography"]
    confidence: "high"
  - term: "Digital signature"
    modifier: "Bitcoin"
    aliases: ["signature"]
    definition: "Cryptographic evidence created with a private key to prove that a spend was authorized without revealing the private key."
    context: "A P2PKH input supplies a signature that must verify with the public key it reveals."
    slide_heading: "Every output is locked by a small script"
    tags: ["bitcoin", "cryptography"]
    confidence: "high"
  - term: "Change output"
    modifier: "Bitcoin"
    aliases: ["change"]
    definition: "A new transaction output that returns leftover value to the sender because selected UTXOs must be spent in full."
    context: "For every hop the analyst records which output is change; a new address, a script type matching the inputs, and an un-round amount are clues."
    slide_heading: "A trace is read one transaction at a time"
    tags: ["bitcoin"]
    confidence: "high"
  - term: "Address reuse"
    modifier: "Bitcoin"
    aliases: []
    definition: "Using the same Bitcoin address again, such as sending a transaction's change back to the address that paid."
    context: "Alice sent her change back to the address that received Joe's payment, which makes the change easy to spot."
    slide_heading: "Reading Alice's payment, field by field"
    tags: ["bitcoin", "real-world"]
    confidence: "high"
  - term: "UTXO"
    modifier: "Bitcoin"
    aliases: ["Unspent Transaction Output", "unspent output", "spendable output"]
    definition: "A discrete unspent output from an earlier transaction that can be used as an input to a later transaction."
    context: "An unspent P2SH or Taproot output does not show its spending rule; the rule appears only when the output is spent, if then."
    slide_heading: "P2SH and Taproot reveal the rule only on spend"
    tags: ["bitcoin"]
    confidence: "high"
  - term: "Public key"
    modifier: "Bitcoin"
    aliases: []
    definition: "A key derived from a private key that can be used to verify signatures and derive receiving addresses."
    context: "A P2PKH spender reveals a public key that must hash to the locked hash, and a signature valid for that key."
    slide_heading: "Every output is locked by a small script"
    tags: ["bitcoin", "cryptography"]
    confidence: "high"
  - term: "Address"
    modifier: "Bitcoin"
    aliases: ["Bitcoin address"]
    definition: "A user-facing encoding of spending conditions, typically derived from public-key material, where value can be locked."
    context: "The wallet that makes an address picks its script type, so the payment address describes the payee's wallet and the inputs and change describe the payer's."
    slide_heading: "Script type says what kind of wallet paid"
    tags: ["bitcoin", "cryptography"]
    confidence: "high"
  - term: "Address format"
    modifier: "Bitcoin"
    aliases: ["legacy address", "SegWit address", "Base58", "Bech32"]
    definition: "The visible encoding of a Bitcoin address, whose prefix shows its script type: 1 for P2PKH, 3 for P2SH, bc1q for native SegWit, and bc1p for Taproot."
    context: "The lesson reads an address's prefix as its script type; P2SH (3...) is not SegWit by itself, though it can carry wrapped SegWit."
    slide_heading: "Script type says what kind of wallet paid"
    tags: ["bitcoin"]
    confidence: "high"
  - term: "Coinbase transaction"
    modifier: "Bitcoin"
    aliases: ["coinbase tx"]
    definition: "The first transaction in a block, created by the miner to claim the block subsidy and transaction fees."
    context: "A trace that ends at a coinbase has reached newly mined coins, not someone's payment."
    slide_heading: "A trace is read one transaction at a time"
    tags: ["bitcoin", "consensus"]
    confidence: "high"
  - term: "Transaction input"
    modifier: "Bitcoin"
    aliases: ["input"]
    definition: "A reference to a previous UTXO plus the unlocking data needed to spend it in a new transaction."
    context: "Inputs show which earlier outputs a transaction consumes in full."
    slide_heading: "A trace is read one transaction at a time"
    tags: ["bitcoin"]
    confidence: "high"
  - term: "Transaction output"
    modifier: "Bitcoin"
    aliases: ["output"]
    definition: "A newly created spendable value record that locks bitcoin to a recipient, change address, or other script condition."
    context: "Outputs are how Bitcoin records the new ownership state after old UTXOs are consumed."
    slide_heading: "A trace is read one transaction at a time"
    tags: ["bitcoin"]
    confidence: "high"
  - term: "Unlocking data"
    modifier: "Bitcoin"
    aliases: ["scriptSig", "witness"]
    definition: "Data such as a signature and public key that satisfies an output's locking script so the referenced UTXO can be spent."
    context: "Unlocking data connects transaction inputs to the cryptographic checks that authorize spending."
    slide_heading: "Every output is locked by a small script"
    tags: ["bitcoin", "cryptography"]
    confidence: "high"
  - term: "Locking script"
    modifier: "Bitcoin"
    aliases: ["scriptPubKey", "script condition"]
    definition: "The script condition attached to an output that defines what must be provided later to spend that output."
    context: "The lesson introduces locking and unlocking as the validation mechanism behind UTXO ownership."
    slide_heading: "Every output is locked by a small script"
    tags: ["bitcoin", "cryptography"]
    confidence: "high"
  - term: "Satoshi"
    modifier: "Bitcoin"
    aliases: ["sat"]
    definition: "The smallest bitcoin unit, equal to 0.00000001 BTC."
    context: "Fee rates are priced in satoshis per virtual byte (sat/vB)."
    slide_heading: "Fees are priced per virtual byte, not per BTC"
    tags: ["bitcoin"]
    confidence: "high"
  - term: "Double-spend check"
    modifier: "Bitcoin"
    aliases: ["double-spend prevention"]
    definition: "The validation rule that an output can be consumed at most once."
    context: "Two versions of a transaction that spend the same inputs cannot both be mined, so at most one counts."
    slide_heading: "Replace-by-fee: unconfirmed can still change"
    tags: ["bitcoin", "consensus"]
    confidence: "high"
  - term: "Miner fee"
    modifier: "Bitcoin"
    aliases: ["transaction fee", "fee"]
    definition: "The value left unassigned to transaction outputs, calculated as total inputs minus total outputs and claimed by the miner."
    context: "The lesson shows that fees are not a separate transaction field but a consequence of UTXO arithmetic."
    slide_heading: "A trace is read one transaction at a time"
    tags: ["bitcoin", "consensus"]
    confidence: "high"
  - term: "Change address"
    modifier: "Bitcoin"
    aliases: []
    definition: "The sender-controlled address that receives a transaction's change output, often a new one."
    context: "Alice's change went back to the address the input came from, so her change address was a reused one."
    slide_heading: "Reading Alice's payment, field by field"
    tags: ["bitcoin", "real-world"]
    confidence: "high"
  - term: "Mempool"
    modifier: "Bitcoin"
    aliases: ["memory pool"]
    definition: "A node's temporary holding area for valid but unconfirmed transactions waiting to be mined."
    context: "Miners rank waiting transactions by fee rate, and replace-by-fee can swap one for another until it is mined."
    slide_heading: "Fees are priced per virtual byte, not per BTC"
    tags: ["bitcoin", "distributed-systems"]
    confidence: "high"
  - term: "Full node"
    modifier: "Bitcoin"
    aliases: ["node"]
    definition: "A network participant that validates transactions and blocks, relays valid data, and maintains its local view of the chain."
    context: "Every node runs the locking script with the unlocking data and accepts the spend only if the result is true."
    slide_heading: "Every output is locked by a small script"
    tags: ["bitcoin", "distributed-systems"]
    confidence: "high"
  - term: "Transaction relay"
    modifier: "Bitcoin"
    aliases: ["broadcast", "gossip"]
    definition: "The peer-to-peer process where signed transactions move from wallets to nodes and then across the network."
    context: "A broadcast but unconfirmed transaction can still be replaced by one paying a higher fee, so the trace follows the version that was mined."
    slide_heading: "Replace-by-fee: unconfirmed can still change"
    tags: ["bitcoin", "distributed-systems"]
    confidence: "high"
  - term: "Confirmation"
    modifier: "Bitcoin"
    aliases: ["confirmations"]
    definition: "A count of how many blocks include or build on top of the block containing a transaction."
    context: "Day 1 taught confirmations; the mempool explorer shows a transaction's confirmation count, which grows with every block."
    slide_heading: "A trace is read one transaction at a time"
    tags: ["bitcoin", "consensus"]
    confidence: "high"
  - term: "Block header"
    modifier: "Bitcoin"
    aliases: ["header"]
    definition: "The block's header, which carries the block's time and the Merkle root and is hashed in turn by the next block's header."
    context: "The time an explorer prints beside a transaction is the miner's stated time in the block header, not when the transaction was sent."
    slide_heading: "A transaction has no timestamp of its own"
    tags: ["bitcoin", "cryptography"]
    confidence: "high"
  - term: "Hash pointer"
    modifier: "Bitcoin"
    aliases: ["previous block hash", "previous block header hash"]
    definition: "A hash reference in a block header that points to the previous block and links the chain together."
    context: "Changing any transaction changes the Merkle root, then the header, then every later block's link."
    slide_heading: "The Merkle root commits to every transaction"
    tags: ["bitcoin", "cryptography"]
    confidence: "high"
  - term: "Merkle root"
    modifier: "Bitcoin"
    aliases: ["transaction root"]
    definition: "The single hash value in a block header that commits to all transactions in that block through a Merkle tree."
    context: "The Merkle root lets a small header stand for a much larger transaction list during verification."
    slide_heading: "The Merkle root commits to every transaction"
    tags: ["bitcoin", "cryptography"]
    confidence: "high"
  - term: "Merkle tree"
    modifier: "Bitcoin"
    aliases: []
    definition: "A hash tree that summarizes many transaction hashes into one Merkle root."
    context: "The lesson uses Merkle trees to show how blocks commit to thousands of transactions while supporting efficient verification."
    slide_heading: "The Merkle root commits to every transaction"
    tags: ["bitcoin", "cryptography"]
    confidence: "high"
  - term: "Block weight"
    modifier: "Bitcoin"
    aliases: ["weight units"]
    definition: "Bitcoin's consensus measure for block size limits, capped at 4 million weight units."
    context: "Weight sets a transaction's virtual size (weight divided by four), and so its fee rate."
    slide_heading: "Fees are priced per virtual byte, not per BTC"
    tags: ["bitcoin"]
    confidence: "high"
  - term: "Block subsidy"
    modifier: "Bitcoin"
    aliases: ["subsidy", "block reward"]
    definition: "The newly issued bitcoin a miner can claim in the coinbase transaction when creating a valid block."
    context: "The subsidy began at 50 BTC and halves every 210,000 blocks; it is 3.125 BTC as of 24 Oct 2026."
    slide_heading: "Coinbase pays the miner: subsidy plus fees"
    tags: ["bitcoin", "consensus"]
    confidence: "high"
  - term: "Immutable chain"
    modifier: "Bitcoin"
    aliases: ["tamper-evident chain"]
    definition: "A hash-linked history where changing an earlier transaction changes its block's Merkle root and header and breaks every later block's link."
    context: "The lesson uses the Merkle root and header links to explain why altering any past transaction is evident."
    slide_heading: "The Merkle root commits to every transaction"
    tags: ["bitcoin", "cryptography"]
    confidence: "high"
