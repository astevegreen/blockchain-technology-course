    tags: ["distributed-systems"]
    confidence: "high"
  - term: "P2P overlay"
    modifier: null
    aliases: ["peer-to-peer overlay", "overlay network"]
    definition: "A logical network of peer connections built on top of the underlying internet or transport network."
    context: "The centralized-versus-P2P diagrams show how overlay paths can avoid one central hub while adding coordination cost."
    slide_heading: "Centralized vs. P2P"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Decentralized system"
    modifier: null
    aliases: ["decentralized network", "decentralized design"]
    definition: "A system that spreads authority, operation, or communication across many participants instead of one central controller."
    context: "The lesson frames decentralization as a tradeoff between resilience and harder coordination."
    slide_heading: "Centralized vs. Decentralized: Trade‑offs"
    tags: ["distributed-systems", "policy"]
    confidence: "high"
  - term: "Chokepoint"
    modifier: null
    aliases: ["central chokepoint"]
    definition: "A concentrated point of control, traffic, or dependency that can limit availability, performance, or freedom to participate."
    context: "Avoiding chokepoints is one reason systems adopt decentralized or P2P architectures."
    slide_heading: "Centralized vs. Decentralized: Trade‑offs"
    tags: ["distributed-systems", "policy"]
    confidence: "high"
  - term: "Coordination cost"
    modifier: null
    aliases: ["coordination complexity"]
    definition: "The added effort required for distributed participants to discover one another, exchange information, and stay coherent."
    context: "The lesson stresses that P2P robustness is not free because coordination becomes harder without a central hub."
    slide_heading: "Centralized vs. Decentralized: Trade‑offs"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Fault isolation"
    modifier: null
    aliases: ["failure isolation"]
    definition: "A design property where a failure in one part of a system is contained instead of spreading through the whole service."
    context: "Fault isolation is one of the motivations for distributing systems across components or organizations."
    slide_heading: "Why Distribute? Motivations and Risks"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Graceful degradation"
    modifier: null
    aliases: []
    definition: "A failure-handling approach where a system keeps providing reduced service instead of collapsing completely."
    context: "The lesson presents graceful degradation as a practical resilience goal for distributed failures."
    slide_heading: "Why Distribute? Motivations and Risks"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Partial failure"
    modifier: null
    aliases: ["partial outage"]
    definition: "A failure mode where some components or links are broken while others continue running, creating inconsistent views of system health."
    context: "Partial failure is central to why distributed systems are harder than all-up or all-down systems."
    slide_heading: "Distributed Failures"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Network partition"
    modifier: null
    aliases: ["partition", "partitions"]
    definition: "A condition where network failures split nodes or regions so they cannot all communicate with each other."
    context: "Partitions explain how links, racks, zones, or regions can disrupt multiple services at once."
    slide_heading: "Distributed Failures"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Blockchain network"
    modifier: null
    aliases: ["blockchain P2P network"]
    definition: "A distributed network of machines that propagate and validate blockchain state without a single central operator."
    context: "The lesson connects general distributed-systems vocabulary directly to blockchain propagation and coordination constraints."
    slide_heading: "Distributed Computing and Blockchain"
    tags: ["distributed-systems", "blockchain"]
    confidence: "high"
  - term: "Shared state"
    modifier: "blockchain"
    aliases: ["shared ledger state"]
    definition: "The common blockchain state that many machines maintain and update by propagating and validating transactions and blocks."
    context: "The lesson argues that a blockchain's value comes from shared state across many machines rather than a local-only log."
    slide_heading: "Distributed Computing and Blockchain"
    tags: ["distributed-systems", "blockchain"]
    confidence: "high"
  - term: "Availability"
    modifier: "distributed systems"
    aliases: ["uptime"]
    definition: "The fraction of time a service is operational during the period users need it."
    context: "Availability gives students a measurable way to discuss resilience and user-visible service health."
    slide_heading: "Availability, MTTF, and MTTR"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Mean Time To Failure"
    modifier: null
    aliases: ["MTTF"]
    definition: "The average time a system runs before failing."
    context: "MTTF is one side of the availability tradeoff: systems improve availability by failing less often."
    slide_heading: "Availability, MTTF, and MTTR"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Mean Time To Repair"
    modifier: null
    aliases: ["MTTR"]
    definition: "The average time needed to recover from a failure and restore service."
    context: "MTTR is the recovery side of availability: systems improve availability by returning to service faster."
    slide_heading: "Availability, MTTF, and MTTR"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Retry"
    modifier: "distributed systems"
    aliases: ["retries", "retrying"]
    definition: "A resilience pattern where a failed or uncertain operation is attempted again, usually with limits or backoff."
    context: "Retries help recover from unreliable communication but must be designed to avoid duplicate effects."
    slide_heading: "Availability, MTTF, and MTTR"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Replication"
    modifier: "distributed systems"
    aliases: ["replicate", "replicated components"]
    definition: "The practice of keeping multiple copies or instances of critical data or services to reduce dependence on one component."
    context: "Replication is one of the lesson's core design levers for improving availability."
    slide_heading: "Availability, MTTF, and MTTR"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Eight fallacies of distributed computing"
    modifier: null
    aliases: ["eight fallacies", "fallacies of distributed computing"]
    definition: "A checklist of common false assumptions engineers make about networks, such as reliability, zero latency, and homogeneous nodes."
    context: "The lesson uses the fallacies as a practical guardrail for evaluating distributed and blockchain designs."
    slide_heading: "The Eight Fallacies"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Idempotent operation"
    modifier: null
    aliases: ["idempotency", "idempotent operations"]
    definition: "An operation that can be safely repeated without causing duplicate or unintended effects."
    context: "Idempotency makes retries safer when a client cannot tell whether an earlier request succeeded."
    slide_heading: "Fallacy #1: The Network Is Reliable"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Best-effort propagation"
    modifier: "blockchain"
    aliases: ["best-effort transport", "best-effort delivery"]
    definition: "A message-spreading model where nodes try to relay information but delivery, ordering, and timing are not guaranteed."
    context: "Blockchain transaction and block propagation are best-effort, so nodes can temporarily hold different views."
    slide_heading: "Fallacy #1: The Network Is Reliable"
    tags: ["distributed-systems", "blockchain"]
    confidence: "high"
  - term: "Latency"
    modifier: "distributed systems"
    aliases: ["network delay", "propagation delay"]
    definition: "The time it takes for information to travel across a network or complete a protocol step."
    context: "The lesson connects latency to chatty protocols, mempool views, confirmation speed, and fork creation."
    slide_heading: "Fallacy #2: Latency Is Zero"
    tags: ["distributed-systems", "blockchain"]
    confidence: "high"
  - term: "Round trip"
    modifier: "network protocol"
    aliases: ["round trips", "back-and-forth exchange"]
    definition: "A request-and-response exchange whose delay accumulates when a protocol requires many sequential steps."
    context: "Reducing round trips is presented as a key response to latency-heavy distributed interactions."
    slide_heading: "Fallacy #2: Latency Is Zero"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Bandwidth"
    modifier: "distributed systems"
    aliases: ["throughput"]
    definition: "The finite data-carrying capacity of network links, shared unevenly across participants."
    context: "Bandwidth limits shape decentralization because large or frequent messages can exclude low-bandwidth nodes."
    slide_heading: "Fallacy #3: Bandwidth Is Infinite"
    tags: ["distributed-systems", "blockchain"]
    confidence: "high"
  - term: "Eclipse attack"
    modifier: "network security"
    aliases: ["eclipse attempt", "eclipse attacks"]
    definition: "An attack where a node's peer connections are manipulated so it receives a distorted view of the network."
    context: "The network security fallacy shows that signatures do not prevent malicious peers from biasing what a node sees."
    slide_heading: "Fallacy #4: The Network Is Secure"
    tags: ["distributed-systems", "security", "blockchain"]
    confidence: "high"
  - term: "Churn"
    modifier: "network topology"
    aliases: ["peer churn", "membership churn"]
    definition: "The continual joining, leaving, rebooting, moving, and reconnecting of nodes in a distributed network."
    context: "Churn explains why robust overlays need ongoing discovery, health checks, and rebroadcast strategies."
    slide_heading: "Fallacy #5: Topology Doesn't Change"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Version negotiation"
    modifier: null
    aliases: ["protocol negotiation"]
    definition: "A compatibility process where participants determine which protocol versions or features they can safely use together."
    context: "Version negotiation is a technical response to the reality that distributed systems often have many administrators."
    slide_heading: "Fallacy #6: There Is One Administrator"
    tags: ["distributed-systems", "policy"]
    confidence: "high"
  - term: "Transport cost"
    modifier: "distributed systems"
    aliases: ["egress cost", "relay cost"]
    definition: "The monetary and resource cost of moving, relaying, storing, or processing data across a network."
    context: "The lesson ties transport cost to architecture viability and the ability of smaller operators to participate."
    slide_heading: "Fallacy #7: Transport Cost Is Zero"
    tags: ["distributed-systems", "blockchain"]
    confidence: "high"
  - term: "Heterogeneity"
    modifier: "distributed systems"
    aliases: ["heterogeneous network", "heterogeneous nodes"]
    definition: "The normal condition that network participants differ in hardware, software, operating systems, and connection quality."
    context: "Heterogeneity explains why protocols need conformance testing, feature negotiation, and fallback paths."
    slide_heading: "Fallacy #8: The Network Is Homogeneous"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Client diversity"
    modifier: "blockchain"
    aliases: ["multi-client diversity"]
    definition: "The presence of multiple independent software clients participating in the same blockchain network."
    context: "The lesson notes that client diversity can improve resilience while increasing compatibility burden."
    slide_heading: "Fallacy #8: The Network Is Homogeneous"
    tags: ["distributed-systems", "blockchain"]
    confidence: "high"
