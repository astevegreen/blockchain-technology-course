    tags: ["distributed-systems", "real-world"]
    confidence: "high"
  - term: "Flooding"
    modifier: "P2P search"
    aliases: ["query flooding", "blind broadcast"]
    definition: "A forwarding pattern where a peer sends a query to all neighbors, who repeat the process until a limit is reached."
    context: "Flooding shows how fully decentralized search can create massive duplicate traffic and poor scaling."
    slide_heading: "Case Study: Gnutella & \"Flooding\""
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Time-to-Live"
    modifier: "network messages"
    aliases: ["TTL"]
    definition: "A counter or limit that prevents a forwarded message from spreading forever through a network."
    context: "Gnutella used TTL to bound query floods, making it a concrete control for decentralized search traffic."
    slide_heading: "Case Study: Gnutella & \"Flooding\""
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Broadcast storm"
    modifier: null
    aliases: []
    definition: "A network condition where repeated or duplicate broadcasts consume so much capacity that useful traffic is crowded out."
    context: "The Gnutella case study uses broadcast storms to show why naive flooding does not scale."
    slide_heading: "Case Study: Gnutella & \"Flooding\""
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Supernode"
