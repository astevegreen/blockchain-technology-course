  - term: "Single point of failure"
    modifier: null
    aliases: ["central point of failure"]
    definition: "A component whose failure can disrupt the whole service because too much control or traffic depends on it."
    context: "The lesson returns to single points of failure when comparing centralized systems with P2P overlays."
    slide_heading: "Client–Server: Centralized Index and Control"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Peer-to-peer network"
    modifier: null
    aliases: ["P2P network", "peer-to-peer networking", "P2P networking"]
    definition: "A network design where participants communicate directly with one another instead of depending on a central server for normal operation."
    context: "The outage thought experiment motivates P2P networking as a resilience pattern for direct sharing."
