    tags: ["distributed-systems", "real-world"]
    confidence: "high"
  - term: "Gnutella"
    modifier: "case study"
    aliases: []
    definition: "An early decentralized P2P file-sharing network that searched by forwarding queries through peers instead of using a central index."
    context: "Gnutella provides the lesson's contrast to Napster by showing the scaling costs of removing central discovery."
