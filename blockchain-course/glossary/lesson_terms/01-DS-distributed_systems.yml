terms:
  - term: "Distributed system"
    modifier: null
    aliases: ["distributed systems"]
    definition: "A system made of multiple networked nodes that cooperate to provide one coherent service to users."
    context: "The lesson starts by defining distributed systems as the baseline for understanding architecture, failure, and blockchain networking."
    slide_heading: "What Is a Distributed System?"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Node"
    modifier: "distributed systems"
    aliases: ["nodes", "peer", "peers"]
    definition: "An individual machine, process, or participant that communicates with others as part of a distributed system."
    context: "Students need node vocabulary before comparing central servers, peers, full nodes, light clients, and volunteer machines."
    slide_heading: "What Is a Distributed System?"
    tags: ["distributed-systems"]
