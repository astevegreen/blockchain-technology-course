    tags: ["distributed-systems", "cryptography"]
    confidence: "high"
  - term: "Distributed ledger"
    modifier: null
    aliases: ["distributed ledgers", "DLT", "distributed ledger technology"]
    definition: "A shared, append-only record replicated across participants, with entries accepted and ordered by consensus and protected by tamper-evident cryptographic links."
    context: "This is the central concept of the lesson and the basis for comparing permissioned, permissionless, public-sector, and Bitcoin examples."
    slide_heading: "The Shared Notebook Problem"
    tags: ["distributed-systems", "consensus"]
    confidence: "high"
  - term: "Log"
    modifier: "distributed ledgers"
    aliases: ["logs", "event log", "audit trail"]
