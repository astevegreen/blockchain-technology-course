  - term: "Independent verification"
    modifier: "distributed ledgers"
    aliases: ["independently verifiable", "verification"]
    definition: "The ability for participants to check the record and its changes for themselves rather than trusting another party's private assertion."
    context: "Independent verification is one of the requirements that turns a shared record into a ledger suitable for multi-organization use."
