lesson_id: "01-EF"
lesson_title: "Ethereum — Accounts, the EVM and Transactions"
source_path: "lessons/ethereum/01-EF-ethereum_intro.qmd"
terms:
  - term: "Ethereum"
    modifier: "programmable blockchain platform"
    aliases: []
    definition: "A general-purpose blockchain platform designed to run shared application logic, smart contracts, and decentralized applications across many nodes."
    context: "The lesson opens by setting Ethereum against Bitcoin: Ethereum keeps one shared table of accounts and balances that a program every node runs updates, and the analyst reads the account, the transaction, the receipt and the internal transfers."
    slide_heading: "Ethereum keeps accounts, not coins"
    tags: ["ethereum", "distributed-systems"]
    confidence: "high"
  - term: "Smart contract"
    modifier: null
    aliases: ["smart contracts", "on-chain program", "on-chain programs"]
    definition: "An on-chain program that can hold value, update state, and enforce rules automatically when called."
    context: "Smart contracts are code plus storage deployed at their own addresses; once deployed, the code determines how calls are handled, and contracts run only when called."
    slide_heading: "A contract is code plus storage at an address"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Decentralized application"
    modifier: null
    aliases: ["DApp", "DApps", "dApp", "dApps", "Dapp", "dapp"]
    definition: "An application that combines a user interface, wallet interaction, and one or more on-chain smart contracts."
    context: "The wallet slide's diagram shows a user connecting a wallet to a dApp, made of a user interface and contracts, and signing a transaction through it."
    slide_heading: "Most users reach the chain through a wallet"
    tags: ["ethereum", "distributed-systems"]
    confidence: "high"
  - term: "Deterministic execution"
    modifier: "Ethereum"
    aliases: ["determinism", "deterministic"]
    definition: "Execution where the same input and prior state always produce the same result on every node."
    context: "Determinism is one of the EVM's properties: because every node reruns every transaction and must reach the same result, balances, receipts and logs are the network's record, not one explorer's."
    slide_heading: "Every node runs the same program: the EVM"
    tags: ["ethereum", "consensus", "distributed-systems"]
    confidence: "high"
  - term: "Ethereum Improvement Proposal"
    modifier: "Ethereum governance"
    aliases: ["EIP", "EIPs", "Ethereum Improvement Proposals"]
    definition: "A public specification for a proposed Ethereum protocol change, process change, or ecosystem standard."
    context: "The lesson names upgrades by their EIP numbers: EIP-7702 lets an externally owned account delegate to a contract's code, and EIP-1559 sets how fees are split."
    slide_heading: "A key or code controls each account"
    tags: ["ethereum", "policy"]
    confidence: "high"
  - term: "EIP-1559"
    modifier: "Ethereum fee market"
    aliases: []
    definition: "An Ethereum upgrade that changed transaction fees by introducing a burned base fee plus a tip paid to the block's fee recipient."
    context: "Under EIP-1559 the base fee is burned and the tip goes to the block's fee recipient, the proposer or the builder who pays the proposer."
    slide_heading: "Gas prices the work; a failed call still pays"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Ethereum Virtual Machine"
    modifier: "Ethereum execution"
    aliases: ["EVM"]
    definition: "The stack-based virtual machine that every Ethereum node uses to execute contract bytecode and reproduce state transitions."
    context: "The EVM is the program every node runs to update Ethereum's shared table of accounts; a later slide describes it as deterministic, isolated and metered by gas."
    slide_heading: "Ethereum keeps accounts, not coins"
    tags: ["ethereum", "distributed-systems"]
    confidence: "high"
  - term: "Bytecode"
    modifier: "EVM"
    aliases: ["contract bytecode", "EVM bytecode"]
    definition: "The low-level instructions produced from smart contract languages and executed by the EVM."
    context: "Contracts are compiled from languages such as Solidity into bytecode, which the EVM runs."
    slide_heading: "Every node runs the same program: the EVM"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Gas metering"
    modifier: "EVM"
    aliases: ["metering computation"]
    definition: "The EVM rule that charges gas for operations so contract execution consumes bounded network resources."
    context: "Metering is one of the EVM's properties: each operation costs gas, which bounds computation and stops endless loops."
    slide_heading: "Every node runs the same program: the EVM"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Ether"
    modifier: "Ethereum native asset"
    aliases: ["ETH"]
    definition: "Ethereum's native asset, used to pay gas and represent value on the network."
    context: "Every account's balance is kept in wei, and 10^18 wei make 1 ETH; a transaction's value field carries only ETH, while tokens move through contract calls."
    slide_heading: "A key or code controls each account"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Gwei"
    modifier: "Ether unit"
    aliases: []
    definition: "A common subunit of Ether, where one ETH equals one billion gwei."
    context: "Ethereum fees are quoted in gwei, one billionth of an ETH."
    slide_heading: "Gas prices the work; a failed call still pays"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Gas"
    modifier: "Ethereum resource unit"
    aliases: []
    definition: "The unit Ethereum uses to measure and charge for computation, storage, and other EVM operations."
    context: "Creating a contract account costs gas because it uses storage; the gas slide adds that every EVM operation has a gas cost and that the fee is paid even when a call fails."
    slide_heading: "A key or code controls each account"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Gas limit"
    modifier: "Ethereum"
    aliases: ["block gas limit", "transaction gas limit"]
    definition: "A cap on how much gas a transaction or block may consume."
    context: "The sender sets the most gas a transaction may use, and each block has a gas limit that caps how much work fits in it."
    slide_heading: "Gas prices the work; a failed call still pays"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Base fee"
    modifier: "EIP-1559"
    aliases: ["base-fee burn"]
    definition: "The protocol-determined part of an Ethereum transaction fee that is burned under EIP-1559."
    context: "The fee is gas used times the base fee plus the tip; under EIP-1559 the base fee is burned."
    slide_heading: "Gas prices the work; a failed call still pays"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Tip"
    modifier: "EIP-1559"
    aliases: ["priority fee", "proposer tip"]
    definition: "The part of an Ethereum transaction fee that goes to the block's fee recipient instead of being burned."
    context: "The tip is one of a transaction's gas fields; the gas slide says it goes to the block's fee recipient, the proposer or the builder who pays the proposer."
    slide_heading: "A transaction is a signed, numbered message"
    tags: ["ethereum", "consensus"]
    confidence: "high"
  - term: "EVM sandbox"
    modifier: "Ethereum execution"
    aliases: ["sandboxed EVM", "sandboxed execution", "isolation"]
    definition: "The restricted execution environment that prevents contracts from directly accessing local files, networks, clocks, or operating-system randomness."
    context: "Isolation is one of the EVM's properties: a contract runs in a sandbox with no file system, network, clock or operating-system randomness, so every node reaches the same result."
    slide_heading: "Every node runs the same program: the EVM"
    tags: ["ethereum", "distributed-systems"]
    confidence: "high"
  - term: "Oracle"
    modifier: "blockchain external data"
    aliases: ["oracles"]
    definition: "An external system that brings off-chain facts on-chain so smart contracts can use them deterministically."
    context: "Because a contract sees only what is on chain, outside facts such as an asset's price arrive through an oracle, which adds trust in its data source; day 8 shows attackers moving that price."
    slide_heading: "A contract sees only what is on chain"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "Externally Owned Account"
    modifier: "Ethereum account type"
    aliases: ["EOA", "EOAs", "wallet account"]
    definition: "An Ethereum account controlled by a private key that can initiate transactions and pay gas."
    context: "An EOA is controlled by whoever holds its private key, is free to create and is the only kind of account that can start a transaction; since EIP-7702 it can delegate to a contract's code."
    slide_heading: "A key or code controls each account"
    tags: ["ethereum", "cryptography"]
    confidence: "high"
  - term: "Contract account"
    modifier: "Ethereum account type"
    aliases: ["contract accounts"]
    definition: "An Ethereum account that holds code and storage and runs only when activated by a transaction or contract call."
    context: "A contract account is controlled by its code, costs gas to create and acts only when a transaction reaches it; for the analyst, an address with code moves funds by its program."
    slide_heading: "A key or code controls each account"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Global state"
    modifier: "Ethereum"
    aliases: ["Ethereum state", "shared global state"]
    definition: "The shared Ethereum record of account balances, nonces, code, and storage after accepted transactions are applied."
    context: "The lesson describes Ethereum's record as one shared table of accounts and their balances, which the EVM changes and every node must update identically."
    slide_heading: "Ethereum keeps accounts, not coins"
    tags: ["ethereum", "distributed-systems"]
    confidence: "high"
  - term: "Nonce"
    modifier: "Ethereum account"
    aliases: ["account nonce"]
    definition: "A per-account counter used in Ethereum state, including in address derivation and transaction sequencing."
    context: "The nonce is one of every account's four fields; an EOA's nonce counts the transactions it has sent, so a high nonce marks a busy account, and a contract's address can come from its creator's address and nonce."
    slide_heading: "A key or code controls each account"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Contract address"
    modifier: "Ethereum"
    aliases: ["contract addresses"]
    definition: "The Ethereum address where a deployed contract account's code and storage can be reached."
    context: "A contract's address comes from its creator: the creator's address and nonce (CREATE), or the creator, a salt and the code (CREATE2)."
    slide_heading: "A key or code controls each account"
    tags: ["ethereum"]
    confidence: "high"
  - term: "UTXO model"
    modifier: "Bitcoin accounting"
    aliases: ["unspent transaction output model", "Bitcoin UTXO Model"]
    definition: "An accounting model where value is tracked as discrete unspent outputs that transactions consume and create."
    context: "The lesson contrasts Bitcoin, which spends outputs and returns change, with Ethereum, which edits balances and has no change output."
    slide_heading: "Bitcoin spends outputs; Ethereum edits balances"
    tags: ["bitcoin", "ethereum"]
    confidence: "high"
  - term: "Account model"
    modifier: "Ethereum accounting"
    aliases: ["Ethereum Account Model"]
    definition: "An accounting and execution model where balances, code, and storage are attached to accounts and updated directly."
    context: "The lesson opens with the account model: Ethereum keeps one shared table of accounts and balances, where Bitcoin moves coins from one output to the next."
    slide_heading: "Ethereum keeps accounts, not coins"
    tags: ["ethereum"]
    confidence: "high"
  - term: "The Merge"
    modifier: "Ethereum upgrade"
    aliases: ["Merge"]
    definition: "The September 15, 2022 Ethereum upgrade that moved block production from Proof of Work to Proof of Stake while preserving existing state."
    context: "Since The Merge on 15 September 2022, validators propose Ethereum blocks; earlier blocks were mined, and execution carried on unchanged."
    slide_heading: "Pending, then included, then final"
    tags: ["ethereum", "consensus"]
    confidence: "high"
  - term: "Proof of Work"
    modifier: "Ethereum pre-Merge consensus"
    aliases: ["PoW"]
    definition: "A consensus model where block production is secured by miners expending energy and hardware work."
    context: "Ethereum blocks before The Merge on 15 September 2022 were mined rather than proposed by validators."
    slide_heading: "Pending, then included, then final"
    tags: ["ethereum", "consensus"]
    confidence: "high"
  - term: "Proof of Stake"
    modifier: "Ethereum post-Merge consensus"
    aliases: ["PoS"]
    definition: "A consensus model where validators stake ETH and risk penalties while proposing and attesting to blocks."
    context: "The lesson follows a transaction from the wallet to finality in today's proof-of-stake Ethereum, where validators propose blocks."
    slide_heading: "Pending, then included, then final"
    tags: ["ethereum", "consensus"]
    confidence: "high"
  - term: "Validator"
    modifier: "Ethereum PoS"
    aliases: ["validators"]
    definition: "A Proof-of-Stake participant that helps propose, check, attest to, and finalize blocks using staked ETH."
    context: "A validator includes a transaction in a block, and the block becomes final only after validators' votes."
    slide_heading: "Pending, then included, then final"
    tags: ["ethereum", "consensus"]
    confidence: "high"
  - term: "Finality"
    modifier: "Ethereum PoS"
    aliases: ["finalized checkpoint", "finalization"]
    definition: "The point at which Ethereum history becomes economically and explicitly irreversible under the Proof-of-Stake consensus rules."
    context: "Inclusion is not finality: a block is final only after validators' votes, about 15 minutes later, so an analyst should say whether a transaction is pending, included or final."
    slide_heading: "Pending, then included, then final"
    tags: ["ethereum", "consensus"]
    confidence: "high"
  - term: "Attestation"
    modifier: "Ethereum PoS vote"
    aliases: ["attestations", "validator attestation"]
    definition: "A validator vote that supports blocks or checkpoints in Ethereum's Proof-of-Stake consensus process."
    context: "Validators' votes are what make an included block final, about 15 minutes after inclusion."
    slide_heading: "Pending, then included, then final"
    tags: ["ethereum", "consensus"]
    confidence: "high"
  - term: "Mempool"
    modifier: "Ethereum transactions"
    aliases: ["transaction pool"]
    definition: "The set of pending transactions relayed through the network before a validator includes them in a block."
    context: "A wallet creates and signs the transaction, and peers relay it to the pool of pending transactions before a validator includes it in a block."
    slide_heading: "Pending, then included, then final"
    tags: ["ethereum", "distributed-systems"]
    confidence: "high"
  - term: "Revert"
    modifier: "EVM execution"
    aliases: ["reverts", "state revert", "reverted"]
    definition: "The rollback of state changes from a failed EVM execution while gas already spent remains charged."
    context: "A call that runs out of gas has its changes reverted, but the fee is still paid, so the sender's balance falls even though nothing else moved."
    slide_heading: "Gas prices the work; a failed call still pays"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Persistent state"
    modifier: "smart contracts"
    aliases: ["contract storage", "persistent storage"]
    definition: "Contract data that remains in Ethereum state after execution and can affect future calls."
    context: "Ethereum can deploy programs at their own contract addresses with persistent state, and writing permanent state is the most expensive kind of EVM operation."
    slide_heading: "A contract is code plus storage at an address"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Solidity"
    modifier: "Ethereum programming"
    aliases: []
    definition: "A smart contract programming language that compiles into EVM bytecode."
    context: "Contracts are compiled from languages such as Solidity into the bytecode the EVM runs; the smart contract slide shows a short Solidity counter."
    slide_heading: "Every node runs the same program: the EVM"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Composability"
    modifier: "smart contracts"
    aliases: ["atomic workflows", "contract composability"]
    definition: "The ability for smart contracts to call and combine with other contracts in a single coordinated workflow."
    context: "Contracts can call other contracts, enabling composability and atomic workflows."
    slide_heading: "A contract is code plus storage at an address"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Wallet"
    modifier: "DApp architecture"
    aliases: ["crypto wallet"]
    definition: "Software that holds or manages keys, signs transactions, and connects users to Ethereum applications."
    context: "A wallet creates and signs each transaction; the wallet slide adds that a wallet holds the user's keys and lets the user connect to apps, swap, bridge to a layer 2 and revoke a contract's access to funds."
    slide_heading: "Pending, then included, then final"
    tags: ["ethereum", "cryptography"]
    confidence: "high"
  - term: "Layer 2"
    modifier: "Ethereum scaling"
    aliases: ["L2", "L2s"]
    definition: "A separate execution environment built on top of a Layer 1 that processes transactions off the main chain and posts data or proofs back."
    context: "The wallet slide shows users reaching either Ethereum or an L2, and lists bridging to a layer 2 among what a wallet does."
    slide_heading: "Most users reach the chain through a wallet"
    tags: ["ethereum", "distributed-systems"]
    confidence: "high"
  - term: "Transaction receipt"
    modifier: null
    aliases: ["receipt"]
    definition: "What a node returns for a transaction once it is in a block: its status (1 success, 0 failure), gas used, effective gas price, logs and any new contract address."
    context: "Read status first: a failed transaction is on the chain but moved nothing except its fee."
    slide_heading: "The receipt says what actually happened"
    tags: ["ethereum", "forensics"]
    confidence: "high"
  - term: "Internal call"
    modifier: null
    aliases: ["internal calls", "internal ETH transfer"]
    definition: "A call one contract makes to another contract or address while running a transaction, which can send ETH; it is not a new transaction and shows only in a trace."
    context: "When funds go into a contract, the trail goes on in the internal transfers (ETH) and the logs (tokens); Otterscan shows the internal transfers."
    slide_heading: "Contracts move value the transaction won't show"
    tags: ["ethereum", "forensics"]
    confidence: "high"
