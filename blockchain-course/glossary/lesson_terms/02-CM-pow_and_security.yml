  - term: "Temporary fork"
    modifier: "proof of work"
    aliases: ["competing branch", "short-lived fork"]
    definition: "A short-lived split where different valid blocks at the same height are seen by different parts of the network."
    context: "Temporary forks can happen honestly when miners find blocks nearly simultaneously and propagation takes time."
    slide_heading: "Block Propagation and Stale/Orphan Blocks"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Stale block"
    modifier: null
    aliases: ["orphan block", "stale/orphan block"]
    definition: "A valid block that is not included in the ultimately canonical chain after a competing branch wins."
    context: "Stale blocks waste honest work and can reduce effective security by lowering the fraction of work securing the canonical chain."
    slide_heading: "Block Propagation and Stale/Orphan Blocks"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Canonical chain"
    modifier: null
    aliases: ["canonical branch", "main chain"]
    definition: "The branch of valid blocks that nodes currently treat as the accepted ledger history under the fork-choice rule."
    context: "Many lesson examples ask which blocks end up canonical after temporary forks, private branches, or attacks resolve."
    slide_heading: "Block Propagation and Stale/Orphan Blocks"
    tags: ["consensus"]
    confidence: "high"
