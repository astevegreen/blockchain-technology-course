    aliases: ["payout variance", "reward variance"]
    definition: "The unpredictability of mining income caused by the lottery-like timing of finding valid blocks."
    context: "Variance explains why miners join pools even when pooling introduces centralization and governance risks."
    slide_heading: "Mining Pools, Variance, and Payouts"
    tags: ["consensus", "real-world"]
    confidence: "high"
  - term: "Share"
    modifier: "mining pool"
    aliases: ["pool share", "valid share"]
    definition: "A partial proof of work meeting an easier pool-set difficulty, used to measure a miner's contributed work."
    context: "Pool payout models rely on shares to pay miners before or without each miner finding a full valid block."
    slide_heading: "Pool Payout Model: Pay-Per-Share (PPS)"
    tags: ["consensus", "bitcoin"]
    confidence: "high"
  - term: "Pay-Per-Share"
    modifier: null
    aliases: ["PPS"]
    definition: "A pool payout model where miners receive a fixed payment for each valid share regardless of when the pool finds blocks."
    context: "PPS gives miners predictable income while shifting block-finding variance and reserve risk to the pool operator."
    slide_heading: "Pool Payout Model: Pay-Per-Share (PPS)"
    tags: ["consensus", "bitcoin"]
    confidence: "high"
  - term: "Pay-Per-Last-N-Shares"
    modifier: null
    aliases: ["PPLNS"]
    definition: "A pool payout model where block rewards are distributed across the recent window of submitted shares when a block is found."
    context: "PPLNS leaves miners with more variance but reduces the pool operator's need to insure unlucky streaks."
    slide_heading: "Pool Payout Model: Pay-Per-Last-N-Shares (PPLNS)"
    tags: ["consensus", "bitcoin"]
    confidence: "high"
