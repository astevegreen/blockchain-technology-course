terms:
  - term: "Proof of Work"
    modifier: null
    aliases: ["PoW", "proof-of-work"]
    definition: "A consensus mechanism that makes block proposal influence depend on costly computation that anyone can cheaply verify."
    context: "The lesson frames PoW as both leader election and history protection through real-world resource cost."
    slide_heading: "Proof of Work: Purpose and Agenda"
    tags: ["consensus", "bitcoin"]
    confidence: "high"
  - term: "Sybil-resistant leader election"
    modifier: null
    aliases: ["Sybil resistant leader election"]
    definition: "A method for choosing who may propose a block that limits fake identities by requiring an expensive scarce resource."
    context: "PoW uses computation rather than identity counts to decide who earns the next block proposal opportunity."
    slide_heading: "Proof of Work: Purpose and Agenda"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Block body"
    modifier: null
    aliases: ["body", "block transactions"]
    definition: "The part of a block that contains the transactions or state updates being recorded in the ledger."
    context: "Students need the block body concept to understand what the Merkle root commits to and what PoW ultimately protects."
    slide_heading: "Block Body Anatomy"
    tags: ["consensus", "cryptography"]
    confidence: "high"
  - term: "Merkle root"
    modifier: null
    aliases: ["transaction root"]
    definition: "A single hash commitment derived from the transactions in a block, so changing any transaction changes the committed root."
    context: "The lesson uses the Merkle root to connect transaction data in the block body to the hash-protected block header."
    slide_heading: "Block Body Anatomy"
    tags: ["cryptography", "consensus"]
    confidence: "high"
  - term: "Block header"
    modifier: null
    aliases: ["header"]
    definition: "The compact set of block metadata that miners hash, including the previous block hash, Merkle root, timestamp, target, and nonce."
    context: "PoW validation depends on every node hashing the same header bytes and comparing the result to the target."
    slide_heading: "The PoW Rule at a Glance"
    tags: ["consensus", "cryptography"]
    confidence: "high"
  - term: "Difficulty target"
    modifier: "proof of work"
    aliases: ["target", "target threshold"]
    definition: "The threshold a block hash must fall below for the block to satisfy the PoW validity rule."
    context: "The target determines how rare valid blocks are and therefore how much work miners are expected to perform."
    slide_heading: "The PoW Rule at a Glance"
    tags: ["consensus", "bitcoin"]
    confidence: "high"
  - term: "Nonce"
    modifier: "block header"
    aliases: ["nonce field", "extra-nonce"]
    definition: "An adjustable value miners vary in or around the block header to search for a hash below the difficulty target."
    context: "Nonce variation is the basic mechanism miners use to explore new candidate hashes without changing the whole block design."
    slide_heading: "The PoW Rule at a Glance"
    tags: ["consensus", "cryptography"]
    confidence: "high"
  - term: "Longest valid chain"
    modifier: "proof of work"
    aliases: ["heaviest valid chain", "longest chain", "heaviest chain"]
    definition: "The protocol-selected branch of valid blocks that represents the most accepted accumulated work under the chain-selection rule."
    context: "Fork choice, stale blocks, confirmations, and many attacks all depend on which branch nodes treat as canonical."
    slide_heading: "The PoW Rule at a Glance"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Proof-of-work puzzle"
    modifier: null
    aliases: ["PoW puzzle"]
    definition: "A computational challenge that is expensive to solve but quick for other nodes to verify."
    context: "The lesson broadens PoW beyond Bitcoin by showing that the security pattern is hard production and cheap verification."
    slide_heading: "Proof-of-work Puzzles"
    tags: ["consensus", "cryptography"]
    confidence: "high"
  - term: "Hash puzzle"
    modifier: null
    aliases: ["hash-based puzzle"]
    definition: "A PoW puzzle where miners search for a nonce so the hash of candidate data falls below a target."
    context: "The course focuses on hash-based puzzles as the main model for Bitcoin-style mining."
    slide_heading: "Proof-of-work Puzzles"
    tags: ["consensus", "cryptography", "bitcoin"]
    confidence: "high"
  - term: "Memory-hard puzzle"
    modifier: null
    aliases: ["memory-hard PoW"]
    definition: "A PoW puzzle designed to require substantial memory as well as computation, making some hardware specialization harder."
    context: "Memory-hard puzzles show that PoW can bind influence to resources other than raw hash throughput."
    slide_heading: "Proof-of-work Puzzles"
    tags: ["consensus", "cryptography"]
    confidence: "high"
  - term: "Proof-of-space puzzle"
    modifier: null
    aliases: ["proof of space", "storage-based puzzle"]
