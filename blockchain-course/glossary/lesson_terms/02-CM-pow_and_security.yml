  - term: "Byte-exact hashing"
    modifier: null
    aliases: ["bit-for-bit deterministic hashing"]
    definition: "Hashing that depends on the exact serialized bytes, field order, and encoding specified by the protocol."
    context: "Implementation mistakes in serialization or byte order can make nodes disagree about whether a block is valid."
    slide_heading: "Block Header Anatomy: What Gets Hashed"
    tags: ["cryptography", "consensus"]
    confidence: "high"
  - term: "Endianness"
    modifier: "block serialization"
    aliases: ["byte order"]
    definition: "The convention for ordering bytes when serializing numbers or fields before hashing or validation."
    context: "The lesson calls out endianness because even tiny encoding differences change the resulting block hash."
    slide_heading: "Block Header Anatomy: What Gets Hashed"
    tags: ["cryptography", "consensus"]
    confidence: "high"
  - term: "Expected work"
    modifier: "proof of work"
    aliases: ["expected trials", "expected hashes"]
    definition: "The average number of hash attempts needed before finding a valid block at a given target."
    context: "Expected work connects probability, target difficulty, and the economic cost of producing valid blocks."
    slide_heading: "Difficulty, Hash Rate, and Expected Work"
    tags: ["consensus", "cryptography"]
    confidence: "high"
  - term: "Hash rate"
    modifier: null
    aliases: ["network hash rate", "H"]
    definition: "The number of hash attempts miners can perform per second, either individually or across the whole network."
    context: "Hash rate determines how quickly valid blocks are found at a fixed target and how much work an attacker must rival."
    slide_heading: "Difficulty, Hash Rate, and Expected Work"
    tags: ["consensus", "bitcoin"]
    confidence: "high"
  - term: "Difficulty adjustment"
    modifier: "proof of work"
    aliases: ["difficulty retargeting", "retargeting"]
    definition: "A protocol rule that adjusts the target based on recent block timing so average block intervals stay near the design goal."
    context: "Difficulty adjustment keeps the system usable and stable as total hash rate rises or falls."
    slide_heading: "Difficulty Adjustment: Control-Loop Intuition"
    tags: ["consensus", "bitcoin"]
    confidence: "high"
  - term: "Control loop"
    modifier: "difficulty adjustment"
    aliases: ["feedback loop"]
    definition: "A mechanism that observes actual output and changes an input to steer the system toward a target behavior."
    context: "The lesson uses a control-loop model to explain why PoW protocols compare observed block times against desired intervals."
    slide_heading: "Difficulty Adjustment: Control-Loop Intuition"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Block interval"
    modifier: null
    aliases: ["block time", "target interval"]
    definition: "The intended average time between new blocks in a chain."
    context: "Block interval affects latency, fork risk, stale rates, and how aggressively difficulty must respond to hash-rate changes."
    slide_heading: "Difficulty Adjustment: Control-Loop Intuition"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Target rule"
    modifier: "proof of work"
    aliases: ["hash-below-target rule", "hash < target"]
    definition: "The validity rule that a candidate block's hash must be numerically below the current target threshold."
    context: "Visualizing this rule helps students see why lower targets make valid hashes rarer but not harder to verify."
    slide_heading: "Visualizing the Target Rule"
    tags: ["consensus", "cryptography"]
    confidence: "high"
  - term: "Median-time-past"
    modifier: "blockchain timestamps"
    aliases: ["MTP"]
    definition: "A timestamp rule that compares a new block's time against the median of recent block times to limit manipulation."
    context: "Median-time-past appears as an implementation defense for retargeting and timestamp-based attacks."
    slide_heading: "Retargeting: Technical Implementation"
    tags: ["consensus", "bitcoin"]
    confidence: "high"
  - term: "Block size"
    modifier: null
    aliases: ["block capacity"]
    definition: "The amount of transaction data a block can carry under the protocol's limits."
    context: "Block size is a parameter tradeoff because larger blocks can improve throughput while increasing propagation and validation time."
