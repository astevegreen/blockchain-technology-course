  - term: "Label"
    modifier: null
    aliases: ["address label", "attribution label", "open label set"]
    definition: "A name attached to an address or cluster saying who controls it, such as an exchange; it is only as good as its source, and one label with an unknown basis is Low confidence."
    context: "The lesson sorts labels by source (the owner, a government listing, a court record, OSINT, an open label set, a platform tag) and asks how each source knew."
