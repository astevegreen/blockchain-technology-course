  - term: "Deanonymization"
    modifier: "blockchain forensics"
    aliases: ["de-anonymization", "identity linkage"]
    definition: "Linking pseudonymous blockchain activity to a real-world identity, operator, organization, or accountable entity."
    context: "In Bitcoin Fog, Samourai Wallet and Hydra, on-chain work found and sized the service; names, intent and control came from forum posts, records, servers and testimony."
    slide_heading: "The chain shows a service; records show who"
    tags: ["forensics", "policy"]
