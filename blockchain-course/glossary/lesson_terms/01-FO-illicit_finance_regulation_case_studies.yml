lesson_id: "01-FO"
lesson_title: "Attribution and Confidence"
source_path: "lessons/forensics/01-FO-illicit_finance_regulation_case_studies.qmd"
terms:
  - term: "Permissionless finance"
    modifier: "blockchain"
    aliases: ["permissionless systems", "permissionless access"]
    definition: "Financial activity on open blockchain networks where users can create wallets and transact without prior approval from a central gatekeeper."
    context: "On a DEX there are no sign-ups, no accounts and no KYC identity checks required to swap tokens."
    slide_heading: "Decentralized Exchanges (DEXs)"
    tags: ["forensics", "policy"]
    confidence: "high"
  - term: "Know Your Customer"
    modifier: "crypto compliance"
    aliases: ["KYC", "identity checks", "mandatory ID checks"]
    definition: "A compliance process that verifies a customer's real-world identity before allowing access to regulated financial services."
    context: "DEXs require no KYC to swap tokens, and BTC-e's accounts needed only a username, password and email address, which attracted illicit users."
    slide_heading: "Decentralized Exchanges (DEXs)"
    tags: ["policy", "forensics"]
    confidence: "high"
  - term: "Money laundering"
    modifier: "blockchain forensics"
    aliases: ["laundering", "crypto laundering"]
    definition: "The process of moving illicit funds through layers of transactions or services to hide their criminal source."
    context: "Samourai Wallet's founders called it \"money laundering for bitcoin\"; the chain sized the service, while their intent came from records off the chain."
    slide_heading: "The chain shows a service; records show who"
    tags: ["forensics", "policy"]
    confidence: "high"
  - term: "Pseudonymity"
    modifier: "blockchain forensics"
    aliases: ["pseudonymous", "pseudonymous address"]
    definition: "A privacy property where activity is tied to persistent identifiers such as addresses without automatically revealing a legal identity."
    context: "Even a perfect on-chain trace only leads to a pseudonymous address; linking it to a real person requires off-chain intelligence."
    slide_heading: "Challenges in Forensic Analysis"
    tags: ["forensics"]
    confidence: "high"
  - term: "Mixer"
    modifier: "blockchain forensics"
    aliases: ["tumbler", "mixing service", "crypto mixer"]
    definition: "A service or protocol that pools funds from multiple users to obscure direct transaction links between sources and destinations."
    context: "Huge clusters holding ransomware addresses were services such as exchanges, wallets and mixers; the lesson's model case, Bitcoin Fog, was a bitcoin mixer."
    slide_heading: "Step 4 ended Low: now name the service"
    tags: ["forensics"]
    confidence: "high"
  - term: "Chain hopping"
    modifier: "blockchain forensics"
    aliases: ["asset hopping", "cross-chain hopping"]
    definition: "Moving assets across different blockchains to force investigators into a new ledger, asset format, or tracing environment."
    context: "DEXs are central to modern asset hopping, swapping one digital asset for another with no KYC; XSema shows how cross-chain hops can be correlated."
    slide_heading: "Decentralized Exchanges (DEXs)"
    tags: ["forensics"]
    confidence: "high"
  - term: "Cross-chain bridge"
    modifier: "blockchain forensics"
    aliases: ["bridge", "cross-chain bridge contract"]
    definition: "Infrastructure that locks, verifies, or represents value from one blockchain so related value can move or appear on another."
    context: "Bridge contracts emit deposit and withdrawal logs, which XSema parses to link a Bitcoin input to its Ethereum output."
    slide_heading: "Future of Forensics: Automated Cross-Chain Tracing"
    tags: ["forensics"]
    confidence: "high"
  - term: "Peel chain"
    modifier: "crypto laundering"
    aliases: ["peeling chain", "peel chains"]
    definition: "A laundering pattern where small amounts are peeled off through a sequence of transactions while the remaining balance continues onward."
    context: "Step 4 of the worked trace follows T6's peel to D, whose cluster holds about 2 million addresses."
    slide_heading: "Step 4 ended Low: now name the service"
    tags: ["forensics"]
    confidence: "high"
  - term: "On-chain analysis"
    modifier: "blockchain forensics"
    aliases: ["ledger analysis", "on-chain ledger analysis"]
    definition: "The examination of blockchain transactions, addresses, contracts, and flows using data recorded directly on a public ledger."
    context: "On-chain analysis can find a service and size it; who ran it, and what they knew, came from records off the chain."
    slide_heading: "The chain shows a service; records show who"
    tags: ["forensics"]
    confidence: "high"
  - term: "Open-source intelligence"
    modifier: null
    aliases: ["OSINT", "open source intelligence"]
    definition: "Intelligence gathered from publicly available sources such as websites, forums, social media, records, and other open data."
    context: "In Bitcoin Fog, an alias, forum posts and IP addresses led to the person; an OSINT label is a lead that needs another line of evidence."
    slide_heading: "A label is only as good as its source"
    tags: ["forensics", "real-world"]
    confidence: "high"
  - term: "Regulatory chokepoint"
    modifier: "crypto policy"
    aliases: ["chokepoint", "regulated chokepoint", "compliance chokepoint"]
    definition: "A service or interface where rules can be enforced because crypto activity touches banks, exchanges, bridges, or other identifiable operators."
    context: "DEXs remove one chokepoint: users swap without exchange accounts or KYC at the protocol layer, though DEXs do not provide fiat cash-out."
    slide_heading: "Decentralized Exchanges (DEXs)"
    tags: ["policy", "forensics"]
    confidence: "high"
  - term: "CoinJoin"
    modifier: null
    aliases: []
    definition: "A collaborative transaction technique that combines inputs and outputs from multiple users to weaken ownership links in the transaction graph."
    context: "CoinJoin illustrates how adversaries can intentionally break common tracing assumptions without leaving the public ledger."
    slide_heading: "Challenges in Forensic Analysis"
    tags: ["forensics", "bitcoin"]
    confidence: "high"
  - term: "Common-input-ownership heuristic"
    modifier: "blockchain forensics"
    aliases: ["common-input heuristic", "CIOH"]
    definition: "A tracing rule of thumb that assumes inputs spent together in one transaction are likely controlled by the same entity."
    context: "The lesson uses CoinJoin to show why this foundational clustering heuristic can fail."
    slide_heading: "Challenges in Forensic Analysis"
    tags: ["forensics", "bitcoin"]
    confidence: "high"
  - term: "Heuristic"
    modifier: "forensic analysis"
    aliases: ["rule of thumb", "forensic heuristic"]
    definition: "An evidence-based rule of thumb used to infer likely relationships or behavior when direct proof is unavailable."
    context: "Heuristics power clustering and tracing, but the lesson repeatedly warns that they require validation and corroboration."
    slide_heading: "Challenges in Forensic Analysis"
    tags: ["forensics"]
    confidence: "high"
  - term: "Privacy coin"
    modifier: null
    aliases: ["Monero", "Zcash", "XMR", "ZEC"]
    definition: "A cryptocurrency that uses privacy-focused cryptography to hide some combination of sender, receiver, and transaction amount."
    context: "Privacy coins represent the point where the visible on-chain trail can become severely limited or go dark."
    slide_heading: "Challenges in Forensic Analysis"
    tags: ["forensics"]
    confidence: "high"
  - term: "Off-chain blind spot"
    modifier: "blockchain forensics"
    aliases: ["private ledger blind spot", "off-chain ledger"]
    definition: "An area of crypto activity recorded inside private systems such as exchanges or OTC desks rather than on a public blockchain."
    context: "The lesson uses off-chain blind spots to explain why on-chain data alone is rarely enough to close a case: forensic tools cannot see into these private ledgers."
    slide_heading: "Challenges in Forensic Analysis"
    tags: ["forensics", "policy"]
    confidence: "high"
  - term: "Attribution uncertainty"
    modifier: "blockchain forensics"
    aliases: ["attribution risk"]
    definition: "The remaining doubt when a transaction trace points to an address or cluster but not yet to a confirmed real-world actor."
    context: "Attribution uncertainty is the reason the lesson separates tracing funds from proving who controlled them."
    slide_heading: "Challenges in Forensic Analysis"
    tags: ["forensics"]
    confidence: "high"
  - term: "False positive"
    modifier: "forensic analysis"
    aliases: ["incorrect match", "incorrect attribution"]
    definition: "An incorrect match or attribution that wrongly links activity, funds, or identities."
    context: "False positives matter because mistaken blockchain attributions can create legal, reputational, and operational harm."
    slide_heading: "Challenges in Forensic Analysis"
    tags: ["forensics", "policy"]
    confidence: "high"
  - term: "Sanctions"
    modifier: "crypto policy"
    aliases: ["sanctions enforcement", "designation"]
    definition: "Legal restrictions that bar interaction with designated entities, actors, contracts, or infrastructure."
    context: "OFAC's listing of over 100 Hydra addresses is a government label, strong for the exact address and the listing's date; open label sets copy OFAC's sanctioned addresses."
    slide_heading: "A label is only as good as its source"
    tags: ["policy", "forensics"]
    confidence: "high"
  - term: "Fiat off-ramp"
    modifier: "crypto laundering"
    aliases: ["off-ramp", "cash-out path", "cash-out venue"]
    definition: "A service or path used to convert crypto assets into fiat currency or spendable equivalents."
    context: "DEXs cannot interface with banks, so they are not fiat off-ramps: they only swap one digital asset for another."
    slide_heading: "Decentralized Exchanges (DEXs)"
    tags: ["forensics", "policy"]
    confidence: "high"
  - term: "Decentralized exchange"
    modifier: null
    aliases: ["DEX", "DEXs"]
    definition: "A blockchain-based exchange where smart contracts allow users to swap crypto assets without a centralized custodian or account system."
    context: "DEXs matter because they remove a familiar compliance counterparty while still enabling asset swaps used in laundering paths."
    slide_heading: "Decentralized Exchanges (DEXs)"
    tags: ["ethereum", "forensics"]
    confidence: "high"
  - term: "Automated market maker"
    modifier: null
    aliases: ["AMM", "AMMs"]
    definition: "A DEX mechanism where smart contracts price swaps from token reserves instead of matching buyers and sellers through an order book."
    context: "AMMs explain how DEXs can keep operating without a human market maker or centralized trading desk."
    slide_heading: "Decentralized Exchanges (DEXs)"
    tags: ["ethereum", "forensics"]
    confidence: "high"
  - term: "Liquidity pool"
    modifier: "AMM"
    aliases: ["token pool", "pool"]
    definition: "A smart-contract reserve of tokens used to execute swaps and determine prices in an automated market maker."
    context: "The lesson uses liquidity pools to explain why DEX swaps are code-driven rather than account-driven."
    slide_heading: "Decentralized Exchanges (DEXs)"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Constant product formula"
    modifier: "AMM"
    aliases: ["x*y=k", "constant product market maker"]
    definition: "An AMM pricing rule that keeps the product of two token reserves constant as trades change each reserve."
    context: "This formula gives students the mechanical intuition for demand-driven DEX pricing."
    slide_heading: "Decentralized Exchanges (DEXs)"
    tags: ["ethereum"]
    confidence: "high"
  - term: "Self-custody"
    modifier: null
    aliases: ["self custody", "non-custodial control"]
    definition: "A custody model where users retain control of their own private keys instead of depositing assets with an intermediary."
    context: "Self-custody explains why DEX users can trade directly from wallets without an exchange holding their funds."
    slide_heading: "Decentralized Exchanges (DEXs)"
    tags: ["ethereum", "forensics"]
    confidence: "high"
  - term: "Correlation"
    modifier: "forensics"
    aliases: ["event correlation", "cross-system correlation"]
    definition: "Linking events across systems using patterns such as timing, amount, destination, or infrastructure rather than a direct shared identifier."
    context: "XSema correlates cross-chain hops by matching a bridge deposit to its withdrawal with timing windows and fee-adjusted amounts."
    slide_heading: "Future of Forensics: Automated Cross-Chain Tracing"
    tags: ["forensics"]
    confidence: "high"
  - term: "Cross-chain tracing"
    modifier: "blockchain forensics"
    aliases: ["cross-chain forensics", "chain-by-chain reconstruction"]
    definition: "Following asset movement across multiple blockchains by matching bridge events, swaps, timings, amounts, and destinations."
    context: "Tracing across chains is slow and manual today; XSema automates it from the logs bridge contracts emit."
    slide_heading: "Future of Forensics: Automated Cross-Chain Tracing"
    tags: ["forensics"]
    confidence: "high"
  - term: "XSema"
    modifier: null
    aliases: []
    definition: "A research system described in the lesson that automates cross-chain provenance extraction from bridge logs and related evidence."
    context: "XSema illustrates how future tools may reduce manual block-explorer work by building unified cross-chain traces."
    slide_heading: "Future of Forensics: Automated Cross-Chain Tracing"
    tags: ["forensics", "real-world"]
    confidence: "high"
  - term: "Automated provenance extraction"
    modifier: "blockchain forensics"
    aliases: ["provenance extraction"]
    definition: "The automated parsing of on-chain events to recover asset type, amount, source chain, destination chain, and related movement history."
    context: "The lesson uses automated provenance extraction to show how forensic tools can scale against rapid cross-chain laundering."
    slide_heading: "Future of Forensics: Automated Cross-Chain Tracing"
    tags: ["forensics"]
    confidence: "high"
  - term: "Timing window"
    modifier: "cross-chain tracing"
    aliases: ["timing windows"]
    definition: "A bounded time interval used to match likely related deposits and withdrawals across chains or services."
    context: "Timing windows help analysts infer continuity when bridge or swap activity lacks one explicit shared transaction identifier."
    slide_heading: "Future of Forensics: Automated Cross-Chain Tracing"
    tags: ["forensics"]
    confidence: "high"
  - term: "Fee-adjusted amount matching"
    modifier: "cross-chain tracing"
    aliases: ["amount matching", "fee-adjusted matching"]
    definition: "A correlation technique that matches likely related transfers after accounting for fees, slippage, or service deductions."
    context: "The lesson presents fee-adjusted matching as one way automated tools connect deposits to later withdrawals."
    slide_heading: "Future of Forensics: Automated Cross-Chain Tracing"
    tags: ["forensics"]
    confidence: "high"
  - term: "Unified provenance graph"
    modifier: "blockchain forensics"
    aliases: ["provenance graph"]
    definition: "A graph that links related asset movements across chains into one traceable history."
    context: "The unified provenance graph is the output that turns scattered bridge and swap events into a single investigative view."
    slide_heading: "Future of Forensics: Automated Cross-Chain Tracing"
    tags: ["forensics"]
    confidence: "high"
  - term: "Attribution"
    modifier: "blockchain forensics"
    aliases: ["actor attribution", "entity attribution"]
    definition: "Linking on-chain activity to the service or actor behind it."
    context: "Every label gets three questions: who says so, how they knew, and how it could be wrong; the chain can name a service, while the people come from records off the chain."
    slide_heading: "Step 4 ended Low: now name the service"
    tags: ["forensics"]
    confidence: "high"
  - term: "Darknet market"
    modifier: null
    aliases: ["dark web market", "illicit marketplace"]
    definition: "An online illicit marketplace accessed through privacy-focused infrastructure such as Tor."
    context: "Darknet markets, like exchanges and OTC desks, keep activity in private databases off the chain, which forensic tools cannot see into."
    slide_heading: "Challenges in Forensic Analysis"
    tags: ["forensics", "real-world"]
    confidence: "high"
  - term: "BTC-e"
