lesson_id: "01-CM"
lesson_title: "Ledger and Finality"
source_path: "lessons/consensus_primitives/01-CM-consensus_in_distributed_systems_and_blockchains_intro.qmd"
terms:
  - term: "Consensus"
    modifier: "distributed systems"
    aliases: ["agreement"]
    definition: "A protocol goal where non-faulty participants eventually choose one proposed value or history despite delay and failure."
    context: "Consensus is the third thing that turns a log into a ledger: a rule for agreeing what is added next, and in what order, so every honest node accepts the same history."
    slide_heading: "A ledger is a shared log no one can quietly edit"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Double-spending"
    modifier: "blockchain"
    aliases: ["double-spend", "double-spend attempt"]
    definition: "An attempt to use the same value in competing transactions or histories so only one can validly survive."
    context: "Alice signs two payments of the same coins, to Carol and to Dave; without consensus, copies of the ledger would tell different stories. Later, the lesson shows an attacker trying it with a private chain."
    slide_heading: "Consensus decides which history we all accept"
    tags: ["consensus", "blockchain"]
    confidence: "high"
  - term: "Process"
    modifier: "consensus"
    aliases: ["participant", "node"]
    definition: "An independently running participant in a distributed consensus protocol."
    context: "In a ledger every participant holds a full copy, so no one controls the record; the lesson calls these participants nodes."
    slide_heading: "A ledger is a shared log no one can quietly edit"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Non-faulty process"
    modifier: null
    aliases: ["correct node", "honest node", "honest participant"]
    definition: "A participant that follows the protocol rules and is not exhibiting the fault behavior under discussion."
    context: "Consensus makes every honest node accept the same history, and its promises are stated for honest nodes, even when some nodes crash or lie."
    slide_heading: "Consensus decides which history we all accept"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Safety"
    modifier: "consensus"
    aliases: ["safety property"]
    definition: "The guarantee that a protocol will not commit conflicting results or later roll back a committed result."
    context: "Safety is one of the two promises consensus makes: once something is decided, honest nodes never disagree about it. Each chain balances it against liveness differently."
    slide_heading: "Consensus decides which history we all accept"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Liveness"
    modifier: "consensus"
    aliases: ["progress"]
    definition: "The guarantee that the system eventually moves forward and reaches a new decision when assumptions allow it."
    context: "Liveness is the second promise of consensus: the ledger keeps growing even when some nodes crash or lie. How a chain balances it against safety sets what \"final\" means there."
    slide_heading: "Consensus decides which history we all accept"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Quorum"
    modifier: "consensus"
    aliases: ["quorum threshold"]
    definition: "A required amount of participant support before a protocol treats a proposal or decision as valid."
    context: "Byzantine-fault-tolerant protocols such as PBFT are final at once, as soon as a quorum of known members signs."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Finality"
    modifier: "consensus"
    aliases: ["finalized", "finalization"]
    definition: "The point at which a committed result is treated as no longer reversible under the protocol's assumptions."
    context: "Hashes and copies protect old entries, but the newest can still change while two versions compete; finality is the point after which an entry won't change, and it means something different on each chain."
    slide_heading: "\"Immutable\" means an edit would show"
    tags: ["consensus", "blockchain"]
    confidence: "high"
  - term: "Failure model"
    modifier: null
    aliases: ["fault model"]
    definition: "The set of failure behaviors a protocol assumes it must tolerate."
    context: "The comparison table lists what each consensus family survives: crashes but not lies for Raft, fewer than a third of members lying for PBFT, attackers with less than half the mining power for proof of work."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Crash fault"
    modifier: null
    aliases: ["crash faults", "crash failure"]
    definition: "A failure where a node stops responding or goes offline without sending deceptive messages."
    context: "Consensus must keep the ledger growing even when some nodes crash; crash-fault-tolerant protocols such as Raft survive nodes that crash, but not nodes that lie."
    slide_heading: "Consensus decides which history we all accept"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Omission fault"
    modifier: null
    aliases: ["omission faults", "message omission"]
    definition: "A failure where a node or network path drops some messages while other behavior may continue."
    context: "One explanation for a transaction that never confirms is that it never reached the miners because of relay or routing trouble, which from outside can look the same as censorship."
    slide_heading: "Delay may mean congestion, not censorship"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Byzantine fault"
    modifier: null
    aliases: ["Byzantine faults", "arbitrary fault", "malicious fault"]
    definition: "A fault where a participant may lie, equivocate, collude, or send conflicting messages."
    context: "Consensus must keep working even when some nodes lie; Byzantine-fault-tolerant protocols such as PBFT survive fewer than a third of members lying."
    slide_heading: "Consensus decides which history we all accept"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Vote phase"
    modifier: "consensus"
    aliases: ["vote", "voting"]
    definition: "The step where validators or members signal support for a candidate, so that enough matching votes can make it final."
    context: "Ethereum's proof of stake finalizes after a vote of two-thirds of the stake: validators vote for pairs of checkpoints, one at the start of each epoch."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Commit phase"
    modifier: "consensus"
    aliases: ["commit", "committed"]
    definition: "The phase where enough matching votes allow the protocol to accept a value as decided for that position."
    context: "Crash-fault-tolerant protocols such as Raft are final at once, when the protocol commits."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Deterministic finality"
    modifier: null
    aliases: ["immediate finality"]
    definition: "Finality where a committed value is final immediately under the protocol assumptions rather than becoming safer gradually."
    context: "A system that knows its members can count their votes and finish at once: Raft when the protocol commits, PBFT when a quorum signs. Open chains can't count strangers, so they finalize more slowly."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "distributed-systems", "permissioned-ledgers"]
    confidence: "high"
  - term: "Slot"
    modifier: "consensus log"
    aliases: ["height", "position"]
    definition: "A specific position in the ordered history where a protocol chooses one value or block."
    context: "During a routine fork two valid blocks can share a height, so a report cites the block hash as well as the height."
    slide_heading: "A stale block is routine, not an attack"
    tags: ["consensus", "blockchain"]
    confidence: "high"
  - term: "Byzantine fault threshold"
    modifier: "BFT quorum"
    aliases: ["fault threshold", "t"]
    definition: "The maximum number of Byzantine participants a protocol's quorum math is designed to tolerate."
    context: "The comparison table states the BFT threshold in words: PBFT survives fewer than a third of members lying."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Crash-fault tolerance"
    modifier: null
    aliases: ["CFT"]
    definition: "A consensus family that tolerates nodes crashing, restarting, or going silent, but not lying or colluding."
    context: "Raft is the lesson's example: known nodes, survives nodes that crash but not nodes that lie, and final at once when the protocol commits."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Identity model"
    modifier: "consensus"
    aliases: ["membership model"]
    definition: "The protocol assumption about who can participate and how participants are recognized."
    context: "The comparison table's \"who takes part\" column: known nodes for Raft, known members for PBFT, anyone for proof of work, and anyone who locks up stake for proof of stake."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "distributed-systems", "permissioned-ledgers"]
    confidence: "high"
  - term: "Sybil attack"
    modifier: null
    aliases: ["Sybil attacks"]
    definition: "An attack where one actor creates many fake identities to gain disproportionate influence."
    context: "Anyone can create a thousand identities on an open chain, which is why open chains make influence cost something instead: computing work or locked-up stake."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Sybil resistance"
    modifier: null
    aliases: ["anti-Sybil mechanism"]
    definition: "A mechanism that prevents one actor from cheaply multiplying identities into excess protocol influence."
    context: "Sybil resistance comes from admission control in permissioned systems and from economic cost, computing work or locked-up stake, in open ones."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "distributed-systems", "blockchain"]
    confidence: "high"
  - term: "Adversary assumption"
    modifier: "consensus"
    aliases: ["adversary model"]
    definition: "The protocol assumption about what faulty or malicious participants are able and willing to do."
    context: "Each family assumes a different adversary: nodes that crash but don't lie for Raft, fewer than a third of members lying for PBFT, and attackers with less than half the mining power for proof of work."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Byzantine-fault tolerance"
    modifier: null
    aliases: ["BFT", "Byzantine fault tolerance"]
    definition: "A consensus family designed to remain safe when some known participants may lie, equivocate, or act maliciously."
    context: "PBFT is the lesson's example: known members, survives fewer than a third of members lying, and final at once when a quorum signs."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "distributed-systems", "permissioned-ledgers"]
    confidence: "high"
  - term: "Governed membership"
    modifier: null
    aliases: ["controlled membership", "known participants"]
    definition: "A participation model where admission, authorization, and membership changes are handled by governance outside the voting protocol."
    context: "Crash- and Byzantine-fault-tolerant protocols run among known members, and permissioned systems resist Sybil attacks through admission control."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "permissioned-ledgers"]
    confidence: "high"
  - term: "Nakamoto consensus"
    modifier: null
    aliases: ["Nakamoto-style consensus", "Proof-of-Work consensus", "PoW consensus"]
    definition: "A permissionless consensus style where scarce work and the heaviest valid chain guide nodes toward one history over time."
    context: "Bitcoin's proof of work is open to anyone, survives attackers with less than half the mining power, and makes reversal harder with every block without ever declaring anything final."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "blockchain", "bitcoin"]
    confidence: "high"
  - term: "Open participation"
    modifier: "consensus"
    aliases: ["permissionless participation", "open membership"]
    definition: "A model where nodes can join or leave without prior admission by a central membership authority."
    context: "Open chains let anyone take part, so they can't count votes from members they don't know and finalize more slowly; they make influence cost work or stake instead."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "blockchain"]
    confidence: "high"
  - term: "Proof-of-Work"
    modifier: null
    aliases: ["PoW", "work"]
    definition: "A Sybil-resistance mechanism that makes influence expensive by requiring participants to perform scarce computation."
    context: "Proof of work makes influence on an open chain cost computing work; Bitcoin's security rests on most of the mining power not working together to attack it."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "blockchain", "bitcoin"]
    confidence: "high"
  - term: "Probabilistic finality"
    modifier: null
    aliases: ["probabilistic settlement"]
    definition: "Finality where confidence increases as more blocks build on a history rather than becoming absolute immediately."
    context: "Proof of work never declares a block final: each block on top makes reversal harder, but never impossible. Six confirmations, about an hour, is the usual wait on Bitcoin for high-value payments."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "blockchain", "bitcoin"]
    confidence: "high"
  - term: "Consensus family"
    modifier: null
    aliases: ["consensus families"]
    definition: "A broad category of consensus protocols grouped by identity assumptions, adversary model, and finality style."
    context: "The comparison table places crash-fault-tolerant, Byzantine-fault-tolerant, proof-of-work and proof-of-stake consensus by who takes part, what they survive and when they are final."
    slide_heading: "Open chains buy openness with slower finality"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Trust minimization"
    modifier: "blockchain"
    aliases: ["minimized trust"]
    definition: "Reducing reliance on a central authority by replacing some trusted intermediaries with protocol rules and incentives."
    context: "The lesson rejects \"trustless\": distributed trust moves from one party to cryptography, the consensus rules and an honest majority, and where it sits differs by chain."
    slide_heading: "\"Trustless\" is wrong: the trust just moves"
    tags: ["consensus", "blockchain"]
    confidence: "high"
  - term: "Ledger convergence"
    modifier: null
    aliases: ["chain convergence", "history convergence"]
    definition: "The process by which honest nodes settle on the same accepted ledger history."
    context: "Different nodes may see conflicting transactions in a different order; consensus makes honest nodes converge on one history."
    slide_heading: "Consensus decides which history we all accept"
    tags: ["consensus", "blockchain"]
    confidence: "high"
  - term: "Canonical chain"
    modifier: "blockchain"
    aliases: ["canonical history", "accepted chain"]
    definition: "The ledger branch that honest nodes treat as the accepted history under the consensus rule."
    context: "Consensus picks the one history every honest node accepts; on Bitcoin, when two blocks compete, nodes follow the chain with the most work."
    slide_heading: "Consensus decides which history we all accept"
    tags: ["consensus", "blockchain"]
    confidence: "high"
  - term: "Confirmation"
    modifier: "blockchain"
    aliases: ["confirmations", "block confirmations"]
    definition: "A count of a transaction's own block and every block built on top of it; each one makes reversing the transaction harder."
    context: "A transaction with one confirmation can drop out in a routine fork; six confirmations, about an hour, is the usual wait on Bitcoin for high-value payments, a convention rather than a rule."
    slide_heading: "A stale block is routine, not an attack"
    tags: ["consensus", "blockchain", "bitcoin"]
    confidence: "high"
  - term: "Heaviest chain"
    modifier: "Proof-of-Work"
    aliases: ["most-work chain"]
    definition: "The valid chain with the most accumulated proof-of-work, used as the surviving history in Nakamoto-style consensus."
    context: "When two miners find a block at nearly the same time, nodes follow the chain with the most work, and the block the next one doesn't extend becomes stale."
    slide_heading: "A stale block is routine, not an attack"
    tags: ["consensus", "blockchain", "bitcoin"]
    confidence: "high"
  - term: "Orphaned branch"
    modifier: "blockchain"
    aliases: ["orphaned fork", "stale branch", "pruned fork"]
    definition: "A competing branch that loses the consensus race and is no longer treated as the accepted ledger history."
    context: "The lesson calls the losing block stale (older sources say \"orphan\"); its transactions go back to the mempool, and the fork is routine, not an attack."
    slide_heading: "A stale block is routine, not an attack"
    tags: ["consensus", "blockchain"]
    confidence: "high"
