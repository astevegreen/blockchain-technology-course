lesson_id: "05-FO"
lesson_title: "VASPs and the Rules"
source_path: "lessons/forensics/05-FO-vasps_and_the_rules.qmd"
terms:
  - term: "Recommendation 15"
    modifier: null
    aliases: ["FATF Recommendation 15", "R.15"]
    definition: "The part of the Financial Action Task Force's anti-money-laundering standard that, since 2019, covers virtual assets and VASPs."
    context: "The lesson uses it to show that most rules fall on the businesses that move crypto for customers, not on blockchains."
    slide_heading: "A VASP moves crypto for others"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "FinCEN"
    modifier: null
    aliases: ["Financial Crimes Enforcement Network"]
    definition: "The U.S. body whose rules under the Bank Secrecy Act set what a money services business must do. Businesses register with it, it fines firms that break AML laws, and it takes Section 311 actions."
    context: "FinCEN fined BTC-e $110 million in 2017 and in 2025 cut Huione off from U.S. correspondent accounts; a 311 action is FinCEN's, not OFAC's."
    slide_heading: "A VASP moves crypto for others"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Money transmitter"
    modifier: null
    aliases: ["money transmission"]
    definition: "FinCEN's term for a business that moves value for others; since 2013 it has included exchangers and administrators of virtual currency."
    context: "The test is the activity, not the software: the same wallet software can serve a user or a money transmitter, depending on what each transaction is for."
    slide_heading: "A VASP moves crypto for others"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Money services business"
    modifier: null
    aliases: ["MSB", "MSBs"]
    definition: "The U.S. category of business, which includes money transmitters, that must register with FinCEN, run an AML program, file reports and keep records under the Bank Secrecy Act."
    context: "An MSB must verify customer identification and know enough about each customer to judge their risk."
    slide_heading: "A VASP moves crypto for others"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Hosted wallet"
    modifier: null
    aliases: ["hosted wallets"]
    definition: "A wallet where a business holds the keys and moves value for its customer. The business must verify and monitor the user's identity."
    context: "Ransom victims often send from a wallet an exchange hosts; a hosted wallet is the side of a transfer where KYC records exist."
    slide_heading: "A VASP moves crypto for others"
    tags: ["policy", "forensics"]
    confidence: "high"
  - term: "Unhosted wallet"
    modifier: null
    aliases: ["unhosted wallets"]
    definition: "A wallet whose owner holds the keys and has total independent control over the value. Someone paying for their own goods this way is not a money transmitter."
    context: "When one side of a transfer is unhosted, no Travel Rule record exists for that side."
    slide_heading: "A VASP moves crypto for others"
    tags: ["policy", "forensics"]
    confidence: "high"
  - term: "AML program"
    modifier: null
    aliases: ["anti-money-laundering program"]
    definition: "A written, risk-based program an MSB must run under the Bank Secrecy Act, with a compliance officer, training and independent review."
    context: "It tells the analyst how a firm screens and monitors its customers."
    slide_heading: "KYC ties an account to a person"
    tags: ["policy"]
    confidence: "high"
  - term: "Currency Transaction Report"
    modifier: null
    aliases: ["Currency Transaction Reports"]
    definition: "A report the Bank Secrecy Act requires of a money services business, where it applies, alongside Suspicious Activity Reports."
    context: "The lesson lists it among the BSA records that can show an analyst that a firm saw a pattern, not that a crime happened."
    slide_heading: "The BSA makes the business keep records"
    tags: ["policy"]
    confidence: "high"
  - term: "Liberty Reserve"
    modifier: null
    aliases: []
    definition: "A centralized digital money system whose operators were prosecuted for evading AML rules, and whose service ended."
    context: "Like e-gold, it shows that the rules act on the operator, its accounts and its access to banks, while a ledger itself carries on."
    slide_heading: "The BSA makes the business keep records"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Section 311"
    modifier: null
    aliases: ["311 action", "Section 311 of the USA PATRIOT Act"]
    definition: "The USA PATRIOT Act authority that lets Treasury find a foreign institution to be of primary money laundering concern and impose special measures, up to barring U.S. institutions from holding a correspondent account for it."
    context: "FinCEN used it against Huione; it closes U.S. banks' doors but does not move or freeze coins on a chain."
    slide_heading: "Section 311 cuts a firm off from U.S. banks"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Primary money laundering concern"
    modifier: null
    aliases: ["of primary money laundering concern"]
    definition: "The finding Treasury makes under Section 311 about a foreign institution, which opens the way to special measures against it."
    context: "FinCEN found Huione of primary money laundering concern on 1 May 2025."
    slide_heading: "Section 311 cuts a firm off from U.S. banks"
    tags: ["policy"]
    confidence: "high"
  - term: "Special measures"
    modifier: null
    aliases: ["special measure five", "measure five"]
    definition: "The five measures Section 311 allows: measures one to four add recordkeeping and reporting duties, and measure five can bar U.S. institutions from holding a correspondent account for the named institution."
    context: "The final Huione rule applied measure five, with special due diligence to keep Huione out indirectly."
    slide_heading: "Section 311 cuts a firm off from U.S. banks"
    tags: ["policy"]
    confidence: "high"
  - term: "Huione Group"
    modifier: null
    aliases: ["Huione", "Huione Pay", "Huione Crypto", "Haowang Guarantee"]
    definition: "A Cambodia-based crypto and payments group whose parts, Huione Pay, Huione Crypto and Haowang Guarantee, FinCEN found operating as one and laundering at least $4 billion between August 2021 and January 2025."
    context: "FinCEN's 2025 Section 311 rule cut Huione off from U.S. correspondent accounts, but its addresses still work; funds reaching it are a risk signal, not proof of intent."
    slide_heading: "Huione laundered at least $4 billion"
    tags: ["policy", "forensics", "real-world"]
    confidence: "high"
  - term: "USDH"
    modifier: null
    aliases: []
    definition: "Huione's own stablecoin, advertised as one that cannot be frozen."
    context: "Huione, a group outside the U.S. that took fiat and crypto from scammers and offered a coin it said could not be frozen, is the lesson's example of rules pushing money to firms that ignore them."
    slide_heading: "Huione laundered at least $4 billion"
    tags: ["stablecoins", "policy", "forensics"]
    confidence: "high"
  - term: "Special due diligence"
    modifier: null
    aliases: []
    definition: "A duty in the final Huione rule that U.S. institutions take care to keep Huione out indirectly, through the banks they deal with."
    context: "Together with the ban on correspondent accounts, it closes the doors of U.S. banks, and of banks that deal with them, to Huione."
    slide_heading: "Huione: what the rule does and doesn't do"
    tags: ["policy"]
    confidence: "high"
  - term: "SDN list"
    modifier: null
    aliases: ["Specially Designated Nationals list", "Specially Designated Nationals and Blocked Persons List"]
    definition: "OFAC's list of Specially Designated Nationals. U.S. persons may not deal with anyone on it, directly or indirectly, and since 2018 some entries list known virtual currency addresses."
    context: "A listed address is a fact the analyst can check; an address clustered with it is a judgment that carries a confidence word."
    slide_heading: "OFAC designates; every U.S. person blocks"
    tags: ["policy", "forensics"]
    confidence: "high"
  - term: "U.S. person"
    modifier: null
    aliases: ["U.S. persons"]
    definition: "Anyone who must comply with OFAC sanctions: U.S. citizens and lawful permanent residents wherever they are, everyone in the United States, and U.S. companies with their foreign branches."
    context: "Every U.S. person must block property in which a listed person has an interest."
    slide_heading: "OFAC designates; every U.S. person blocks"
    tags: ["policy"]
    confidence: "high"
  - term: "50 percent rule"
    modifier: null
    aliases: ["OFAC 50 percent rule", "fifty percent rule"]
    definition: "OFAC's rule that a firm owned 50 percent or more by blocked persons is blocked too."
    context: "The lesson lists it with the SDN list and strict liability as the OFAC rules that bind every U.S. person."
    slide_heading: "OFAC designates; every U.S. person blocks"
    tags: ["policy"]
    confidence: "high"
  - term: "Strict liability"
    modifier: null
    aliases: []
    definition: "OFAC's power to impose a civil penalty even when the violator had no knowledge or reason to know of the violation."
    context: "Strict liability is why VASPs screen every address."
    slide_heading: "OFAC designates; every U.S. person blocks"
    tags: ["policy"]
    confidence: "high"
  - term: "Sanctions exposure"
    modifier: null
    aliases: ["exposure", "sanctions risk"]
    definition: "Funds or addresses linked to a sanctioned party, for example an address that shares a wallet with a listed one. It is a risk signal, not proof of a violation."
    context: "The analyst reports exposure with a confidence word and never as proof on its own."
    slide_heading: "The SDN list names some addresses, not all"
    tags: ["policy", "forensics"]
    confidence: "high"
  - term: "Delisting"
    modifier: null
    aliases: ["sanctions delisting", "delisted"]
    definition: "Treasury lifting sanctions it had placed on a person or entity, removing it from the list."
    context: "Tornado Cash was sanctioned in August 2022 and delisted on 21 March 2025, so every statement that an address is sanctioned needs a date."
    slide_heading: "Date every sanctions claim: Tornado Cash"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Travel Rule"
    modifier: null
    aliases: ["FATF Travel Rule"]
    definition: "The rule that for a transfer of $3,000 or more, or its equivalent in crypto, the sending institution and any intermediary must pass on required information about the sender and recipient."
    context: "The data travels off-chain, before or at the time of the transfer; 99 jurisdictions have passed or are passing Travel Rule laws, as of 26 June 2025."
    slide_heading: "The Travel Rule sends the sender's data along"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Offshore VASP"
    modifier: null
    aliases: ["offshore VASPs"]
    definition: "A VASP run from outside a jurisdiction, whose operators that jurisdiction struggles to identify and whose risk it struggles to reduce."
    context: "When funds avoid KYC'd exchanges, the analyst looks for the firm that took them instead, since its rules decide what records exist."
    slide_heading: "Rules push money to firms that ignore them"
    tags: ["policy", "forensics"]
    confidence: "high"
