lesson_id: "08-EF"
lesson_title: "Layer 2s and Bridges by Type"
source_path: "lessons/ethereum/08-EF-layer2s_and_bridges.qmd"
terms:
  - term: "Rollup batch"
    modifier: null
    aliases: ["rollup batches", "batch of transactions"]
    definition: "A bundle of a rollup's transaction data that its sequencer posts to Ethereum, as calldata or in blobs."
    context: "One user's rollup activity shows up as an L1 deposit, many L2 transactions, and batches on L1."
    slide_heading: "A rollup posts its batches to Ethereum"
    tags: ["ethereum", "distributed-systems"]
    confidence: "high"
  - term: "Security Council"
    modifier: null
    aliases: ["security councils", "L2 security council"]
    definition: "A council some rollups keep that can act in an emergency; at L2BEAT Stage 1, at least 75% of it can still block or forge a message to Ethereum."
    context: "On 21 April 2026 Arbitrum's Security Council froze 30,766 ETH tied to the Kelp DAO exploit (as of 31 Oct 2026)."
    slide_heading: "One sequencer orders each rollup's trades"
    tags: ["ethereum", "policy", "forensics"]
    confidence: "high"
  - term: "Arbitrum"
    modifier: null
    aliases: []
    definition: "An optimistic rollup on Ethereum, with a Security Council that can act in an emergency."
    context: "Its Security Council froze 30,766 ETH from the Kelp DAO exploit on 21 April 2026, a real case of an L2 acting on stolen funds."
    slide_heading: "One sequencer orders each rollup's trades"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "Kelp DAO exploit"
    modifier: null
    aliases: ["Kelp DAO", "Kelp DAO hack"]
    definition: "The 18 April 2026 attack in which a forged LayerZero message, claiming to come from Unichain, released rsETH on Ethereum and about $292 million was drained."
    context: "One compromised verifier was enough; a release with no matching source event is the sign of a forged message."
    slide_heading: "One sequencer orders each rollup's trades"
    tags: ["ethereum", "security", "real-world"]
    confidence: "high"
  - term: "Challenge period"
    modifier: null
    aliases: ["challenge window", "withdrawal period"]
    definition: "The roughly seven days an optimistic rollup waits before a withdrawal back to Ethereum completes, during which anyone may challenge a batch with a fraud proof."
    context: "An optimistic withdrawal leaves a start on the rollup and a finish on Ethereum about a week later; funds that left within minutes suggest a third-party bridge."
    slide_heading: "Optimistic waits a week; ZK waits for a proof"
    tags: ["ethereum", "forensics"]
    confidence: "high"
  - term: "OP Stack"
    modifier: null
    aliases: ["OP Mainnet", "OP Stack chains"]
    definition: "The software behind a family of optimistic rollups, such as OP Mainnet."
    context: "The lesson names OP Stack chains and Arbitrum as optimistic-rollup examples students will meet most."
    slide_heading: "Optimistic waits a week; ZK waits for a proof"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "Liquidity bridge"
    modifier: null
    aliases: ["liquidity bridges", "liquidity network", "liquidity networks", "liquidity and intents", "third-party bridge"]
    definition: "A bridge where someone on the far chain pays you from their own funds, so assets are swapped rather than copies minted."
    context: "Its evidence is two transactions by different parties, joined only by the protocol's records; launderers favour it, and usually no one can freeze it except a stablecoin issuer."
    slide_heading: "Optimistic waits a week; ZK waits for a proof"
    tags: ["ethereum", "forensics"]
    confidence: "high"
  - term: "Native bridge"
    modifier: null
    aliases: ["native rollup bridge", "rollup bridge contract"]
    definition: "A rollup's own bridge: assets deposited into its contract on Ethereum are minted on the rollup, and withdrawals complete from that contract; it is a lock-and-mint bridge."
    context: "The lab reads a native bridge movement on each chain: the deposit on Ethereum and the matching credit on the rollup."
    slide_heading: "A deposit and a withdrawal touch both chains"
    tags: ["ethereum", "forensics"]
    confidence: "high"
  - term: "Lock-and-mint bridge"
    modifier: null
    aliases: ["lock-and-mint", "burn-and-mint", "lock and mint"]
    definition: "A bridge that locks or burns the real coin on chain A and mints a wrapped copy on chain B; burning the copy releases the coin."
    context: "Evidence is the lock on A and the mint on B; the locked pool draws attackers, and the bridge's operators or the token issuer can freeze."
    slide_heading: "A deposit and a withdrawal touch both chains"
    tags: ["ethereum", "tokenization", "forensics"]
    confidence: "high"
  - term: "L2BEAT"
    modifier: null
    aliases: []
    definition: "A public site that rates rollups by how far they depend on people rather than code."
    context: "Its rating says whether 'who could have stopped this?' has a named answer; note the date read, since ratings change."
    slide_heading: "L2BEAT stages: who can still change the rules"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "L2BEAT Stages"
    modifier: null
    aliases: ["Stage 0", "Stage 1", "Stage 2", "rollup stages"]
    definition: "L2BEAT's rating of a rollup from Stage 0 (fully controlled by few entities) through Stage 1 (mostly code, with a Security Council) to Stage 2 (fully controlled by code)."
    context: "A low stage means a small group could upgrade the rollup, censor users or freeze funds."
    slide_heading: "L2BEAT stages: who can still change the rules"
    tags: ["ethereum", "policy"]
    confidence: "high"
  - term: "Solana"
    modifier: null
    aliases: ["SOL"]
    definition: "A separate Layer 1, not an Ethereum L2, where everything is an account and code lives in programs that own accounts."
    context: "Taught for recognition only; it carries real stablecoin and memecoin volume, and its records look different from Ethereum's."
    slide_heading: "Solana: programs own the accounts"
    tags: ["blockchain", "real-world"]
    confidence: "high"
  - term: "Solana account"
    modifier: null
    aliases: ["Solana accounts"]
    definition: "Solana's basic record: everything is an account with a 32-byte address, and only its owner program can change its data or debit its lamports."
    context: "Unlike an Ethereum contract, which keeps its own storage, Solana data sits in separate accounts that a program owns."
    slide_heading: "Solana: programs own the accounts"
    tags: ["blockchain"]
    confidence: "high"
  - term: "Solana program"
    modifier: null
    aliases: ["owner program", "Solana programs"]
    definition: "Solana's code; each account has an owner program, which alone can modify the account's data or debit its lamports."
    context: "The Token Program owns token accounts but is not their holder; read the owner field inside the account to find the wallet."
    slide_heading: "Solana: programs own the accounts"
    tags: ["blockchain"]
    confidence: "high"
  - term: "Lamport"
    modifier: null
    aliases: ["lamports"]
    definition: "SOL's smallest unit."
    context: "Only an account's owner program can debit its lamports."
    slide_heading: "Solana: programs own the accounts"
    tags: ["blockchain"]
    confidence: "high"
  - term: "Confirmed block"
    modifier: null
    aliases: ["confirmed (Solana)"]
    definition: "On Solana, a block that more than two-thirds of the network's active stake has voted on; finalized is the stronger level."
    context: "Analysts quote finalized data."
    slide_heading: "Solana: programs own the accounts"
    tags: ["blockchain", "consensus"]
    confidence: "high"
  - term: "Mint account"
    modifier: null
    aliases: ["mint accounts", "token mint"]
    definition: "The Solana account that defines one token type; it can name a freeze authority."
    context: "An associated token account's address is derived from the owner's address and the mint's address."
    slide_heading: "Solana keeps each token in its own account"
    tags: ["blockchain", "tokenization"]
    confidence: "high"
  - term: "Token account"
    modifier: null
    aliases: ["token accounts", "SPL token account"]
    definition: "A separate Solana account in which a wallet holds one token; a wallet needs one for each token it holds."
    context: "A USDC balance on Solana sits at a token account address, not the wallet address; the owner field inside it names the wallet."
    slide_heading: "Solana keeps each token in its own account"
    tags: ["blockchain", "tokenization", "forensics"]
    confidence: "high"
  - term: "Associated token account"
    modifier: null
    aliases: ["ATA", "associated token accounts"]
    definition: "The usual token account, whose address is derived from the owner's address and the mint's address."
    context: "A report may quote either the wallet address or this token account address."
    slide_heading: "Solana keeps each token in its own account"
    tags: ["blockchain", "tokenization"]
    confidence: "high"
  - term: "Freeze authority"
    modifier: null
    aliases: ["freeze authorities"]
    definition: "The account a Solana mint names as authorized to freeze tokens in a token account."
    context: "It parallels the issuer freezes students met on day 3."
    slide_heading: "Solana keeps each token in its own account"
    tags: ["blockchain", "tokenization", "stablecoins"]
    confidence: "high"
  - term: "Message-verified bridge"
    modifier: null
    aliases: ["message bridge", "message bridges", "message-verified"]
    definition: "A bridge that passes messages between chains; chain B acts when its verifiers say a message about chain A is genuine."
    context: "Evidence is the message, the action on B and the event on A; a release with no matching source event is the sign of a forged message."
    slide_heading: "A bridge moves a claim, not the coin"
    tags: ["ethereum", "security", "forensics"]
    confidence: "high"
  - term: "Intent"
    modifier: null
    aliases: ["intents"]
    definition: "A liquidity bridge design, such as Across: the user deposits on chain A, a relayer pays them on chain B from its own tokens, and the protocol repays the relayer later."
    context: "No token moves across, so only the protocol's records join the two sides."
    slide_heading: "A bridge moves a claim, not the coin"
    tags: ["ethereum", "forensics"]
    confidence: "high"
  - term: "Wormhole"
    modifier: null
    aliases: ["Wormhole bridge"]
    definition: "A lock-and-mint bridge that lost 120,000 wETH (about $325 million) to an attacker."
    context: "An example of why a bridge's locked pool is a target."
    slide_heading: "Lock-and-mint: the coin waits in a contract"
    tags: ["security", "real-world"]
    confidence: "high"
  - term: "LayerZero"
    modifier: null
    aliases: []
    definition: "A message-verified bridge protocol; in the Kelp DAO exploit a forged LayerZero message released rsETH on Ethereum."
    context: "One compromised verifier (DVN) was enough for the forgery."
    slide_heading: "Message bridges trust a message: Kelp DAO"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "DVN"
    modifier: null
    aliases: ["DVNs"]
    definition: "A verifier in a LayerZero message bridge that vouches a message is genuine."
    context: "In the Kelp DAO exploit one compromised DVN was enough to release about $292 million."
    slide_heading: "Message bridges trust a message: Kelp DAO"
    tags: ["ethereum", "security"]
    confidence: "medium"
  - term: "Relayer"
    modifier: null
    aliases: ["relayers"]
    definition: "In an intents bridge such as Across, the party that pays the user on chain B using its own tokens and is repaid later by the protocol."
    context: "The two sides are different parties' transactions, so the link between them sits in the protocol's records."
    slide_heading: "Liquidity bridges: someone pays you there"
    tags: ["ethereum", "forensics"]
    confidence: "high"
  - term: "Across"
    modifier: null
    aliases: ["Across Protocol"]
    definition: "An intents bridge: the user deposits on one chain, a relayer pays on the other from its own tokens, and the protocol repays relayers later through Ethereum."
    context: "Bitget's stolen ETH crossed through Across among other liquidity bridges."
    slide_heading: "Liquidity bridges: someone pays you there"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "THORChain"
    modifier: null
    aliases: []
    definition: "A cross-chain swap protocol where anyone can swap a coin on one chain for a coin on another."
    context: "In the Bitget case some ETH, plus BNB and XRP, went through THORChain, mostly into BTC."
    slide_heading: "Liquidity bridges: someone pays you there"
    tags: ["blockchain", "real-world", "forensics"]
    confidence: "high"
  - term: "Cross-chain swap"
    modifier: null
    aliases: ["cross-chain swaps"]
    definition: "Swapping a coin on one chain for a coin on another, as THORChain does, without a relayer and without minting a copy."
    context: "Like other liquidity bridges, it leaves two transactions joined only by the protocol's records."
    slide_heading: "Liquidity bridges: someone pays you there"
    tags: ["blockchain", "forensics"]
    confidence: "high"
  - term: "Bitget hack"
    modifier: null
    aliases: ["Bitget theft", "Bitget"]
    definition: "The 24 September 2026 attack in which attackers reached the exchange Bitget's wallet servers and forged withdrawal commands, taking about $388 million across 11 blockchains by Bitget's count."
    context: "No bridge was hacked; bridges carried the money away, and only about $339,000 was frozen (as of 30 Sep 2026). North Korean involvement is a suspicion, not a finding."
    slide_heading: "Bitget: the hack was at the exchange"
    tags: ["real-world", "security", "forensics"]
    confidence: "high"
  - term: "CCTP"
    modifier: null
    aliases: ["Circle's CCTP"]
    definition: "Circle's own bridge for USDC, an issuer's bridge."
    context: "In the Bitget case, USDC crossed on CCTP to Noble and Solana."
    slide_heading: "Answers: bridges moved it faster than freezes"
    tags: ["stablecoins", "real-world"]
    confidence: "high"
  - term: "Cross-chain bridge"
    modifier: "blockchain forensics"
    aliases: ["bridge", "cross-chain bridge contract"]
    definition: "Infrastructure that locks, verifies, or represents value from one blockchain so related value can move or appear on another."
    context: "A bridge cannot carry a coin between chains; it links two ledgers by lock-and-mint, a verified message, a liquidity swap or an intent, and each type leaves its evidence in different places."
    slide_heading: "A bridge moves a claim, not the coin"
    tags: ["forensics"]
    confidence: "high"
  - term: "Cross-chain tracing"
    modifier: "blockchain forensics"
    aliases: ["cross-chain forensics", "chain-by-chain reconstruction"]
    definition: "Following asset movement across multiple blockchains by matching bridge events, swaps, timings, amounts, and destinations."
    context: "A liquidity bridge leaves two transactions by different parties on two chains, joined only by the protocol's records, such as a THORChain memo, which is why day 8's cross-chain trace needs those records."
    slide_heading: "Liquidity bridges: someone pays you there"
    tags: ["forensics"]
    confidence: "high"
