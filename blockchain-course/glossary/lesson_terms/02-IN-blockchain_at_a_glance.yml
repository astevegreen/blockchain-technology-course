  - term: "Cryptography"
    modifier: "blockchain pillar"
    aliases: []
    definition: "The mathematical toolkit blockchains use to prove authorization, protect integrity, and make tampering evident."
    context: "Cryptography is one of the three pillars that lets blockchains operate without trusting every participant."
    slide_heading: "The Three Pillars"
    tags: ["cryptography"]
