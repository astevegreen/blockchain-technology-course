lesson_id: "02-IN"
lesson_title: "Blockchain at a Glance"
source_path: "lessons/introduction/02-IN-blockchain_at_a_glance.qmd"
terms:
  - term: "Blockchain"
    modifier: null
    aliases: ["blockchains"]
    definition: "A record of transactions grouped into blocks, where each block's header holds the hash of the block before it, kept and checked by many independent nodes."
    context: "The lesson defines a blockchain as the record and its rules, separate from any cryptocurrency it records, then follows one real Bitcoin payment through it."
    slide_heading: "The chain shows every payment, but no names"
    tags: ["distributed-systems", "consensus"]
    confidence: "high"
  - term: "Shared history"
    modifier: "blockchain"
    aliases: ["shared reality", "shared truth"]
    definition: "The one record that many nodes each keep and check their own copy of, with no central keeper."
    context: "The lesson describes a blockchain as a shared, hash-linked record, as opposed to the cryptocurrencies it carries."
    slide_heading: "A blockchain is a record, not a currency"
    tags: ["distributed-systems", "consensus"]
    confidence: "high"
  - term: "Append-only ledger"
    modifier: null
    aliases: ["append-only database"]
    definition: "A record structure where new entries can be added but past entries are not silently edited or deleted."
    context: "The lesson says new blocks only go on the end of the chain and old ones are not edited, which is why an edit to old history shows."
    slide_heading: "A blockchain is blocks, each linked to the last"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Permissioned ledger"
    modifier: null
    aliases: ["private blockchain", "consortium blockchain", "permissioned blockchain", "permissioned system"]
    definition: "A blockchain design where access, transaction submission, or validation is limited to approved entities."
    context: "The lesson names Hyperledger Fabric, a permissioned blockchain, to show that a chain can run without a native cryptocurrency."
    slide_heading: "A blockchain is a record, not a currency"
    tags: ["permissioned-ledgers", "policy"]
    confidence: "high"
  - term: "Block"
    modifier: "blockchain data structure"
    aliases: ["blocks"]
    definition: "A batch of transactions with a header; the header holds the hash of the previous block, which links the block into the chain."
    context: "The lesson's worked payment sits in Bitcoin block 277,316, whose header points back to block 277,315."
    slide_heading: "A blockchain is blocks, each linked to the last"
    tags: ["distributed-systems", "cryptography"]
    confidence: "high"
  - term: "Transaction"
    modifier: "blockchain"
    aliases: ["transactions"]
    definition: "A signed message that moves value on a chain; on Bitcoin it spends earlier outputs whole and creates new ones, and its hash is its transaction ID."
    context: "The lesson follows one real transaction, Alice's 0.015 BTC payment to Bob's Cafe in block 277,316, from her wallet into the chain."
    slide_heading: "A blockchain is blocks, each linked to the last"
    tags: ["distributed-systems", "cryptography"]
    confidence: "high"
  - term: "Cryptographic link"
    modifier: null
    aliases: ["hash link", "mathematical link"]
    definition: "A reference from one block to another using a cryptographic hash so later blocks depend on earlier block contents."
    context: "Editing an old block changes its hash and breaks every later link, so nodes reject the edited copy."
    slide_heading: "A blockchain is blocks, each linked to the last"
    tags: ["cryptography", "distributed-systems"]
    confidence: "high"
  - term: "Cryptography"
    modifier: "blockchain pillar"
    aliases: []
    definition: "The mathematical toolkit blockchains use to prove authorization, protect integrity, and make tampering evident."
    context: "The lesson tells analysts to answer 'it can't be hacked' by saying the cryptography is strong and thefts happen at the endpoints: wallets and exchanges."
    slide_heading: "Review: four beliefs, and what breaks each"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Peer-to-peer network"
    modifier: "blockchain pillar"
    aliases: ["P2P network", "peer-to-peer networking", "P2P networking"]
    definition: "A network design where nodes exchange information directly with peers instead of depending on one central server."
    context: "Alice's payment reaches miners' nodes by being relayed from node to node, with no central server."
    slide_heading: "Nodes check a payment before passing it on"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Consensus"
    modifier: "blockchain mechanism"
    aliases: ["consensus mechanism", "consensus mechanisms"]
    definition: "The rule-based process nodes use to agree which transactions and blocks are valid and should become official history."
    context: "The lesson only names proof of work as what decides whose block the network accepts, and leaves how the network chooses between blocks to lesson ③ and the consensus module."
    slide_heading: "A miner packs waiting payments into a block"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Digital signature"
    modifier: null
    aliases: ["digital signatures", "signature", "signatures", "signing"]
    definition: "A cryptographic proof that the holder of a private key authorized a message or transaction."
    context: "Alice's wallet signs her payment with her key, and each node checks that the signature unlocks the coin being spent."
    slide_heading: "Every payment takes the same five steps"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Private key"
    modifier: null
    aliases: ["private keys", "secret key"]
    definition: "The secret credential a user controls to authorize blockchain actions such as signing a transaction."
    context: "A payment's first step is signing in the wallet with the private key that controls the output being spent; lesson ② covers keys."
    slide_heading: "Every payment takes the same five steps"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Cryptographic hash"
    modifier: null
    aliases: ["hash", "hashes", "digital fingerprint"]
    definition: "A function that turns data into a compact fingerprint that changes completely if the input changes."
    context: "The lesson uses hashes to link each block to the one before and to name a transaction by its transaction ID."
    slide_heading: "A blockchain is blocks, each linked to the last"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Tamper-evident"
    modifier: null
    aliases: ["tamper evidence"]
    definition: "A property where unauthorized changes become detectable rather than silently hidden."
    context: "The lesson shows that editing an old block breaks every later hash link, so the edit shows and nodes reject the edited copy."
    slide_heading: "A blockchain is blocks, each linked to the last"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Node"
    modifier: "blockchain network"
    aliases: ["nodes"]
    definition: "An individual computer running blockchain software and participating in relaying, checking, or storing network data."
    context: "Many full nodes each keep and check their own copy of the chain, and each node checks a payment before relaying it to its peers."
    slide_heading: "A blockchain is blocks, each linked to the last"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Gossip protocol"
    modifier: null
    aliases: ["gossip", "peer relay"]
    definition: "A propagation method where each node forwards valid messages to neighboring peers until information spreads through the network."
    context: "Each node checks Alice's payment and relays it to its peers; watching which node relayed it first is only a weak clue to the sender."
    slide_heading: "Nodes check a payment before passing it on"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Proof of Work"
    modifier: "consensus"
    aliases: ["PoW"]
    definition: "A consensus approach where participants prove eligibility to add a block by performing computational work."
    context: "The lesson names proof of work as what decides whose block the network accepts, and leaves the detail to lesson ③."
    slide_heading: "A miner packs waiting payments into a block"
    tags: ["consensus", "bitcoin"]
    confidence: "high"
  - term: "Miner"
    modifier: "blockchain role"
    aliases: ["miners"]
    definition: "A participant that packs waiting transactions into blocks and is paid the block subsidy plus the fees through the block's coinbase transaction."
    context: "The miner of block 277,316 kept the 0.0005 BTC left over from Alice's payment as its fee; miners favor the highest fee for the space."
    slide_heading: "Bitcoin keeps no balances, only unspent coins"
    tags: ["consensus", "bitcoin"]
    confidence: "high"
  - term: "Transaction lifecycle"
    modifier: "blockchain"
    aliases: ["lifecycle of a transaction"]
    definition: "The five steps every payment takes: signed in the wallet, broadcast, held in the mempool, mined into a block, then confirmed by blocks on top."
    context: "The lesson uses the five steps as its spine and shows what an analyst can see at each one."
    slide_heading: "Every payment takes the same five steps"
    tags: ["distributed-systems", "consensus", "cryptography"]
    confidence: "high"
  - term: "Digital asset"
    modifier: "blockchain"
    aliases: ["digital assets"]
    definition: "A blockchain-recorded item of value or ownership that can be transferred through valid transactions."
    context: "The lesson tells analysts to name both the asset and the chain, such as 'USDT on Tron', because one chain records many assets and one asset sits on many chains."
    slide_heading: "A blockchain is a record, not a currency"
    tags: ["real-world"]
    confidence: "high"
  - term: "Wallet software"
    modifier: null
    aliases: ["wallet", "wallets"]
    definition: "Software that helps a user create transactions and apply the private key needed to authorize them."
    context: "Alice's wallet signs her payment and hands it to a node; the keys sit in wallets, off the chain."
    slide_heading: "The chain shows every payment, but no names"
    tags: ["cryptography", "real-world"]
    confidence: "high"
  - term: "Broadcast"
    modifier: "blockchain network"
    aliases: ["broadcasting", "transmission"]
    definition: "The act of sending a signed transaction or block outward to peers so the wider network can learn about it."
    context: "Broadcast is step 2, where nodes check Alice's payment and pass it on; the first node to relay it is only a weak clue to the sender."
    slide_heading: "Every payment takes the same five steps"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Mempool"
    modifier: null
    aliases: ["memory pool", "pending transaction pool"]
    definition: "A node's waiting area for valid transactions that have been seen by the network but not yet included in a block."
    context: "The mempool lives in each node's memory, so a payment that is never mined fades from the network as nodes restart."
    slide_heading: "Every payment takes the same five steps"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "Unconfirmed transaction"
    modifier: null
    aliases: ["unconfirmed", "pending transaction"]
    definition: "A transaction the network has received but that has not yet become part of accepted blockchain history."
    context: "The lesson warns that 'unconfirmed' on an explorer means seen, not settled: unconfirmed is not paid."
    slide_heading: "Every payment takes the same five steps"
    tags: ["distributed-systems", "consensus"]
    confidence: "high"
  - term: "Block assembly"
    modifier: null
    aliases: ["candidate block assembly"]
    definition: "The process where a miner selects waiting transactions and packs them into a block, whose first transaction, the coinbase, pays the miner."
    context: "Block 277,316 holds Alice's payment among 419 transactions; its coinbase paid the miner the 25 BTC subsidy of the time plus the fees."
    slide_heading: "A miner packs waiting payments into a block"
    tags: ["consensus", "distributed-systems"]
    confidence: "high"
  - term: "Immutability"
    modifier: "blockchain"
    aliases: ["immutable"]
    definition: "The practical resistance of accepted blockchain history to unnoticed revision because later blocks depend on earlier hashes."
    context: "The lesson quotes Hyperledger's description of an immutable transaction ledger and shows why: editing an old block breaks every later hash link, so nodes reject the edit."
    slide_heading: "A blockchain is blocks, each linked to the last"
    tags: ["cryptography", "distributed-systems"]
    confidence: "high"
  - term: "Decentralization"
    modifier: null
    aliases: []
    definition: "The distribution of participation, control, and validation across multiple parties rather than one central authority."
    context: "Every full node keeps and checks its own copy of the chain, so there is no central keeper of the record and no central server relaying payments."
    slide_heading: "A blockchain is blocks, each linked to the last"
    tags: ["distributed-systems", "policy"]
    confidence: "high"
  - term: "Bitcoin"
    modifier: "blockchain platform"
    aliases: []
    definition: "A public blockchain whose record of every payment goes back to its first block in 2009; its coin, BTC, shares its name."
    context: "The lesson follows one real Bitcoin payment and contrasts Bitcoin's unspent outputs with the accounts that Ethereum and the course chain keep."
    slide_heading: "The chain shows every payment, but no names"
    tags: ["bitcoin", "real-world"]
    confidence: "high"
  - term: "Ethereum"
    modifier: "blockchain platform"
    aliases: []
    definition: "A blockchain that keeps accounts with balances and records ETH as well as anyone's ERC-20 tokens."
    context: "Ethereum is the lesson's example of one chain carrying many assets, and of the account model that the lab's course chain also uses."
    slide_heading: "A blockchain is a record, not a currency"
    tags: ["ethereum", "real-world"]
    confidence: "high"
  - term: "Hyperledger Fabric"
    modifier: "permissioned ledger platform"
    aliases: ["Fabric"]
    definition: "A permissioned blockchain framework that needs no native cryptocurrency."
    context: "Hyperledger Fabric is the lesson's example of a chain with no coin, which shows that a blockchain and a cryptocurrency are different things."
    slide_heading: "A blockchain is a record, not a currency"
    tags: ["permissioned-ledgers", "real-world"]
    confidence: "high"
  - term: "Pseudonymity"
    modifier: "blockchain privacy"
    aliases: ["pseudonymous"]
    definition: "A privacy model where public addresses appear on-chain instead of real names, but activity can still be linked and analyzed."
    context: "An address is a pseudonym: a name has to come from outside the chain, and once one address is tied to a person, its history is exposed."
    slide_heading: "The chain shows every payment, but no names"
    tags: ["forensics", "policy", "real-world"]
    confidence: "high"
  - term: "Endpoint"
    modifier: "blockchain security"
    aliases: ["endpoints"]
    definition: "A system around the chain, such as a wallet or exchange, where users interact with a blockchain and where thefts happen."
    context: "The lesson explains that thefts happen at the endpoints rather than by breaking the cryptography."
    slide_heading: "Review: four beliefs, and what breaks each"
    tags: ["real-world"]
    confidence: "high"
  - term: "Distributed system"
    modifier: null
    aliases: ["distributed systems"]
    definition: "A system made of multiple independent computers that coordinate over a network to accomplish shared behavior."
    context: "The lesson quotes Hyperledger's description of a blockchain as maintained within a distributed network of peer nodes, each keeping and checking its own copy."
    slide_heading: "A blockchain is blocks, each linked to the last"
    tags: ["distributed-systems"]
    confidence: "high"
