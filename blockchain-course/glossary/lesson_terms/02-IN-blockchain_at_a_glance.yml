terms:
  - term: "Blockchain"
    modifier: null
    aliases: ["blockchains"]
    definition: "A system that lets distributed participants agree on a shared, append-only history of valid state changes without relying on a central referee."
    context: "The lesson frames every later technical component as serving the goal of maintaining one agreed history among independent participants."
    slide_heading: "What is a Blockchain?"
    tags: ["distributed-systems", "consensus"]
    confidence: "high"
  - term: "Shared history"
    modifier: "blockchain"
    aliases: ["shared reality", "shared truth"]
    definition: "The common record of events or state that honest nodes converge on after transactions are validated and accepted."
    context: "The lesson uses shared history to explain why blockchain is fundamentally about coordinated agreement rather than isolated storage."
    slide_heading: "What is a Blockchain?"
    tags: ["distributed-systems", "consensus"]
    confidence: "high"
  - term: "Append-only ledger"
    modifier: null
    aliases: ["append-only database"]
    definition: "A record structure where new entries can be added but past entries are not silently edited or deleted."
    context: "Append-only behavior is one of the baseline properties students need before studying why blockchains are difficult to revise."
    slide_heading: "What is a Blockchain?"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "State machine"
    modifier: "blockchain"
    aliases: ["state machines"]
    definition: "A rule-governed system that moves from one agreed state to the next when valid transactions are applied."
    context: "The lesson introduces state machines so students can see blockchain activity as controlled state transitions rather than just data storage."
    slide_heading: "What is a Blockchain?"
    tags: ["distributed-systems"]
    confidence: "high"
  - term: "State"
