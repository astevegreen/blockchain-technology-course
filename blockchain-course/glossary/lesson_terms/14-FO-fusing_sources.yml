lesson_id: "14-FO"
lesson_title: "Fusing On-Chain Findings with Other Sources"
source_path: "lessons/forensics/14-FO-fusing_sources.qmd"
terms:
  - term: "ICD 203"
    modifier: null
    aliases: []
    definition: "The analytic standard that asks analysts to state their confidence. The course uses it only to standardize its confidence words, not to write formal memos."
    context: "This lesson also uses ICD 203's source-quality factors and its call for analysis informed by all relevant information, with critical gaps named."
    slide_heading: "The chain says what moved; others say who"
    tags: ["forensics", "policy"]
    confidence: "high"
  - term: "Owner's list"
    modifier: null
    aliases: ["owner's published wallet list", "published wallet list", "transparency page"]
    definition: "A service's own published list of its wallets, such as Binance's. It is the owner's word for the exact address, but it covers only what the owner chose to list, usually hot and cold wallets rather than customer deposit addresses."
    context: "Absence from an owner's list is weaker evidence than presence on it, because the list is incomplete by design."
    slide_heading: "The chain says what moved; others say who"
    tags: ["forensics"]
    confidence: "high"
  - term: "Government release"
    modifier: null
    aliases: ["government listing", "government designation release"]
    definition: "An official statement that names an actor or service, often with addresses, such as OFAC's Hydra addresses or the FBI's Bybit notice. It rarely states its basis, and lists change, so cite its date."
    context: "A government listing for the exact address is one strong line: Moderate on its own."
    slide_heading: "The chain says what moved; others say who"
    tags: ["forensics", "policy"]
    confidence: "high"
  - term: "Vendor label"
    modifier: null
    aliases: ["vendor tag", "vendor report", "vendor labels"]
    definition: "A label or report from an analytics firm naming who holds an address. It adds speed and coverage, but its basis is often unstated and it may repeat another source."
    context: "One vendor tag with no stated basis is one unverified label: Low on its own."
    slide_heading: "The chain says what moved; others say who"
    tags: ["forensics"]
    confidence: "high"
  - term: "Exchange record"
    modifier: null
    aliases: ["account record", "exchange records"]
    definition: "An exchange's records of who opened and used an account. It is usually the strongest kind of line an analyst receives, but it records what the customer typed, so the name on it can be false."
    context: "In the Bitfinex case the records tied deposits, logins and withdrawals to accounts opened under fictitious identities."
    slide_heading: "The chain says what moved; others say who"
    tags: ["forensics"]
    confidence: "high"
  - term: "Off-chain identifier"
    modifier: null
    aliases: ["off-chain identifiers"]
    definition: "A link from a service to a person found off the chain, such as an alias, an IP analysis or a forum post. Aliases can be shared or planted."
    context: "Bitcoin Fog's launch alias and an IP analysis, and Samourai's darknet-forum marketing, are the lesson's examples."
    slide_heading: "The chain says what moved; others say who"
    tags: ["forensics", "privacy"]
    confidence: "high"
  - term: "Issuer action"
    modifier: null
    aliases: ["issuer actions"]
    definition: "Something a token issuer does to an address, such as a freeze. It shows that someone with records acted on this address on this date, but rarely says why."
    context: "Tether's freeze of $28M USDT at Garantex is the lesson's example."
    slide_heading: "The chain says what moved; others say who"
    tags: ["forensics", "stablecoins"]
    confidence: "high"
  - term: "Independent line of evidence"
    modifier: null
    aliases: ["kind of evidence", "kinds of evidence", "independent line", "line of evidence"]
    definition: "Support for an assessment that comes from a different kind of evidence than the rest. Counting these kinds, not names or labels, sets the confidence word."
    context: "In fusing, independent means another kind of evidence from another origin; an echo of a source already counted is not a second line."
    slide_heading: "Six kinds of source, and what each adds"
    tags: ["forensics"]
    confidence: "high"
  - term: "Garantex"
    modifier: null
    aliases: []
    definition: "A sanctioned Russian crypto exchange where Tether froze $28M in USDT in March 2025."
    context: "Treasury sanctioned it on 5 April 2022; after the freeze Garantex suspended its services, the lesson's example of an issuer action."
    slide_heading: "Six kinds of source, and what each adds"
    tags: ["forensics", "real-world", "stablecoins", "policy"]
    confidence: "high"
  - term: "Bitcoin Fog"
    modifier: null
    aliases: []
    definition: "A bitcoin mixer launched in 2011 by someone calling himself \"Akemashite Omedetou\". An IP analysis tied IP addresses connected to Sterlingov to the service."
    context: "It is the lesson's example of an off-chain identifier; the Bitfinex launderers also used it."
    slide_heading: "Six kinds of source, and what each adds"
    tags: ["forensics", "privacy", "bitcoin"]
    confidence: "high"
  - term: "Source-quality factors"
    modifier: null
    aliases: ["ICD 203 source factors", "source factors"]
    definition: "ICD 203's questions for judging a source before it counts: accuracy and completeness, possible denial and deception, age and continued currency, source access and validation, and motivation and possible bias. A line that fails them does not move the confidence word."
    context: "The same factors apply to every source, classified or not."
    slide_heading: "Judge each source before you count it"
    tags: ["forensics", "policy"]
    confidence: "high"
  - term: "Denial and deception"
    modifier: null
    aliases: ["possible denial and deception"]
    definition: "The ICD 203 factor that asks whether the subject could have planted a source, such as a fake identity or a borrowed alias."
    context: "Bitfinex's accounts opened under fictitious identities show denial and deception in an exchange record."
    slide_heading: "Judge each source before you count it"
    tags: ["forensics", "policy"]
    confidence: "high"
  - term: "Echo"
    modifier: null
    aliases: ["echoes", "echo rule"]
    definition: "A source that agrees with another only because it copied it, so the two are one line. Count the origins, not the labels."
    context: "An open label set built from OFAC's addresses, a vendor tag drawn from a court record, or a press story quoting a release are all echoes."
    slide_heading: "An echo is not a second line"
    tags: ["forensics"]
    confidence: "high"
  - term: "Intelligence-based clustering"
    modifier: null
    aliases: []
    definition: "Clustering that draws on data leaks, court documents and data partnerships rather than on-chain heuristics. A vendor tag built this way may be a court record you have already counted."
    context: "The D.C. Circuit's Sterlingov opinion describes Reactor's clustering as co-spend, a behavioral heuristic and intelligence-based clustering."
    slide_heading: "An echo is not a second line"
    tags: ["forensics"]
    confidence: "high"
  - term: "Reactor"
    modifier: null
    aliases: ["Chainalysis Reactor"]
    definition: "A commercial blockchain analytics platform whose clustering, per the D.C. Circuit's Sterlingov opinion, rests on co-spend, a behavioral heuristic and intelligence-based clustering."
    context: "The lesson names it for awareness, to show why a vendor tag may echo a source already counted."
    slide_heading: "An echo is not a second line"
    tags: ["forensics"]
    confidence: "medium"
  - term: "Deposit address"
    modifier: null
    aliases: ["deposit addresses", "exchange deposit address"]
    definition: "An address a service gives a customer to pay into, which sweeps its funds into the service's hot wallet. Seeing the sweep says the address feeds a service, not which one."
    context: "Owners list hot and cold wallets, not customer deposit addresses, so the hot wallet is where the list and the chain meet."
    slide_heading: "How each source moves the confidence word"
    tags: ["forensics"]
    confidence: "high"
  - term: "Sweeping"
    modifier: null
    aliases: ["sweep", "sweeps"]
    definition: "Moving the funds that arrive at a deposit address on into one wallet, typically the service's hot wallet."
    context: "In the lesson's worked example, T-addr sweeping into a wallet the exchange lists is what lifts the confidence to High."
    slide_heading: "How each source moves the confidence word"
    tags: ["forensics"]
    confidence: "high"
  - term: "AddedBlackList"
    modifier: null
    aliases: ["addBlackList"]
    definition: "The event USDT's contract on Tron emits when its addBlackList function freezes an address. It lets you read who was frozen, and when, yourself."
    context: "An AddedBlackList event supports a High statement that USDT at the address was blacklisted on that date, not why."
    slide_heading: "A freeze is a source: read it narrowly"
    tags: ["forensics", "stablecoins"]
    confidence: "high"
  - term: "Classified holdings"
    modifier: null
    aliases: ["classified reporting"]
    definition: "Classified reporting that may bear on an assessment. In an unclassified class it is taught as a process only: it is judged with the same factors, counted as one line, and checked for echoes like any other source."
    context: "An unclassified assessment rests only on lines its reader may see, and names the gap when it matters."
    slide_heading: "Classified holdings: the process only"
    tags: ["forensics", "policy"]
    confidence: "high"
  - term: "Critical information gap"
    modifier: null
    aliases: ["information gap", "critical gaps"]
    definition: "Something the analysis needed but did not have. ICD 203 asks analysts to identify and address these gaps."
    context: "An unclassified assessment that cannot rest on classified lines names the gap when it matters."
    slide_heading: "Classified holdings: the process only"
    tags: ["forensics", "policy"]
    confidence: "high"
  - term: "Alternative hypotheses"
    modifier: null
    aliases: ["alternative hypothesis"]
    definition: "Other plausible explanations for what the sources show, which ICD 203 asks analysts to identify and weigh."
    context: "When a vendor tag and an owner's list disagree, the possible reasons are listed and tested, starting with the dates."
    slide_heading: "When sources disagree, say so"
    tags: ["forensics", "policy"]
    confidence: "high"
  - term: "Indicator"
    modifier: null
    aliases: ["indicators"]
    definition: "Something that, if detected, would change a judgment. ICD 203 asks analysts to name them."
    context: "In the disagreement example, a sweep into a listed wallet is the indicator that would raise the confidence."
    slide_heading: "When sources disagree, say so"
    tags: ["forensics", "policy"]
    confidence: "high"
