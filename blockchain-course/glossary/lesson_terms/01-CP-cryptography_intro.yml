terms:
  - term: "Cryptography"
    modifier: "mathematical security"
    aliases: ["crypto"]
    definition: "The study of mathematical techniques for securing information and proving authenticity when adversaries may observe, alter, or impersonate activity."
    context: "The lesson frames cryptography as a practical trust technology that supports secure communication, signatures, and blockchain protocols."
    slide_heading: "Cryptography: From Obscurity to Mathematical Security"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Security through obscurity"
    modifier: null
    aliases: ["obscurity"]
    definition: "A fragile security model that depends on keeping the method itself secret rather than relying on openly analyzable assumptions and keys."
    context: "The opening history contrasts older hidden methods with modern cryptography's reliance on public algorithms and mathematical reasoning."
    slide_heading: "Cryptography: From Obscurity to Mathematical Security"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Mathematical security"
    modifier: null
    aliases: ["security through mathematics"]
    definition: "Security based on precise definitions, assumptions, and proofs rather than on hiding how the system works."
    context: "This shift explains why modern blockchain systems can ask participants to verify rules instead of trusting secret procedures."
    slide_heading: "Cryptography: From Obscurity to Mathematical Security"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Confidentiality"
    modifier: null
    aliases: []
    definition: "A security property that keeps information hidden from parties who are not authorized to read it."
    context: "The lesson presents confidentiality as the classical goal of cryptography, then shows that modern systems need additional guarantees."
    slide_heading: "What Is Cryptography?"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Integrity"
    modifier: null
    aliases: ["data integrity"]
    definition: "A security property that lets users detect whether data or messages have been changed."
    context: "Integrity matters especially for blockchain because participants must verify that records and blocks have not been tampered with."
    slide_heading: "What Is Cryptography?"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Authenticity"
    modifier: null
    aliases: ["authentication"]
    definition: "A security property that supports checking whether data or a message came from the claimed source."
    context: "The lesson distinguishes authenticity from secrecy because blockchain transactions need authorization more than hidden content."
    slide_heading: "What Is Cryptography?"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Non-repudiation"
    modifier: null
    aliases: []
    definition: "A security property that makes it difficult for a party to plausibly deny an action such as signing a message."
    context: "Non-repudiation helps students understand why digital signatures can bind actions to key holders."
    slide_heading: "What Is Cryptography?"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Adversary"
    modifier: null
    aliases: ["attacker"]
    definition: "A modeled opponent who may try to read, alter, forge, replay, or otherwise break a cryptographic system."
    context: "The lesson defines cryptography in the presence of adversaries so security claims are evaluated against active threats."
    slide_heading: "What Is Cryptography?"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Trustless coordination"
    modifier: null
    aliases: []
    definition: "Coordination among parties who do not need personal trust because cryptographic checks and protocol rules make agreement verifiable."
    context: "This idea connects cryptography to blockchain's promise of agreement among people or nodes that do not know each other."
