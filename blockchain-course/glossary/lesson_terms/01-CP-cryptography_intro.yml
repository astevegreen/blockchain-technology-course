  - term: "Secret key"
    modifier: null
    aliases: ["secret keys", "key"]
    definition: "A private value used with a public algorithm to control encryption, authentication, signing, or other cryptographic behavior."
    context: "The lesson contrasts secret methods with public algorithms plus secret keys as a modern security pattern."
    slide_heading: "From Secrecy to Integrity"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Set"
    modifier: "mathematics"
    aliases: ["sets"]
    definition: "A collection of distinct elements used to describe spaces such as all possible keys or all possible messages."
    context: "Sets give students the notation needed to read cryptographic definitions precisely."
