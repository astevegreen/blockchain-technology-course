    tags: ["cryptography"]
    confidence: "high"
  - term: "One-way function"
    modifier: null
    aliases: ["one-way"]
    definition: "A function that is easy to compute in the forward direction but infeasible to invert with available algorithms and resources."
    context: "One-way behavior underlies the intuition behind hashes, signatures, and many hardness-based cryptographic constructions."
    slide_heading: "Sets and Functions"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Bit string"
    modifier: null
    aliases: ["bit strings"]
    definition: "A sequence of 0s and 1s used as the standard representation of digital inputs, outputs, keys, and messages."
    context: "The notes explain that cryptographic algorithms are often described as functions over bit strings."
    slide_heading: "Sets and Functions"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Security proof"
    modifier: null
    aliases: ["proof", "proofs"]
    definition: "A formal argument that a cryptographic claim follows from stated assumptions and logical rules."
    context: "Students are taught to treat cryptographic security as an argument from assumptions rather than a collection of convincing examples."
    slide_heading: "Proofs and Reasoning"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Reduction"
    modifier: "cryptographic proof"
    aliases: ["security reduction"]
    definition: "A logical transformation showing that breaking one scheme would also solve another problem believed to be hard."
    context: "The notes introduce reductions as a common way cryptographers connect system security to underlying hardness assumptions."
    slide_heading: "Proofs and Reasoning"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Probability space"
    modifier: null
    aliases: ["sample space"]
    definition: "A mathematical model of possible outcomes and events used to reason about uncertainty."
    context: "The probability refresher prepares students to understand randomness, attacker success rates, and security claims."
    slide_heading: "Probability Refresher: Events and Outcomes"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Success probability"
    modifier: null
    aliases: ["adversary success probability"]
    definition: "The chance that an adversary succeeds at a specified attack or guessing task."
    context: "The lesson uses success probability to show how cryptographic security statements quantify attacker advantage."
    slide_heading: "Probability Refresher: Events and Outcomes"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Negligible advantage"
    modifier: null
    aliases: ["negligible probability"]
    definition: "An advantage over random guessing so small that it is treated as practically unusable by any efficient adversary."
    context: "The lesson's callout previews modern proof language where secure schemes leak no meaningful advantage beyond chance."
    slide_heading: "Probability Refresher: Events and Outcomes"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Independence"
    modifier: "probability"
    aliases: ["independent events"]
    definition: "A relationship where the outcome of one event does not change the probability of another event."
    context: "Independence matters because hidden correlations in random outputs can create exploitable patterns."
    slide_heading: "Probability Refresher: Independence & Random Variables"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Random variable"
    modifier: null
    aliases: ["random variables"]
    definition: "A numeric value assigned to the outcome of a random process."
    context: "Random variables support later reasoning about entropy, distributions, and adversarial success."
    slide_heading: "Probability Refresher: Independence & Random Variables"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Entropy"
    modifier: "randomness"
    aliases: []
    definition: "A measure of how much unpredictability a source or process provides."
    context: "The lesson emphasizes entropy because weak or biased randomness can break keys, nonces, and signatures."
    slide_heading: "Probability Refresher: Independence & Random Variables"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Randomness"
    modifier: null
    aliases: ["true randomness"]
    definition: "Unpredictability with no discernible pattern from the perspective of an observer or attacker."
    context: "Randomness is presented as essential for key generation, nonces, salts, mining puzzles, and protocol fairness."
    slide_heading: "Probability Refresher: Events and Outcomes"
    tags: ["cryptography", "consensus"]
    confidence: "high"
  - term: "Nonce"
    modifier: null
    aliases: ["nonces"]
    definition: "A one-time value used to provide freshness and prevent dangerous reuse in cryptographic operations."
    context: "The lesson uses nonces to show how randomness supports keys, signatures, blockchain mining, and anti-replay behavior."
    slide_heading: "What Is Randomness?"
    tags: ["cryptography", "bitcoin"]
    confidence: "high"
  - term: "Salt"
    modifier: null
    aliases: ["salts"]
    definition: "An added random value that makes otherwise similar inputs produce different cryptographic results."
    context: "Salt creation appears alongside nonce creation as a practical use of randomness in secure systems."
    slide_heading: "What Is Randomness?"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Physical entropy"
    modifier: null
    aliases: ["physical entropy source", "entropy source"]
    definition: "Unpredictability gathered from real-world physical processes such as thermal noise, user input, or network jitter."
    context: "The lesson explains that deterministic computers often need physical sources to seed secure randomness."
    slide_heading: "Sources of Randomness"
    tags: ["cryptography", "real-world"]
    confidence: "high"
  - term: "Seed"
    modifier: "randomness"
    aliases: ["random seed"]
    definition: "The initial input that determines the output sequence of a pseudorandom generator."
    context: "Seed quality is critical because if attackers can predict the seed, they can compromise downstream random outputs."
    slide_heading: "Sources of Randomness"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Pseudorandom generator"
    modifier: null
    aliases: ["PRG", "pseudorandom number generator", "PRNG"]
    definition: "An algorithm that expands a short random seed into a longer sequence that should appear random to efficient observers."
    context: "PRGs let practical cryptographic systems use limited true entropy while still producing enough randomness for operations."
    slide_heading: "Sets and Functions"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Indistinguishability"
    modifier: "cryptography"
    aliases: ["computational indistinguishability", "indistinguishable"]
    definition: "A property where no efficient algorithm can reliably tell one distribution, such as PRG output, from another, such as true randomness."
    context: "The lesson uses indistinguishability to connect randomness, ciphertexts, PRGs, and adversary limits."
    slide_heading: "Probability Refresher: Events and Outcomes"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Unpredictability"
    modifier: "PRG property"
    aliases: ["predictability"]
    definition: "A property where seeing part of a sequence does not make the next value feasibly guessable."
    context: "The PRG discussion emphasizes that deterministic output can still be secure when attackers cannot predict future values."
    slide_heading: "Probability Refresher: Independence & Random Variables"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Polynomial time"
    modifier: null
    aliases: ["efficient algorithm"]
    definition: "A runtime that grows by a polynomial function of input size and is treated as the practical side of cryptographic feasibility."
    context: "The lesson contrasts polynomial time with exponential time to explain what counts as efficient for algorithms and adversaries."
    slide_heading: "Desirable Properties of PRGs"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Computational hardness"
    modifier: null
