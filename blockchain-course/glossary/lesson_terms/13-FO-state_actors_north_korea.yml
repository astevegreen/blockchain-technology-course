lesson_id: "13-FO"
lesson_title: "State Actors: North Korea in Depth"
source_path: "lessons/forensics/13-FO-state_actors_north_korea.qmd"
terms:
  - term: "Government attribution"
    modifier: null
    aliases: ["state attribution", "attribution to a state"]
    definition: "A government's public statement naming who carried out a theft, such as the FBI naming North Korea for Bybit. The analyst quotes it with the agency and date and does not attribute a state from the chain alone."
    context: "A government statement plus matching on-chain links is the strongest pair of lines an analyst has."
    slide_heading: "You characterize; the government attributes"
    tags: ["forensics", "policy"]
    confidence: "high"
  - term: "Vendor assessment"
    modifier: null
    aliases: ["firm's assessment", "vendor's assessment", "analytics firm assessment"]
    definition: "An analytics firm's judgment of who likely did something, built from behavior and timing it observed. Quote it as the firm's view with its date, and give it only the confidence its lines support; it is not a government attribution."
    context: "TRM's and Elliptic's North Korea link for Drift are vendor assessments; no government had spoken."
    slide_heading: "You characterize; the government attributes"
    tags: ["forensics"]
    confidence: "high"
  - term: "State actor"
    modifier: null
    aliases: ["state actors", "state-sponsored actor", "state-sponsored hacking group"]
    definition: "An actor that steals for a government rather than for profit. Its patience, backing and scale change the trace: preparation can sit on chain days before a theft, and laundering runs at volume across many addresses."
    context: "The chain cannot show a state actor's purpose; that comes from government reporting."
    slide_heading: "A state actor steals to fund a state"
    tags: ["forensics", "policy", "real-world"]
    confidence: "high"
  - term: "Durable nonce account"
    modifier: null
    aliases: ["durable nonce", "durable nonce accounts"]
    definition: "An account used so that signers' approvals can be sent later rather than at once. At Drift, a Solana protocol, the attacker created them between 23 and 30 March 2026, about a week before the theft."
    context: "They show how a state actor's preparation can sit on chain days before the theft."
    slide_heading: "A state actor steals to fund a state"
    tags: ["forensics", "security", "real-world"]
    confidence: "medium"
  - term: "Bybit hack"
    modifier: null
    aliases: ["Bybit theft"]
    definition: "The theft of about $1.5 billion from the Bybit exchange on or about 21 February 2025, which the FBI attributed to North Korea's TraderTraitor actors. The thieves changed the Safe{Wallet} web page the signers used, then swapped stolen tokens for ETH and moved most of it to bitcoin."
    context: "It was most of North Korea's record 2025 theft total and is the lesson's main example of the laundering playbook."
    slide_heading: "A state actor steals to fund a state"
    tags: ["forensics", "real-world", "ethereum"]
    confidence: "high"
  - term: "Drift theft"
    modifier: null
    aliases: ["Drift hack"]
    definition: "The 1 April 2026 theft of about $285 million from Drift, a Solana exchange protocol, with no bug in its code. Two of five Security Council signers pre-signed transactions that handed over admin control, and 31 withdrawals followed in about 12 minutes."
    context: "Its North Korea link comes from analytics firms, not a government, so it teaches the difference between an assessment and an attribution."
    slide_heading: "A state actor steals to fund a state"
    tags: ["forensics", "real-world", "security"]
    confidence: "high"
  - term: "Garantex"
    modifier: null
    aliases: []
    definition: "A sanctioned Russian crypto exchange where Tether froze $28M in USDT in March 2025."
    context: "The lesson uses it to show that Russia's sanctioned exchanges meet the same control points as North Korea's laundering."
    slide_heading: "Blockchain cuts both ways for state power"
    tags: ["forensics", "real-world", "stablecoins", "policy"]
    confidence: "high"
  - term: "APT38"
    modifier: null
    aliases: []
    definition: "A government name for North Korean hackers, used with Lazarus Group in the FBI's attribution of the Ronin theft. Quote the name, the agency and the date; never coin one from a trace."
    context: "The analyst borrows these names because they rest on government sources the analyst does not see."
    slide_heading: "The names come from the government"
    tags: ["forensics", "security", "real-world"]
    confidence: "medium"
  - term: "TraderTraitor"
    modifier: null
    aliases: []
    definition: "The name the FBI used on 26 February 2025 for the North Korean actors behind the Bybit theft."
    context: "Statements use different names for North Korea's actors; quote the one your source uses."
    slide_heading: "The names come from the government"
    tags: ["forensics", "security", "real-world"]
    confidence: "high"
  - term: "Harmony Horizon bridge hack"
    modifier: null
    aliases: ["Horizon bridge hack", "Harmony's Horizon bridge"]
    definition: "A 2022 theft from Harmony's Horizon bridge that the FBI said on 23 January 2023 the Lazarus Group carried out. Over $96M of its proceeds went through Tornado Cash."
    context: "It is one row in the lesson's timeline of government statements and of North Korea's laundering routes."
    slide_heading: "The names come from the government"
    tags: ["forensics", "real-world"]
    confidence: "high"
  - term: "Safe{Wallet}"
    modifier: null
    aliases: ["Safe Wallet"]
    definition: "The wallet web interface Bybit's signers used. A developer's machine was compromised, malicious JavaScript was placed in its storage bucket, and the signers' browsers loaded it, which altered the transaction they signed."
    context: "Four of the five steps of the Bybit theft happened off chain through Safe{Wallet}, so the chain shows only the last."
    slide_heading: "Bybit: the way in was the wallet's website"
    tags: ["forensics", "security", "ethereum"]
    confidence: "high"
  - term: "masterCopy"
    modifier: null
    aliases: ["master copy"]
    definition: "The value in slot 0 of Bybit's Safe cold wallet. The cold wallet delegatecalled a contract that rewrote it to an address the thieves chose, after which they controlled the wallet."
    context: "Rewriting the masterCopy is the one step of the Bybit theft visible on chain, read in the day 8 lab."
    slide_heading: "Bybit: the way in was the wallet's website"
    tags: ["ethereum", "forensics", "security"]
    confidence: "medium"
  - term: "THORChain"
    modifier: null
    aliases: []
    definition: "A cross-chain swap service through which most of the Bybit Ether that reached Bitcoin was moved, breaking the trail at a chain crossing."
    context: "It is part of the days-long stage of Bybit's laundering."
    slide_heading: "Bybit: out of freezable tokens first, then to Bitcoin"
    tags: ["forensics", "real-world"]
    confidence: "high"
  - term: "eXch"
    modifier: null
    aliases: []
    definition: "A swap service that did not freeze, which Elliptic reported Bybit's thieves used with other services to convert most of the stolen Ether to bitcoin."
    context: "It shows the playbook's preference for services that will not freeze funds."
    slide_heading: "Bybit: out of freezable tokens first, then to Bitcoin"
    tags: ["forensics", "real-world"]
    confidence: "high"
  - term: "Laundering playbook"
    modifier: null
    aliases: ["North Korea's playbook"]
    definition: "The shape North Korea's laundering repeats across cases: out of freezable tokens, mix or swap, cross chains, then cash out. The services change as each is designated or shut; the shape stays."
    context: "Other thieves share the shape, so a match to the playbook is one line of evidence, not an identity."
    slide_heading: "One playbook across North Korea's cases"
    tags: ["forensics", "real-world"]
    confidence: "high"
  - term: "Sinbad"
    modifier: null
    aliases: ["Sinbad.io"]
    definition: "A mixer the U.S. Treasury designated in November 2023 as one North Korea used."
    context: "It shows the playbook switching to a new service after Blender.io and Tornado Cash were designated."
    slide_heading: "One playbook across North Korea's cases"
    tags: ["forensics", "privacy", "policy"]
    confidence: "high"
  - term: "Delisting"
    modifier: null
    aliases: ["sanctions delisting"]
    definition: "Removing a name from a sanctions list. Tornado Cash was designated in August 2022 and delisted on 21 March 2025, so say both dates when you call it sanctioned."
    context: "Exposure statements about Tornado Cash give the designation window."
    slide_heading: "One playbook across North Korea's cases"
    tags: ["policy", "forensics"]
    confidence: "high"
  - term: "Drift Security Council"
    modifier: null
    aliases: []
    definition: "Drift's five signers who approve admin actions. Two of them pre-signed transactions that hid admin authority, which handed control to the attacker."
    context: "As at Bybit, the signers approved something other than what they thought."
    slide_heading: "Drift: a week to prepare, twelve minutes to steal"
    tags: ["forensics", "security"]
    confidence: "high"
  - term: "Pre-signed transaction"
    modifier: null
    aliases: ["pre-signed transactions", "pre-approved transaction"]
    definition: "A transaction a signer approves in advance to be sent later. At Drift, pre-signed transactions hid admin actions and handed over admin control on the day of the theft."
    context: "Durable nonce accounts let the attacker hold these approvals for later."
    slide_heading: "Drift: a week to prepare, twelve minutes to steal"
    tags: ["forensics", "security"]
    confidence: "high"
  - term: "Sanctions exposure"
    modifier: null
    aliases: ["exposure statement"]
    definition: "The observable fact that funds from a listed or designated address reached a service, stated with the designation or attribution and its date. Whether that broke a sanction is someone else's call."
    context: "Say \"Address X received $Y from the Bybit theft addresses the FBI listed on 26 Feb 2025\", not \"the service violated sanctions\"."
    slide_heading: "Report exposure; leave \"violation\" to others"
    tags: ["forensics", "policy"]
    confidence: "high"
