lesson_id: "05-BF"
lesson_title: "Bitcoin — Wallet Types"
source_path: "lessons/bitcoin/05-BF-wallet_types.qmd"
terms:
  - term: "Hosted wallet"
    modifier: null
    aliases: ["hosted wallets"]
    definition: "FinCEN's name for a custodial wallet: a third party such as an exchange holds the keys and executes transactions for the user."
    context: "The lesson uses the hosted label to show that custody decides whether a business holds records of the user's activity."
    slide_heading: "Whoever holds the key controls the coins"
    tags: ["bitcoin", "policy", "forensics"]
    confidence: "high"
  - term: "Unhosted wallet"
    modifier: null
    aliases: ["unhosted wallets", "self-hosted wallet", "non-custodial wallet"]
    definition: "A self-custody wallet where the user holds the keys on their own computer, phone or device and needs no third party to transact."
    context: "With no business holding the keys, the chain and the user's own device are the record, and lost keys mean lost coins."
    slide_heading: "Whoever holds the key controls the coins"
    tags: ["bitcoin", "policy", "forensics"]
    confidence: "high"
  - term: "Deposit address"
    modifier: null
    aliases: ["deposit addresses", "exchange deposit address"]
    definition: "An address an exchange assigns to one customer for deposits, while the exchange itself holds its key."
    context: "A deposit to an exchange address is where the on-chain trail meets the exchange's own records."
    slide_heading: "Whoever holds the key controls the coins"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Sweeping"
    modifier: null
    aliases: ["sweep", "sweeps", "deposit sweep"]
    definition: "An exchange moving the coins sent to customers' deposit addresses into other wallets it controls."
    context: "Sweeping is one way an exchange runs its wallets; afterwards the customers' coins sit pooled together."
    slide_heading: "Whoever holds the key controls the coins"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Omnibus account"
    modifier: null
    aliases: ["omnibus accounts", "omnibus wallet"]
    definition: "A wallet where an exchange holds many customers' coins together, so on chain they appear as one pooled balance."
    context: "Pooled custody means the chain shows the exchange's flows, while who owns what is only in the platform's books."
    slide_heading: "Whoever holds the key controls the coins"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Internal transfer"
    modifier: null
    aliases: ["internal transfers", "off-chain transfer"]
    definition: "A payment between two customers of the same exchange that the platform records on its own books and that may never reach the chain."
    context: "The lesson warns that custodial activity can leave no on-chain trace, so the exchange's books are the only record."
    slide_heading: "Whoever holds the key controls the coins"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Electrum"
    modifier: null
    aliases: ["Electrum wallet"]
    definition: "Open-source self-custody wallet software that creates a user's keys and addresses."
    context: "The lesson names Electrum as an example of software wallets that subjects use; the next lesson compares it with other open-source wallets."
    slide_heading: "Whoever holds the key controls the coins"
    tags: ["bitcoin", "real-world"]
    confidence: "high"
  - term: "Sparrow"
    modifier: null
    aliases: ["Sparrow wallet"]
    definition: "Open-source self-custody wallet software that creates a user's keys and addresses."
    context: "The lesson names Sparrow as an example of software wallets that subjects use; the next lesson compares it with other open-source wallets."
    slide_heading: "Whoever holds the key controls the coins"
    tags: ["bitcoin", "real-world"]
    confidence: "high"
  - term: "Trezor"
    modifier: null
    aliases: []
    definition: "A hardware wallet that keeps the key offline and signs inside the device."
    context: "The lesson names Trezor as an example of self-custody hardware, named for awareness and not as an endorsement."
    slide_heading: "Whoever holds the key controls the coins"
    tags: ["bitcoin", "security", "real-world"]
    confidence: "high"
  - term: "Cold wallet"
    modifier: null
    aliases: ["cold wallets", "cold storage"]
    definition: "A wallet whose key is not connected to the internet, such as an air-gapped computer or a hardware wallet, built to hold high-value funds securely at rest; a person must act, such as pressing a button, to sign."
    context: "One transaction cannot show whether a hot or cold wallet signed it; calling a wallet cold is an inference from behaviour over time, at low confidence."
    slide_heading: "Hot or cold says where the key lives"
    tags: ["bitcoin", "security", "forensics"]
    confidence: "high"
  - term: "Air-gapped computer"
    modifier: null
    aliases: ["air-gapped", "air gap", "air-gapped wallet"]
    definition: "A computer kept off the internet so the keys it holds stay offline; one form of cold wallet."
    context: "The lesson lists air-gapped computers alongside hardware wallets as places cold keys live."
    slide_heading: "Hot or cold says where the key lives"
    tags: ["bitcoin", "security"]
    confidence: "high"
  - term: "Fresh address"
    modifier: null
    aliases: ["fresh addresses", "new address per payment"]
    definition: "A new address a wallet hands out for each payment or customer, so one wallet ends up holding outputs at many addresses."
    context: "Because the analyst sees addresses, never the wallet, fresh addresses spread one balance across many addresses that share nothing visible on chain."
    slide_heading: "A wallet manages many keys and addresses"
    tags: ["bitcoin", "privacy", "forensics"]
    confidence: "high"
  - term: "BIP39"
    modifier: null
    aliases: ["BIP 39", "BIP39 mnemonic", "mnemonic code", "mnemonic"]
    definition: "The standard that turns 128 to 256 random bits plus a checksum into a 12- to 24-word seed phrase from a 2048-word list, then runs the words through 2048 rounds of HMAC-SHA512 to make a 512-bit seed."
    context: "The lesson shows that the words encode random numbers, not a password the user chose, and that anyone with them can restore the wallet."
    slide_heading: "A seed phrase is the whole wallet as words"
    tags: ["bitcoin", "cryptography"]
    confidence: "high"
  - term: "Passphrase"
    modifier: null
    aliases: ["BIP39 passphrase", "seed passphrase"]
    definition: "An optional extra word or phrase that changes the seed made from a seed phrase; every passphrase opens a valid wallet, but only the right one opens the funded wallet."
    context: "A found seed phrase that opens an empty wallet may need its passphrase, which the standard presents as plausible deniability."
    slide_heading: "A seed phrase is the whole wallet as words"
    tags: ["bitcoin", "security", "forensics"]
    confidence: "high"
  - term: "HD wallet"
    modifier: null
    aliases: ["hierarchical deterministic wallet", "HD wallets", "BIP32", "BIP 32"]
    definition: "A hierarchical deterministic wallet: it derives an unlimited number of key pairs from one seed as a tree, inside the wallet software, with no registry or issuer."
    context: "One backup restores every address the wallet ever used, and nothing on chain records the tree."
    slide_heading: "One seed grows a whole tree of keys"
    tags: ["bitcoin", "cryptography"]
    confidence: "high"
  - term: "External chain"
    modifier: null
    aliases: ["receiving chain"]
    definition: "The branch of an HD wallet account that makes receiving addresses; change level 0 in the derivation path."
    context: "Receiving and change addresses come from two separate branches of the same account."
    slide_heading: "One seed grows a whole tree of keys"
    tags: ["bitcoin"]
    confidence: "high"
  - term: "Internal chain"
    modifier: null
    aliases: ["change chain"]
    definition: "The branch of an HD wallet account that makes change addresses; change level 1 in the derivation path."
    context: "The published test addresses for receiving and change differ only at this level, yet share nothing visible on chain."
    slide_heading: "One seed grows a whole tree of keys"
    tags: ["bitcoin"]
    confidence: "high"
  - term: "Native SegWit"
    modifier: null
    aliases: ["native SegWit address", "P2WPKH"]
    definition: "The address format whose single-key addresses (P2WPKH) begin bc1q; in a derivation path, purpose 84' selects it."
    context: "The lesson's example wallet derives native SegWit addresses from the BIP84 test phrase."
    slide_heading: "One seed grows a whole tree of keys"
    tags: ["bitcoin"]
    confidence: "high"
  - term: "Derivation path"
    modifier: null
    aliases: ["derivation paths", "BIP44", "BIP 44", "BIP44 path"]
    definition: "A key's address in an HD wallet's tree, written m / purpose' / coin_type' / account' / change / address_index, for example m/84'/0'/0'/0/0."
    context: "The same seed in two wallets that use different paths shows different addresses, so the path matters when restoring a found seed."
    slide_heading: "The path names coin, account, chain and index"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "BIP84"
    modifier: null
    aliases: ["BIP 84", "purpose 84'"]
    definition: "The derivation scheme for native SegWit (P2WPKH) addresses, whose paths start m/84'; it also publishes a test phrase and its first addresses."
    context: "A wallet that does not read this address type finds no accounts, so a funded seed can look empty in it."
    slide_heading: "The path names coin, account, chain and index"
    tags: ["bitcoin"]
    confidence: "high"
  - term: "Coin type"
    modifier: null
    aliases: ["coin_type"]
    definition: "The derivation-path level that names the coin: 0' for Bitcoin and 1' for testnet."
    context: "The lesson reads the coin type as one level of the example path m/84'/0'/0'/0/0."
    slide_heading: "The path names coin, account, chain and index"
    tags: ["bitcoin"]
    confidence: "high"
  - term: "Address index"
    modifier: null
    aliases: ["address_index"]
    definition: "The last derivation-path level: which address on the receiving or change chain, starting at 0."
    context: "The test phrase's first receiving and first change addresses are index 0 on each chain."
    slide_heading: "The path names coin, account, chain and index"
    tags: ["bitcoin"]
    confidence: "high"
  - term: "Gap limit"
    modifier: null
    aliases: ["address gap limit"]
    definition: "The rule that a restoring wallet stops looking after 20 unused addresses in a row."
    context: "A wallet that skipped more than 20 addresses can look empty after a restore, so an empty result is not the end of the question."
    slide_heading: "The path names coin, account, chain and index"
    tags: ["bitcoin", "forensics"]
    confidence: "high"
  - term: "Extended public key"
    modifier: null
    aliases: ["xpub", "zpub", "extended public keys", "master public key"]
    definition: "A key (xpub, or zpub for native SegWit) that derives every public key and address on a branch, including ones not used yet, but no private key."
    context: "Merchants and auditors use it to receive or watch without spending; for the analyst an account's xpub links that account's addresses, and an xpub plus one non-hardened child private key exposes the parent private key."
    slide_heading: "An xpub reveals every address, past and future"
    tags: ["bitcoin", "cryptography", "forensics"]
    confidence: "high"
  - term: "Hardened derivation"
    modifier: null
    aliases: ["hardened level", "hardened levels", "hardened key"]
    definition: "A derivation-path level marked ' (purpose, coin type and account) that no public key can derive across."
    context: "An account's xpub cannot reach the seed's other accounts or address types, because they sit past hardened levels."
    slide_heading: "An xpub reveals every address, past and future"
    tags: ["bitcoin", "cryptography"]
    confidence: "high"
  - term: "Confidence word"
    modifier: null
    aliases: ["confidence words", "confidence scale"]
    definition: "The word on the course's scale that an assessment states to say how sure it is; an inference from chain behaviour alone, such as calling a wallet cold, is low confidence."
    context: "The analyst's job ends at the assessment, which names custody and likely storage and says how sure it is."
    slide_heading: "Each wallet type leaves different evidence"
    tags: ["forensics"]
    confidence: "high"
