lesson_id: "03-FO"
lesson_title: "Ransomware: the Payment and the Cash-out"
source_path: "lessons/forensics/03-FO-ransomware_payments_colonial.qmd"
terms:
  - term: "Ransomware extortion"
    modifier: "illicit finance"
    aliases: ["ransomware payment", "ransom demand"]
    definition: "A criminal payment demand made after malware disrupts or threatens a victim's systems or data."
    context: "A ransom trace starts from a known payment: the victim knows the address it paid, and the ledger is visible to everyone."
    slide_heading: "Ransom: a payment you can watch from the start"
    tags: ["forensics", "real-world"]
    confidence: "high"
  - term: "Ransom note"
    modifier: null
    aliases: ["ransomware note"]
    definition: "The message ransomware criminals leave on a victim's systems, pointing to a Tor site and demanding a price in cryptocurrency."
    context: "Colonial's note appeared before 5 am on 7 May 2021 and demanded about 75 BTC; the note names the group and the site, so it is a lead to ask the victim for."
    slide_heading: "A note leads to a portal, a price, an address"
    tags: ["forensics", "security", "real-world"]
    confidence: "high"
  - term: "Payment portal"
    modifier: null
    aliases: ["ransom portal", "Tor portal", "portal chat"]
    definition: "The criminals' Tor site, reached from the ransom note, where they set the price and give the victim the address to pay."
    context: "The chat on the portal records the price and any discount, so the analyst asks the victim for it alongside the ransom address."
    slide_heading: "A note leads to a portal, a price, an address"
    tags: ["forensics", "security", "privacy"]
    confidence: "high"
  - term: "DFIR firm"
    modifier: null
    aliases: ["digital forensics and incident response firm", "DFIR"]
    definition: "A digital forensics and incident response firm, which may negotiate with the criminals and pay the ransom on the victim's behalf."
    context: "When a firm paid for the victim, the analyst asks that firm, not only the victim, for the ransom address, note, portal chat and payment transaction."
    slide_heading: "A note leads to a portal, a price, an address"
    tags: ["forensics", "security", "real-world"]
    confidence: "high"
  - term: "DarkSide"
    modifier: null
    aliases: ["DarkSide ransomware"]
    definition: "The ransomware-as-a-service group behind the May 2021 Colonial Pipeline attack, whose developers took a share of each ransom from the affiliates who ran the attacks."
    context: "The lesson uses DarkSide's Colonial ransom as the worked trace, and DarkSide's on-chain split between developer and affiliate wallets."
    slide_heading: "Colonial: shut down at dawn, paid the next day"
    tags: ["forensics", "security", "real-world", "bitcoin"]
    confidence: "high"
  - term: "Ransom address"
    modifier: null
    aliases: ["ransom payment address"]
    definition: "The address the criminals tell the victim to pay. The victim knows it, so a ransom trace starts from a known payment instead of a guess."
    context: "Colonial gave the FBI the address it was told to pay, and the affidavit's trace begins there."
    slide_heading: "The ransom moved four times in two days"
    tags: ["forensics", "bitcoin"]
    confidence: "high"
  - term: "Hop"
    modifier: null
    aliases: ["trace hop", "hops"]
    definition: "One move of funds from one address to the next in a trace. Each hop is written with the heuristic that supports it and a confidence word."
    context: "Colonial's ransom moved four times by 9 May 2021 and a fifth time on 27 May; the lesson writes each hop as the lab's trace is written."
    slide_heading: "The ransom moved four times in two days"
    tags: ["forensics"]
    confidence: "high"
  - term: "Change undetermined"
    modifier: null
    aliases: ["no call on change"]
    definition: "The call an analyst makes when no clue shows which output of a transaction is change. Both outputs are followed, and that is a correct answer."
    context: "Two of Colonial's hops leave change undetermined, so the trace follows both branches instead of forcing a guess."
    slide_heading: "Each hop gets a heuristic and a confidence"
    tags: ["forensics", "bitcoin"]
    confidence: "high"
  - term: "Explorer label"
    modifier: null
    aliases: ["explorer's label", "block explorer label"]
    definition: "A blockchain explorer's grouping or naming of addresses, for example listing many addresses as one wallet. The label can be wrong, so a hop resting on it alone is Low confidence."
    context: "Hop 5 of Colonial's trace rests on an explorer listing an address and 23 others as one wallet."
    slide_heading: "Each hop gets a heuristic and a confidence"
    tags: ["forensics"]
    confidence: "high"
  - term: "Holding address"
    modifier: null
    aliases: ["holding wallet"]
    definition: "An address where money has been gathered and left still. A trace that reaches one has nowhere further to go until the money moves."
    context: "Colonial's trace ended at an address holding 69.6 BTC that had not moved as of 7 June 2021; Silk Road's stolen coins sat in one until November 2020."
    slide_heading: "This trace stopped at a wallet, not a service"
    tags: ["forensics", "bitcoin"]
    confidence: "high"
  - term: "First service"
    modifier: null
    aliases: ["first service reached"]
    definition: "The first exchange, OTC broker, darknet market or other service that the traced money reaches. The trace ends there, or where the money stops moving."
    context: "The lab's annotated trace follows a ransom to the first service; Colonial's stopped at a holding address instead, and the analyst must say which."
    slide_heading: "This trace stopped at a wallet, not a service"
    tags: ["forensics"]
    confidence: "high"
  - term: "Ransomware-as-a-service"
    modifier: null
    aliases: ["RaaS"]
    definition: "A ransomware model in which developers supply the malware and affiliates run the attacks, with the developers taking a share of each ransom."
    context: "DarkSide was ransomware-as-a-service; its developer reportedly took 25% of ransoms under $500,000, falling to 10% above $5 million."
    slide_heading: "Developer and affiliate split it on-chain"
    tags: ["forensics", "security", "real-world"]
    confidence: "high"
  - term: "Ransomware affiliate"
    modifier: null
    aliases: ["affiliate"]
    definition: "The party that runs a ransomware attack using a ransomware-as-a-service group's tools, paying the group's developers a share of each ransom."
    context: "DarkSide's developer and affiliate shares went to separate wallets, so the split shows on the blockchain; one affiliate wallet linked the Colonial and Brenntag ransoms."
    slide_heading: "Developer and affiliate split it on-chain"
    tags: ["forensics", "security", "real-world"]
    confidence: "high"
  - term: "Developer's cut"
    modifier: null
    aliases: ["developer share", "developer's share"]
    definition: "The share of each ransom that a ransomware-as-a-service group's developers take from the affiliate. DarkSide reportedly took 25% of ransoms under $500,000, falling to 10% above $5 million."
    context: "The hop-3 exercise asks which output looks like the developer's cut; a share read from the amount alone is Low confidence."
    slide_heading: "Developer and affiliate split it on-chain"
    tags: ["forensics", "security"]
    confidence: "high"
  - term: "Garantex"
    modifier: null
    aliases: []
    definition: "An exchange that received nearly $6 million from the Conti ransomware gang, as of April 2022."
    context: "The lesson names it as an example of an exchange where ransoms cash out."
    slide_heading: "A ransom cashes out at a service"
    tags: ["forensics", "real-world", "policy"]
    confidence: "high"
  - term: "Hydra"
    modifier: null
    aliases: ["Hydra Market"]
    definition: "The world's largest darknet market when Treasury sanctioned it in April 2022. It sold ransomware-as-a-service, hacking tools, stolen data and drugs, and was a route to Russian exchanges."
    context: "About $8 million in ransomware proceeds passed through Hydra, and about 86% of the illicit Bitcoin Russian exchanges received directly in 2019 came from it."
    slide_heading: "A ransom cashes out at a service"
    tags: ["forensics", "real-world", "policy"]
    confidence: "high"
  - term: "Round amounts"
    modifier: null
    aliases: ["round-amount transfers", "round Bitcoin amounts"]
    definition: "Transfers of exact, round values sent close together in time, a pattern that stands out against a service's normal traffic."
    context: "The coins taken out of Silk Road left in mainly round amounts, including ten transfers of exactly 2,500 BTC at about 3:59 am."
    slide_heading: "Silk Road: stolen coins left in round amounts"
    tags: ["forensics", "bitcoin"]
    confidence: "high"
  - term: "Red flag indicator"
    modifier: null
    aliases: ["red flags", "FinCEN red flags"]
    definition: "A sign FinCEN lists that a bank may see on the victim's side of a ransom payment, such as a customer using Tor or an unidentified web portal to talk to the person they pay in cryptocurrency."
    context: "The lesson uses it to show that the start of a ransom trace comes from the victim's side, not the blockchain."
    slide_heading: "The portal and chat are leads; ask for them"
    tags: ["forensics", "policy"]
    confidence: "high"
  - term: "Anonymity-enhanced cryptocurrency"
    modifier: null
    aliases: ["AEC", "AECs", "anonymity-enhanced cryptocurrencies"]
    definition: "FinCEN's term for privacy coins such as Monero; ransoms are most often in Bitcoin, but criminals increasingly ask for AECs."
    context: "The ransom's coin decides how far a trace can go; FinCEN reported the shift as of November 2021."
    slide_heading: "A note leads to a portal, a price, an address"
    tags: ["forensics", "privacy"]
    confidence: "high"
  - term: "Cash-out"
    modifier: null
    aliases: ["cash out", "cashing out"]
    definition: "Turning cryptocurrency into money or goods the criminal can use, at a service such as an exchange, an OTC broker or a darknet market."
    context: "The ransom trace ends at the first service, where the on-chain trace stops and the service's own records begin."
    slide_heading: "A ransom cashes out at a service"
    tags: ["forensics"]
    confidence: "high"
  - term: "Darknet market"
    modifier: null
    aliases: []
    definition: "An online market for illegal goods and services on sites reached with software that hides its users, paid almost exclusively in virtual currency."
    context: "A market is both a shop and a route to cash out: Hydra sold ransomware-as-a-service and was a main source of illicit Bitcoin received by Russian exchanges."
    slide_heading: "A darknet market is a shop and a cash-out"
    tags: ["forensics", "real-world"]
    confidence: "high"
  - term: "Mixer"
    modifier: null
    aliases: ["tumbler", "tumblers"]
    definition: "A service that mixes coins to break the link between payer and payee."
    context: "Silk Road's Bitcoin payment system used a tumbler to hide its users."
    slide_heading: "A darknet market is a shop and a cash-out"
    tags: ["forensics", "privacy"]
    confidence: "high"
