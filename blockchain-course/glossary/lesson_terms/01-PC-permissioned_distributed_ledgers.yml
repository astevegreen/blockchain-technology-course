lesson_id: "01-PC"
lesson_title: "Ledgers with a Gatekeeper"
source_path: "lessons/permissioned_ledger/01-PC-permissioned_distributed_ledgers.qmd"
terms:
  - term: "Permissioned ledger"
    modifier: null
    aliases: ["permissioned blockchain", "permissioned distributed ledger", "permissioned system", "consortium blockchain"]
    definition: "A ledger where an operator admits every participant and writes the rules, so trust rests on identity and policy rather than costly work or stake."
    context: "For any ledger the analyst asks who the gatekeeper is; on a permissioned ledger it is the operator, only the operator and its members hold the records, and an outsider sees nothing."
    slide_heading: "Find the gatekeeper: who can stop or see it"
    tags: ["permissioned-ledgers", "policy", "distributed-systems"]
    confidence: "high"
  - term: "Commitment"
    modifier: "ledger verification"
    aliases: ["hash commitment", "commitments"]
    definition: "A compact cryptographic reference that can later prove whether a specific piece of data matches what was recorded."
    context: "In a Fabric private data collection, peers on the channel outside the collection get only a hash of the private data."
    slide_heading: "The trace stops at the operator's edge"
    tags: ["cryptography", "permissioned-ledgers", "privacy"]
    confidence: "high"
  - term: "Permissionless ledger"
    modifier: null
    aliases: ["permissionless blockchain", "permissionless system", "public blockchain"]
    definition: "A ledger design where participation is open and security must handle unknown or pseudonymous participants."
    context: "Tron, like Ethereum, is open: anyone can read it, while on a permissioned ledger the operator admits every participant and an outsider sees nothing."
    slide_heading: "Find the gatekeeper: who can stop or see it"
    tags: ["permissioned-ledgers", "consensus", "policy"]
    confidence: "high"
  - term: "Curated participation"
    modifier: null
    aliases: ["curated admission", "controlled participation"]
    definition: "A participation model where membership is granted only to approved entities instead of anyone who connects."
    context: "On a permissioned ledger the operator admits every participant, so only admitted organizations take part."
    slide_heading: "Find the gatekeeper: who can stop or see it"
    tags: ["permissioned-ledgers", "policy"]
    confidence: "high"
  - term: "Admission control"
    modifier: "permissioned ledger"
    aliases: ["membership admission", "access admission"]
    definition: "The process for deciding who may join or act in the network before they receive credentials or roles."
    context: "On Tron anyone can join; on a permissioned ledger the operator admits every member and writes the rules."
    slide_heading: "Find the gatekeeper: who can stop or see it"
    tags: ["permissioned-ledgers", "policy", "security"]
    confidence: "high"
  - term: "Named identity"
    modifier: "permissioned ledger"
    aliases: ["authenticated identity", "recognized identity"]
    definition: "An identity tied to a known participant rather than only to a pseudonymous key or economic stake."
    context: "In Hyperledger Fabric, a membership service provider maps each participant to a certificate from its organization's authority, so every member is named."
    slide_heading: "Permissioned: the operator decides who writes"
    tags: ["permissioned-ledgers", "policy", "security"]
    confidence: "high"
  - term: "Identity and membership"
    modifier: null
    aliases: ["membership identity"]
    definition: "The mechanisms that establish who a participant is and what standing they have in the network."
    context: "On a permissioned ledger trust rests on identity and policy: only admitted organizations take part, each known by certificate."
    slide_heading: "Permissioned: the operator decides who writes"
    tags: ["permissioned-ledgers", "policy", "security"]
    confidence: "high"
  - term: "Policy and governance"
    modifier: null
    aliases: ["governance policy"]
    definition: "The rules and decision processes that define who may act, approve, administer, and change the network."
    context: "The operator admits members and writes the rules; identity and policy replace costly work or stake as the basis of trust."
    slide_heading: "Permissioned: the operator decides who writes"
    tags: ["permissioned-ledgers", "policy"]
    confidence: "high"
  - term: "Credential"
    modifier: "permissioned ledger"
    aliases: ["credentials", "operational certificate"]
    definition: "Cryptographic proof that ties an action to a recognized participant, organization, and role."
    context: "In Fabric each participant holds a certificate from its organization's authority; without a certificate there is nothing to read."
    slide_heading: "Permissioned: the operator decides who writes"
    tags: ["permissioned-ledgers", "cryptography", "security"]
    confidence: "high"
  - term: "Organization"
    modifier: "permissioned ledger identity"
    aliases: ["consortium member", "member organization"]
    definition: "An admitted member of a permissioned network; in Hyperledger Fabric each organization has its own certificate authority."
    context: "Only admitted organizations take part, and in the Fabric demo each transaction names the organization that endorsed it by its MSP identity."
    slide_heading: "Permissioned: the operator decides who writes"
    tags: ["permissioned-ledgers", "policy"]
    confidence: "high"
  - term: "Node"
    modifier: "permissioned ledger"
    aliases: ["software instance", "network node"]
    definition: "A software instance that keeps a copy of the ledger and answers queries about it."
    context: "The lab's Tron data comes from java-tron, Tron's open-source node; on a permissioned ledger an outsider has no public node to read."
    slide_heading: "Tron works like Ethereum, with T-addresses"
    tags: ["permissioned-ledgers", "distributed-systems"]
    confidence: "high"
  - term: "Validator / endorser"
    modifier: "permissioned ledger role"
    aliases: ["validator", "endorser", "approver"]
    definition: "A participant role that approves transactions according to the network's policy."
    context: "In the Fabric demo each transaction names the organization that endorsed it, and the endorsement policy names whose peers must sign a write."
    slide_heading: "Fabric demo: watch the gatekeeper work"
    tags: ["permissioned-ledgers", "consensus", "policy"]
    confidence: "high"
  - term: "Orderer / sequencer"
    modifier: "permissioned ledger role"
    aliases: ["orderer", "sequencer", "ordering role"]
    definition: "A participant or service role that establishes a consistent order for accepted transactions."
    context: "In Fabric, the orderer does not see the data in a private data collection."
    slide_heading: "The trace stops at the operator's edge"
    tags: ["permissioned-ledgers", "consensus", "distributed-systems"]
    confidence: "high"
  - term: "Permissioned consensus"
    modifier: null
    aliases: ["known-membership consensus"]
    definition: "A consensus model where known participants use roles, signatures, quorums, and policy to agree on ledger updates."
    context: "Known participants can agree without mining, so a committed transaction is final when the quorum signs."
    slide_heading: "Permissioned: the operator decides who writes"
    tags: ["permissioned-ledgers", "consensus"]
    confidence: "high"
  - term: "Quorum"
    modifier: "permissioned consensus"
    aliases: ["quorum rule", "threshold"]
    definition: "The required number or proportion of authorized participants whose approvals are needed for an action to proceed."
    context: "On a permissioned ledger a committed transaction is final when the quorum signs, with no waiting and no reorganization."
    slide_heading: "Permissioned: the operator decides who writes"
    tags: ["permissioned-ledgers", "consensus", "policy"]
    confidence: "high"
  - term: "Signed approval"
    modifier: "permissioned consensus"
    aliases: ["signed approvals", "approved signature"]
    definition: "A cryptographically signed authorization from a known member that counts toward policy or consensus requirements."
    context: "Signed approvals replace mining or staking signals when the system can verify which members are authorized to approve."
    slide_heading: "Permissioned: the operator decides who writes"
    tags: ["permissioned-ledgers", "consensus", "cryptography"]
    confidence: "high"
  - term: "Deterministic finality"
    modifier: null
    aliases: ["deterministic commit", "final commit"]
    definition: "A finality model where a transaction is final once required signatures and quorum rules are satisfied."
    context: "A Tron block is final, not probable, once 19 distinct active SRs have produced a block at or above its height; on a permissioned ledger a transaction is final once the required approvals are in."
    slide_heading: "27 elected producers; final after 19 confirm"
    tags: ["permissioned-ledgers", "consensus"]
    confidence: "high"
  - term: "Probabilistic finality"
    modifier: null
    aliases: ["probabilistic confirmation"]
    definition: "A finality model where confidence increases over time but reordering remains theoretically possible."
    context: "Tron calls a block final, not probable, once it is solidified; on a permissioned ledger a committed transaction needs no waiting and cannot be reorganized."
    slide_heading: "27 elected producers; final after 19 confirm"
    tags: ["consensus", "permissioned-ledgers"]
    confidence: "high"
  - term: "Ordering service"
    modifier: "permissioned ledger"
    aliases: ["ordering cluster", "leader-based cluster"]
    definition: "A service or small cluster that places accepted requests into one consistent sequence for validation and commit."
    context: "In Fabric, the ordering service does not see the data in a private data collection."
    slide_heading: "The trace stops at the operator's edge"
    tags: ["permissioned-ledgers", "consensus", "distributed-systems"]
    confidence: "high"
  - term: "Required approvals"
    modifier: "transaction policy"
    aliases: ["organizational signoffs", "approval requirements"]
    definition: "The policy-defined set of organizations or nodes that must approve a proposed action."
    context: "A committed transaction is final once the required approvals are in; in Fabric the endorsement policy names whose peers must sign a write."
    slide_heading: "Permissioned: the operator decides who writes"
    tags: ["permissioned-ledgers", "policy", "consensus"]
    confidence: "high"
  - term: "Validation against policy"
    modifier: "transaction path"
    aliases: ["policy validation"]
    definition: "The check that an ordered request still satisfies the relevant policy and state rules before commit."
    context: "In Fabric a write without enough of the endorsements the policy names is not valid; the demo takes peers offline to show it."
    slide_heading: "Fabric demo: watch the gatekeeper work"
    tags: ["permissioned-ledgers", "policy"]
    confidence: "high"
  - term: "Policy layer"
    modifier: "permissioned ledger"
    aliases: ["policy layers", "policy controls"]
    definition: "A set of explicit rules that define who may read, submit, approve, govern, or change the network."
    context: "On a permissioned ledger trust rests on identity and policy, and members read only what the policy allows."
    slide_heading: "Permissioned: the operator decides who writes"
    tags: ["permissioned-ledgers", "policy"]
    confidence: "high"
  - term: "Access policy"
    modifier: null
    aliases: ["access control policy"]
    definition: "Rules that determine which participants may read, write, submit, approve, or administer specific resources."
    context: "On a permissioned ledger a member reads what the policy allows: its channels and hashes of others' private data."
    slide_heading: "What each reader can see"
    tags: ["permissioned-ledgers", "policy", "privacy"]
    confidence: "high"
  - term: "Transaction policy"
    modifier: null
    aliases: ["endorsement policy", "approval policy"]
    definition: "Rules that determine which organizations or roles must approve a transaction before it can be committed."
    context: "The endorsement policy names whose peers must sign a write; the Fabric demo takes peers offline to show writes failing."
    slide_heading: "Fabric demo: watch the gatekeeper work"
    tags: ["permissioned-ledgers", "policy", "consensus"]
    confidence: "high"
  - term: "Quorum disruption"
    modifier: null
    aliases: ["preventing quorum", "approval disruption"]
    definition: "An attack or outage that prevents enough authorized approvers from participating to meet a quorum rule."
    context: "The Fabric demo takes peers offline: with too few of the peers the endorsement policy needs, writes fail."
    slide_heading: "Fabric demo: watch the gatekeeper work"
    tags: ["permissioned-ledgers", "consensus", "security"]
    confidence: "high"
  - term: "Privacy controls"
    modifier: "permissioned ledger"
    aliases: ["selective visibility", "selective disclosure"]
    definition: "Mechanisms that separate who can participate from who can see particular data or proofs."
    context: "In Fabric, channels keep transactions within their members and private data collections narrow it further, so members see different amounts and an outsider sees nothing."
    slide_heading: "The trace stops at the operator's edge"
    tags: ["permissioned-ledgers", "privacy", "policy"]
    confidence: "high"
  - term: "Channel"
    modifier: "permissioned ledger privacy"
    aliases: ["channels", "partition", "partitions"]
    definition: "A ledger or communication partition that limits which participants can see or interact with a subset of data."
    context: "A Fabric channel keeps whole transactions and ledgers confidential within a set of organizations; an outsider sees none of it."
    slide_heading: "The trace stops at the operator's edge"
    tags: ["permissioned-ledgers", "privacy"]
    confidence: "high"
  - term: "Private data collection"
    modifier: null
    aliases: ["private data collections"]
    definition: "A Fabric mechanism that lets a defined subset of organizations on a channel read some data, while every other peer on the channel gets only a hash of it."
    context: "Private data collections narrow what members can see, and the orderer does not see the private data."
    slide_heading: "The trace stops at the operator's edge"
    tags: ["permissioned-ledgers", "privacy"]
    confidence: "high"
  - term: "Hyperledger Fabric"
    modifier: null
    aliases: ["Fabric"]
    definition: "A permissioned blockchain platform that the lesson uses to show certificates, channels, private data collections and endorsement policies."
    context: "After the Tron lab, the instructor runs a live Fabric network in which member organizations share a channel to issue and check diplomas."
    slide_heading: "Find the gatekeeper: who can stop or see it"
    tags: ["permissioned-ledgers", "real-world"]
    confidence: "high"
