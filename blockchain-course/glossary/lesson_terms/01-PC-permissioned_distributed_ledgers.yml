    tags: ["permissioned-ledgers", "real-world"]
    confidence: "high"
  - term: "Shared database"
    modifier: "permissioned-ledger contrast"
    aliases: ["central shared database"]
    definition: "A database shared across organizations but still controlled by one administrator or broad admin access model."
    context: "The lesson contrasts shared databases with permissioned ledgers to show why replication alone does not solve authority, visibility, or finality."
    slide_heading: "Why Not A Shared Database?"
    tags: ["distributed-systems", "permissioned-ledgers"]
    confidence: "high"
  - term: "Append-only shared ledger"
    modifier: null
    aliases: ["append-only ledger", "append-only shared record"]
    definition: "A shared record where new entries are added without silently overwriting prior history."
    context: "Append-only history supports auditability across organizations while avoiding normal database edits that can hide disputes."
