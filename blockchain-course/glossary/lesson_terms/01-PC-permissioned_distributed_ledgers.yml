terms:
  - term: "Permissioned ledger"
    modifier: null
    aliases: ["permissioned blockchain", "permissioned distributed ledger", "permissioned system", "consortium blockchain"]
    definition: "A shared ledger system where known, approved participants operate under explicit identity, access, and governance rules."
    context: "The lesson uses permissioned ledgers to solve cross-organization record sharing when no single company should control the authoritative history."
    slide_heading: "Scenario"
    tags: ["permissioned-ledgers", "policy", "distributed-systems"]
    confidence: "high"
  - term: "Shared handoff record"
    modifier: null
    aliases: ["shared record", "shared custody record"]
    definition: "A common record of custody transfers, approvals, and related documents that multiple organizations can rely on."
    context: "The cargo scenario motivates why competing and regulating parties may need one shared source of operational truth."
