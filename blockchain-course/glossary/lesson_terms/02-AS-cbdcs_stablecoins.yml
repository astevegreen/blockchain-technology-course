  - term: "Capital flow control"
    modifier: null
    aliases: ["capital controls"]
    definition: "State efforts to restrict, monitor, or steer money moving across borders or out of the domestic financial system."
    context: "Stablecoins challenge capital flow control when users can move value outside local banking channels."
