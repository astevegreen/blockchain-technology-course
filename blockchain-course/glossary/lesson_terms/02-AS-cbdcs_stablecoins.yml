    aliases: ["MakerDAO DAI"]
    definition: "A crypto-collateralized stablecoin governed through MakerDAO rather than a single traditional issuer."
    context: "DAI gives students an example of a more decentralized stablecoin model with different collateral and governance assumptions."
    slide_heading: "Types of Digital Money"
    tags: ["stablecoins", "distributed-systems"]
    confidence: "high"
  - term: "Reserve"
    modifier: "stablecoin"
    aliases: ["reserves", "backing assets"]
    definition: "The assets or collateral meant to support confidence that a stablecoin can be redeemed at its target value."
    context: "Major stablecoins differ in issuer structure, reserve model, and regulatory posture."
    slide_heading: "Major Stablecoins and Use Cases"
    tags: ["stablecoins", "policy"]
    confidence: "high"
  - term: "Inflation hedging"
    modifier: "stablecoin"
    aliases: ["inflation hedge"]
    definition: "Using a stablecoin or other asset to preserve purchasing power when a local currency is rapidly losing value."
    context: "The lesson uses Venezuela, Bolivia, and Iran to show stablecoins functioning as practical dollar access during inflation or currency stress."
    slide_heading: "Major Stablecoins and Use Cases"
    tags: ["stablecoins", "real-world"]
    confidence: "high"
  - term: "Know Your Customer"
    modifier: "identity"
    aliases: ["KYC"]
    definition: "Identity verification requirements used by regulated financial institutions or wallet providers before serving users."
    context: "The lesson contrasts CBDCs, where KYC is required and the state knows participants, with cryptocurrencies, which have no identity gate at the protocol level."
    slide_heading: "CBDCs vs Cryptocurrencies"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Pseudonymous"
    modifier: "blockchain identity"
    aliases: ["pseudonymity"]
    definition: "Identified by addresses or keys rather than real-world names, while activity may still be visible on-chain."
    context: "The lesson contrasts pseudonymous cryptocurrency use with CBDC designs that require verified identity."
    slide_heading: "Types of Digital Money"
    tags: ["distributed-systems", "policy"]
    confidence: "high"
  - term: "Censorship resistance"
    modifier: null
    aliases: ["censorship-resistant"]
    definition: "The property that makes it difficult for any single authority to prevent a valid participant from transacting."
    context: "Censorship resistance is one of the clearest governance differences between permissionless cryptocurrencies and CBDCs."
    slide_heading: "CBDCs vs Cryptocurrencies"
    tags: ["distributed-systems", "policy"]
    confidence: "high"
  - term: "Legal tender"
    modifier: null
    aliases: []
    definition: "Money that must be accepted for debts or payments under the law of an issuing jurisdiction."
    context: "Legal status separates state-issued CBDCs from cryptocurrencies whose treatment varies by jurisdiction."
    slide_heading: "CBDCs vs Cryptocurrencies"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Monetary sovereignty"
    modifier: null
    aliases: []
    definition: "A state's ability to issue and govern its currency and transmit monetary policy through its financial system."
    context: "Governments care about digital money because it can reinforce or weaken control over national currency and policy."
    slide_heading: "Why Governments Care"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Payment system modernization"
    modifier: null
    aliases: []
    definition: "Efforts to make payment systems faster, cheaper, more resilient, and better suited to digital commerce."
    context: "Modernization is one of the non-geopolitical reasons governments explore CBDCs and new payment rails."
    slide_heading: "Why Governments Care"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Financial inclusion"
    modifier: null
    aliases: []
    definition: "Expanding access to useful financial services for people or businesses underserved by existing banking systems."
    context: "CBDC advocates often present inclusion as a reason to build digital public payment infrastructure."
    slide_heading: "Why Governments Care"
    tags: ["policy", "real-world"]
