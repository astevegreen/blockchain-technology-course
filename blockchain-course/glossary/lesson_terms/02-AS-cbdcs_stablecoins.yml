  - term: "Address freeze"
    modifier: "stablecoin"
    aliases: ["freeze capability", "blacklist", "blacklisting"]
    definition: "An issuer-controlled function that prevents specified blockchain addresses from moving a stablecoin token."
    context: "USDC's ability to freeze addresses is part of its US-regulated, sanctions-compliant posture."
    slide_heading: "Major Stablecoins and Use Cases"
    tags: ["stablecoins", "policy"]
    confidence: "high"
  - term: "USDT"
    modifier: "stablecoin"
    aliases: ["Tether"]
    definition: "A dollar-referenced stablecoin issued by Tether that dominates many high-volume and emerging-market payment flows."
    context: "USDT is the largest stablecoin by volume and dominant on Tron for emerging-market payments."
    slide_heading: "Types of Digital Money"
    tags: ["stablecoins", "real-world"]
    confidence: "high"
  - term: "USDC"
    modifier: "stablecoin"
    aliases: ["USD Coin", "Circle USDC"]
    definition: "A dollar-referenced stablecoin issued by Circle with a US-regulated, sanctions-compliant posture."
    context: "USDC is contrasted with USDT and DAI to show how issuer jurisdiction affects compliance and freeze authority."
    slide_heading: "Types of Digital Money"
    tags: ["stablecoins", "policy", "real-world"]
    confidence: "high"
  - term: "DAI"
