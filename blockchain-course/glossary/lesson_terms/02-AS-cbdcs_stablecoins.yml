terms:
  - term: "Digital money"
    modifier: null
    aliases: ["digital currency"]
    definition: "Money represented and transferred through digital systems rather than physical cash."
    context: "The lesson compares different digital money designs by issuer, infrastructure, and state visibility."
    slide_heading: "Types of Digital Money"
    tags: ["policy", "stablecoins"]
    confidence: "high"
  - term: "Central Bank Digital Currency"
    modifier: null
    aliases: ["CBDC", "CBDCs", "central bank digital currency"]
    definition: "A digital form of central-bank money issued and governed by a state monetary authority."
    context: "CBDCs are the state-controlled pole in the lesson's comparison of digital money systems."
    slide_heading: "Types of Digital Money"
    tags: ["policy", "permissioned-ledgers"]
    confidence: "high"
  - term: "Stablecoin"
    modifier: null
    aliases: ["stablecoins"]
    definition: "A token designed to maintain value relative to a reference asset, often a fiat currency such as the US dollar."
    context: "Stablecoins are the contested middle category because sovereign currency can move on non-sovereign infrastructure."
    slide_heading: "Types of Digital Money"
    tags: ["stablecoins", "policy"]
    confidence: "high"
  - term: "Cryptocurrency"
    modifier: "digital money"
    aliases: ["traditional cryptocurrency", "cryptocurrencies"]
    definition: "A protocol-issued digital asset that runs on permissionless blockchain infrastructure without a single central issuer."
    context: "The lesson contrasts cryptocurrencies with CBDCs and stablecoins to show different control and visibility models."
    slide_heading: "Types of Digital Money"
    tags: ["distributed-systems", "policy"]
    confidence: "high"
  - term: "Issuer"
    modifier: "digital money"
    aliases: ["issuers"]
    definition: "The entity or protocol responsible for creating, redeeming, or defining a monetary instrument."
    context: "Issuer identity is one of the main ways the lesson separates CBDCs, stablecoins, and cryptocurrencies."
    slide_heading: "Types of Digital Money"
    tags: ["policy", "stablecoins"]
    confidence: "high"
  - term: "State visibility"
    modifier: "digital money"
    aliases: []
    definition: "The degree to which government authorities can observe participants, balances, and transactions in a money system."
    context: "State visibility helps explain why governments view CBDCs, stablecoins, and cryptocurrencies differently."
    slide_heading: "Types of Digital Money"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Retail CBDC"
    modifier: null
    aliases: ["retail CBDCs"]
    definition: "A public-facing central bank digital currency intended for citizens, businesses, and everyday payments."
    context: "Retail CBDCs raise direct policy questions about public access, privacy, traceability, and state control."
    slide_heading: "Central Bank Digital Currencies (CBDCs)"
    tags: ["policy", "permissioned-ledgers"]
    confidence: "high"
  - term: "Wholesale CBDC"
    modifier: null
    aliases: ["wholesale CBDCs"]
    definition: "A central-bank digital instrument intended for settlement among financial institutions rather than general public use."
    context: "Wholesale CBDCs focus on interbank and cross-border settlement problems instead of consumer payments."
    slide_heading: "Central Bank Digital Currencies (CBDCs)"
    tags: ["policy", "permissioned-ledgers"]
    confidence: "high"
  - term: "Permissioned system"
    modifier: "CBDC"
    aliases: ["permissioned infrastructure", "permissioned by definition"]
    definition: "A system where participation, validation, and access are controlled by an authority or approved membership process."
    context: "The lesson treats permissioning as a design requirement for sovereign digital money."
    slide_heading: "Central Bank Digital Currencies (CBDCs)"
    tags: ["permissioned-ledgers", "policy"]
    confidence: "high"
  - term: "Permissionless system"
    modifier: "blockchain"
    aliases: ["permissionless network", "permissionless blockchain"]
    definition: "A blockchain system where anyone can run a node, validate, and transact without prior authorization."
    context: "The lesson contrasts permissionless cryptocurrencies with CBDCs, where the state controls nodes, validation, and participation."
    slide_heading: "Types of Digital Money"
    tags: ["distributed-systems", "policy"]
    confidence: "high"
  - term: "CBDC pilot"
    modifier: null
    aliases: ["pilot"]
    definition: "A limited operational test of a CBDC design before full-scale production deployment."
    context: "The lesson counts 49 active CBDC pilots worldwide, while 137 countries are exploring a CBDC and 72 are in advanced stages."
    slide_heading: "Central Bank Digital Currencies (CBDCs)"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Payment rails"
    modifier: null
    aliases: ["rails", "payment infrastructure"]
    definition: "The messaging, settlement, and intermediary systems that move money between institutions and across borders."
    context: "Payment rails are the infrastructure layer that stablecoins and CBDCs may bypass, compete with, or rebuild."
    slide_heading: "Global Payment Infrastructure: Overview"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Payment messaging"
    modifier: null
    aliases: ["messaging"]
    definition: "The transmission of payment instructions about who should pay whom, separate from the final movement of value."
    context: "The lesson separates messaging from settlement to explain why systems like SWIFT do not themselves move money."
    slide_heading: "Global Payment Infrastructure: Overview"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Settlement"
    modifier: "payment"
    aliases: []
    definition: "The final completion of a payment or transfer obligation through the actual movement of value."
    context: "Settlement is the function performed by dollar systems such as Fedwire and CHIPS and targeted by CBDC settlement experiments."
    slide_heading: "Global Payment Infrastructure: Overview"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Correspondent banking"
    modifier: null
    aliases: ["correspondent banks"]
    definition: "A banking arrangement where banks hold accounts with one another to route international payments."
    context: "Correspondent banking gives the dollar system chokepoints that can become sources of sanctions leverage."
    slide_heading: "Global Payment Infrastructure: Overview"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Sanctions power"
    modifier: "payment infrastructure"
    aliases: ["sanctions leverage", "sanctions enforcement"]
    definition: "The ability to restrict financial activity by controlling access to payment networks, settlement systems, or banking relationships."
    context: "The lesson connects payment infrastructure control to non-military state power."
    slide_heading: "Global Payment Infrastructure: Overview"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "SWIFT"
    modifier: "payment messaging"
    aliases: ["Society for Worldwide Interbank Financial Telecommunication"]
    definition: "A global bank-to-bank financial messaging network that carries payment instructions but does not settle funds itself."
    context: "SWIFT is presented as a dominant incumbent rail whose disconnection can become a major sanctions tool."
    slide_heading: "Global Payment Infrastructure: Overview"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "Fedwire"
    modifier: "payment settlement"
    aliases: []
    definition: "A US Federal Reserve settlement system where dollar payments are finally transferred between participating institutions."
    context: "Fedwire is part of the US-centered dollar clearing infrastructure contrasted with emerging alternatives."
    slide_heading: "Global Payment Infrastructure: Overview"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "CHIPS"
    modifier: "payment settlement"
    aliases: ["Clearing House Interbank Payments System"]
    definition: "A private US dollar clearing and settlement system used for large-value payments among banks."
    context: "CHIPS helps anchor global dollar settlement and therefore US leverage over dollar-denominated transactions."
    slide_heading: "Global Payment Infrastructure: Overview"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "CIPS"
    modifier: "cross-border payment system"
    aliases: ["Cross-Border Interbank Payment System"]
    definition: "China's cross-border yuan payment system that combines messaging and settlement for renminbi transactions."
    context: "CIPS is one of the emerging alternatives that reduces dependence on US-influenced infrastructure."
    slide_heading: "Global Payment Infrastructure: Overview"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "SPFS"
    modifier: "payment messaging"
    aliases: ["System for Transfer of Financial Messages"]
    definition: "Russia's financial messaging system built as an alternative to SWIFT after sanctions pressure."
    context: "SPFS illustrates how states build parallel rails to reduce vulnerability to Western payment infrastructure control."
    slide_heading: "Global Payment Infrastructure: Overview"
    tags: ["policy", "real-world"]
    confidence: "high"
  - term: "mBridge"
    modifier: "CBDC platform"
    aliases: ["mBridge Ledger", "Project mBridge"]
    definition: "A multi-central-bank CBDC platform for direct cross-border settlement in participating sovereign digital currencies."
    context: "mBridge is a state-led alternative to correspondent banking and dollar-centered settlement infrastructure."
    slide_heading: "Global Payment Infrastructure: Overview"
    tags: ["policy", "permissioned-ledgers", "real-world"]
    confidence: "high"
  - term: "Crypto-collateralized stablecoin"
    modifier: null
    aliases: ["crypto-backed stablecoin", "crypto-collateralized"]
    definition: "A stablecoin backed by crypto assets held as collateral."
    context: "DAI is the lesson's example: crypto-collateralized, with decentralized governance and permissionless use."
    slide_heading: "Major Stablecoins and Use Cases"
    tags: ["stablecoins", "distributed-systems"]
