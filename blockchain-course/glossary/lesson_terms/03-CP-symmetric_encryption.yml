lesson_id: "03-CP"
lesson_title: "Symmetric Encryption"
source_path: "lessons/primitives/03-CP-symmetric_encryption.qmd"
terms:
  - term: "Symmetric cryptography"
    modifier: null
    aliases: ["symmetric encryption", "symmetric crypto"]
    definition: "A cryptographic approach where the same shared secret key is used to encrypt and decrypt data."
    context: "The lesson opens with the shared-key model as the core idea behind efficient encryption for real systems."
    slide_heading: "The Shared Key"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Shared secret key"
    modifier: null
    aliases: ["shared key", "secret key"]
    definition: "A secret value known to the communicating parties that enables both encryption and decryption."
    context: "The shared key is the power and operational weakness of symmetric cryptography because it must be distributed and protected."
    slide_heading: "The Shared Key"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Encryption"
    modifier: null
    aliases: ["encrypt"]
    definition: "The process of transforming plaintext into ciphertext using a cryptographic key."
    context: "The lesson contrasts encryption with hashing by emphasizing that symmetric encryption is reversible with the key."
    slide_heading: "The Shared Key"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Decryption"
    modifier: null
    aliases: ["decrypt"]
    definition: "The process of recovering plaintext from ciphertext using the correct cryptographic key."
    context: "Decryption completes the symmetric-encryption correctness requirement that the original message can be recovered with the same key."
    slide_heading: "The Shared Key"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Plaintext"
    modifier: null
    aliases: ["message"]
    definition: "The original readable data before encryption or after successful decryption."
    context: "Plaintext is the input students track as examples move from XOR pads to formal encryption notation."
    slide_heading: "Infinite-length One Time Pad"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Ciphertext"
    modifier: null
    aliases: []
    definition: "The encrypted output that should hide the plaintext from anyone without the correct key or keystream."
    context: "The lesson uses ciphertext to show what an observer sees after XOR, block-cipher, or mode-based encryption."
    slide_heading: "Infinite-length One Time Pad"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Exclusive OR"
    modifier: null
    aliases: ["XOR", "⊕", "^"]
    definition: "A bit operation that outputs 1 when exactly one input bit is 1 and outputs 0 otherwise."
    context: "XOR is the reversible bit-level operation used to explain one-time pads, stream ciphers, and key mixing."
    slide_heading: "Exclusive OR (XOR) Logic"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Self-inverse"
    modifier: "XOR property"
    aliases: ["XOR reversibility"]
    definition: "A property where applying the same XOR value twice cancels it out and restores the original input."
    context: "This property explains why the same XOR operation can encrypt and decrypt in simple stream-style constructions."
    slide_heading: "Exclusive OR (XOR) Logic"
    tags: ["cryptography"]
    confidence: "high"
  - term: "One-time pad"
    modifier: null
    aliases: ["OTP", "random pad"]
    definition: "An encryption method that XORs plaintext with truly random key material of equal length that is never reused."
    context: "The one-time pad is presented as the conceptual gold standard for secrecy before practical stream ciphers are introduced."
    slide_heading: "Infinite-length One Time Pad"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Perfect secrecy"
    modifier: null
    aliases: []
    definition: "A security property where ciphertext alone reveals no information about the plaintext."
    context: "The lesson ties perfect secrecy to the one-time pad and its strict requirement for fresh random pad material."
    slide_heading: "Infinite-length One Time Pad"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Pad reuse"
    modifier: null
    aliases: ["keystream reuse", "offset reuse"]
    definition: "The unsafe use of the same one-time-pad segment or keystream position for more than one encryption."
    context: "Pad reuse is highlighted as the failure condition that destroys the one-time pad's security guarantee."
    slide_heading: "Infinite-length One Time Pad"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Pseudorandom generator"
    modifier: null
    aliases: ["PRG", "pseudorandom number generator"]
    definition: "An algorithm that expands a short seed into a longer stream that should appear random to an attacker."
    context: "PRGs replace impractical infinite shared pads with generated keystreams that can scale symmetric encryption."
    slide_heading: "Pseudo-Random Generators"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Seed"
    modifier: "PRG input"
    aliases: ["random seed", "initial seed"]
    definition: "A starting value shared or stored by a generator to deterministically produce pseudorandom output."
    context: "The seed shows how a short secret can drive a long keystream when both parties run the same generator."
    slide_heading: "Pseudo-Random Generators"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Keystream"
    modifier: null
    aliases: ["pseudorandom stream"]
    definition: "A sequence of key-derived bits or bytes combined with plaintext, often by XOR, to produce ciphertext."
    context: "The lesson uses keystreams to connect one-time pads, PRGs, stream ciphers, and CTR-style encryption."
    slide_heading: "Pseudo-Random Generators"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Offset"
    modifier: "keystream position"
    aliases: ["counter position"]
    definition: "The position in a pad or generated stream where encryption or decryption begins."
    context: "Tracking the offset matters because reusing or misaligning positions can break simple stream-style encryption."
    slide_heading: "Pseudo-Random Generators"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Cryptographic hash function"
    modifier: "PRG building block"
    aliases: ["hash function", "hash"]
    definition: "A function used in the toy PRG example to transform internal state and emit pseudorandom-looking output."
    context: "The simple PRG slide reuses hashing to make stateful expansion concrete while warning that the construction is pedagogical."
    slide_heading: "Simple Pseudorandom Generator"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Least significant byte"
    modifier: null
    aliases: ["LSB_8", "last byte"]
    definition: "The final byte of a binary value, used in the toy PRG as the emitted output for each round."
    context: "The toy PRG uses the least significant byte to illustrate how a generator can reveal part of state-derived output each iteration."
    slide_heading: "Simple Pseudorandom Generator"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Pseudorandom function"
    modifier: null
    aliases: ["PRF", "keyed pseudorandom function"]
    definition: "A keyed function whose outputs should be computationally indistinguishable from random for anyone without the key."
    context: "The counter-mode PRG uses a PRF to generate repeatable but hard-to-predict blocks from counter inputs."
    slide_heading: "Counter-Mode Pseudorandom Generator (PRG)"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Counter-mode PRG"
    modifier: null
    aliases: ["counter-mode pseudorandom generator", "CTR-style PRG"]
    definition: "A generator that evaluates a keyed function on successive counter values to produce a keystream."
    context: "Counter-mode generation previews the structure behind CTR mode and modern stream-like encryption."
    slide_heading: "Counter-Mode Pseudorandom Generator (PRG)"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Counter"
    modifier: "cryptography"
    aliases: ["ctr"]
    definition: "A value that increments across generator or encryption rounds so each keyed function input is distinct."
    context: "Counters let a keyed primitive seek through pseudorandom blocks without reusing the same input under the same key."
    slide_heading: "Counter-Mode Pseudorandom Generator (PRG)"
    tags: ["cryptography"]
    confidence: "high"
  - term: "HMAC"
    modifier: null
    aliases: ["hash-based message authentication code"]
    definition: "A keyed construction built from a hash function that can serve as a pseudorandom function or message authenticator."
    context: "The lesson names HMAC as an example PRF and later as part of the older encrypt-then-MAC authenticated-encryption pattern."
    slide_heading: "Counter-Mode Pseudorandom Generator (PRG)"
    tags: ["cryptography"]
    confidence: "high"
  - term: "AES"
    modifier: "symmetric cipher"
    aliases: ["Advanced Encryption Standard"]
    definition: "A widely used symmetric block cipher standard for encrypting fixed-size blocks with a secret key."
    context: "AES is one of the main real-world examples for symmetric encryption, block ciphers, and AES-GCM."
    slide_heading: "What Is Symmetric Cryptography?"
    tags: ["cryptography", "real-world"]
    confidence: "high"
  - term: "ChaCha20"
    modifier: "symmetric cipher"
    aliases: []
    definition: "A modern stream cipher that generates a fast keystream for symmetric encryption."
    context: "ChaCha20 appears as the stream-cipher counterpart to AES and as part of ChaCha20-Poly1305 AEAD."
    slide_heading: "What Is Symmetric Cryptography?"
    tags: ["cryptography", "real-world"]
    confidence: "high"
  - term: "DES"
    modifier: "legacy symmetric cipher"
    aliases: ["Data Encryption Standard"]
    definition: "An older block cipher that is now treated as legacy because its security margin is no longer adequate."
    context: "DES is included to distinguish historical symmetric ciphers from modern choices like AES and ChaCha20."
    slide_heading: "What Is Symmetric Cryptography?"
    tags: ["cryptography", "real-world"]
    confidence: "high"
  - term: "Confusion"
    modifier: "Shannon principle"
    aliases: []
    definition: "A cipher design goal that obscures the relationship between the secret key and the resulting ciphertext."
    context: "Confusion prepares students to understand why block ciphers use substitutions and nonlinear round functions."
    slide_heading: "Shannon’s Principles: Confusion and Diffusion"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Diffusion"
    modifier: "Shannon principle"
    aliases: []
    definition: "A cipher design goal that spreads each plaintext bit's influence across many ciphertext bits."
    context: "Diffusion explains why secure ciphers rearrange and mix data so small input changes affect large portions of output."
    slide_heading: "Shannon’s Principles: Confusion and Diffusion"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Block cipher"
    modifier: null
    aliases: ["block ciphers"]
    definition: "A symmetric cipher that transforms fixed-size blocks of data under a secret key."
    context: "Block ciphers are the engine behind many modes of operation and provide the main contrast with stream ciphers."
    slide_heading: "Building Blocks of Block Ciphers"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Round"
    modifier: "block cipher"
    aliases: ["rounds"]
    definition: "One repeated step of a block cipher that combines operations such as substitution, permutation, and key mixing."
    context: "Multiple rounds amplify security by making the final ciphertext depend on many layers of transformation."
    slide_heading: "Building Blocks of Block Ciphers"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Substitution box"
    modifier: null
    aliases: ["S-box", "substitution"]
    definition: "A nonlinear mapping in a block cipher that replaces input values to create confusion."
    context: "S-boxes are the concrete building block the lesson uses to connect Shannon's confusion principle to block-cipher design."
    slide_heading: "Building Blocks of Block Ciphers"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Permutation box"
    modifier: null
    aliases: ["P-box", "permutation"]
    definition: "A bit-reordering step in a block cipher that spreads influence across positions to create diffusion."
    context: "P-boxes show how block ciphers distribute local changes across the block during repeated rounds."
    slide_heading: "Building Blocks of Block Ciphers"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Key mixing"
    modifier: null
    aliases: ["round-key mixing"]
    definition: "A block-cipher step that combines data with a round key, commonly using XOR."
    context: "Key mixing ties each round's transformation back to the secret key rather than only rearranging data."
    slide_heading: "Building Blocks of Block Ciphers"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Round key"
    modifier: null
    aliases: ["round keys"]
    definition: "A per-round key value derived from the main secret key for use inside a block cipher."
    context: "Round keys explain how one main key influences many repeated rounds of block-cipher processing."
    slide_heading: "Building Blocks of Block Ciphers"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Stream cipher"
    modifier: null
    aliases: ["stream ciphers"]
    definition: "A symmetric cipher that generates a keystream and encrypts data bit by bit or byte by byte."
    context: "Stream ciphers are contrasted with block ciphers as a better fit for low-latency or continuous data streams."
    slide_heading: "Block vs Stream Ciphers"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Mode of operation"
    modifier: "block cipher"
    aliases: ["mode", "modes of operation", "block-cipher mode"]
    definition: "A rule set that applies a fixed-size block cipher safely to longer messages or data streams."
    context: "The lesson emphasizes that the same block cipher can have different security behavior depending on the surrounding mode."
    slide_heading: "Modes of Operation Visual"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Galois/Counter Mode"
    modifier: null
    aliases: ["GCM", "AES-GCM"]
    definition: "A modern mode that combines CTR-style encryption with an authentication tag."
    context: "GCM is presented as the best-practice AEAD mode when used with unique nonces."
    slide_heading: "Modes of Operation Overview"
    tags: ["cryptography", "real-world"]
    confidence: "high"
  - term: "Cipher Block Chaining"
    modifier: null
    aliases: ["CBC"]
    definition: "A block-cipher mode that XORs each plaintext block with the previous ciphertext block before encryption."
    context: "CBC shows how chaining can hide repeated patterns but introduces sequential processing and IV requirements."
    slide_heading: "Modes of Operation Overview"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Counter mode"
    modifier: null
    aliases: ["CTR"]
    definition: "A block-cipher mode that encrypts counter values to generate a keystream."
    context: "CTR links the earlier counter-mode PRG idea to a practical parallelizable encryption mode."
    slide_heading: "Modes of Operation Overview"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Electronic Codebook"
    modifier: null
    aliases: ["ECB"]
    definition: "A block-cipher mode that encrypts each block independently under the same key."
    context: "ECB is the lesson's warning example because identical plaintext blocks produce identical ciphertext blocks."
    slide_heading: "Modes of Operation Overview"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Cipher Feedback"
    modifier: null
    aliases: ["CFB"]
    definition: "A legacy mode that turns a block cipher into a self-synchronizing stream-like construction."
    context: "CFB appears in the mode comparison as a legacy option with error-propagation tradeoffs."
    slide_heading: "Modes of Operation Overview"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Nonce"
    modifier: "cryptography"
    aliases: ["unique nonce"]
    definition: "A value that must not repeat with the same key in modes such as CTR and GCM."
    context: "Nonce uniqueness is central to avoiding catastrophic keystream reuse in modern parallelizable modes."
    slide_heading: "Counter-Mode Pseudorandom Generator (PRG)"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Padding"
    modifier: "block cipher"
    aliases: ["PKCS#7 padding"]
    definition: "Extra bytes added so plaintext fits the exact block size required by a block cipher mode."
    context: "Padding solves block-size mismatch for messages whose final block is too short."
    slide_heading: "Padding and Initialization Vectors"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Initialization vector"
    modifier: null
    aliases: ["IV"]
    definition: "A public value supplied with ciphertext so repeated plaintexts encrypt differently under modes that require freshness."
    context: "The lesson separates IV handling from key secrecy and emphasizes that IVs must be unique or unpredictable as the mode requires."
    slide_heading: "Padding and Initialization Vectors"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Semantic security"
    modifier: null
    aliases: []
    definition: "A confidentiality property where repeated encryption should not reveal whether plaintexts are equal."
    context: "IVs and nonces are introduced as the freshness mechanism that helps avoid equality leakage across encryptions."
    slide_heading: "Padding and Initialization Vectors"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Confidentiality"
    modifier: null
    aliases: []
    definition: "The security goal of hiding message contents from parties who lack the required key."
    context: "Authenticated encryption is introduced by separating confidentiality from integrity and authenticity."
    slide_heading: "From Confidentiality to Authenticated Encryption (AEAD)"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Integrity"
    modifier: null
    aliases: []
    definition: "The security goal of detecting whether protected data has been changed."
    context: "The lesson stresses that encryption alone is not enough if tampering cannot be detected."
    slide_heading: "From Confidentiality to Authenticated Encryption (AEAD)"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Authenticity"
    modifier: null
    aliases: ["authentication"]
    definition: "The security goal of binding protected data to someone who holds the relevant cryptographic key."
    context: "Authenticity explains why modern encryption APIs combine secrecy with proof that the data came from a valid key holder."
    slide_heading: "From Confidentiality to Authenticated Encryption (AEAD)"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Authenticated encryption with associated data"
    modifier: null
    aliases: ["AEAD", "authenticated encryption"]
    definition: "An encryption design that provides confidentiality, integrity, and authentication in one API while allowing some data to be authenticated but not encrypted."
    context: "AEAD is presented as the modern default for avoiding separate and error-prone encryption and authentication steps."
    slide_heading: "From Confidentiality to Authenticated Encryption (AEAD)"
    tags: ["cryptography", "real-world"]
    confidence: "high"
  - term: "Associated data"
    modifier: null
    aliases: ["AAD", "additional authenticated data"]
    definition: "Metadata or headers that are authenticated by an AEAD scheme but intentionally left unencrypted."
    context: "Associated data helps students see how systems can protect protocol fields from tampering without hiding them."
    slide_heading: "From Confidentiality to Authenticated Encryption (AEAD)"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Encrypt-then-MAC"
    modifier: null
    aliases: []
    definition: "A composition pattern that encrypts data first and then authenticates the ciphertext with a message authentication code."
    context: "The lesson names encrypt-then-MAC as an older safe pattern that modern AEAD APIs package more directly."
    slide_heading: "From Confidentiality to Authenticated Encryption (AEAD)"
    tags: ["cryptography"]
    confidence: "high"
  - term: "Key management"
    modifier: "symmetric cryptography"
    aliases: ["key distribution", "key rotation"]
    definition: "The operational practice of securely distributing, storing, using, and replacing symmetric keys."
    context: "Key management is the main limitation of symmetric cryptography despite its speed and widespread deployment."
    slide_heading: "Why Symmetric Crypto"
    tags: ["cryptography", "real-world"]
    confidence: "high"
  - term: "Session key"
    modifier: null
    aliases: ["session keys"]
    definition: "A temporary symmetric key used to protect data after a secure session has been established."
    context: "The notes explain that asymmetric cryptography often bootstraps keys while symmetric cryptography carries most session data."
    slide_heading: "Why Symmetric Crypto"
    tags: ["cryptography", "real-world"]
    confidence: "high"
