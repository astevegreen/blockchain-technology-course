lesson_id: "05-EF"
lesson_title: "Tokens: ERC-20, Stablecoins and NFTs"
source_path: "lessons/ethereum/05-EF-digital_assets_tokenization_and_nfts.qmd"
terms:
  - term: "On-chain token"
    modifier: null
    aliases: ["blockchain token", "token"]
    definition: "A balance that a smart contract keeps for each address on an existing chain; the contract's code decides who can create, move or freeze it."
    context: "The lesson contrasts tokens with the chain's own coin, such as ETH, and tells the analyst to read the token's contract as well as the transaction."
    slide_heading: "A token is a balance a contract keeps"
    tags: ["tokenization", "ethereum"]
    confidence: "high"
  - term: "Native coin"
    modifier: null
    aliases: ["native coins", "native asset", "ETH"]
    definition: "An asset built into a chain's base ledger that pays network fees and may support staking or mining incentives, such as ETH on Ethereum."
    context: "The lesson asks first whether an asset is the chain's own coin or a token record kept by code on top of the chain; token transfers still pay fees in the native coin."
    slide_heading: "Coin or Token? Start With the Balance Record"
    tags: ["ethereum", "tokenization"]
    confidence: "high"
  - term: "Token contract"
    modifier: "tokenization"
    aliases: ["token contracts", "token program", "token programs", "contract-issued token"]
    definition: "Smart-contract or program logic that records token balances and enforces transfer, minting, approval, freezing, upgrade, or governance rules on an existing chain."
    context: "The coin-versus-token distinction asks whether value is recorded in the chain's base ledger or inside token contract or token program logic running on top of the chain."
    slide_heading: "Coin or Token? Start With the Balance Record"
    tags: ["ethereum", "tokenization"]
    confidence: "high"
  - term: "Fungible token"
    modifier: null
    aliases: ["fungible tokens", "ERC-20 token", "ERC-20 tokens"]
    definition: "A token type where each unit is interchangeable with any other unit of the same asset."
    context: "The lesson contrasts an ERC-20 balance, which is an amount, with an ERC-721 token, which is one numbered item with one owner."
    slide_heading: "ERC-20: six functions and two events"
    tags: ["ethereum", "tokenization", "stablecoins"]
    confidence: "high"
  - term: "ERC-20"
    modifier: "Ethereum token standard"
    aliases: ["EIP-20", "ERC20"]
    definition: "The Ethereum token standard: six functions (totalSupply, balanceOf, transfer, approve, allowance, transferFrom) and two events (Transfer, Approval) that a token offers."
    context: "The lesson reads the whole interface on one slide; because it is standard, any wallet or exchange can handle any ERC-20 token."
    slide_heading: "ERC-20: six functions and two events"
    tags: ["ethereum", "tokenization"]
    confidence: "high"
  - term: "Non-fungible token"
    modifier: null
    aliases: ["NFT", "NFTs", "non-fungible tokens"]
    definition: "A token that is one numbered item with one owner rather than an amount; on Ethereum, defined by the ERC-721 standard."
    context: "The lesson reads three ERC-721 pieces: ownerOf names the owner, the Transfer event names the token ID, and tokenURI points to the metadata."
    slide_heading: "An NFT is a token ID with one owner"
    tags: ["ethereum", "tokenization"]
    confidence: "high"
  - term: "ERC-721"
    modifier: "Ethereum token standard"
    aliases: ["ERC721"]
    definition: "The Ethereum non-fungible token standard, in which ownerOf returns the one owner of each token ID and every move emits a Transfer event naming that token ID."
    context: "The lesson quotes the standard: the Transfer event fires on creation with from set to zero, so a mint is a transfer from address zero."
    slide_heading: "An NFT is a token ID with one owner"
    tags: ["ethereum", "tokenization"]
    confidence: "high"
  - term: "Asset-backed token"
    modifier: null
    aliases: ["asset-backed tokens", "reference token", "reference tokens"]
    definition: "A token whose value depends on something held outside its contract, such as an issuer's reserves or a custodian's holdings."
    context: "The lesson shows stablecoins depending on issuer reserves and redemption, and wrapped or bridged tokens such as WBTC depending on custody and bridge contracts."
    slide_heading: "Same Token Standard, Different Promise"
    tags: ["tokenization", "real-world", "policy"]
    confidence: "high"
  - term: "Provenance"
    modifier: "tokenization"
    aliases: ["ownership history", "asset provenance"]
    definition: "The history of an asset's ownership and transfers; for an NFT, readable from the Transfer logs that name its token ID."
    context: "The lesson tells the analyst to follow a token ID through its Transfer logs; day 8 reads NFT wash trading as that trail going in a circle."
    slide_heading: "An NFT is a token ID with one owner"
    tags: ["tokenization", "real-world"]
    confidence: "high"
  - term: "Allowance"
    modifier: "fungible token"
    aliases: ["allowances", "spending allowance", "spending allowances"]
    definition: "An ERC-20 permission, set with approve, that lets another address, often a contract, spend up to a set amount of the holder's tokens through transferFrom."
    context: "The lesson calls an approval standing permission to spend, which wallet drainers abuse on day 8."
    slide_heading: "ERC-20: six functions and two events"
    tags: ["ethereum", "tokenization", "security"]
    confidence: "high"
  - term: "Token ID"
    modifier: "NFT"
    aliases: ["token identifier", "unique identifier", "unique identifiers"]
    definition: "The number that identifies one NFT within its contract; ownerOf returns the one address that owns it."
    context: "The ERC-721 Transfer event indexes the token ID, so the analyst can read one token's whole history from its logs."
    slide_heading: "An NFT is a token ID with one owner"
    tags: ["ethereum", "tokenization"]
    confidence: "high"
  - term: "Metadata"
    modifier: "NFT"
    aliases: ["token metadata", "metadata JSON"]
    definition: "Descriptive data about a token, such as its name or a link to its image; for an NFT, the optional tokenURI function points to it."
    context: "The lesson notes that NFT metadata often sits off chain, for example on IPFS: the chain records who owns the token, not the picture."
    slide_heading: "An NFT is a token ID with one owner"
    tags: ["ethereum", "tokenization"]
    confidence: "high"
  - term: "InterPlanetary File System"
    modifier: "NFT storage"
    aliases: ["IPFS"]
    definition: "A file storage network often used to hold NFT metadata off chain."
    context: "The lesson gives IPFS as an example of where an NFT's tokenURI may point, since the chain records ownership, not the media."
    slide_heading: "An NFT is a token ID with one owner"
    tags: ["distributed-systems", "tokenization"]
    confidence: "high"
  - term: "Wash trading"
    modifier: "NFT market"
    aliases: ["wash trade", "wash trades"]
    definition: "Trading in which the same actor or related wallets pass an asset among themselves, so its trail goes in a circle."
    context: "The lesson previews day 8, which reads NFT wash trading as the same token ID moving among related wallets in its Transfer logs."
    slide_heading: "An NFT is a token ID with one owner"
    tags: ["tokenization", "forensics", "real-world"]
    confidence: "high"
  - term: "Minting"
    modifier: "NFT"
    aliases: ["mint", "mints"]
    definition: "Creating new tokens under a contract's rules; ERC-20 and ERC-721 record a mint as a Transfer from address zero."
    context: "The lesson lists minting among the rules a token contract may set, and the afternoon lab mints an NFT and finds its mint as a Transfer from address zero."
    slide_heading: "Coin or Token? Start With the Balance Record"
    tags: ["ethereum", "tokenization"]
    confidence: "high"
  - term: "Custody"
    modifier: "asset-backed token"
    aliases: ["custodian", "custodians"]
    definition: "The safekeeping and control of an underlying asset or keys by a party trusted to support a tokenized claim."
    context: "The lesson lists custody among what a wrapped or bridged token, such as WBTC, depends on, alongside bridge contracts and validators."
    slide_heading: "Same Token Standard, Different Promise"
    tags: ["tokenization", "real-world", "security"]
    confidence: "high"
  - term: "Redemption"
    modifier: "real-world asset token"
    aliases: ["redeem", "redemption gates"]
    definition: "Exchanging a token with its issuer for the asset behind it, such as dollars for a fiat-backed stablecoin."
    context: "The lesson lists redemption among what a stablecoin holder depends on; as of MIT's 2022 review, only an issuer's verified customers could redeem directly."
    slide_heading: "Same Token Standard, Different Promise"
    tags: ["tokenization", "real-world", "policy"]
    confidence: "high"
  - term: "On-chain state"
    modifier: "token architecture"
    aliases: ["contract state", "canonical state"]
    definition: "The record a contract keeps on chain, such as token balances and owners, which the system treats as authoritative."
    context: "The lesson stresses that a token contract's balances are the ledger; tools rebuild them from Transfer logs, so a move with no log can be missed."
    slide_heading: "A token transfer shows up as a log"
    tags: ["ethereum", "tokenization", "distributed-systems"]
    confidence: "high"
  - term: "Indexer"
    modifier: "blockchain application"
    aliases: ["indexers"]
    definition: "An off-chain tool that reads blockchain data, such as Transfer logs, and organizes it for search, display or analysis."
    context: "The lesson warns that a tool rebuilding balances from Transfer logs misses a move with no log: after Tether's destroyBlackFunds it still shows the old balance."
    slide_heading: "A token transfer shows up as a log"
    tags: ["ethereum", "distributed-systems", "tokenization"]
    confidence: "high"
  - term: "Event log"
    modifier: "Ethereum"
    aliases: ["events", "logs", "event logs"]
    definition: "Data a contract emits when something happens, such as an ERC-20 Transfer or Approval event, recorded with the transaction for tools to read."
    context: "The lesson says every token move writes a Transfer log, and shows that the log, not the transaction's to field, names a token payment's recipient."
    slide_heading: "ERC-20: six functions and two events"
    tags: ["ethereum", "distributed-systems"]
    confidence: "high"
  - term: "tokenURI"
    modifier: "NFT metadata"
    aliases: ["token URI", "tokenURI function"]
    definition: "An optional ERC-721 function that returns where a token's metadata is, often off chain, for example on IPFS."
    context: "The lesson notes the chain records who owns a token, not the picture its metadata points to."
    slide_heading: "An NFT is a token ID with one owner"
    tags: ["ethereum", "tokenization"]
    confidence: "high"
  - term: "Approval"
    modifier: "token permission"
    aliases: ["approvals", "operator approval", "over-broad approvals"]
    definition: "A permission a holder grants, with ERC-20's approve, letting another address or contract move up to an allowance of their tokens."
    context: "The lesson calls an approval standing permission to spend; wallet drainers abuse it on day 8."
    slide_heading: "ERC-20: six functions and two events"
    tags: ["ethereum", "tokenization", "security"]
    confidence: "high"
  - term: "Contract address"
    modifier: "NFT verification"
    aliases: ["contract addresses"]
    definition: "The address of the contract that defines a token's rules and keeps its records."
    context: "The lesson shows that a token payment's transaction goes to the token contract's address, not to the person paid."
    slide_heading: "A token transfer shows up as a log"
    tags: ["ethereum", "tokenization", "security"]
    confidence: "high"
