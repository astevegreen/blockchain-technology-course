title: glossary-lookup
version: 1.0.0
quarto-required: ">=1.4.0"

# A glossary panel over the slide: the corner button or the G key opens it, and a word selected on the slide is
# searched for. It reads the site's generated glossary/terms.json (blockchain-course/glossary/README.md).
contributes:
  revealjs-plugins:
    - name: GlossaryLookup
      script:
        - glossary-lookup.js
      stylesheet:
        - glossary-lookup.css
