
  <script>
(function () {
  function setOffsets() {
    const header = document.querySelector('.reveal-header');
    const footer = document.querySelector('.reveal .footer');
    const h = header ? header.offsetHeight : 0;
    const f = footer ? footer.offsetHeight : 0;
    const root = document.documentElement;
    root.style.setProperty('--reveal-header-height', h + 'px');
    root.style.setProperty('--reveal-footer-height', f + 'px');
  }

  // Update on load and resize
  window.addEventListener('load', setOffsets);
  window.addEventListener('resize', setOffsets);

  // Also observe header/footer size changes (fonts, images, dynamic content)
  const ro = new ResizeObserver(setOffsets);
  document.querySelectorAll('.reveal-header, .reveal .footer').forEach(el => ro.observe(el));
})();
</script>
