title: aci
author: Army Cyber Institute
version: 0.0.1
quarto-required: ">=1.4.0"
contributes:
  formats:
    beamer: 
      include-in-header: 
        - file: beamer/front-matter.tex
      # Override pandoc defaults to obtain the correct title slide
      # and author information.
      template-partials:
      #  - beamer/title.tex
        - beamer/before-body.tex
      format-resources:
        - beamer/beamerthemeaci.sty
        - beamer/beamercolorthemeaci.sty
        - beamer/beamerinnerthemeaci.sty
        - beamer/beamerouterthemeaci.sty
        - beamer/meamerouterthemesimplefooter.sty
        - logos/ACILogo.png
    revealjs:
      date-format: long
      header: ""              # or leave blank
      overview: true
      progress: true
      touch: true
      chalkboard: true
      slide-number: "c"
      math:
        mathjax: /assets/vendor/mathjax/2.7.9/MathJax.js
        config: TeX-AMS_HTML-full
      mermaid:
        theme: neutral
      scrollable: true
      execute:
        echo: true
      extends: revealjs
      theme: [default, revealjs/custom.scss]
      logo: logos/ACILogo.png      
      footer: "{{< meta title >}} — {{< meta author >}} — {{< meta date >}}"
      header-logo: logos/ACILogo.png
      title-as-header: false
      subtitle-as-header: false   
      includes:
        after-body: html/safe-viewport.html
      revealjs-plugins:
        - reveal-header
      filters:
        - reveal-header
      margin: 0         # you control edges; don’t add extra margins
      center: false     # optional: off if you prefer top-aligned content under a header
      scroll-overflow: true

      
      # 1) Keep the slide’s title on the title slide (don’t lift/remove it)
      skip-title-lift: false

      # 2) If a slide has ::: header ... :::, use it and DO NOT remove the H1/H2/H3
      # (This defaults to true; set false if you want to ignore per-slide headers)
      #prefer-slide-header: true

      #title-slide-header: "Army Cyber Institute"

  


    
