name: Build Quiz Bank Bundle (Manual)

on:
  workflow_dispatch:

jobs:
  build-quiz-bank-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build quiz-bank JSON bundle
        run: python3 quizes/build_quiz_bank_bundle.py
      - name: Upload quiz-bank JSON bundle
        uses: actions/upload-artifact@v4
        with:
          name: blockchain-course-quiz-bank-bundle
          path: quizes/dist/blockchain-course-quiz-bank-bundle.json
          retention-days: 30
