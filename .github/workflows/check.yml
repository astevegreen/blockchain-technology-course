name: Check

# Runs the repo's one check over everything, with the whole site rendered (`python tools/check.py --all --render`),
# on every push to main. The pre-commit hook runs the same check on each commit, but only in a clone that turned the
# hooks on; this proves main itself (owner's policy, 28 Oct 2026). It builds and publishes nothing: the site
# changes only when the owner runs Publish.
# Windows, like the computers that commit: the check and its tool tests are written for Git Bash on Windows.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      NO_COLOR: "1"
      FORCE_COLOR: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Install the check's Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Check everything, the whole site rendered
        run: python tools/check.py --all --render
