name: Publish Course to GitHub Pages (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-quarto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          # Pinned, so a new Quarto release cannot change the site mid-course; check.yml pins the same version.
          version: 1.11.9
          tinytex: true
      - name: Inject VM Links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The VM build is now its own workflow with a different run id, so we
          # look up the most recent latest-vm-* release rather than this run's id.
          RELEASE_TAG=$(gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("latest-vm-"))] | sort_by(.createdAt) | last | .tagName // empty' \
            || true)
          if [ -n "$RELEASE_TAG" ]; then
            echo "Linking to VM release: $RELEASE_TAG"
            echo "* [Download VM Image Parts](https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG)" >> blockchain-course/index.qmd
            echo "* [Download VM Checksums](https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/hashes.txt)" >> blockchain-course/index.qmd
          else
            echo "No VM release found yet; skipping VM links."
          fi
      - name: Check the zip step leaves out what the check expects
        # tools/check.py reads the -x patterns below with fnmatch; this lists what zip itself would pack.
        env:
          SRC_ZIP_TEST_REQUIRED: "1"
        run: python3 -m unittest -v tools/tests/test_src_zip.py
      - name: Create source zip
        run: |
          # Keep instructor quiz banks/solutions out of the student-facing source bundle.
          zip -r blockchain-course/assets/src.zip blockchain-course dynamic-labs \
            -x "**/.git/**" \
            -x "*/.git" \
            -x "quizes/**" \
            -x "quizes/*" \
            -x "dynamic-labs/**/quizes/**" \
            -x "dynamic-labs/**/quizes/*" \
            -x "dynamic-labs/bitcoin-forensics/instructor-bitcoindir-forensics/**" \
            -x "dynamic-labs/bitcoin-forensics/instructor.zip" \
            -x "dynamic-labs/bitcoin-forensics/*_answer_LIVE.json" \
            -x "dynamic-labs/bitcoin-forensics/copilot-gen-script.sh" \
            -x "dynamic-labs/bitcoin-forensics/malicious_seed.py" \
            -x "dynamic-labs/bitcoin-forensics/malicious_seed_v*.py" \
            -x "dynamic-labs/bitcoin-forensics/seeder/scenario_v3*.py" \
            -x "dynamic-labs/bitcoin-forensics/build_v3*.py" \
            -x "dynamic-labs/bitcoin-forensics/FORENSICS-V34-STATE.md" \
            -x "dynamic-labs/bitcoin-forensics/lab.md" \
            -x "dynamic-labs/bitcoin/INSTRUCTOR_SOLUTION_GUIDE.md" \
            -x "dynamic-labs/bitcoin/forensics-*.md" \
            -x "dynamic-labs/docs/plans/forensics-v2-curriculum-draft.md" \
            -x "dynamic-labs/cryptography/solution.md" \
            -x "dynamic-labs/p2p_trust/instructor_notes.qmd" \
            -x "dynamic-labs/ethereum_lab/CODEX-HANDOFF.md" \
            -x "dynamic-labs/ethereum_lab/docs/instructor/**" \
            -x "dynamic-labs/ethereum_lab/frontend/public/docs/instructor/**" \
            -x "dynamic-labs/hlf/docs/INSTRUCTOR_GUIDE.md" \
            -x "dynamic-labs/regression-tests/**" \
            -x "dynamic-labs/explorer/chain/build-chain.sh" \
            -x "dynamic-labs/explorer/chain/build-steps.sh" \
            -x "dynamic-labs/explorer/chain/capture_pages.py" \
            -x "dynamic-labs/explorer/chain/make_sourcify_copy.py" \
            -x "dynamic-labs/lane-service/labs/bitcoin_catalog.yaml"
      - name: Render
        uses: quarto-dev/quarto-actions/render@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          path: blockchain-course
      - name: Save
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: website-render
          path: ./blockchain-course/_site
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build-quarto
    # ONLY deploy to pages if on main branch, to prevent PRs/other branches from overwriting pages
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: website-render
          path: ./blockchain-course/_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./blockchain-course/_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
