name: Build Bitcoin Lab Images (Manual)

# Builds the three Bitcoin base images from this repo's Dockerfiles and pushes them to this repo owner's registry,
# ghcr.io/astevegreen/bitcoin-{lab,mempool,graph}, as :latest and :trixie-<date>. The labs, Lab Tests and the VM
# build pull them from there, so the course depends on no other organization's registry. Hand-started only, and
# only from main: start it after a change to dynamic-labs/bitcoin/workstation, dynamic-labs/bitcoin/mempool or
# dynamic-labs/bitcoin-graph. amd64 only: every course path is amd64 (Apple Silicon runs the x86_64 VM).
# It logs in with the run's own GITHUB_TOKEN, so no personal token or secret is needed.
# A new package starts private: make it public once, in the package's settings on github.com.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-images
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io/astevegreen

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build bitcoin-lab
        run: docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$REGISTRY/bitcoin-lab:latest" dynamic-labs/bitcoin/workstation
      # mempool and graph build on the bitcoin-lab image just built, not on the one in the registry.
      - name: Build bitcoin-mempool
        run: docker build --pull=false --build-arg "BITCOIN_LAB_BASE=$REGISTRY/bitcoin-lab:latest" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$REGISTRY/bitcoin-mempool:latest" dynamic-labs/bitcoin/mempool
      - name: Build bitcoin-graph
        run: docker build --pull=false --build-arg "BITCOIN_LAB_BASE=$REGISTRY/bitcoin-lab:latest" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$REGISTRY/bitcoin-graph:latest" dynamic-labs/bitcoin-graph
      # A broken build never reaches the registry: each image must at least run its bitcoind.
      - name: Check each image runs bitcoind
        run: |
          set -euo pipefail
          for name in bitcoin-lab bitcoin-mempool bitcoin-graph; do
            docker run --rm --entrypoint bitcoind "$REGISTRY/$name:latest" -version
          done
      - name: Push :latest and the dated tag
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          dated="trixie-$(date -u +%F)"
          for name in bitcoin-lab bitcoin-mempool bitcoin-graph; do
            docker tag "$REGISTRY/$name:latest" "$REGISTRY/$name:$dated"
            docker push "$REGISTRY/$name:$dated"
            docker push "$REGISTRY/$name:latest"
            echo "Pushed $REGISTRY/$name:latest and :$dated" >> "$GITHUB_STEP_SUMMARY"
          done
