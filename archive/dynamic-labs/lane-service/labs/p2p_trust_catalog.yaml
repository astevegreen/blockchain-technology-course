intro:
  title: P2P Trust & Routing
  summary: Two labs. Lab A attacks and defends a decentralized reputation system; Lab B compares unstructured (Gossip) and structured (DHT) peer-to-peer routing, then fixes a real bug in a Pastry implementation. The scenario is humanitarian relief coordination in a degraded operational environment.
  labs:
  - id: lab-trust
    title: Lab A · Reputation
    summary: Audit the ReliefLedger reputation system. Exploit open registration, bypass the patch with spoofed endorsements, then see how EigenTrust and PeerTrust neutralize both attacks by anchoring trust in a pre-trusted core.
  - id: lab-routing
    title: Lab B · Routing
    summary: Route lookups across an unstructured gossip mesh and a structured Chord DHT, then debug a broken Pastry implementation where prefix routing hits a dead end.
  chapters:
  - id: trust-recon
    lab: lab-trust
    title: Reputation · Recon
    summary: Snapshot the current NGO scores and get oriented in ngo_sim.py.
  - id: trust-sybil
    lab: lab-trust
    title: Reputation · Sybil Attack
    summary: 'Exploit open registration: create fake NGOs and cross-endorse your way to the top of the leaderboard.'
  - id: trust-spoof
    lab: lab-trust
    title: Reputation · Spoofing Past the Patch
    summary: Apply the anti-Sybil patch, then bypass it by forging the endorser ID on outbound endorsements.
  - id: trust-eigentrust
    lab: lab-trust
    title: Reputation · EigenTrust / PeerTrust
    summary: Run the advanced audit and trace how pre-trusted anchors starve malicious subgraphs of global trust.
  - id: routing-gossip
    lab: lab-routing
    title: Routing · Gossip & Flooding
    summary: Flood vs random-walk lookups on an unstructured mesh. Measure bandwidth cost vs hit rate.
  - id: routing-chord
    lab: lab-routing
    title: Routing · Chord Finger Table
    summary: Route a key across the Chord ring using only your finger table — log-N hops if you pick well.
  - id: routing-pastry
    lab: lab-routing
    title: Routing · Fix the Pastry Bug
    summary: Reproduce the dead-end in get_next_hop, then implement the leaf-set fallback to pass the stress test.
exercises:
- id: trust-score-recon
  chapter: trust-recon
  title: Snapshot the Reputation Ledger
  goal: |-
    **Orientation**

    **Scenario.** You are operating inside a humanitarian relief network where NGOs need to discover reliable partners and route information in an unstable environment. Lab A focuses on trust: who gets believed, how reputation can be manipulated, and how stronger trust models resist abuse. Lab B shifts to routing: how information actually moves once peers try to find one another across a damaged or decentralized network.

    **Purpose.** This lab connects two problems students often treat separately. A distributed system is only useful if you can both decide **who to trust** and **how to reach them**. The exercises show how weak assumptions in either area create openings for manipulation or failure.

    **What you'll learn.** By the end, you should be able to explain how Sybil and spoofing attacks distort naive reputation systems, why anchored trust models such as EigenTrust and PeerTrust are more resilient, and how unstructured and structured routing trade reachability, bandwidth cost, and repair complexity.

    **How to approach this first exercise.** Begin by reading the current reputation ledger before you attack it. The goal here is to build a mental model of the normal network state so you can recognize what changes when you inject fake identities and forged endorsements.

    Get oriented before attacking. The score table shows the current naive endorsement total for each NGO; the JSON files show the underlying verification and baseline fields.
  student_steps:
  - |-
    Print the current ledger:

    ```
    python3 scripts/ngo_sim.py score
    ```
  - |-
    Note the median endorsement total and the top 3 NGOs. In this table, `Endorsements` is the current naive score: each NGO's `baseline_score` plus any new endorsements added during the exercise.
  - |-
    Inspect the NGO records directly for verification and baseline fields:

    ```
    less data/ngos.json
    ```
  - |-
    Inspect the live endorsement log:

    ```
    less data/endorsements.json
    ```

    This file may be empty before you create new endorsements.
  expected_observations:
  - The score table has baseline NGOs like `NGO_01…NGO_NN` with modest endorsement totals and ages.
  - The `score` command does not initially show `verified`; it appears after the patch is applied. The underlying `data/ngos.json` rows include `verified`, `age`, and `baseline_score` — remember these; the patch will check them.
  meaning:
  - Naive reputation systems treat **every endorsement as equal**, regardless of who sent it or whether they exist.
  - 'Your attack surface is: cheap registration + unsigned endorsements + unweighted sums.'
  transition: Register a fake NGO and vote it to the top.
- id: trust-sybil-attack
  chapter: trust-sybil
  title: Run a Sybil Flood
  goal: Open registration is free. Create a target NGO and a swarm of burner endorsers, then cross-endorse to inflate the target's score past legitimate NGOs.
  student_steps:
  - |-
    Register your target — call it `BadActor`:

    ```
    python3 scripts/ngo_sim.py register
    ```

    Note the random 6-digit ID the system assigns.
  - |-
    Register several burner NGOs (`Fake1`, `Fake2`, `Fake3`, …). You do not need to copy their IDs; the endorse command will show them in a selector.

    ```
    python3 scripts/ngo_sim.py register
    ```
  - |-
    For each burner, run:

    ```
    python3 scripts/ngo_sim.py endorse
    ```

    Use the cursor selector: Up/Down moves, Enter selects, and `q` exits. Pick one of your burner NGOs as the endorser, press Enter, then pick `BadActor` as the endorsee.
  - |-
    Check the new leaderboard:

    ```
    python3 scripts/ngo_sim.py score
    ```
  expected_observations:
  - '`BadActor` now sits at or near the top of the leaderboard.'
  - The newly-registered NGOs cluster together and endorse only one target — an obvious **cross-endorsement ring** if you know to look for it.
  meaning:
  - '"One identity, one vote" is impossible to enforce without proof-of-humanity, cost-of-entry, or pre-approved enrollment.'
  - 'Real-world defenses: invite-only, PoS-gated registration, hardware roots of trust (military contexts).'
  transition: HQ authorizes a patch. You will learn it doesn't actually fix the root problem.
- id: trust-apply-patch
  chapter: trust-spoof
  title: Apply the Anti-Sybil Patch
  goal: The patch restricts endorsements to NGOs that are **verified** and at least 7 rounds old. Apply it, then confirm your burner NGOs are blocked.
  student_steps:
  - |-
    Apply the patch:

    ```
    python3 scripts/ngo_sim.py patch
    ```
  - |-
    Try endorsing from one of your burner NGOs:

    ```
    python3 scripts/ngo_sim.py endorse
    ```

    You should be rejected with a verification error.
  expected_observations:
  - Burner NGOs cannot endorse.
  - Verified legitimate NGOs still can.
  meaning:
  - The patch fixed **authorization** — who is allowed to act.
  - It left **authentication** wide open — it still trusts the sender-ID field at face value.
  transition: Now bypass the patch by pretending to be a legitimate endorser.
- id: trust-spoof-endorsement
  chapter: trust-spoof
  title: Spoof a Verified Endorser
  goal: The endorsement protocol lets you choose the sender identity but never cryptographically proves you own that identity. Impersonate a legitimate NGO.
  student_steps:
  - |-
    Pick a high-reputation, verified NGO from the leaderboard (e.g., `NGO_04`) to impersonate:

    ```
    python3 scripts/ngo_sim.py score
    ```
  - |-
    Endorse yourself using their identity:

    ```
    python3 scripts/ngo_sim.py endorse
    ```

    Use the cursor selector: Up/Down moves, Enter selects, and `q` exits. Pick the victim NGO as the endorser, press Enter, then pick `BadActor` as the endorsee.
  - Repeat for each verified NGO until `BadActor` has endorsements from the whole verified pool.
  - Re-check the leaderboard.
  expected_observations:
  - The system accepts endorsements from legitimate NGOs that never actually sent them.
  - '`BadActor` now ranks above many real NGOs.'
  meaning:
  - '**Authorization ≠ Authentication.** The patch checks who is allowed; it does not check who actually spoke.'
  - 'Fix: sign each endorsement with the sender''s private key; reject packets that don''t verify against the sender''s registered public key (PKI).'
  transition: Headquarters wants a more resilient scoring model. Let's see what EigenTrust does to your attack.
- id: trust-eigentrust-audit
  chapter: trust-eigentrust
  title: Audit With EigenTrust & PeerTrust
  goal: Recompute reputations with trust propagation anchored in a pre-trusted core, then compare that against a live-edge view that accepts every recorded endorsement.
  student_steps:
  - |-
    Run the anchored audit first:

    ```
    python3 scripts/ngo_sim.py audit
    ```

    This view uses the trusted baseline graph and excludes live endorsements unless both endpoints are mature verified NGOs.
  - |-
    Now run the live-edge comparison:

    ```
    python3 scripts/ngo_sim.py audit --live
    ```

    This view includes every live endorsement in `data/endorsements.json`, including spoofed or Sybil-origin edges.
  - |-
    Trace trust flow into your attacker ID. Replace the example `123456` value
    with the numeric ID you recorded when you created `BadActor`; if you did not
    record it, rerun `python3 scripts/ngo_sim.py score` and copy the suspicious
    `BadActor` row:

    ```
    python3 scripts/ngo_sim.py audit --trace 123456
    ```
  - |-
    Optional: show the EigenTrust rounds as they propagate:

    ```
    python3 scripts/ngo_sim.py audit --trace 123456 --step
    ```
  - Compare the naive score vs anchored EigenTrust, live-edge EigenTrust, and PeerTrust for `BadActor` and for a legitimate top-ranking NGO.
  expected_observations:
  - In the anchored view, `BadActor`'s **naive** score is still high but its **EigenTrust** score collapses to near 0.
  - In the live-edge view, spoofed endorsements can make `BadActor` look more credible because the audit accepts those edges as real.
  - The `--step` output shows trust mass repeatedly moving through the verified baseline graph while excluded suspicious edges do not receive anchored trust.
  meaning:
  - 'EigenTrust''s pre-trusted anchor acts like an **alpha damping factor**: every round, a fraction of trust is artificially routed back to known-good nodes. Malicious subgraphs that don''t connect to them get starved.'
  - 'Operational risk: if the anchor nodes are destroyed or jammed, the trust calculation degrades. You''ve replaced one centralization with a smaller one.'
  transition: Reputation audited. Now move to the network layer.
- id: routing-gossip-lookup
  chapter: routing-gossip
  title: 'Unstructured Lookups: Flood vs Random Walk'
  goal: Route a file lookup through an unstructured mesh. Compare the bandwidth cost of flooding against the hit rate of a random walk.
  student_steps:
  - |-
    Run a flood search:

    ```
    python3 scripts/gossip_demo.py --mode lookup
    ```
  - |-
    Run a broadcast:

    ```
    python3 scripts/gossip_demo.py --mode broadcast
    ```
  - Record total messages exchanged and wall-clock time for each.
  expected_observations:
  - Flood hits the target almost immediately — but message count blows up roughly with the size of the network.
  - Random walks use dramatically fewer messages but sometimes miss the target entirely.
  meaning:
  - Flooding scales with O(N) messages per query — a **bandwidth storm** in anything larger than a hobby network.
  - Random walks are low-traffic but unreliable; they work best as a **complement** to structure, not a replacement.
  transition: 'Now try the structured approach: Chord.'
- id: routing-chord-lookup
  chapter: routing-chord
  title: Manual Chord Routing
  goal: Route a file hash to the node responsible for it using only your node's finger table. Try to match the greedy log-N reference route.
  student_steps:
  - |-
    Start the Chord simulator:

    ```
    python3 scripts/dht_demo.py
    ```
  - Remember that `T` is a file hash, not usually a node address. The destination is the first node clockwise at or after `T`.
  - If a finger-table entry is labeled `owner of T`, that node owns the file hash even when its node ID is not equal to `T`.
  - At each hop, pick the finger with the greatest **clockwise** distance from your current node that still lands before `T`. If every finger would pass `T`, choose the first finger; that is your immediate successor.
  - Track your hop count and compare against the simulator's reported greedy reference path.
  - Rerun and try to match it.
  expected_observations:
  - Even in a ring of hundreds of nodes, a good route takes only a handful of hops.
  - The target key and owner node often have different numbers. For example, key `46203` belongs to node `47144` if `47144` is the first live node clockwise after that key.
  - Overshooting the target wastes a hop. The correct choice is based on clockwise distance around the ring, not ordinary numeric `<= target` order.
  meaning:
  - 'DHTs are **O(log N)** in hops: each jump roughly halves the remaining distance in the keyspace.'
  - 'Trade-off: every node must maintain an accurate finger table. In a high-churn network (mobile, kinetic), the ring fractures and lookups fail.'
  transition: 'Advanced: Pastry works the same way in spirit but with prefix matching — and the implementation in front of you has a bug.'
- id: routing-pastry-reproduce
  chapter: routing-pastry
  title: Reproduce the Pastry Dead-End
  goal: Run the Pastry stress-test until a routing request gets stuck. Identify the code path that returns `None` and drops the message.
  student_steps:
  - |-
    Run the stress test:

    ```
    python3 scripts/pastry.py
    ```
  - Wait for the failure; copy the key and node IDs it reports.
  - Open `scripts/pastry.py` and find `get_next_hop(self, key)`. Locate the `return None` at the bottom.
  expected_observations:
  - After a random number of routes, the simulator reports a message dropped at node N with key K.
  - The current `get_next_hop` tries the **Routing Table** (prefix match), then gives up.
  meaning:
  - Prefix tables are sparse by design — they don't cover every possible key. A prefix-only router has gaps.
  - 'Pastry guarantees delivery with a secondary structure: the **Leaf Set** (immediate ring neighbors).'
  transition: Implement the fallback.
- id: routing-pastry-fix
  chapter: routing-pastry
  title: Implement the Closest-Known Fallback
  goal: Replace the table-only next-hop decision in `get_next_hop` with a closest-known-node fallback so every message either moves closer to the key or stops at the closest known node.
  student_steps:
  - |-
    Open `scripts/pastry.py` and find this function:

    ```python
    def get_next_hop(self, key):
    ```

    Inside that function, find the line:

    ```python
            # STUDENT PATCH AREA START
    ```

    Select and delete everything from `# STUDENT PATCH AREA START` through `# STUDENT PATCH AREA END`.
  - |-
    Paste this exact replacement in the same spot. Keep the leading spaces exactly as shown:

    ```python
            candidates = []
            if shl in self.routing_table and next_digit in self.routing_table[shl]:
                candidates.append(self.routing_table[shl][next_digit])

            candidates.extend(self.leaf_set)
            best = min(candidates, key=lambda x: diff(x, key), default=self.node_id)
            if diff(best, key) < diff(self.node_id, key):
                return best

            # No known neighbor is closer; this node is the closest known owner.
            return self.node_id
    ```

    This replaces the old routing-table-only decision. Do not only replace the final `return None`; that partial patch can still send the route into a loop.
  - |-
    Quick check before you run it:

    - The `# STUDENT PATCH AREA START` and `# STUDENT PATCH AREA END` lines should be gone.
    - The old line `return self.routing_table[shl][next_digit]` should be gone.
    - The old line `return None` should be gone.
  - |-
    If editing in `nano` is painful, reset from the backup copy and apply the exact patch automatically with this single paste:

    ```bash
    cd ~/lab
    cp ~/pastry.py.original scripts/pastry.py
    sed -i '/# STUDENT PATCH AREA START/,/# STUDENT PATCH AREA END/c\
            candidates = []\
            if shl in self.routing_table and next_digit in self.routing_table[shl]:\
                candidates.append(self.routing_table[shl][next_digit])\
    \
            candidates.extend(self.leaf_set)\
            best = min(candidates, key=lambda x: diff(x, key), default=self.node_id)\
            if diff(best, key) < diff(self.node_id, key):\
                return best\
    \
            # No known neighbor is closer; this node is the closest known owner.\
            return self.node_id' scripts/pastry.py
    ```

    This overwrites your current `scripts/pastry.py` from the clean backup at `~/pastry.py.original`, then applies the patch.
  - |-
    Rerun the stress test and confirm it finishes without dropping messages:

    ```
    python3 scripts/pastry.py
    ```
  expected_observations:
  - The stress test completes with `No delivery failures found...`.
  - The script prints one or two example successful lookup traces showing the full Pastry walk from source node to closest owner.
  - Hop counts are slightly higher on the previously-failing keys — the leaf-set walk is a slower fallback, but it delivers.
  meaning:
  - Prefix shortcuts give you speed; leaf-set walking gives you a **correctness guarantee**. Real DHTs layer both.
  - In a degraded ring (node churn), the leaf-set walk is what keeps the network from fracturing entirely.
