server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Render .qmd files inline as plain text. Preserved from the
    # retired crypto-lab-router-1 which used to do this with a
    # Content-Type header rewrite.
    types {
        text/html                    html htm;
        text/plain                   qmd md txt;
        application/javascript       js;
        text/css                     css;
        image/png                    png;
        image/svg+xml                svg;
    }
    default_type application/octet-stream;
}
