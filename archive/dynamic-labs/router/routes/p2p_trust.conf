# p2p_trust lab (Phase 9.2b — lane-service managed).
#
# Students claim a session via /api/p2p_trust/claim, which redirects
# to /labs/p2p_trust/c/<uuid>/. The wrapper page (served by lane-service)
# iframes ttyd and runs a 30s heartbeat. Nginx resolves the uuid to a
# container hostname via an auth_request subrequest to the lane-service.

# No-slash convenience redirect.
location = /labs/p2p_trust {
    return 301 $scheme://$http_host/labs/p2p_trust/;
}

# Landing page → claim
location = /labs/p2p_trust/ {
    return 302 /api/p2p_trust/claim;
}

# Lane-service API: claim, heartbeat, instructor controls.
# ^~ prevents the root /api regex catch-all in routes.conf from
# intercepting /api/p2p_trust/* requests.
location ^~ /api/p2p_trust/ {
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Wrapper page (served by lane-service Flask app)
location ~ ^/labs/p2p_trust/c/(?<uuid>[0-9a-f-]+)/$ {
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

# ttyd proxy: resolve uuid → container, then proxy to ttyd
location ~ ^/labs/p2p_trust/c/(?<uuid>[0-9a-f-]+)/ttyd(?<rest>/.*)?$ {
    auth_request /_resolve/p2p_trust;
    auth_request_set $resolved_host $upstream_http_x_lane_host;

    proxy_pass http://$resolved_host:7681$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header Origin "";
}

# Resolve subrequest — lane-service maps uuid → container hostname
location = /_resolve/p2p_trust {
    internal;
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090/api/p2p_trust/resolve;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Session-UUID $uuid;
    proxy_set_header Cookie $http_cookie;
}

# Instructor admin console (HTML) served by lane-service. Gated.
location = /labs/p2p_trust/admin {
    auth_request /_auth/instructor;
    error_page 401 = @instructor_login;
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
}

# Instructor terminal: gated by the shared instructor cookie.
# Force trailing slash — without it, $rest="" and proxy_pass falls
# back to passing the original URI, which ttyd 404s.
location = /labs/p2p_trust/instructor {
    return 301 /labs/p2p_trust/instructor/;
}
location ~ ^/labs/p2p_trust/instructor(?<rest>/.*)?$ {
    auth_request /_auth/instructor;
    error_page 401 = @instructor_login;
    set $target_host "p2p-trust-lab-instructor-1";
    proxy_pass http://$target_host:7681$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header Origin "";
}
