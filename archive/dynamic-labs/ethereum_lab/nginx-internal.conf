# In-container nginx: routes traffic to internal services
# Used when NGINX_ENABLED=1. Single port 8080 for all traffic.

events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server 127.0.0.1:5173;
    }

    upstream blockchain_rpc {
        server 127.0.0.1:8545;
    }

    server {
        listen 8080;
        server_name _;

        # Lab Terminal WebSocket (PTY) - must be before /
        # Send websocket traffic through the frontend proxy so terminal port
        # selection and balancing live in one place for both :5173 and :8080.
        location /ws/terminal {
            proxy_pass http://frontend/ws/terminal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 60;
        }

        # Legacy read-capable RPC endpoint is intentionally unavailable to
        # classroom browsers. Reads must use cache endpoints; writes go through
        # the frontend server's method-filtered /rpc-write proxy.
        location /rpc {
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            return 403 '{"jsonrpc":"2.0","id":null,"error":{"code":-32080,"message":"Direct /rpc is disabled. Use cached state endpoints for reads and /rpc-write for transactions."}}';
        }

        location /rpc-write {
            proxy_pass http://frontend/rpc-write;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Frontend (SPA, /api, /lab-api, /rpc-write)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
