events {
    worker_connections 1024;
}

http {
    upstream blockchain_rpc {
        server ethereum-trainer:8545;
    }

    upstream frontend {
        server ethereum-trainer:5173;
    }

    server {
        listen 80;
        server_name _;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Legacy read-capable RPC endpoint is intentionally unavailable to
        # classroom browsers. Reads must use cache endpoints; writes go through
        # the frontend server's method-filtered /rpc-write proxy.
        location /rpc {
            default_type application/json;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            return 403 '{"jsonrpc":"2.0","id":null,"error":{"code":-32080,"message":"Direct /rpc is disabled. Use cached state endpoints for reads and /rpc-write for transactions."}}';
        }

        location /rpc-write {
            proxy_pass http://frontend/rpc-write;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    }
}
