# The words that signal each Role Concept, for tools/alignment_map.py. Keyed by Role Concepts Order (the numbers in
# quizes/posttest/posttest_day10-quiz-bank.json). Each term is a regular expression, matched as whole words and
# ignoring case; a term written in capitals and digits only (AML, BSA, L2) matches in capitals only, so "pos" in a
# sentence never counts as PoS. A slide counts as teaching a concept when its title matches a term, or its body
# matches twice; a lab question or quiz item counts on one match. Tune a list when the map shows a slide it should
# not, or misses one it should, then rerun the script.
