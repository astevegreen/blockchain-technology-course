# Lab manifest. Schema: dynamic-labs/lab.schema.json. Design: docs/student-launcher-design.md section 3.
# memory_mb and approx_download_mb are first estimates; the session that writes the launcher compose file refines them.
id: bitcoin-trace
title: Bitcoin Trace Lab
kind: lab
order:
  day: 6
  position: 0
compose_project: bitcoin-trace
compose_file: docker-compose.yml
student_local: true
student_compose_file: docker-compose.launcher.yml
services:
  mempool:
    source: build
    context: .
    dockerfile: launcher/mempool.Dockerfile
    platforms:
    - linux/amd64
    - linux/arm64
  gateway:
    source: build
    context: .
    dockerfile: launcher/gateway.Dockerfile
    platforms:
    - linux/amd64
    - linux/arm64
networks:
- name: router-net
  internal: false
routes:
- routes/bitcoin-trace.conf
uses_lane_service: false
entry:
  path: /labs/bitcoin-trace/
memory_mb: 3072
approx_download_mb: 2500
data:
- path: ./mempool/load-chain.sh
  into: /chain-loader/load-chain.sh
  how: baked
- path: ./chain/blocks.hex
  into: /chain/blocks.hex
  how: baked
- path: ./gateway/default.conf
  into: /etc/nginx/conf.d/default.conf
  how: baked
- path: ./gateway/static
  into: /usr/share/nginx/html
  how: baked
keep_volumes_on_update: true
