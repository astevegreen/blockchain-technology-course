# Lab manifest. Schema: dynamic-labs/lab.schema.json. Design: docs/student-launcher-design.md section 3.
# memory_mb and approx_download_mb are first estimates; the session that writes the launcher compose file refines them.
id: p2p_trust
title: P2P Trust Lab
kind: lab
order:
  day: null
  position: 1
compose_project: p2p-trust-lab
compose_file: docker-compose.yml
student_local: true
student_compose_file: docker-compose.launcher.yml
services:
  student:
    source: build
    context: .
    platforms:
    - linux/amd64
    - linux/arm64
networks:
- name: p2p-trust-student-net
  internal: true
- name: p2p-trust-instructor-net
  internal: true
routes:
- routes/p2p_trust.conf
uses_lane_service: true
entry:
  path: /labs/p2p_trust/
memory_mb: 1024
approx_download_mb: 300
data: []
keep_volumes_on_update: true
