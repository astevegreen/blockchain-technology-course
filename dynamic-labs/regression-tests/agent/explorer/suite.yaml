version: 1
suite_id: day1-explorer-agent-regression
lab: explorer
mode: browser_mcp
entry_mode:
  default: non_destructive
  fresh_start_reference: ../../automated/explorer/run.sh
assumptions:
  - MCP browser tooling is available.
  - The explorer automated suite has already run against the same live environment.
  - Reset is optional and is not the default starting point.
shared_inputs:
  explorer_host: explorer.localhost
  signing_seat: 39
observability:
  required:
    - console_logs
    - network_failures
shared_rules:
  - Use a fresh browser context per task.
  - Read facts from the rendered pages and compare them with the values in the playbook.
  - Check console errors and network failures after each major phase.
  - Capture a screenshot for any visible failure.
parallelization:
  recommended:
    - Run the explorer and signing tasks in parallel; they share no state.
tasks:
  - id: explorer-read-flow
    title: Otterscan shows the worksheet's fields
    file: tasks/explorer-read-flow.md
    context: student_fresh
    auth: none
    routes:
      - /
      - /tx/<hash>
      - /address/<address>
      - /block/7/txs
    parallel_safe: true
  - id: explorer-sign-flow
    title: Sign and send from the signing page
    file: tasks/sign-and-send-flow.md
    context: student_fresh
    auth: none
    routes:
      - /sign/
      - /lab/
      - /fallback/
    parallel_safe: true
completion:
  - Every required task returns pass, partial, or fail.
  - Any non-pass result includes route, reproduction steps, console evidence, network evidence, screenshot, and a fix recommendation.
