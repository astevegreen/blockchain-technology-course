version: 1
suite_id: day8-cross-chain-agent-regression
lab: cross-chain
mode: browser_mcp
entry_mode:
  default: non_destructive
  fresh_start_reference: ../../automated/cross-chain/run.sh
assumptions:
  - MCP browser tooling is available.
  - The cross-chain automated suite has already run against the same live environment.
  - Reset is never needed; the snapshot is frozen and nothing the page does changes it.
shared_inputs:
  lab_base: /labs/cross-chain/
observability:
  required:
    - console_logs
    - network_failures
shared_rules:
  - Use a fresh browser context per task.
  - Read facts from the rendered pages and compare them with the values in the playbook.
  - Check console errors and network failures after each major phase.
  - Capture a screenshot for any visible failure.
parallelization:
  recommended:
    - Run all three tasks in parallel; they share no state.
tasks:
  - id: cross-chain-query-flow
    title: The query page answers the worksheet's questions
    file: tasks/query-flow.md
    context: student_fresh
    auth: none
    routes:
      - /labs/cross-chain/query/?lab=d8
    parallel_safe: true
  - id: cross-chain-links-flow
    title: Worksheet, saved results and links
    file: tasks/links-flow.md
    context: student_fresh
    auth: none
    routes:
      - /labs/cross-chain/
      - /labs/cross-chain/lab/
      - /labs/cross-chain/fallback/
    parallel_safe: true
  - id: cross-chain-find-the-line-page
    title: Find the line game page
    file: tasks/find-the-line-page.md
    context: student_fresh
    auth: none
    routes:
      - /labs/cross-chain/lab/
      - /assets/labs/find-the-line/index.html
    parallel_safe: true
completion:
  - Every required task returns pass, partial, or fail.
  - Any non-pass result includes route, reproduction steps, console evidence, network evidence, screenshot, and a fix recommendation.
