version: 1
suite_id: day6-bitcoin-trace-agent-regression
lab: bitcoin-trace
mode: browser_mcp
entry_mode:
  default: non_destructive
  fresh_start_reference: ../../automated/bitcoin-trace/run.sh
assumptions:
  - MCP browser tooling is available.
  - The bitcoin-trace automated suite has already run against the same live environment.
  - Reset is optional and is not the default starting point; the chain is frozen, so no run changes it.
shared_inputs:
  lab_base: /labs/bitcoin-trace/
  viewport_min_width: 800
observability:
  required:
    - console_logs
    - network_failures
shared_rules:
  - Use a fresh browser context per task, with a window at least 800 pixels wide.
  - Read facts from the rendered pages and compare them with bitcoin-trace/quizes/facts.json.
  - Check console errors and network failures after each major phase.
  - Capture a screenshot for any visible failure.
parallelization:
  recommended:
    - Run all three tasks in parallel; they share no state and nothing writes to the chain.
tasks:
  - id: bitcoin-trace-explorer-flow
    title: The mempool explorer shows every hop's fields
    file: tasks/explorer-flow.md
    context: student_fresh
    auth: none
    routes:
      - /labs/bitcoin-trace/mempool/
      - /labs/bitcoin-trace/mempool/tx/<txid>
      - /labs/bitcoin-trace/mempool/address/<address>
    parallel_safe: true
  - id: bitcoin-trace-worksheet-flow
    title: The worksheet reads well and gives nothing away
    file: tasks/worksheet-flow.md
    context: student_fresh
    auth: none
    routes:
      - /labs/bitcoin-trace/lab/
    parallel_safe: true
  - id: bitcoin-trace-links-flow
    title: Saved pages and links
    file: tasks/links-flow.md
    context: student_fresh
    auth: none
    routes:
      - /labs/bitcoin-trace/
      - /labs/bitcoin-trace/fallback/
    parallel_safe: true
completion:
  - Every required task returns pass, partial, or fail.
  - Any non-pass result includes route, reproduction steps, console evidence, network evidence, screenshot, and a fix recommendation.
