version: 1
suite_id: dynamic-l03-exercises-agent-regression
lab: exercises
mode: browser_mcp
entry_mode:
  default: non_destructive
  fresh_start_reference: ../../automated/exercises/README.md
assumptions:
  - MCP browser tooling is available.
  - The dynamic L03 exercises automated suite has already run against the same live environment.
  - Reset is optional and is not the default starting point.
shared_inputs:
  instructor_credentials_file: .runtime/instructor-credentials.txt
observability:
  required:
    - console_logs
    - network_failures
  suggested_mcp_methods:
    - get_console_logs
    - get_network_digest
    - get_network_traffic
shared_rules:
  - Use a fresh browser context per task.
  - Keep student and instructor cookies in separate contexts.
  - When switching roles, discard the old browser context and create a fresh session for the new role.
  - Prefer visible room controls over synthetic websocket calls once the page is loaded.
  - Check console errors and network failures after each major phase.
  - Capture a screenshot for any visible failure.
parallelization:
  recommended:
    - Run the BGP and Insider tasks in parallel.
    - Keep the student and instructor surfaces for a single exercise in separate browser contexts.
tasks:
  - id: exercises-bgp-browser
    title: BGP student and instructor flow
    file: tasks/bgp-browser-flow.md
    context: split_student_instructor
    auth: mixed
    routes:
      - /exercises/bgp/
      - /exercises/bgp/instructor
    parallel_safe: true
  - id: exercises-insider-browser
    title: Insider student and instructor flow
    file: tasks/insider-browser-flow.md
    context: split_student_instructor
    auth: mixed
    routes:
      - /exercises/insider/
      - /exercises/insider/instructor
      - /exercises/insider/room/<room-id>/qr.png
    parallel_safe: true
completion:
  - Every required task returns pass, partial, or fail.
  - Any non-pass result includes route, reproduction steps, console evidence, network evidence, screenshot, and a fix recommendation.
  - The suite is complete only when BGP and Insider student plus instructor surfaces have both been checked.
