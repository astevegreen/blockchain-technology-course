# Test-only lab for the student launcher's smoke test (docs/student-launcher-design.md, spec 4.5).
# kind fixture: never released; the fixture build stages it beside the router so the launcher can start it.
id: hello-lab
title: Hello lab (test)
kind: fixture
order: {day: null, position: 0}
compose_project: hello-lab
compose_file: docker-compose.launcher.yml
student_local: true
student_compose_file: docker-compose.launcher.yml
services:
  # Built, not pulled: the smoke test builds it twice with a different label, so the two launchers carry
  # different digests and the Change check has something to see.
  hello:
    source: build
    context: .
    platforms: [linux/amd64, linux/arm64]
networks:
  - {name: hello-net, internal: false}
routes: []
uses_lane_service: false
entry: {path: /, port: 8449}
memory_mb: 64
approx_download_mb: 5
data: []
keep_volumes_on_update: false
