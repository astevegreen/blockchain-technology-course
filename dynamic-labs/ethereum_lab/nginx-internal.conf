# In-container nginx: routes traffic to internal services
# Used when NGINX_ENABLED=1. Single port 8080 for all traffic.

events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server 127.0.0.1:5173;
    }

    upstream blockchain_rpc {
        server 127.0.0.1:8545;
    }

    server {
        listen 8080;
        server_name _;

        # Lab Terminal WebSocket (PTY) - must be before /
        # Send websocket traffic through the frontend proxy so terminal port
        # selection and balancing live in one place for both :5173 and :8080.
        location /ws/terminal {
            proxy_pass http://frontend/ws/terminal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
            proxy_connect_timeout 60;
        }

        # JSON-RPC (blockchain)
        location /rpc {
            proxy_pass http://blockchain_rpc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Frontend (SPA, /api, /lab-api, /rpc-proxy)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
