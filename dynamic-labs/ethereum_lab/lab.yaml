# Lab manifest. Schema: dynamic-labs/lab.schema.json. Design: docs/student-launcher-design.md section 3.
# memory_mb and approx_download_mb are first estimates; the session that writes the launcher compose file refines them.
id: ethereum_lab
title: Ethereum Lab
kind: lab
order:
  day: null
  position: 4
compose_project: ethereum_lab
compose_file: docker-compose.yml
student_local: true
student_compose_file: docker-compose.launcher.yml
services:
  ethereum-trainer:
    source: build
    context: .
    dockerfile: Dockerfile
    platforms:
    - linux/amd64
    - linux/arm64
networks:
- name: ethereum-rpc-net
  internal: true
- name: ethereum-student-mgmt-net
  internal: true
- name: ethereum-instructor-mgmt-net
  internal: true
routes:
- routes/ethereum.conf
uses_lane_service: true
entry:
  path: /labs/ethereum_lab/
memory_mb: 4096
approx_download_mb: 1500
data: []
keep_volumes_on_update: true
