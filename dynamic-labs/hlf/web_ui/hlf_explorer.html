<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HLF Explorer</title>
  <style>
    :root {
      --bg: #0b0d10;
      --bg-elevated: #11151a;
      --bg-panel: #151a20;
      --bg-panel-soft: #101419;
      --border: #242c35;
      --border-strong: #313b46;
      --text: #edf2f7;
      --muted: #97a4b2;
      --accent: #d7e6f7;
      --accent-bg: #1a2734;
      --ok: #7fd0a2;
      --warn: #e6c26c;
      --error: #ea7a7a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }

    /* --- Header --- */
    header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: rgba(10,12,15,0.96); border-bottom: 1px solid var(--border); position: sticky; top: 0; backdrop-filter: blur(10px); z-index: 100; gap: 12px; flex-wrap: wrap; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .header-left h1 { margin: 0; font-size: 15px; color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; }
    .header-stats { display: flex; gap: 18px; }
    .header-stat { text-align: center; }
    .header-stat .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .header-stat .value { font-size: 16px; font-weight: 600; margin-top: 1px; }
    .header-stat .value.status-running { color: var(--ok); }
    .header-stat .value.status-stopped { color: var(--muted); }
    .header-stat .value.status-error { color: var(--error); }
    .header-stat .value.status-starting { color: var(--warn); }
    .toolbar { display: flex; gap: 6px; }
    .toolbar button, .toolbar a { background: transparent; color: var(--muted); border: 1px solid var(--border-strong); padding: 6px 10px; cursor: pointer; font-size: 11px; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .toolbar button:hover, .toolbar a:hover { background: var(--bg-panel); color: var(--text); }

    /* --- Chain strip --- */
    .chain-section { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
    .chain-section h2 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .chain-strip { display: flex; gap: 0; align-items: stretch; overflow-x: auto; padding-bottom: 4px; }
    .chain-strip::-webkit-scrollbar { height: 4px; }
    .chain-strip::-webkit-scrollbar-thumb { background: var(--border-strong); }
    .block-node { min-width: 100px; flex-shrink: 0; background: var(--bg-panel); border: 1px solid var(--border); padding: 10px 12px; cursor: pointer; position: relative; transition: border-color 120ms, background 120ms; }
    .block-node:hover { border-color: var(--accent); background: var(--accent-bg); }
    .block-node.selected { border-color: var(--accent); background: var(--accent-bg); }
    .block-node .block-num { font-size: 18px; font-weight: 700; color: var(--text); }
    .block-node .block-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .block-node .block-txcount { font-size: 11px; color: var(--accent); margin-top: 2px; }
    .chain-link { width: 24px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .chain-link svg { width: 24px; height: 8px; }
    .chain-link svg line { stroke: var(--border-strong); stroke-width: 2; }
    .chain-empty { color: var(--muted); font-size: 13px; padding: 16px 0; }

    /* --- Block detail drawer --- */
    .block-detail { background: var(--bg-elevated); border: 1px solid var(--border); border-top: 2px solid var(--accent); margin: 0 18px; padding: 14px 16px; display: none; }
    .block-detail.open { display: block; }
    .block-detail h3 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
    .tx-row { background: var(--bg-panel-soft); border: 1px solid var(--border); padding: 10px 12px; margin-bottom: 6px; }
    .tx-row .tx-id { font-family: monospace; font-size: 12px; color: var(--accent); word-break: break-all; }
    .tx-row .tx-id a { color: var(--accent); text-decoration: none; }
    .tx-row .tx-id a:hover { text-decoration: underline; }
    .tx-row .tx-type { font-size: 11px; color: var(--muted); margin-top: 3px; }

    /* --- Main content --- */
    .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 18px; }
    @media (max-width: 900px) { .content-grid { grid-template-columns: 1fr; } }

    /* --- Network topology --- */
    .topo-section { grid-column: 1 / -1; }
    .topo-section h2 { margin: 0 0 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
    .topo-grid { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; align-items: start; }
    .topo-org { background: var(--bg-panel); border: 1px solid var(--border); padding: 14px; }
    .topo-org h3 { margin: 0 0 8px; font-size: 13px; color: var(--accent); }
    .topo-org .org-role { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .topo-node { background: var(--bg-panel-soft); border: 1px solid var(--border); padding: 8px 10px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .topo-node a { color: var(--text); text-decoration: none; font-size: 12px; font-weight: 500; }
    .topo-node a:hover { color: var(--accent); }
    .topo-node .node-status { font-size: 11px; padding: 2px 6px; border: 1px solid var(--border-strong); }
    .topo-node .node-status.up { color: var(--ok); border-color: rgba(127,208,162,0.3); }
    .topo-node .node-status.down { color: var(--error); border-color: rgba(234,122,122,0.3); }
    .topo-orderer { background: var(--bg-panel); border: 1px solid var(--border); padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 180px; }
    .topo-orderer h3 { margin: 0 0 4px; font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; }
    .topo-orderer .ord-label { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .topo-flow { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--muted); margin-top: 6px; }
    .topo-flow svg { width: 30px; height: 6px; }
    .topo-flow svg line { stroke: var(--border-strong); stroke-width: 1.5; }
    @media (max-width: 700px) { .topo-grid { grid-template-columns: 1fr; } .topo-orderer { min-width: auto; } }

    /* --- Panel --- */
    .panel { background: var(--bg-panel); border: 1px solid var(--border); overflow: hidden; }
    .panel h2 { margin: 0; padding: 10px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--bg-elevated); }
    .panel .body { padding: 12px; }

    /* --- World state table --- */
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    td a { color: var(--accent); text-decoration: none; }
    td a:hover { text-decoration: underline; }

    /* --- Identity / governance cards --- */
    .info-card { background: var(--bg-panel-soft); border: 1px solid var(--border); padding: 10px 12px; margin-bottom: 6px; }
    .info-card strong { color: var(--text); font-size: 13px; }
    .info-card .detail { color: var(--muted); font-size: 12px; margin-top: 3px; }
    code { background: var(--bg-panel-soft); border: 1px solid var(--border); padding: 1px 5px; font-size: 12px; }

    .muted { color: var(--muted); }
    .error { color: var(--error); }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Explorer</h1>
    </div>
    <div class="header-stats">
      <div class="header-stat">
        <div class="label">Status</div>
        <div class="value" id="netStatus">...</div>
      </div>
      <div class="header-stat">
        <div class="label">Nodes</div>
        <div class="value" id="nodeCount">...</div>
      </div>
      <div class="header-stat">
        <div class="label">Height</div>
        <div class="value" id="chainHeight">...</div>
      </div>
      <div class="header-stat">
        <div class="label">Assets</div>
        <div class="value" id="assetCount">...</div>
      </div>
    </div>
    <div class="toolbar">
      <button onclick="refreshExplorer()">Refresh</button>
      <a href="../" id="lessonLink">Lesson</a>
      <a href="./governance/" id="governanceLink">Governance</a>
      <a href="./chaincode/" id="chaincodeLink">Chaincode</a>
    </div>
  </header>

  <!-- Chain visualization -->
  <div class="chain-section">
    <h2>Chain</h2>
    <div class="chain-strip" id="chainStrip">
      <div class="chain-empty">Loading blocks...</div>
    </div>
  </div>
  <div class="block-detail" id="blockDetail"></div>

  <div class="content-grid">
    <!-- Network topology -->
    <div class="topo-section">
      <h2>Network</h2>
      <div class="topo-grid" id="topoGrid">
        <div class="muted">Loading network topology...</div>
      </div>
    </div>

    <!-- World state -->
    <div class="panel">
      <h2>World State</h2>
      <div class="body">
        <table>
          <thead><tr><th>Asset</th><th>Owner</th><th>Field of Study</th><th>Degree</th><th>Value</th></tr></thead>
          <tbody id="worldState"></tbody>
        </table>
      </div>
    </div>

    <!-- Governance + Identity -->
    <div class="panel">
      <h2>Governance &amp; Identity</h2>
      <div class="body" id="govIdentity"></div>
    </div>

    <!-- Chaincode -->
    <div class="panel">
      <h2>Chaincode</h2>
      <div class="body" id="chaincodeInfo"></div>
    </div>

    <!-- Trust context -->
    <div class="panel">
      <h2>Trust Context</h2>
      <div class="body" id="trustContext"></div>
    </div>
  </div>

  <script src="/labs/hlf/hlf_session.js"></script>
  <script src="/labs/hlf/progress_beacon.js"></script>
  <script src="/labs/hlf/hlf_explorer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.HLFProgress) window.HLFProgress.recordStep('surface:explorer');
      // Re-anchor toolbar links against the resolved session prefix so
      // students who land on /labs/hlf/explorer/ with only a cookie still
      // get /c/<uuid>/* back-links rather than dropping to the preview URL.
      var base = (window.HLFBase && window.HLFBase.resolve()) || '/labs/hlf';
      var lesson = document.getElementById('lessonLink');
      if (lesson) lesson.href = base + '/';
      // Governance and Chaincode live under /explorer/ (the explorer owns
      // those drilldowns), not at the session root. Original HTML used
      // ./governance/ + ./chaincode/ which resolved that way from
      // /explorer/; preserve the same structure when we re-anchor.
      var gov = document.getElementById('governanceLink');
      if (gov) gov.href = base + '/explorer/governance/';
      var cc = document.getElementById('chaincodeLink');
      if (cc) cc.href = base + '/explorer/chaincode/';
    });
  </script>
</body>
</html>
