<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HLF Transaction Detail</title>
  <style>
    :root {
      --bg: #0b0d10;
      --bg-elevated: #11151a;
      --bg-panel: #151a20;
      --bg-panel-soft: #101419;
      --border: #242c35;
      --border-strong: #313b46;
      --text: #edf2f7;
      --muted: #97a4b2;
      --accent: #d7e6f7;
    }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(180deg, #0b0d10 0%, #0e1216 100%); color: var(--text); }
    header { padding: 14px 18px; border-bottom: 1px solid var(--border); background: rgba(10, 12, 15, 0.96); position: sticky; top: 0; backdrop-filter: blur(10px); }
    main { padding: 18px; display: grid; gap: 16px; }
    .panel { background: linear-gradient(180deg, rgba(18,22,27,0.98) 0%, rgba(14,18,23,0.98) 100%); border: 1px solid var(--border); border-radius: 0; overflow: hidden; }
    .panel h2 { margin: 0; padding: 10px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--bg-elevated); }
    .content { padding: 14px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .card { background:var(--bg-panel-soft); border:1px solid var(--border); border-radius:0; padding:12px; }
    .muted { color:var(--muted); }
    code { background:var(--bg-panel-soft); border:1px solid var(--border); padding:2px 6px; border-radius:0; }
    ul { margin: 0; padding-left: 18px; }
    table { width:100%; border-collapse: collapse; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--border); vertical-align:top; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>HLF Transaction Detail</h1>
    <div class="muted" id="txSubtitle">Loading transaction...</div>
  </header>
  <main>
    <section class="panel">
      <h2>Overview</h2>
      <div class="content grid" id="txOverview"></div>
    </section>
    <section class="panel">
      <h2>Invocation</h2>
      <div class="content" id="txInvocation"></div>
    </section>
    <section class="panel">
      <h2>Write Set</h2>
      <div class="content" id="txWrites"></div>
    </section>
  </main>
  <script src="/labs/hlf/hlf_session.js"></script>
  <script src="/labs/hlf/hlf_transaction.js"></script>
</body>
</html>
