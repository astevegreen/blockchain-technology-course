<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HLF Chaincode Detail</title>
  <style>
    :root {
      --bg: #0b0d10;
      --bg-elevated: #11151a;
      --bg-panel: #151a20;
      --bg-panel-soft: #101419;
      --border: #242c35;
      --border-strong: #313b46;
      --text: #edf2f7;
      --muted: #97a4b2;
      --accent: #d7e6f7;
    }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(180deg, #0b0d10 0%, #0e1216 100%); color: var(--text); }
    header { padding: 14px 18px; border-bottom: 1px solid var(--border); background: rgba(10, 12, 15, 0.96); position: sticky; top: 0; backdrop-filter: blur(10px); }
    h1 { margin: 0; font-size: 20px; color: var(--accent); }
    main { padding: 18px; display:grid; gap:16px; }
    .panel { background: linear-gradient(180deg, rgba(18,22,27,0.98) 0%, rgba(14,18,23,0.98) 100%); border: 1px solid var(--border); border-radius: 0; overflow: hidden; }
    .panel h2 { margin: 0; padding: 10px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--bg-elevated); }
    .content { padding: 14px; }
    .card { background:var(--bg-panel-soft); border:1px solid var(--border); border-radius:0; padding:12px; margin-bottom:10px; }
    .muted { color:var(--muted); }
    code, pre { background:var(--bg-panel-soft); border:1px solid var(--border); border-radius:0; }
    code { padding:2px 6px; }
    pre { padding:12px; white-space:pre-wrap; word-break:break-word; }
    .btn { background:#1a2734; color:var(--accent); border:1px solid var(--border-strong); padding:8px 14px; cursor:pointer; font-size:13px; }
    .btn:hover { background:#22323f; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); display:none; align-items:flex-start; justify-content:center; z-index:1000; padding:40px 20px; overflow-y:auto; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--bg-panel); border:1px solid var(--border-strong); max-width:1100px; width:100%; max-height:calc(100vh - 80px); overflow-y:auto; }
    .modal-header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg-panel); }
    .modal-header h2 { margin:0; font-size:16px; color:var(--accent); }
    .modal-body { padding:14px 18px; }
    .modal-body details { margin-bottom:10px; border:1px solid var(--border); background:var(--bg-panel-soft); }
    .modal-body summary { padding:10px 12px; cursor:pointer; color:var(--accent); font-weight:600; }
    .modal-body summary .muted { font-weight:normal; margin-left:8px; }
    .modal-body pre { margin:0; border:none; border-top:1px solid var(--border); max-height:500px; overflow:auto; white-space:pre; }
  </style>
</head>
<body>
  <header>
    <h1>HLF Chaincode Detail</h1>
    <div class="muted">Lifecycle and policy inspection for the managed course chaincode.</div>
  </header>
  <main>
    <section class="panel">
      <h2>Summary</h2>
      <div class="content" id="summary">Loading chaincode details...</div>
    </section>
    <section class="panel">
      <h2>Installed Package <button class="btn" id="btnViewSource" style="float:right; margin:-4px 0;">View Source</button></h2>
      <div class="content" id="installed"></div>
    </section>
    <section class="panel">
      <h2>Committed Definitions</h2>
      <div class="content" id="committed"></div>
    </section>
    <section class="panel">
      <h2>Approved Definitions</h2>
      <div class="content" id="approved"></div>
    </section>
  </main>
  <div class="modal-overlay" id="sourceModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Chaincode Source</h2>
        <button class="btn" id="btnCloseModal">Close</button>
      </div>
      <div class="modal-body" id="sourceBody">Loading...</div>
    </div>
  </div>
  <script src="/labs/hlf/hlf_session.js"></script>
  <script src="/labs/hlf/hlf_chaincode.js"></script>
</body>
</html>
