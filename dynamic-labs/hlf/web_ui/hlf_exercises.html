<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HLF Guided Exercises</title>
  <style>
    :root {
      --bg: #0b0d10;
      --bg-elevated: #11151a;
      --bg-panel: #151a20;
      --bg-panel-soft: #101419;
      --border: #242c35;
      --border-strong: #313b46;
      --text: #edf2f7;
      --muted: #97a4b2;
      --accent: #d7e6f7;
      --accent-bg: #1a2734;
    }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(180deg, #0b0d10 0%, #0e1216 100%); color: var(--text); }
    header { padding: 14px 18px; border-bottom: 1px solid var(--border); background: rgba(10, 12, 15, 0.96); display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; position: sticky; top: 0; backdrop-filter: blur(10px); }
    h1 { margin: 0; font-size: 22px; color: var(--accent); }
    main { padding: 18px; display:grid; gap:16px; max-width: 980px; margin: 0 auto; }
    .intro { background:linear-gradient(180deg, rgba(18,22,27,0.98) 0%, rgba(14,18,23,0.98) 100%); border:1px solid var(--border); border-radius:0; padding:16px; }
    .sequence { display:grid; gap:16px; }
    .card { background:linear-gradient(180deg, rgba(18,22,27,0.98) 0%, rgba(14,18,23,0.98) 100%); border:1px solid var(--border); border-radius:0; overflow:hidden; }
    .card h2 { margin:0; padding:10px 12px; font-size:18px; border-bottom:1px solid var(--border); background: var(--bg-elevated); color: var(--accent); }
    .content { padding:14px; display:grid; gap:12px; }
    .chapter-card > .content { background:#121820; }
    .exercise-card { border-color:var(--border); background:var(--bg-panel-soft); }
    .exercise-card h2 { font-size:17px; }
    .section-title { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    ul { margin:0; padding-left:18px; }
    li { margin-bottom:6px; }
    .links { display:flex; flex-wrap:wrap; gap:8px; }
    .links a, .toolbar a { color:var(--accent); text-decoration:none; background:var(--accent-bg); padding:6px 10px; border-radius:0; font-size:13px; border:1px solid var(--border-strong); }
    .toolbar { display:flex; gap:8px; flex-wrap:wrap; }
    .muted { color:var(--muted); }
    .step-num { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:0; background:var(--accent-bg); color:#fff; margin-right:10px; font-size:13px; border:1px solid var(--border-strong); }
    .phase { display:inline-block; margin-top:10px; padding:4px 8px; border-radius:0; background:var(--accent-bg); color:var(--accent); font-size:12px; border:1px solid var(--border-strong); }
    code { background: var(--bg-panel-soft); border: 1px solid var(--border); padding: 1px 5px; font-size: 12px; }
    .code-block { position: relative; margin: 10px 0; background: #0c1014; border: 1px solid var(--border-strong); max-width: 100%; box-sizing: border-box; }
    .code-block pre { margin: 0; padding: 12px 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5; color: #dbe6f1; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
    .code-block pre code { background: transparent; border: 0; padding: 0; font-size: 13px; color: inherit; white-space: inherit; word-break: inherit; overflow-wrap: inherit; }
    .code-block .copy-btn { position: absolute; top: 6px; right: 6px; background: var(--bg-panel); color: var(--muted); border: 1px solid var(--border-strong); padding: 3px 9px; font-size: 11px; letter-spacing: 0.04em; cursor: pointer; text-transform: uppercase; opacity: 0; transition: opacity 120ms ease; }
    .code-block:hover .copy-btn, .code-block .copy-btn:focus-visible, .code-block .copy-btn.copied { opacity: 1; }
    .code-block .copy-btn:hover { background: var(--accent-bg); color: var(--accent); }
    .code-block .copy-btn.copied { background: #2e7d48; color: #fff; border-color: #2e7d48; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>HLF Guided Exercises</h1>
      <div id="introSummary" class="muted">Loading exercise track...</div>
    </div>
    <div class="toolbar">
      <a href="../" id="lessonLink">Back to Lesson</a>
    </div>
  </header>
  <main>
    <section id="intro" class="intro"></section>
    <section id="exerciseGrid" class="sequence"></section>
  </main>
  <script src="/labs/hlf/hlf_session.js"></script>
  <script src="/labs/hlf/progress_beacon.js"></script>
  <script src="/labs/hlf/hlf_markdown.js"></script>
  <script src="/labs/hlf/hlf_exercises.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var base = (window.HLFBase && window.HLFBase.resolve()) || '/labs/hlf';
      var lesson = document.getElementById('lessonLink');
      if (lesson) lesson.href = base + '/';
    });
  </script>
</body>
</html>
