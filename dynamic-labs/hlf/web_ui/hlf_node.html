<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HLF Node Detail</title>
  <style>
    :root {
      --bg: #0b0d10;
      --bg-elevated: #11151a;
      --bg-panel: #151a20;
      --bg-panel-soft: #101419;
      --border: #242c35;
      --border-strong: #313b46;
      --text: #edf2f7;
      --muted: #97a4b2;
      --accent: #d7e6f7;
      --accent-bg: #1a2734;
    }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(180deg, #0b0d10 0%, #0e1216 100%); color: var(--text); }
    header { padding: 14px 18px; border-bottom: 1px solid var(--border); background: rgba(10, 12, 15, 0.96); position: sticky; top: 0; backdrop-filter: blur(10px); }
    h1 { margin: 0; font-size: 20px; color: var(--accent); }
    main { padding: 18px; display:grid; gap:16px; }
    .panel { background: linear-gradient(180deg, rgba(18,22,27,0.98) 0%, rgba(14,18,23,0.98) 100%); border: 1px solid var(--border); border-radius: 0; overflow: hidden; }
    .panel h2 { margin: 0; padding: 10px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--bg-elevated); }
    .content { padding: 14px; }
    .stack { display:grid; gap:10px; }
    .card { background:var(--bg-panel-soft); border:1px solid var(--border); border-radius:0; padding:12px; }
    code { background:var(--bg-panel-soft); border:1px solid var(--border); padding:2px 6px; border-radius:0; }
    .muted { color:var(--muted); }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    a { color: var(--accent); background: var(--accent-bg); padding: 6px 10px; border: 1px solid var(--border-strong); text-decoration: none; border-radius: 0; display: inline-block; margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">HLF Node Detail</h1>
    <div id="subtitle" class="muted"></div>
    <p><a id="consoleLink" href="">Open node console</a></p>
  </header>
  <main>
    <section class="panel">
      <h2>Overview</h2>
      <div class="content stack" id="overview"></div>
    </section>

    <section class="panel">
      <h2>Runtime Environment</h2>
      <div class="content">
        <table>
          <thead>
            <tr><th>Environment Variable</th></tr>
          </thead>
          <tbody id="envTable"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <h2>Mounts</h2>
      <div class="content">
        <table>
          <thead>
            <tr><th>Source</th><th>Destination</th></tr>
          </thead>
          <tbody id="mountTable"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/labs/hlf/hlf_session.js"></script>
  <script src="/labs/hlf/hlf_node.js"></script>
</body>
</html>
