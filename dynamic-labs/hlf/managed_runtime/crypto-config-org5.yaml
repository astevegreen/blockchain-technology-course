# Managed HLF crypto-config for Org5 (Meridian Industries).
# Staged into fabric-samples/test-network/organizations/cryptogen/ by lab.sh
# during bootstrap so cryptogen generates MSP + TLS material for the read-only
# channel member. Meridian is a channel member but is excluded from chaincode
# endorsement by the configtx Application.Policies.Endorsement signature rule.
PeerOrgs:
  - Name: Org5
    Domain: meridian.example.com
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
    Users:
      Count: 1
