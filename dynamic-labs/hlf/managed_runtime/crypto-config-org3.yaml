# Managed HLF crypto-config for Org3 (South Hudson Institute of Technology).
# Staged into fabric-samples/test-network/organizations/cryptogen/ by lab.sh
# during bootstrap so cryptogen generates MSP + TLS material for the new org.
PeerOrgs:
  - Name: Org3
    Domain: southhudson.example.com
    EnableNodeOUs: true
    Template:
      Count: 1
      SANS:
        - localhost
    Users:
      Count: 1
