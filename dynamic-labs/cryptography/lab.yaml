# Lab manifest. Schema: dynamic-labs/lab.schema.json. Design: docs/student-launcher-design.md section 3.
# memory_mb and approx_download_mb are first estimates; the session that writes the launcher compose file refines them.
id: cryptography
title: Cryptography Lab
kind: lab
order:
  day: null
  position: 0
compose_project: crypto-lab
compose_file: docker-compose.yml
student_local: true
student_compose_file: docker-compose.launcher.yml
services:
  student:
    source: build
    context: .
    platforms:
    - linux/amd64
    - linux/arm64
networks:
- name: crypto-student-net
  internal: true
- name: crypto-instructor-net
  internal: true
routes:
- routes/cryptography.conf
uses_lane_service: true
entry:
  path: /labs/cryptography/
memory_mb: 1024
approx_download_mb: 400
data: []
keep_volumes_on_update: true
