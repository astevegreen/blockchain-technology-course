# Static pages for the day-5 Tron lab. The router sends /labs/tron/<path> here as /<path>.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    location / {
        try_files $uri $uri/ =404;
    }
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
