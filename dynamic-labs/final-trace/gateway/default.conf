# Static pages for the day-10 final trace. The router sends /labs/final-trace/<path> here as /<path>
# (all but /mempool/, which goes to the explorer).
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    location / {
        try_files $uri $uri/ =404;
    }
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}
