<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab queries</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 1.5rem; max-width: 110rem; }
  h1 { font-size: 1.4rem; margin-bottom: 0.2rem; }
  #as-of, #status, footer { color: #555; font-size: 0.9rem; }
  section { border-top: 1px solid #ccc; margin-top: 1.2rem; padding-top: 0.6rem; }
  h2 { font-size: 1.1rem; }
  pre { background: #f4f4f4; padding: 0.6rem; overflow-x: auto; font-size: 0.85rem; }
  .table-wrap { overflow-x: auto; max-height: 30rem; }
  table { border-collapse: collapse; font-size: 0.85rem; }
  th, td { border: 1px solid #ccc; padding: 0.2rem 0.5rem; text-align: left; white-space: nowrap; }
  th { background: #eee; position: sticky; top: 0; }
  td.null { color: #999; }
  .error { color: #a00; white-space: pre-wrap; }
</style>
</head>
<body>
<h1 id="title">Lab queries</h1>
<p id="as-of"></p>
<p id="status">Loading the database (about 35 MB, once)...</p>
<button id="run-all" type="button" disabled>Run every query</button>
<main id="queries"></main>
<footer id="engine"></footer>
<script type="module" src="app.js"></script>
</body>
</html>
