services:
  course-site:
    image: ${COURSE_SITE_IMAGE:-course-site-course-site:latest}
    pull_policy: never
    build:
      context: ../..
      dockerfile: dynamic-labs/course-site/Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-default}
    networks:
      - router-net

networks:
  router-net:
    external: true
