# Lab manifest. Schema: dynamic-labs/lab.schema.json. Design: docs/student-launcher-design.md section 3.
# Measured 10 Nov 2026 on a 16 GB Windows 11 PC with student release 2026.11.10-11. memory_mb: the most Docker memory this
# lab's own containers held while in use (MiB, rounded up to 10; the router and lane-service are counted in their own files).
# approx_download_mb: compressed linux/amd64 image layers, each counted once (MiB). The launcher only shows the pull.
id: explorer
title: Explorer Lab
kind: lab
order:
  day: 1
  position: 1
compose_project: explorer
compose_file: docker-compose.yml
student_local: true
student_compose_file: docker-compose.launcher.yml
services:
  anvil:
    source: build
    context: .
    dockerfile: launcher/anvil.Dockerfile
    platforms:
    - linux/amd64
    - linux/arm64
  gateway:
    source: build
    context: .
    dockerfile: launcher/gateway.Dockerfile
    platforms:
    - linux/amd64
    - linux/arm64
  otterscan:
    source: build
    context: .
    dockerfile: launcher/otterscan.Dockerfile
    platforms:
    - linux/amd64
    - linux/arm64
networks:
- name: router-net
  internal: false
routes:
- routes/explorer.conf
uses_lane_service: false
entry:
  path: /lab/
  port: 8441
memory_mb: 40
approx_download_mb: 329
data:
- path: ./chain
  into: /chain
  how: baked
- path: ./gateway/gateway.py
  into: /srv/gateway.py
  how: baked
- path: ./gateway/static
  into: /srv/static
  how: baked
- path: ./otterscan/default.conf
  into: /etc/nginx/conf.d/default.conf
  how: baked
- path: ./chain/sourcify
  into: /usr/share/nginx/html/sourcify
  how: baked
keep_volumes_on_update: true
