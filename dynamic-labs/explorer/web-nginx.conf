# Replaces /etc/nginx/conf.d/default.conf in the otterscan/otterscan:v2.11.0 image. It keeps the image's own
# locations and changes three things:
# 1. config.json names the explorer's own address. The file holds __EXPLORER_ORIGIN__, filled in here with the
#    scheme and name the browser used (the router passes both), so the explorer's calls to its node (/rpc) and
#    to its source copy (/sourcify) go back to the same site whatever the class reaches it by.
# 2. /sourcify answers a missing file with a plain 404. The image answers every missing file with its home page,
#    so asking for an ordinary account's source got HTML back and filled the console with "not valid JSON" errors
#    (docs/spikes/otterscan.md, "What the lab build must solve", point 3).
# 3. The image's cross-origin headers are left out: the explorer, its node and its source copy share one site.

# Read at http{} level (the image includes conf.d/*.conf there).
map $http_x_forwarded_proto $explorer_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen       80;
    server_name  _;

    gzip_static on;
    root /usr/share/nginx/html;

    location = /config.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '__EXPLORER_ORIGIN__' '$explorer_scheme://$http_host';
    }

    location /static {
        expires max;
    }

    location /signatures {
        expires 30d;
        default_type text/plain;
    }

    location /topic0 {
        expires 30d;
        default_type text/plain;
    }

    location /assets {
        expires 30d;
    }

    location /chains {
        expires 30d;
    }

    location /sourcify {
        try_files $uri =404;
    }

    location / {
        index  index.html;
        try_files $uri /index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
    }
}
