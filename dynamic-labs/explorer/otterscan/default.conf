# Replaces the Otterscan image's own nginx site (otterscan/otterscan:v2.11.0). Same file
# layout, without the open CORS headers (the browser loads everything from this one site),
# plus the /sourcify block: the image answers a missing file with its home page and a 200, so
# an ordinary account's "source" came back as HTML and filled the console with JSON errors.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    gzip_static on;

    location /static     { expires max; }
    location /signatures { expires 30d; default_type text/plain; }
    location /topic0     { expires 30d; default_type text/plain; }
    location /assets     { expires 30d; }
    location /chains     { expires 30d; }

    # The contracts' source, laid out as Sourcify stores it (chain/sourcify, mounted read-only).
    location /sourcify   { try_files $uri =404; }

    location / {
        index index.html;
        try_files $uri /index.html;
    }
}
