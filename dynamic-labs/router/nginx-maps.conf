# http{}-scope directives used by router locations.
#
# Mounted at /etc/nginx/conf.d/10-maps.conf by router/docker-compose.yml.

# Ethereum instructor-mode cookie: only honor it when the instructor
# auth cookie is also present.  Without this, a stale
# ethereum_instructor_mode=1 cookie with no valid hlf_instructor
# session produces a 401 loop.
map "$cookie_ethereum_instructor_mode:$cookie_hlf_instructor" $ethereum_instructor_valid {
    default         "";
    "~^1:.+"        "1";
}

map "$cookie_ethereum_instructor_mode:$cookie_hlf_instructor" $ethereum_instructor_clear_cookie {
    default         "";
    "1:"            "ethereum_instructor_mode=; Path=/labs/ethereum_lab/; Max-Age=0";
}

# Phase 8.5 — Cryptography lab Streamlit proxy.
# Originally an upstream block with cookie-hash sticky sessions, but
# nginx resolves upstream DNS at startup and crashes if the container
# is offline.  With a single backend the hash was a no-op anyway.
# Resolution is now deferred to request time via a variable proxy_pass
# and the Docker DNS resolver (see routes/cryptography.conf).
