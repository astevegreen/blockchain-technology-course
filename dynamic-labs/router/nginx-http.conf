server {
    server_name _;

    listen 80;
    listen [::]:80;

    # When nginx rewrites a relative `return 302 /path;` into an absolute
    # Location header, it uses $server_port — which breaks clients that
    # reach us through an outer proxy on a non-80 port (e.g. localhost:5555).
    # Emit relative Location headers so the browser resolves them against
    # the original request URL and preserves the outer host:port.
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 10m;

    # The labs' own ports (8441-8445, routes.conf) speak plain HTTP in this config.
    set $lab_scheme http;

    include /etc/nginx/routes.conf;
}

# The day-1 explorer lab on its own host name (routes/explorer-host.conf says why).
server {
    server_name ~^explorer\.;

    listen 80;
    listen [::]:80;
    # By IP address the class reaches this lab on its own port (routes.conf says why).
    listen 8441;
    listen [::]:8441;

    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 1m;

    include /etc/nginx/routes/explorer-host.conf;
}

