# The router on a student's own computer, started by the student launcher's control container
# (docs/student-launcher-design.md section 4). Standalone: the launcher runs only this file.
# The image is Dockerfile.launcher, baked with the local routes; nothing is bind-mounted.
# Only 127.0.0.1, plain HTTP. HTTP_PORT is 80, or 8480 when 80 is busy; 8441-8445 are fixed.
services:
  router:
    image: ${ROUTER_ROUTER_IMAGE:?}
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HTTP_PORT:?}:80"
      - "${HOST_BIND:-127.0.0.1}:8441-8445:8441-8445"
    networks:
      - public
      - router-net
      - consensus-student-net
      - consensus-instructor-net
      - bitcoin-student-mgmt-net
      - bitcoin-instructor-mgmt-net
      - crypto-student-net
      - crypto-instructor-net
      - hlf-student-term
      - hlf-instructor-term

networks:
  router-net:
    external: true
  consensus-student-net:
    external: true
  consensus-instructor-net:
    external: true
  bitcoin-student-mgmt-net:
    external: true
  bitcoin-instructor-mgmt-net:
    external: true
  crypto-student-net:
    external: true
  crypto-instructor-net:
    external: true
  hlf-student-term:
    external: true
  hlf-instructor-term:
    external: true
  public:
