# HTTPS redirect on (nginx-ssl.conf, every server): a cloud host with a domain
# (docker-compose.cloud.yml mounts this file). Plain port 80 answers only with a
# 301 to the same host and path over HTTPS, so a class code or instructor login
# never travels unencrypted. The Let's Encrypt certificate needs nothing here:
# deploy-cloud.sh runs certbot --standalone before the router starts.
if ($scheme = http) {
    return 301 https://$host$request_uri;
}
