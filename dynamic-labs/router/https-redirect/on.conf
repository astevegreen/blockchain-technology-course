# HTTPS redirect on (nginx-ssl.conf, every server): a cloud host with a domain
# (docker-compose.cloud.yml mounts this file). Plain port 80 answers only with a
# 301 to the same host and path over HTTPS, so a class code or instructor login
# never travels unencrypted.
#
# One path is let through: Let's Encrypt fetches its challenge token from
# http://<name>/.well-known/acme-challenge/ to issue and renew the certificate.
# certbot (deploy-cloud.sh, then certbot's renewal timer) writes the token into a
# webroot that docker-compose.cloud.yml mounts at /var/www/acme, so a renewal
# needs no downtime. The redirect runs at server level, before nginx picks a
# location, so the exception sits in its condition.
set $https_redirect $scheme;
if ($uri ~ "^/\.well-known/acme-challenge/") {
    set $https_redirect acme;
}
if ($https_redirect = http) {
    return 301 https://$host$request_uri;
}

location ^~ /.well-known/acme-challenge/ {
    # Let's Encrypt has no class pass: without this the class gate's server-level
    # auth_request (class-gate/on.conf) would refuse it.
    auth_request off;
    root /var/www/acme;
    default_type text/plain;
    try_files $uri =404;
}
