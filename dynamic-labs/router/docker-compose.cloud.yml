services:
  router:
    volumes:
      - /etc/letsencrypt/live/${DOMAIN:-localhost}/privkey.pem:/etc/nginx/certs/privkey.pem:ro
      - /etc/letsencrypt/live/${DOMAIN:-localhost}/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      # Replaces the base file's off.conf (compose merges volumes by container path).
      - ./https-redirect/on.conf:/etc/nginx/https-redirect.conf:ro
