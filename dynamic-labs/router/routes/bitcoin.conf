# Bitcoin lab (Phase 9.2c — lane-service managed).
#
# Students claim a session via /api/bitcoin/claim, which redirects
# to /labs/bitcoin/c/<uuid>/. The wrapper page (served by lane-service)
# shows a panel with mempool/explorer/peers links and iframes ttyd.
# Peers discover each other's wallet-address static web via a short
# uuid-prefix path (/labs/bitcoin/peer/<8-hex>/…) so the full ttyd
# path isn't leaked.
#
# /_auth/instructor and @instructor_login come from routes/_auth.conf.

# No-slash convenience redirect.
location = /labs/bitcoin {
    return 301 $scheme://$http_host/labs/bitcoin/;
}

# Landing page → claim
location = /labs/bitcoin/ {
    return 302 /api/bitcoin/claim;
}

# Lane-service API: claim, heartbeat, peers, instructor controls.
#
# /api/bitcoin/nuke tears down ~30 containers and compose-ups the
# core pair, which can easily breach the 60s default read timeout,
# so widen it for this location only.
location = /api/bitcoin/nuke {
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Phase 9.3g: forensics deploy streams a 131MB snapshot into a named
# volume via docker cp then recreates instructor + mempool — same
# long-running shape as /api/bitcoin/nuke.
location = /api/bitcoin/forensics/deploy {
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}

location ^~ /api/bitcoin/ {
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
}

# Wrapper page (served by lane-service Flask app)
location ~ ^/labs/bitcoin/c/(?<uuid>[0-9a-f-]+)/$ {
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Cookie $http_cookie;
}

# Student ttyd: resolve uuid → container, then proxy to ttyd:7681.
location ~ ^/labs/bitcoin/c/(?<uuid>[0-9a-f-]+)/ttyd(?<rest>/.*)?$ {
    auth_request /_resolve/bitcoin;
    auth_request_set $resolved_host $upstream_http_x_lane_host;

    proxy_pass http://$resolved_host:7681$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header Origin "";
}

# Student static web (wallet address, etc.): resolve uuid → container,
# proxy to :8000. Owner access via full uuid.
location ~ ^/labs/bitcoin/c/(?<uuid>[0-9a-f-]+)/static(?<rest>/.*)?$ {
    auth_request /_resolve/bitcoin;
    auth_request_set $resolved_host $upstream_http_x_lane_host;

    proxy_pass http://$resolved_host:8000$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# Peer static access via short uuid prefix. Only proxies :8000.
# Short path does NOT expose ttyd, limiting blast radius if guessed.
location ~ "^/labs/bitcoin/peer/(?<short>[0-9a-f]{8})(?<rest>/.*)?$" {
    auth_request /_resolve/bitcoin-peer;
    auth_request_set $resolved_host $upstream_http_x_lane_host;

    proxy_pass http://$resolved_host:8000$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# Resolve subrequest (owner, full uuid via cookie/URL).
location = /_resolve/bitcoin {
    internal;
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090/api/bitcoin/resolve;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Session-UUID $uuid;
    proxy_set_header Cookie $http_cookie;
}

# Resolve subrequest (peer, short id only).
location = /_resolve/bitcoin-peer {
    internal;
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090/api/bitcoin/resolve-short;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Peer-Short $short;
}

# Instructor admin console (HTML). Gated.
location = /labs/bitcoin/admin {
    auth_request /_auth/instructor;
    error_page 401 = @instructor_login;
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
}

# Instructor terminal: gated by the shared instructor cookie.
location = /labs/bitcoin/instructor {
    return 301 /labs/bitcoin/instructor/;
}
location ~ ^/labs/bitcoin/instructor(?<rest>/.*)?$ {
    auth_request /_auth/instructor;
    error_page 401 = @instructor_login;
    set $target_host "bitcoin-instructor-1";
    proxy_pass http://$target_host:7681$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header Origin "";
}

# Instructor static web: gated.
location ~ ^/labs/bitcoin/static-web-instructor(?<rest>/.*)?$ {
    auth_request /_auth/instructor;
    error_page 401 = @instructor_login;
    set $target_host "bitcoin-instructor-1";
    proxy_pass http://$target_host:8000$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

# Mempool UI + API. The upstream container is built with
# MEMPOOL_BASE_PATH=/labs/bitcoin/mempool, so its internal nginx
# expects the full prefix on every request and handles all path
# rewriting itself — no sub_filter needed at the outer router.
location ~ ^/labs/bitcoin/mempool(?<rest>/.*)?$ {
    set $target_host "bitcoin-mempool-1";
    proxy_pass http://$target_host:8080/labs/bitcoin/mempool$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header Origin "";
}

# Chain Graph (tx-graph explorer, bitcoin-graph container, port 8082).
# The app is subpath-aware (GRAPH_BASE_PATH=/labs/bitcoin/graph), so the
# full URI is forwarded unchanged. No auth gate here: enable/disable is
# enforced inside the app itself (instructor toggle via lane-service
# `docker exec graph-gate`), which also covers students curling the
# container directly from their lanes.
location ~ ^/labs/bitcoin/graph(/.*)?$ {
    set $target_host "bitcoin-graph-1";
    proxy_pass http://$target_host:8082;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# btc-explorer (port 8081 on mempool container).
# btc-rpc-explorer is configured with baseUrl=/labs/bitcoin/btc-explorer/
# and 302s any request whose path doesn't match that prefix back to its
# configured baseUrl. Forward the full URI unchanged (no $rest strip) so
# the app sees /labs/bitcoin/btc-explorer/... and serves 200 instead of
# redirecting into a loop.
location ~ ^/labs/bitcoin/btc-explorer(/.*)?$ {
    set $target_host "bitcoin-mempool-1";
    proxy_pass http://$target_host:8081;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

