    # The day-7 CoinJoin trace lab (coinjoin-trace/docker-compose.yml): one copy for the class. Its mempool image is
    # built with MEMPOOL_BASE_PATH=/labs/coinjoin-trace/mempool, so that path keeps its prefix; everything
    # else under /labs/coinjoin-trace/ is the lab's static gateway, prefix stripped.
    location ~ ^/labs/coinjoin-trace/?$ {
        return 302 $scheme://$http_host/labs/coinjoin-trace/lab/;
    }

    # A page folder typed without its slash: the gateway's own redirect would drop the /labs/coinjoin-trace prefix.
    location ~ ^/labs/coinjoin-trace/(?<page>lab|fallback|mempool)$ {
        return 301 $scheme://$http_host/labs/coinjoin-trace/$page/;
    }

    location ~ ^/labs/coinjoin-trace/mempool(?<rest>/.*)?$ {
        set $target_host "coinjoin-trace-mempool-1";
        proxy_pass http://$target_host:8080/labs/coinjoin-trace/mempool$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Origin "";
    }

    location ~ ^/labs/coinjoin-trace(?<rest>/.*)$ {
        set $target_host "coinjoin-trace-gateway-1";
        proxy_pass http://$target_host:8080$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
