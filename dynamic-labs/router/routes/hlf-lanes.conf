# Phase 7 per-student routing for the HLF lab.
#
# URL scheme: /labs/hlf/s/<id>/*  where <id> is s01..s30 (two-digit).
#
# All of these proxy to hlf-runner:8080 with two extras injected:
#   X-HLF-Student-Id: s07
#   X-Forwarded-Prefix: /labs/hlf/s/07
#
# Student identity is carried by the URL alone (resolved decision in
# hlf-phase7-classroom-plan.md §7 — no enrollment tokens for Phase 7).
#
# NOTE: include order matters. This file must be loaded *before*
# routes/hlf.conf so the lane-specific locations take precedence over
# the generic /labs/hlf(?<rest>/.*)? catch-all. nginx evaluates regex
# locations in the order they appear.

# Student entry point: /labs/hlf/claim claims or resumes a session and
# 302s to /labs/hlf/c/<uuid>/. The runner sets the hlf_session cookie
# on the response.
location = /labs/hlf/claim {
    set $target_host "hlf-hlf-runner-1";
    proxy_pass http://$target_host:8080/api/hlf/claim;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /labs/hlf;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
}

# Redirect bare /labs/hlf/c/<uuid> to /labs/hlf/c/<uuid>/ so relative
# links resolve correctly.
location ~ ^/labs/hlf/c/(?<cuuid>[0-9a-f-]+)$ {
    return 301 $scheme://$http_host/labs/hlf/c/$cuuid/;
}

# Per-session API.
location ~ ^/labs/hlf/c/(?<cuuid>[0-9a-f-]+)/api/hlf(?<rest>/.*)?$ {
    set $target_host "hlf-hlf-runner-1";
    proxy_pass http://$target_host:8080/api/hlf$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-HLF-Session $cuuid;
    proxy_set_header X-Forwarded-Prefix /labs/hlf/c/$cuuid;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
}

# Per-session terminal: runner resolves session -> station and returns
# an iframe wrapper so the address bar stays at the session URL.
location ~ ^/labs/hlf/c/(?<cuuid>[0-9a-f-]+)/term(?<rest>/.*)?$ {
    set $target_host "hlf-hlf-runner-1";
    proxy_pass http://$target_host:8080/api/hlf/term-redirect$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-HLF-Session $cuuid;
    proxy_set_header X-Forwarded-Prefix /labs/hlf/c/$cuuid;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
}

# Catch-all for the shared HLF UI rendered under the per-session prefix.
location ~ ^/labs/hlf/c/(?<cuuid>[0-9a-f-]+)(?<rest>/.*)?$ {
    set $target_host "hlf-hlf-1";
    proxy_pass http://$target_host:8080$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-HLF-Session $cuuid;
    proxy_set_header X-Forwarded-Prefix /labs/hlf/c/$cuuid;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
}

# Forgive /labs/hlf/s/<UUID>/term → /labs/hlf/c/<UUID>/term. The /s/
# form is station-scoped (sNN); a UUID in that slot is a user mistake.
# Must come before the /s/sNN/term location so nginx picks this first.
location ~ "^/labs/hlf/s/(?<maybe_uuid>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?<rest>/.*)?$" {
    return 302 $scheme://$http_host/labs/hlf/c/$maybe_uuid$rest;
}

# Redirect bare /labs/hlf/s/<id> to /labs/hlf/s/<id>/ so relative links
# resolve correctly.
location ~ ^/labs/hlf/s/(?<sid>s[0-9][0-9])$ {
    return 301 $scheme://$http_host/labs/hlf/s/$sid/;
}

# Per-student API.
location ~ ^/labs/hlf/s/(?<sid>s[0-9][0-9])/api/hlf(?<rest>/.*)?$ {
    set $target_host "hlf-hlf-runner-1";
    proxy_pass http://$target_host:8080/api/hlf$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-HLF-Student-Id $sid;
    proxy_set_header X-Forwarded-Prefix /labs/hlf/s/$sid;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
}

# Bare /labs/hlf/s/<sid>/term (no trailing slash) → redirect with slash.
# Without this, the rewrite-to-$rest pattern below would pass an empty URI
# to ttyd and produce a 500. Must appear before the generic /term(/.*)? rule.
location ~ ^/labs/hlf/s/(?<sid_noslash>s[0-9][0-9])/term$ {
    return 301 $scheme://$http_host/labs/hlf/s/$sid_noslash/term/;
}

# Per-student terminal. ttyd runs directly inside each student peer
# container on port 7681, reachable via the hlf-student-term network.
location ~ ^/labs/hlf/s/s(?<nn>[0-9][0-9])/term(?<rest>/.*)?$ {
    set $target_host "peer0.student${nn}.example.com";
    rewrite ^/labs/hlf/s/s[0-9][0-9]/term(/.*)?$ $1 break;
    proxy_pass http://$target_host:7681;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header Origin "";
}

# Catch-all for the shared HLF UI rendered under the per-student prefix.
# The UI is identical across students; exercise text + linkouts vary by
# the X-HLF-Student-Id header the runner reads.
location ~ ^/labs/hlf/s/(?<sid>s[0-9][0-9])(?<rest>/.*)?$ {
    set $target_host "hlf-hlf-1";
    proxy_pass http://$target_host:8080$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-HLF-Student-Id $sid;
    proxy_set_header X-Forwarded-Prefix /labs/hlf/s/$sid;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
}
