# The day-4 exchange lab (dynamic-labs/dex), its L1 chain, on its own host name: dex.localhost,
# dex.lab, dex.<domain>. Otterscan is a single-page app that expects to sit at the
# root of a site, so it gets a host of its own instead of a /labs/ path.
# Included from the dex server{} in nginx-ssl.conf and nginx-http.conf.
resolver 127.0.0.11 valid=10s;

# The gateway: the node (read methods and signed transactions only; /rpc-l2 is the L2 node, for
# the swap page), Otterscan's config, and the lab's own pages (worksheet, swap page, saved pages).
location ~ ^/(rpc$|rpc-l2$|config\.json|lab/|lab$|sign/|sign$|fallback/|fallback$|vendor/|healthz$) {
    set $target_host "dex-gateway-1";
    proxy_pass http://$target_host:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Everything else is the explorer itself.
location / {
    set $target_host "dex-otterscan-1";
    proxy_pass http://$target_host:80;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
