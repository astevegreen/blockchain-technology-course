    # The days 6-7 team game "Hide and trace" (hide-and-trace/docker-compose.yml): one copy for the class, one
    # container. Its mempool explorer keeps the /labs/hide-and-trace/mempool prefix (MEMPOOL_BASE_PATH); the game
    # server (hide-and-trace/game/server.py) answers under /labs/hide-and-trace/game/, prefix stripped. The
    # instructor page and API are gated here by the shared instructor cookie, and the server checks it again.
    location ~ ^/labs/hide-and-trace/?$ {
        return 302 $scheme://$http_host/labs/hide-and-trace/game/;
    }

    location ~ ^/labs/hide-and-trace/(?<page>game|mempool|game/instructor)$ {
        return 301 $scheme://$http_host/labs/hide-and-trace/$page/;
    }

    location ~ ^/labs/hide-and-trace/mempool(?<rest>/.*)?$ {
        set $target_host "hide-and-trace-mempool-1";
        proxy_pass http://$target_host:8080/labs/hide-and-trace/mempool$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Origin "";
    }

    location ~ ^/labs/hide-and-trace/game(?<rest>/instructor/.*)$ {
        auth_request /_auth/instructor;
        error_page 401 = @instructor_login;
        set $target_host "hide-and-trace-mempool-1";
        proxy_pass http://$target_host:8090$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location ~ ^/labs/hide-and-trace/game(?<rest>/.*)$ {
        set $target_host "hide-and-trace-mempool-1";
        proxy_pass http://$target_host:8090$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
