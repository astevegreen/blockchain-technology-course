# Class gate: one class code per class (instructor_auth_service/class_gate.py).
#
# Included inside every server{} block: routes.conf (the main host) and each lab
# host conf (explorer, tokens, dex, dex-l2), so a student who enters the code on
# one host carries the pass to the others (the cookie sits on the parent domain).
#
# Whether the gate is on comes from /etc/nginx/class-gate.conf, which
# docker-compose.yml mounts from class-gate/on.conf or class-gate/off.conf by
# CLASS_GATE (lab-manager.sh --class-gate; deploy-cloud.sh turns it on). When on,
# it adds a server-level `auth_request /_auth/class`. nginx applies a server-level
# auth_request only to locations without one of their own, so:
#   - locations gated by `auth_request /_auth/instructor` need the instructor
#     cookie, which also passes the class gate;
#   - locations gated by a lane-service `/_resolve/<lab>` subrequest rely on the
#     lane-service checking the pass itself (lane-service/instructor_auth.py);
#   - the pages below, the instructor portal and the login redirects say
#     `auth_request off;` so a student without a pass can reach the code page.

# Subrequest target: 200 with a valid class pass or instructor cookie, else 403.
location = /_auth/class {
    internal;
    set $class_auth_host "instructor-auth-service";
    proxy_pass http://$class_auth_host:8080/api/class/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    # One page load with many assets asks once; a code change takes effect
    # within 5 seconds.
    proxy_cache class_pass_cache;
    proxy_cache_key "$cookie_class_pass|$cookie_hlf_instructor";
    proxy_cache_valid 200 403 5s;
    proxy_cache_lock on;
}

# No pass: remember where the student was going (GET pages only), then show the
# code page. Reached through `error_page 403 = @class_login`.
location @class_login {
    auth_request off;
    set $class_login_host "instructor-auth-service";
    proxy_pass http://$class_login_host:8080/api/class/return-to;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header Origin "";
}

# The code page and its API. `^~` keeps the lab hosts' regex locations from
# taking these paths.
location = /class {
    auth_request off;
    return 301 /class/;
}

location ^~ /class/ {
    auth_request off;
    set $class_page_host "instructor-auth-service";
    proxy_pass http://$class_page_host:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
}

location ^~ /api/class/ {
    auth_request off;
    set $class_api_host "instructor-auth-service";
    proxy_pass http://$class_api_host:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
}

include /etc/nginx/class-gate.conf;
