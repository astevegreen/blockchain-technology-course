# The day-4 exchange lab (dynamic-labs/dex), its L2 chain, on its own host name: dex-l2.localhost,
# dex-l2.lab, dex-l2.<domain>. Otterscan is a single-page app that expects to sit at the
# root of a site, so it gets a host of its own instead of a /labs/ path.
# Included from the dex-l2 server{} in nginx-ssl.conf and nginx-http.conf.
resolver 127.0.0.11 valid=10s;

# The gateway: the node (read methods and signed transactions only), Otterscan's config,
# and the lab's own pages (the same lab pages as L1).
location ~ ^/(rpc$|config\.json|lab/|lab$|sign/|sign$|fallback/|fallback$|vendor/|healthz$) {
    set $target_host "dex-gateway-l2-1";
    proxy_pass http://$target_host:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Everything else is the explorer itself: the same Otterscan copy as L1, reading L2 through this host's config.
location / {
    set $target_host "dex-otterscan-1";
    proxy_pass http://$target_host:80;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
