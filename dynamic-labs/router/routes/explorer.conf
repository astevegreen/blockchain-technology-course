# The course chain explorer (dynamic-labs/explorer/), served on its own name: the explorer.* server blocks in
# nginx-http.conf and nginx-ssl.conf include this file, and routes.conf does not. Otterscan v2.11.0 cannot be
# served from a sub-folder: its links and its config.json path assume the site root.
#
# Variable-based proxy_pass defers DNS resolution to request time, so the router starts even when the explorer
# lab is not running.
resolver 127.0.0.11 valid=10s;

# The browser's calls to the node go to the read-only filter, never to Anvil itself.
location = /rpc {
    set $explorer_rpc "explorer-rpc-1";
    proxy_pass http://$explorer_rpc:8545;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 64k;
}

# Otterscan's web app. It builds its config.json from the name and scheme the browser used, so pass both on.
location / {
    set $explorer_web "explorer-web-1";
    proxy_pass http://$explorer_web:80;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
