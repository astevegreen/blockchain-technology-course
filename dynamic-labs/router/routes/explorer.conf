    # The day-1 explorer lab lives on its own host (routes/explorer-host.conf); the course
    # site links here, so the link works on every host the class uses. An IP address has no
    # explorer.<host>, so there the lab is the same server on a port of its own: 8441 (explorer),
    # 8442 (tokens), 8443 (dex), 8444 (dex-l2); nginx-http.conf and nginx-ssl.conf listen on them
    # and set $lab_scheme to what those ports speak.
    location ~ ^/labs/explorer/?$ {
        if ($host ~ "^[0-9.]+$|^\[") {
            return 302 $lab_scheme://$host:8441/lab/;
        }
        return 302 $scheme://explorer.$http_host/lab/;
    }
