# Shared instructor auth snippet.
#
# Included from routes.conf so every lab's `auth_request /_auth/instructor`
# and `error_page 401 = @instructor_login` / `@hlf_api_unauth` resolve
# identically without copy-pasting the block per lab. Phase 8.1 extracted
# this from routes/hlf.conf. Subsequent consolidation sub-phases
# (8.2–8.6) rely on the named locations + subrequest target existing
# here.
#
# Named locations (@instructor_login, @hlf_api_unauth) live at server{}
# scope, so this file must be included inside the server block (it is,
# via routes.conf).

# Unauthenticated browsers hitting an instructor HTML surface bounce through the
# shared auth service. The service validates the original path, stores it in a
# short-lived signed HttpOnly return-to cookie, and then redirects to the shared
# portal. We intentionally avoid visible `next=` query parameters here.
location @instructor_login {
    set $login_host "instructor-auth-service";
    proxy_pass http://$login_host:8080/api/instructor/return-to;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header Origin "";
}

# JSON-shaped 401 for API consumers. Tooling (and browser fetch that
# sets `Accept: application/json`) gets a machine-readable body instead
# of an HTML redirect.
location @hlf_api_unauth {
    default_type application/json;
    return 401 '{"error":"instructor auth required"}';
}

# Subrequest target. Returns 200/401 based on the instructor cookie.
# Cached 5s keyed on cookie value so one page load with N assets
# doesn't fan out into N subrequests.
location = /_auth/instructor {
    internal;
    # Distinct variable name: `$target_host` leaks into the parent
    # request's scope, so the calling location's upstream hostname
    # would get clobbered if we reused it here.
    set $auth_host "instructor-auth-service";
    proxy_pass http://$auth_host:8080/api/instructor/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Host $host;

    proxy_cache instructor_auth_cache;
    proxy_cache_key "$cookie_hlf_instructor";
    proxy_cache_valid 200 401 5s;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout;
}
