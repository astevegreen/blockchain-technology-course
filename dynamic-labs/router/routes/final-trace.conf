    # The day-10 final trace (final-trace/docker-compose.yml): one copy for the class. Its explorer keeps the
    # /labs/final-trace/mempool prefix (MEMPOOL_BASE_PATH); everything else is the lab's page, prefix stripped.
    location ~ ^/labs/final-trace/?$ {
        return 302 $scheme://$http_host/labs/final-trace/lab/;
    }

    # A page folder typed without its slash: the page's own redirect would drop the /labs/final-trace prefix.
    location ~ ^/labs/final-trace/(?<page>lab|query|fallback|fallback/tron|snapshot|mempool)$ {
        return 301 $scheme://$http_host/labs/final-trace/$page/;
    }

    location ~ ^/labs/final-trace/mempool(?<rest>/.*)?$ {
        set $target_host "final-trace-mempool-1";
        proxy_pass http://$target_host:8080/labs/final-trace/mempool$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Origin "";
    }

    location ~ ^/labs/final-trace(?<rest>/.*)$ {
        set $target_host "final-trace-page-1";
        proxy_pass http://$target_host:8080$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
