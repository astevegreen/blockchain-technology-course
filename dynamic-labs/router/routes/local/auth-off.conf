# Student launcher (local mode): replaces routes/_auth.conf in Dockerfile.launcher.
# No instructor auth service runs on a student's own computer, but each lab's instructor route still asks
# /_auth/instructor first. Asking a service that isn't there made those routes answer 500; this answers
# "not signed in", and the login bounce answers 404, the same as /instructor/ (staff-pages-off.conf).
location @instructor_login {
    auth_request off;
    return 404;
}

location @hlf_api_unauth {
    default_type application/json;
    return 401 '{"error":"instructor auth required"}';
}

location = /_auth/instructor {
    internal;
    return 401;
}
