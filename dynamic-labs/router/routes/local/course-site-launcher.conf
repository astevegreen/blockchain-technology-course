# Student launcher (local mode): replaces routes/course-site.conf in Dockerfile.launcher.
# No course-site locally (the lessons are on Pages): / is the control page, which the
# control container serves as course-launcher on router-net.
    location = /favicon.ico {
        return 404;
    }

    location = /favicon.svg {
        return 404;
    }

    location / {
        set $target_host "course-launcher";
        proxy_pass http://$target_host:8470;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
    }
