# Student launcher (local mode): replaces routes/quiz-engine-v2.conf in Dockerfile.launcher.
# Quizzes run in class, not on a student's own computer, so each location answers 404.
    location = /quiz {
        return 404;
    }

    location = /quiz/instructor/ {
        return 404;
    }

    location ~ ^/quiz/instructor(?<rest>/.*)?$ {
        return 404;
    }

    location ~ ^/quiz(?<rest>/.*)?$ {
        return 404;
    }
