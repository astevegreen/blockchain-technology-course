# Student launcher (local mode): replaces routes/_instructor.conf in Dockerfile.launcher.
# There are no instructor surfaces on a student's own computer, so each location answers 404.
    location = /instructor {
        return 404;
    }

    location ~ ^/instructor/labs-progress(?<rest>/.*)?$ {
        return 404;
    }

    location ~ ^/api/portal(?<rest>/.*)?$ {
        return 404;
    }

    location ~ ^/instructor(?<rest>/.*)?$ {
        return 404;
    }

    location ~ ^/api/instructor(?<rest>/.*)?$ {
        return 404;
    }
