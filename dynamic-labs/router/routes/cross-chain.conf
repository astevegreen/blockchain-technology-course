    # The day-8 cross-chain lab (cross-chain/docker-compose.yml): one copy for the class, its pages under
    # /labs/cross-chain/, prefix stripped.
    location ~ ^/labs/cross-chain/?$ {
        return 302 $scheme://$http_host/labs/cross-chain/lab/;
    }

    # A page folder typed without its slash: the page's own redirect would drop the /labs/cross-chain prefix.
    location ~ ^/labs/cross-chain/(?<page>lab|query|fallback|snapshot)$ {
        return 301 $scheme://$http_host/labs/cross-chain/$page/;
    }

    location ~ ^/labs/cross-chain(?<rest>/.*)$ {
        set $target_host "cross-chain-page-1";
        proxy_pass http://$target_host:8080$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
