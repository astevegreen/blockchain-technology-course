# Ethereum lab — lane-service managed (replaces the Phase 7.5 single
# instructor-gated proxy). Architecture:
#   - one shared instructor container runs the hardhat node + the SPA's
#     trainer surface; reachable on ethereum-instructor-mgmt-net.
#   - per-student "lane" containers run MODE=student (same image): the
#     SPA + lab-API + ttyd. lane-service spawns them on /claim and
#     publishes container hostname via /_resolve/ethereum.
#
# The student SPA is built with VITE_BASE_PATH=/labs/ethereum_lab/, so
# every fetch is prefix-relative. We strip the prefix before proxying
# to the lane (which serves dist at root).
#
# /_auth/instructor + @instructor_login come from routes/_auth.conf.

location = /labs/ethereum_lab {
    return 301 $scheme://$http_host/labs/ethereum_lab/;
}

location = /labs/ethereum_lab/ {
    error_page 418 = @ethereum_instructor_mode;
    if ($arg_mode = instructor) {
        return 418;
    }

    auth_request /_resolve/ethereum;
    error_page 401 = @ethereum_claim;
    auth_request_set $resolved_host $upstream_http_x_lane_host;
    auth_request_set $is_instructor $upstream_http_x_instructor_verified;

    proxy_pass http://$resolved_host:5173/$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Instructor $is_instructor;
    proxy_set_header Origin "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_intercept_errors on;
    error_page 502 504 = @ethereum_starting;
}

# Instructor admin console (HTML). Gated.
location = /labs/ethereum/admin {
    auth_request /_auth/instructor;
    error_page 401 = @instructor_login;
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
}

# Lane-service API surface (claim, heartbeat, instructor list/start/etc.)
location ^~ /api/ethereum/ {
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
}

# Browser-side JSON-RPC. Ungated — every student dials this from the
# SPA. The instructor's in-container nginx adds the CORS headers; we
# pass through to :8080/rpc.
location = /labs/ethereum_lab/rpc {
    set $target_host "ethereum-trainer-instructor";
    proxy_pass http://$target_host:8080/rpc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Origin "";
}

# Instructor Trainer UI alias. The canonical instructor URL remains
# /labs/ethereum_lab/?mode=instructor; this path just redirects there
# after cookie verification.
location = /labs/ethereum_lab/instructor {
    auth_request /_auth/instructor;
    error_page 401 = @instructor_login;
    return 302 /labs/ethereum_lab/instructor/;
}
location = /labs/ethereum_lab/instructor/ {
    auth_request /_auth/instructor;
    error_page 401 = @instructor_login;
    return 302 /labs/ethereum_lab/?mode=instructor;
}

# Resolve subrequest: cookie → station → container hostname. Returns
# 401 with no cookie so the named @ethereum_claim location kicks in.
location = /_resolve/ethereum {
    internal;
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090/api/ethereum/resolve;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
}

# Unauthenticated landing → mint a session.
location @ethereum_claim {
    add_header Set-Cookie $ethereum_instructor_clear_cookie always;
    return 302 /api/ethereum/claim;
}

location @ethereum_instructor_mode {
    auth_request /_auth/instructor;
    error_page 401 = @instructor_login;
    add_header Set-Cookie "ethereum_instructor_mode=1; Path=/labs/ethereum_lab/; SameSite=Lax" always;

    set $eth_instructor "ethereum-trainer-instructor";
    rewrite ^/labs/ethereum_lab(?<rest>/.*)?$ $rest break;
    proxy_pass http://$eth_instructor:5173$uri$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Instructor 1;
    proxy_set_header Origin "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Catch-all for the student SPA (and ws/terminal, lab-api, assets).
# Strips the /labs/ethereum_lab/ prefix because the lane's
# frontend-server serves dist at /; the SPA was built with base
# /labs/ethereum_lab/, so its asset URLs come back to us at this
# prefix and we hand them to the lane unprefixed.
location ~ ^/labs/ethereum_lab(?<rest>/.*)?$ {
    # Only enter instructor mode if both the cookie AND a valid
    # instructor session are present (map in nginx-maps.conf).
    # Stale cookie without session falls through to the student path.
    error_page 418 = @ethereum_instructor_mode;
    if ($ethereum_instructor_valid = 1) {
        return 418;
    }

    add_header Set-Cookie $ethereum_instructor_clear_cookie always;

    auth_request /_resolve/ethereum;
    error_page 401 = @ethereum_claim;
    auth_request_set $resolved_host $upstream_http_x_lane_host;
    # Phase 9.4: lane-service's resolve also reports whether the
    # caller's hlf_instructor cookie verifies. Forward it as
    # `X-Instructor: 1|0` so lab-api can gate /lab-api/fund-requests
    # without an in-container IP allowlist.
    auth_request_set $is_instructor $upstream_http_x_instructor_verified;

    proxy_pass http://$resolved_host:5173$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Instructor $is_instructor;
    proxy_set_header Origin "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_intercept_errors on;
    error_page 502 504 = @ethereum_starting;
}

location @ethereum_starting {
    default_type text/html;
    return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Starting lab\u2026</title>
<meta http-equiv="refresh" content="3">
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0d10;color:#edf2f7;font-family:system-ui,sans-serif}
.wrap{text-align:center;max-width:420px;padding:2rem}h1{color:#60a5fa;font-size:1.4rem;margin:0 0 .75rem}
p{color:#94a3b8;font-size:.9rem;line-height:1.6}
.spinner{width:32px;height:32px;border:3px solid #1e293b;border-top-color:#60a5fa;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1.5rem}
@keyframes spin{to{transform:rotate(360deg)}}</style></head>
<body><div class="wrap"><div class="spinner"></div><h1>Preparing your lab environment\u2026</h1>
<p>The container is starting up. This page will refresh automatically.</p></div></body></html>';
}
