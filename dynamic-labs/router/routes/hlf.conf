# HLF lab routes (shared / non-per-student).
# Per-student routing lives in routes/hlf-lanes.conf.
#
# Shared auth snippet (@instructor_login, @hlf_api_unauth,
# /_auth/instructor) moved to routes/_auth.conf in Phase 8.1 and is
# included once from routes.conf.

location = /labs/hlf {
    return 301 $scheme://$http_host/labs/hlf/;
}

# Bare /labs/hlf/ gates on an hlf_session cookie:
#   - cookie present → hop straight to the user's lane at /labs/hlf/c/<uuid>/
#   - cookie missing → send to the claim flow (which mints a station and
#     bounces back to /labs/hlf/c/<uuid>/).
# "Cookie present" is accepted at face value. A stale/invalid uuid just
# drops the user into a lane page with no live backend; they can click
# "claim" to rotate. Strict server validation would require an
# auth_request round-trip, which we skip for this hot path.
location = /labs/hlf/ {
    if ($cookie_hlf_session = "") {
        return 302 $scheme://$http_host/labs/hlf/claim;
    }
    return 302 $scheme://$http_host/labs/hlf/c/$cookie_hlf_session/;
}

# Preview / unclaimed users hitting the legacy shared-terminal URL get
# nudged to /labs/hlf/claim instead of a 404. Phase 7 uses per-student
# lanes, so there is no shared terminal anymore.
location = /labs/hlf/term {
    return 302 $scheme://$http_host/labs/hlf/claim;
}
location = /labs/hlf/term/ {
    return 302 $scheme://$http_host/labs/hlf/claim;
}

# Public read-only HLF API surface. Explicit allowlist: any mutating
# endpoint — or a future read endpoint we haven't listed — falls through
# to the instructor-gated catch-all below. This is the opt-OUT posture
# (new routes default to gated), which is what we want for an admin API.
#
# The per-session (/labs/hlf/c/<uuid>/api/hlf/*) and per-station
# (/labs/hlf/s/<sid>/api/hlf/*) routes in routes/hlf-lanes.conf remain
# open because students legitimately call them; @require_instructor in
# Flask still gates mutating endpoints at the runner layer.
location ~ ^/labs/hlf/api/hlf/(status|health|guide|exercises|explorer|explorer-view|chaincode|governance|transactions|assets|node-context|term-redirect|logs)(?<rest>/.*)?$ {
    set $target_host "hlf-hlf-runner-1";
    rewrite ^/labs/hlf/(.*)$ /$1 break;
    proxy_pass http://$target_host:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /labs/hlf;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
}

# Student governance uses the shared path (outside /c/<uuid>/...) so
# the active-claims helper must also be reachable on the shared API
# surface. Flask still verifies that callers present either a live
# student session or a valid instructor cookie.
location = /labs/hlf/api/hlf/claims/active {
    set $target_host "hlf-hlf-runner-1";
    rewrite ^/labs/hlf/(.*)$ /$1 break;
    proxy_pass http://$target_host:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /labs/hlf;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
}

# Instructor-gated HLF API catch-all. Belt-and-suspenders over the
# Flask @require_instructor decorators: a decorator forgotten on a
# future mutating route gets caught here instead of silently shipping.
location ~ ^/labs/hlf/api/hlf(?<rest>/.*)?$ {
    auth_request /_auth/instructor;
    error_page 401 = @hlf_api_unauth;
    set $target_host "hlf-hlf-runner-1";
    proxy_pass http://$target_host:8080/api/hlf$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Forwarded-Prefix /labs/hlf;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
}

# Phase 7.4 — Employer/orderer consoles moved behind /instructor/term/*.
# Still unauthenticated at the nginx layer (auth lands in Phase 7.5);
# the move just keeps the URL out of student-facing discovery paths.
# Student shells live at /labs/hlf/s/<sid>/term/* (see routes/hlf-lanes.conf).
location ~ ^/labs/hlf/instructor/term/org1(?<rest>/.*)?$ {
    auth_request /_auth/instructor;
    error_page 401 = @instructor_login;
    set $target_host "peer0.cascadiastate.example.com";
    rewrite ^/labs/hlf/instructor/term/org1(/.*)?$ $1 break;
    proxy_pass http://$target_host:7681;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header Origin "";
}

