# Consortium consoles are instructor-only. The interactive ttyd
# terminals inside are already gated via /instructor/term/* above; this
# block keeps the wrapper HTML aligned with that policy.
location ~ ^/labs/hlf/peer/org[1-5]/console(?<rest>/.*)?$ {
    auth_request /_auth/instructor;
    error_page 401 = @instructor_login;
    set $target_host "hlf-hlf-1";
    rewrite ^/labs/hlf(/peer/org[1-5]/console.*)$ $1 break;
    proxy_pass http://$target_host:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /labs/hlf;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
}

# Read-only node detail pages are part of the shared explorer surface,
# so students must be able to open them directly from the topology view.
location ~ ^/labs/hlf/peer/org[1-5](?<rest>/.*)?$ {
