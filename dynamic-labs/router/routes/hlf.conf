# Instructor HTML/JS are served by the runner so @require_instructor
# gates them server-side. Must precede the /labs/hlf catch-all.
location ~ ^/labs/hlf/(hlf_instructor\.html|hlf_instructor\.js|hlf_session\.js)$ {
    set $target_host "hlf-hlf-runner-1";
    rewrite ^/labs/hlf/(.*)$ /$1 break;
    proxy_pass http://$target_host:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Prefix /labs/hlf;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
}

# Catch-all for the shared HLF UI (explorer, static assets, chaincode
# source, etc.). The per-student surface at /labs/hlf/s/<id>/* is
# handled first in routes/hlf-lanes.conf (include order matters).
location ~ ^/labs/hlf(?<rest>/.*)?$ {
    set $target_host "hlf-hlf-1";
    proxy_pass http://$target_host:8080$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Forwarded-Prefix /labs/hlf;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
}
