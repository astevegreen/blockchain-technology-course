# The day-3 token lab (dynamic-labs/tokens) on its own host name: tokens.localhost,
# tokens.lab, tokens.<domain>. Otterscan is a single-page app that expects to sit at the
# root of a site, so it gets a host of its own instead of a /labs/ path.
# Included from the tokens server{} in nginx-ssl.conf and nginx-http.conf.
resolver 127.0.0.11 valid=10s;

# The gateway: the node (read methods and signed transactions only), Otterscan's config,
# and the lab's own pages (worksheet, mint page, saved explorer pages).
location ~ ^/(rpc$|config\.json|lab/|lab$|sign/|sign$|fallback/|fallback$|vendor/|healthz$) {
    set $target_host "tokens-gateway-1";
    proxy_pass http://$target_host:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Everything else is the explorer itself.
location / {
    set $target_host "tokens-otterscan-1";
    proxy_pass http://$target_host:80;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
