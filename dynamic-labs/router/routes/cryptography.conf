# Cryptography lab (Phase 8.5 consolidation).
#
# Retired the per-lab crypto-lab-router-1 nginx. Outer router now
# proxies directly to the shared Streamlit student app and the instructor
# container on split --internal networks.
#
# The landing page (location = below) sets a random crypto_lab_session
# cookie client-side, then redirects to the shared Streamlit app. The
# cookie is used for per-session progress tracking, not backend
# selection.

# Lane-service API for cryptography: progress beacon + instructor
# summary. Phase 9.3d. No claim/lane routes — cryptography containers
# are managed by the per-lab compose file, not the lane-service.
# ^~ prevents the root /api regex catch-all from intercepting.
location ^~ /api/cryptography/ {
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# Cryptography admin console (HTML). Cryptography has no lanes, so the
# page served here is a progress-only view — aggregate counts plus a
# clickable card per session for timeline + unvisited drilldown.
location = /labs/cryptography/admin {
    auth_request /_auth/instructor;
    error_page 401 = @instructor_login;
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
}

# No-slash convenience redirect.
location = /labs/cryptography {
    return 301 $scheme://$http_host/labs/cryptography/;
}

# Landing page: set crypto_lab_session cookie if absent, then redirect into
# the Streamlit app. Served inline from nginx — no backend needed, so
# works before any Streamlit container is up.
location = /labs/cryptography/ {
    default_type text/html;
    return 200 '<!doctype html>
<meta charset="utf-8">
<title>Loading cryptography lab…</title>
<script>
(function () {
  var m = document.cookie.match(/(?:^|;\\s*)crypto_lab_session=([^;]+)/);
  if (!m) {
    var id = (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : String(Date.now()) + "-" + Math.random().toString(36).slice(2);
    document.cookie = "crypto_lab_session=" + id + "; Path=/labs/cryptography/; SameSite=Lax";
  }
  location.replace("/labs/cryptography/app/");
})();
</script>
';
}

# Instructor surface: gated by the shared cookie. The bare /instructor/
# path serves the lane-service status panel (cryptography_admin.html),
# which embeds the rendered solution guide via /api/cryptography/
# instructor-guide. Direct file paths under /instructor/<name> still
# proxy to the crypto-lab-instructor container so instructors can
# fetch raw .qmd / .pdf / etc.
location = /labs/cryptography/instructor {
    return 301 $scheme://$http_host/labs/cryptography/instructor/;
}
location = /labs/cryptography/instructor/ {
    auth_request /_auth/instructor;
    error_page 401 = @instructor_login;
    set $lane_svc "lane-service-lane-service-1";
    proxy_pass http://$lane_svc:8090/labs/cryptography/admin;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
}

location ~ ^/labs/cryptography/instructor(?<rest>/.+)$ {
    auth_request /_auth/instructor;
    error_page 401 = @instructor_login;
    set $target_host "crypto-lab-instructor-1";
    proxy_pass http://$target_host:80$rest$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin "";
}

# Streamlit app + its asset/WS paths. Streamlit runs with
# --server.baseUrlPath=labs/cryptography/app so it emits URLs with
# the prefix baked in; we just proxy through without rewrites.
# Variable-based proxy_pass defers DNS resolution to request time so
# the router starts even if the crypto container is offline.
#
# On direct reload of a Streamlit page URL such as
# /labs/cryptography/app/Merkle_Trees, Streamlit's frontend resolves
# _stcore paths relative to that page. Normalize those nested runtime
# endpoints back to the configured baseUrlPath so deep links remain
# reload-safe.
location ~ ^/labs/cryptography/app/[^/]+/_stcore/(?<stcore_rest>.*)$ {
    resolver 127.0.0.11 valid=10s;
    set $crypto_backend "http://crypto-lab-student-1:8501";
    rewrite ^/labs/cryptography/app/[^/]+/_stcore/(.*)$ /labs/cryptography/app/_stcore/$1 break;
    proxy_pass $crypto_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 86400;
    proxy_cache_bypass $http_upgrade;
}

location ~ ^/labs/cryptography/app(?<rest>/.*)?$ {
    resolver 127.0.0.11 valid=10s;
    set $crypto_backend "http://crypto-lab-student-1:8501";
    proxy_pass $crypto_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 86400;
    proxy_cache_bypass $http_upgrade;
    sub_filter_once on;
    sub_filter 'window.prerenderReady = false' 'window.prerenderReady = false; window.__streamlit = Object.assign({}, window.__streamlit, {BACKEND_BASE_URL: window.location.origin + "/labs/cryptography/app", HOST_CONFIG_BASE_URL: window.location.origin + "/labs/cryptography/app", MAIN_PAGE_BASE_URL: window.location.origin + "/labs/cryptography/app"})';
}
