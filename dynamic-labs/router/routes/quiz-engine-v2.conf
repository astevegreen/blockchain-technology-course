    location = /quiz {
        return 301 $scheme://$http_host/quiz/;
    }

    location = /quiz/instructor/ {
        return 301 /quiz/instructor;
    }

    location ~ ^/quiz/instructor(?<rest>/.*)?$ {
        auth_request /_auth/instructor;
        error_page 401 = @instructor_login;
        set $target_host "quiz-engine-v2";
        proxy_pass http://$target_host:8000/instructor$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-Prefix /quiz;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    location ~ ^/quiz(?<rest>/.*)?$ {
        set $target_host "quiz-engine-v2";
        proxy_pass http://$target_host:8000$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-Prefix /quiz;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }
