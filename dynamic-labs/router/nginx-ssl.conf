server {
    server_name _;

    listen 80;
    listen [::]:80;

    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # See nginx-http.conf for rationale.
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 10m;

    include /etc/nginx/routes.conf;
}

# The course chain explorer on its own name (explorer.lab, explorer.localhost, explorer.<domain>).
# It comes second, so the block above stays the default for every other name.
server {
    server_name explorer.*;

    listen 80;
    listen [::]:80;

    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    absolute_redirect off;
    port_in_redirect off;

    include /etc/nginx/routes/explorer.conf;
}