server {
    server_name _;

    listen 80;
    listen [::]:80;

    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Plain port 80 to HTTPS on a cloud host (https-redirect/on.conf says why).
    include /etc/nginx/https-redirect.conf;

    # See nginx-http.conf for rationale.
    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 10m;

    # The labs' own ports (8441-8445, routes.conf) speak HTTPS only in this config.
    set $lab_scheme https;

    include /etc/nginx/routes.conf;
}

# The day-1 explorer lab on its own host name (routes/explorer-host.conf says why).
server {
    server_name ~^explorer\.;

    listen 80;
    listen [::]:80;
    # By IP address the class reaches this lab on its own port (routes.conf says why).
    listen 8441 ssl;
    listen [::]:8441 ssl;

    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Plain port 80 to HTTPS on a cloud host (https-redirect/on.conf says why).
    include /etc/nginx/https-redirect.conf;

    absolute_redirect off;
    port_in_redirect off;
    client_max_body_size 1m;

    include /etc/nginx/routes/explorer-host.conf;
}

