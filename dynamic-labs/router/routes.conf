    # 1. Docker's internal DNS resolver is REQUIRED for variables in proxy_pass
    resolver 127.0.0.11 valid=10s;

    # Shared instructor auth: defines /_auth/instructor, @instructor_login,
    # @hlf_api_unauth. Included before any location that uses them so the
    # named locations resolve at server{} scope. Extracted from
    # routes/hlf.conf in Phase 8.1.
    include /etc/nginx/routes/_auth.conf;

    # Top-level instructor portal. One login gates instructor surfaces
    # across all labs; cookie path=/ so lab API routes under
    # /labs/<lab>/api/* can verify the same cookie. The browser entry
    # point and /api/instructor/* contract now live on the dedicated
    # instructor auth service.
    location = /instructor {
        return 301 $scheme://$http_host/instructor/;
    }

    # Phase 9.3a — cross-lab progress rollup (served by lane-service).
    # Must come before the generic /instructor/* → auth-service catch-all.
    location ~ ^/instructor/labs-progress(?<rest>/.*)?$ {
        set $target_host "lane-service-lane-service-1";
        proxy_pass http://$target_host:8090/instructor/labs-progress$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    location ~ ^/api/portal(?<rest>/.*)?$ {
        set $target_host "lane-service-lane-service-1";
        proxy_pass http://$target_host:8090/api/portal$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    location ~ ^/instructor(?<rest>/.*)?$ {
        set $target_host "instructor-auth-service";
        proxy_pass http://$target_host:8080/instructor$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    location ~ ^/api/instructor(?<rest>/.*)?$ {
        set $target_host "instructor-auth-service";
        proxy_pass http://$target_host:8080/api/instructor$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    # Ethereum lab — lane-service managed (replaces the Phase 7.5
    # cookie-gated single-container proxy). routes/ethereum.conf has
    # the full breakdown: shared instructor + on-demand student lanes,
    # student SPA prefix-stripped to lane :5173, /rpc passthrough,
    # /labs/ethereum_lab/instructor cookie-gated.
    include /etc/nginx/routes/ethereum.conf;

    # These labs use docker compose project names that do not match their URL slugs.
    #
    # Phase 7.5: instructor surfaces on sibling labs are gated with the same
    # shared cookie as the centralized instructor auth service. The
    # auth_request hits /_auth/instructor (defined in routes/_auth.conf),
    # which returns 200/401 from /api/instructor/verify. Unauthenticated users redirect to /instructor/
    # (the shared login). Gated locations must come BEFORE the lab catch-all
    # because nginx regex locations match in order of definition.
    #
    # Phase 8.2: consensus lab retired its per-lab nginx; routes moved to
    # routes/consensus.conf and now proxy directly to the ttyd containers
    # on split student/instructor networks.
    include /etc/nginx/routes/consensus.conf;

    # Phase 8.5: cryptography retired its per-lab nginx; routes moved
    # to routes/cryptography.conf with a shared singleton Streamlit app
    # and a gated instructor surface.
    include /etc/nginx/routes/cryptography.conf;

    # Phase 8.3: p2p_trust retired its per-lab nginx; routes moved to
    # routes/p2p_trust.conf and now proxy directly to the ttyd
    # containers on split student/instructor networks.
    include /etc/nginx/routes/p2p_trust.conf;

    # HLF lab routes live in routes/hlf-lanes.conf (per-student) +
    # routes/hlf.conf (shared). hlf-lanes.conf MUST come first so the
    # per-student /labs/hlf/s/<id>/* regex matches before the generic
    # /labs/hlf(?<rest>/.*)? catch-all in hlf.conf.
    include /etc/nginx/routes/hlf-lanes.conf;
    include /etc/nginx/routes/hlf.conf;

    # Phase 8.4: bitcoin retired its per-lab nginx; all bitcoin routes
    # (student + instructor ttyd, student + instructor static-web,
    # mempool, btc-explorer) live in routes/bitcoin.conf and proxy
    # directly to the underlying containers on split networks.
    include /etc/nginx/routes/bitcoin.conf;

    # Phase 8.7: removed the generic `^/labs/(?<lab>...)` catch-all
    # that proxied to `<lab>-router-1`. Every lab now has an explicit
    # include or block above; the catch-all was the source of silent
    # wrong-upstream bugs (e.g., the bitcoin mempool asset 502 where
    # the outer catch-all beat a prefix fallback). ethereum_lab has
    # its own explicit block near the top of this file.


    location ~ ^/exercises/(?<exercise>[a-zA-Z0-9-]+)$ {
        return 301 /exercises/$exercise/;
    }

    location ~ ^/exercises/(?<exercise>[a-zA-Z0-9-]+)/instructor/$ {
        return 301 /exercises/$exercise/instructor;
    }

    location ~ ^/exercises/(?<exercise>[a-zA-Z]+)/instructor(?<rest>/.*)?$ {
        auth_request /_auth/instructor;
        error_page 401 = @instructor_login;
        set $target_host "exercises-$exercise-1";
        rewrite ^/exercises/[a-zA-Z0-9-]+(/.*)$ $1 break;
        proxy_pass http://$target_host:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-Prefix /exercises/$exercise;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Origin "";
    }

    location ~ ^/exercises/(?<exercise>[a-zA-Z]+)(?<rest>/.*)?$ {
        set $target_host "exercises-$exercise-1";
        rewrite ^/exercises/[a-zA-Z0-9-]+(/.*)$ $1 break;
        proxy_pass http://$target_host:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-Prefix /exercises/$exercise;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Origin "";
    }

    # The day-1 explorer lab lives on its own host (routes/explorer-host.conf); the course
    # site links here, so the link works on every host the class uses.
    location ~ ^/labs/explorer/?$ {
        return 302 $scheme://explorer.$http_host/lab/;
    }

    # The day-3 token lab, likewise on its own host (routes/tokens-host.conf).
    location ~ ^/labs/tokens/?$ {
        return 302 $scheme://tokens.$http_host/lab/;
    }

    # The day-2 wallet lab (wallet/docker-compose.yml): one copy for the class. Its mempool image is
    # built with MEMPOOL_BASE_PATH=/labs/wallet/mempool, so that path keeps its prefix; everything
    # else under /labs/wallet/ is the lab's static gateway, prefix stripped.
    location ~ ^/labs/wallet/?$ {
        return 302 $scheme://$http_host/labs/wallet/lab/;
    }

    # A page folder typed without its slash: the gateway's own redirect would drop the /labs/wallet prefix.
    location ~ ^/labs/wallet/(?<page>lab|wallet|fallback|mempool)$ {
        return 301 $scheme://$http_host/labs/wallet/$page/;
    }

    location ~ ^/labs/wallet/mempool(?<rest>/.*)?$ {
        set $target_host "wallet-mempool-1";
        proxy_pass http://$target_host:8080/labs/wallet/mempool$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Origin "";
    }

    location ~ ^/labs/wallet(?<rest>/.*)$ {
        set $target_host "wallet-gateway-1";
        proxy_pass http://$target_host:8080$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # The day-5 Tron lab (tron/docker-compose.yml): one copy for the class, its pages under /labs/tron/,
    # prefix stripped.
    location ~ ^/labs/tron/?$ {
        return 302 $scheme://$http_host/labs/tron/lab/;
    }

    # A page folder typed without its slash: the page's own redirect would drop the /labs/tron prefix.
    location ~ ^/labs/tron/(?<page>lab|query|fallback|snapshot)$ {
        return 301 $scheme://$http_host/labs/tron/$page/;
    }

    location ~ ^/labs/tron(?<rest>/.*)$ {
        set $target_host "tron-page-1";
        proxy_pass http://$target_host:8080$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /quiz {
        return 301 $scheme://$http_host/quiz/;
    }

    location = /quiz/instructor/ {
        return 301 /quiz/instructor;
    }

    location ~ ^/quiz/instructor(?<rest>/.*)?$ {
        auth_request /_auth/instructor;
        error_page 401 = @instructor_login;
        set $target_host "quiz-engine-v2";
        proxy_pass http://$target_host:8000/instructor$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-Prefix /quiz;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    location ~ ^/quiz(?<rest>/.*)?$ {
        set $target_host "quiz-engine-v2";
        proxy_pass http://$target_host:8000$rest$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-Prefix /quiz;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    location = /favicon.ico {
        set $target_host "course-site-course-site-1";
        proxy_pass http://$target_host:80/favicon.svg;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header Content-Type;
        add_header Content-Type "image/svg+xml" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location = /favicon.svg {
        set $target_host "course-site-course-site-1";
        proxy_pass http://$target_host:80/favicon.svg;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        set $target_host "course-site-course-site-1";
        proxy_pass http://$target_host:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }
