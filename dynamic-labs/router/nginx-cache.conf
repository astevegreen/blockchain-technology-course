# Phase 7.6: cache instructor auth_request responses briefly so a
# single page load doesn't fire one subrequest to the centralized auth service per
# asset. Keyed on the hlf_instructor cookie value so different
# sessions don't share cache entries. 5s TTL keeps revocation
# latency low; 7.9's revocation list makes this explicit.
proxy_cache_path /var/cache/nginx/instructor_auth levels=1:2
    keys_zone=instructor_auth_cache:1m max_size=5m
    inactive=30s use_temp_path=off;
