	~*^en-US en-US;
	~*^en en-US;
	~*^ar ar;
	~*^cs cs;
	~*^da da;
	~*^de de;
	~*^es es;
	~*^fa fa;
	~*^fr fr;
	~*^ko ko;
	~*^it it;
	~*^he he;
	~*^ka ka;
	~*^hu hu;
	~*^mk mk;
	~*^nl nl;
	~*^ja ja;
	~*^nb nb;
	~*^pl pl;
	~*^pt pt;
	~*^ro ro;
	~*^ru ru;
	~*^sl sl;
	~*^fi fi;
	~*^sv sv;
	~*^th th;
	~*^tr tr;
	~*^uk uk;
	~*^vi vi;
	~*^zh zh;
	~*^hi hi;
	~*^ne ne;
	~*^lt lt;
	~*^hr hr;
}

map $cookie_lang $lang {
	default $header_lang;
	~*^en-US en-US;
	~*^en en-US;
	~*^ar ar;
	~*^cs cs;
	~*^da da;
	~*^de de;
	~*^es es;
	~*^fa fa;
	~*^fr fr;
	~*^ko ko;
	~*^it it;
	~*^he he;
	~*^ka ka;
	~*^hu hu;
	~*^mk mk;
	~*^nl nl;
	~*^ja ja;
	~*^nb nb;
	~*^pl pl;
	~*^pt pt;
	~*^ro ro;
	~*^ru ru;
	~*^sl sl;
	~*^fi fi;
	~*^sv sv;
	~*^th th;
	~*^tr tr;
	~*^uk uk;
	~*^vi vi;
	~*^zh zh;
	~*^hi hi;
	~*^ne ne;
	~*^lt lt;
	~*^hr hr;
}

server {
	listen 0.0.0.0:8080;
	access_log /var/log/nginx/access_mempool.log;
	error_log /var/log/nginx/error_mempool.log;

	root /var/www/mempool/browser;
	index index.html;

	add_header Cache-Control "public, no-transform";
	add_header Vary Accept-Language;
	add_header Vary Cookie;

	location = /labs/bitcoin/mempool {
		return 302 /labs/bitcoin/mempool/;
	}

	location /labs/bitcoin/mempool/ {
		rewrite ^/labs/bitcoin/mempool(/.*)$ $1 break;
		try_files /$lang$uri /$lang$uri/ $uri $uri/ /en-US$uri @index-redirect;
		expires 10m;
	}

	location /labs/bitcoin/mempool/resources {
		rewrite ^/labs/bitcoin/mempool(/.*)$ $1 break;
		try_files $uri @index-redirect;
		expires 1h;
	}

	location /labs/bitcoin/mempool/resources/config. {
		rewrite ^/labs/bitcoin/mempool(/.*)$ $1 break;
		try_files $uri =404;
		expires 5m;
	}

	location /labs/bitcoin/mempool/resources/customize. {
		rewrite ^/labs/bitcoin/mempool(/.*)$ $1 break;
		try_files $uri =404;
		expires 5m;
	}

	location @index-redirect {
		rewrite (.*) /labs/bitcoin/mempool/$lang/index.html;
	}

	location ~ ^/labs/bitcoin/mempool/(ar|bg|bs|cs|da|de|et|el|es|eo|eu|fa|fr|gl|ko|hr|id|it|he|ka|lv|lt|hu|mk|ms|nl|ja|nb|nn|pl|pt|pt-BR|ro|ru|sk|sl|sr|sh|fi|sv|th|tr|uk|vi|zh|hi)/ {
		rewrite ^/labs/bitcoin/mempool(/.*)$ $1 break;
		try_files $uri $uri/ /$1/index.html =404;
	}

	location = /labs/bitcoin/mempool/api {
		rewrite ^/labs/bitcoin/mempool(/.*)$ $1 break;
		try_files $uri $uri/ /en-US/index.html =404;
	}

	location = /labs/bitcoin/mempool/api/ {
		rewrite ^/labs/bitcoin/mempool(/.*)$ $1 break;
		try_files $uri $uri/ /en-US/index.html =404;
	}

	# address-index hotfix (2026-06-03): mempool runs electrum backend, which has no
	# /api/address route. Serve esplora address+scripthash lookups from electrs (:3000).
	location /labs/bitcoin/mempool/api/address {
		rewrite ^/labs/bitcoin/mempool/api(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:3000;
	}
	location /labs/bitcoin/mempool/api/scripthash {
		rewrite ^/labs/bitcoin/mempool/api(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:3000;
	}

	# esplora-compat tx endpoints (also absent on electrum backend): tx detail/status
	# and outspends (spent indicators + click-to-trace) served from electrs (:3000).
	location /labs/bitcoin/mempool/api/txs {
		rewrite ^/labs/bitcoin/mempool/api(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:3000;
	}
	location /labs/bitcoin/mempool/api/tx {
		rewrite ^/labs/bitcoin/mempool/api(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:3000;
	}

	# price stub: this build has no fiat price feed (backend returns -1/0). Serve a fixed
	# current BTC rate (blockchain.info snapshot) so fiat columns show real values, not $0.
	location /labs/bitcoin/mempool/api/v1/prices {
		default_type application/json;
		return 200 '{"time":1780876800,"USD":64224.69,"EUR":55312.94,"GBP":47822.86,"CAD":89211.95,"CHF":50797.11,"AUD":89998.45,"JPY":10271101.77,"BGN":0,"BRL":0,"CNY":0,"CZK":0,"DKK":0,"HKD":0,"HRK":0,"HUF":0,"IDR":0,"ILS":0,"INR":0,"ISK":0,"KRW":0,"MXN":0,"MYR":0,"NOK":0,"NZD":0,"PHP":0,"PLN":0,"RON":0,"RUB":0,"SEK":0,"SGD":0,"THB":0,"TRY":0,"ZAR":0}';
	}
	location /labs/bitcoin/mempool/api/v1/historical-price {
		default_type application/json;
		return 200 '{"prices":[{"time":1780876800,"USD":64224.69}],"exchangeRates":{"USDEUR":0.86124,"USDGBP":0.74462,"USDCAD":1.38906,"USDCHF":0.79093,"USDAUD":1.40131,"USDJPY":159.92451,"USDBGN":0,"USDBRL":0,"USDCNY":0,"USDCZK":0,"USDDKK":0,"USDHKD":0,"USDHRK":0,"USDHUF":0,"USDIDR":0,"USDILS":0,"USDINR":0,"USDISK":0,"USDKRW":0,"USDMXN":0,"USDMYR":0,"USDNOK":0,"USDNZD":0,"USDPHP":0,"USDPLN":0,"USDRON":0,"USDRUB":0,"USDSEK":0,"USDSGD":0,"USDTHB":0,"USDTRY":0,"USDZAR":0}}';
	}

	location /labs/bitcoin/mempool/api/v1/ws {
		rewrite ^/labs/bitcoin/mempool(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:8999;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
	}

	location /labs/bitcoin/mempool/api/v1/services {
		default_type application/json;
		return 200 '{}';
	}

	location /labs/bitcoin/mempool/api/v1 {
		rewrite ^/labs/bitcoin/mempool(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:8999/api/v1;
	}

	location /labs/bitcoin/mempool/api/ {
		rewrite ^/labs/bitcoin/mempool(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:8999/api/v1/;
	}

	location /labs/bitcoin/mempool/ws {
		rewrite ^/labs/bitcoin/mempool(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:8999;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
	}
}
