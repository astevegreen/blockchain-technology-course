server {
	listen 0.0.0.0:8080;
	access_log /var/log/nginx/access_mempool.log;
	error_log /var/log/nginx/error_mempool.log;

	root /var/www/mempool/browser;
	index index.html;

	add_header Cache-Control "public, no-transform";
	add_header Vary Accept-Language;
	add_header Vary Cookie;

__MEMPOOL_EXACT_BASE_LOCATION__

	location __MEMPOOL_BASE_PATH__/ {
__MEMPOOL_PREFIX_REWRITE__
		try_files /$lang$uri /$lang$uri/ $uri $uri/ /en-US$uri @index-redirect;
		expires 10m;
	}

	location __MEMPOOL_BASE_PATH__/resources {
__MEMPOOL_PREFIX_REWRITE__
		try_files $uri @index-redirect;
		expires 1h;
	}

	location __MEMPOOL_BASE_PATH__/resources/config. {
__MEMPOOL_PREFIX_REWRITE__
		try_files $uri =404;
		expires 5m;
	}

	location __MEMPOOL_BASE_PATH__/resources/customize. {
__MEMPOOL_PREFIX_REWRITE__
		try_files $uri =404;
		expires 5m;
	}

	location @index-redirect {
		rewrite (.*) __MEMPOOL_BASE_PATH__/$lang/index.html;
	}

	location ~ ^__MEMPOOL_BASE_PATH__/(ar|bg|bs|cs|da|de|et|el|es|eo|eu|fa|fr|gl|ko|hr|id|it|he|ka|lv|lt|hu|mk|ms|nl|ja|nb|nn|pl|pt|pt-BR|ro|ru|sk|sl|sr|sh|fi|sv|th|tr|uk|vi|zh|hi)/ {
__MEMPOOL_PREFIX_REWRITE__
		try_files $uri $uri/ /$1/index.html =404;
	}

	location = __MEMPOOL_BASE_PATH__/api {
__MEMPOOL_PREFIX_REWRITE__
		try_files $uri $uri/ /en-US/index.html =404;
	}

	location = __MEMPOOL_BASE_PATH__/api/ {
__MEMPOOL_PREFIX_REWRITE__
		try_files $uri $uri/ /en-US/index.html =404;
	}

	# Address-index routes. The mempool backend in "electrum" mode does NOT serve the
	# esplora-compatible /api/address, /api/scripthash, /api/tx, /api/txs routes (they 404),
	# but electrs already indexes every script and serves the esplora HTTP API on :3000.
	# Proxy these straight to electrs so address pages, tx pages, and the outspends endpoint
	# (spent indicators + click-to-trace) work. Custom rewrite strips the base path AND /api
	# so electrs receives its native paths (/address, /scripthash, /tx, /txs). Longest-prefix
	# match makes these win over the generic `location __MEMPOOL_BASE_PATH__/api/` below, in
	# both base-path and root (__MEMPOOL_BASE_PATH__ == "") modes.
	location __MEMPOOL_BASE_PATH__/api/address {
		rewrite ^__MEMPOOL_BASE_PATH__/api(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:3000;
	}

	location __MEMPOOL_BASE_PATH__/api/scripthash {
		rewrite ^__MEMPOOL_BASE_PATH__/api(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:3000;
	}

	location __MEMPOOL_BASE_PATH__/api/txs {
		rewrite ^__MEMPOOL_BASE_PATH__/api(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:3000;
	}

	location __MEMPOOL_BASE_PATH__/api/tx {
		rewrite ^__MEMPOOL_BASE_PATH__/api(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:3000;
	}

	# Fiat price stub. This image has no live price feed, so the mempool backend returns
	# sentinel values (-1 / 0) for /api/v1/prices and /api/v1/historical-price, making every
	# fiat column render as $0. Serve a fixed snapshot rate instead so fiat looks real.
	# (Snapshot — bump these numbers on rebuild if you want a fresher rate.) Pairs with the
	# price-path rewrite in configure-mempool-base-path.sh, which makes the frontend request
	# these at the base-path-prefixed URL so they hit this stub rather than the site root.
	location __MEMPOOL_BASE_PATH__/api/v1/prices {
		default_type application/json;
		return 200 '{"time":1780876800,"USD":64224.69,"EUR":55312.94,"GBP":47822.86,"CAD":89211.95,"CHF":50797.11,"AUD":89998.45,"JPY":10271101.77,"BGN":0,"BRL":0,"CNY":0,"CZK":0,"DKK":0,"HKD":0,"HRK":0,"HUF":0,"IDR":0,"ILS":0,"INR":0,"ISK":0,"KRW":0,"MXN":0,"MYR":0,"NOK":0,"NZD":0,"PHP":0,"PLN":0,"RON":0,"RUB":0,"SEK":0,"SGD":0,"THB":0,"TRY":0,"ZAR":0}';
	}

	location __MEMPOOL_BASE_PATH__/api/v1/historical-price {
		default_type application/json;
		return 200 '{"prices":[{"time":1780876800,"USD":64224.69}],"exchangeRates":{"USDEUR":0.86124,"USDGBP":0.74462,"USDCAD":1.38906,"USDCHF":0.79093,"USDAUD":1.40131,"USDJPY":159.92451,"USDBGN":0,"USDBRL":0,"USDCNY":0,"USDCZK":0,"USDDKK":0,"USDHKD":0,"USDHRK":0,"USDHUF":0,"USDIDR":0,"USDILS":0,"USDINR":0,"USDISK":0,"USDKRW":0,"USDMXN":0,"USDMYR":0,"USDNOK":0,"USDNZD":0,"USDPHP":0,"USDPLN":0,"USDRON":0,"USDRUB":0,"USDSEK":0,"USDSGD":0,"USDTHB":0,"USDTRY":0,"USDZAR":0}}';
	}

	location __MEMPOOL_BASE_PATH__/api/v1/ws {
__MEMPOOL_PREFIX_REWRITE__
		proxy_pass http://127.0.0.1:8999;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
	}

	location __MEMPOOL_BASE_PATH__/api/v1/services {
		default_type application/json;
		return 200 '{}';
	}

	location __MEMPOOL_BASE_PATH__/api/v1 {
__MEMPOOL_PREFIX_REWRITE__
		proxy_pass http://127.0.0.1:8999/api/v1;
	}

	location __MEMPOOL_BASE_PATH__/api/ {
__MEMPOOL_PREFIX_REWRITE__
		proxy_pass http://127.0.0.1:8999/api/v1/;
	}

	location __MEMPOOL_BASE_PATH__/ws {
__MEMPOOL_PREFIX_REWRITE__
		proxy_pass http://127.0.0.1:8999;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
	}
}
