
	
	map $http_accept_language $header_lang {
		default en-US;
		~*^en-US en-US;
		~*^en en-US;
	        ~*^ar ar;
	        ~*^cs cs;
	        ~*^da da;
	        ~*^de de;
	        ~*^es es;
	        ~*^fa fa;
	        ~*^fr fr;
	        ~*^ko ko;
	        ~*^it it;
	        ~*^he he;
	        ~*^ka ka;
	        ~*^hu hu;
	        ~*^mk mk;
	        ~*^nl nl;
	        ~*^ja ja;
	        ~*^nb nb;
	        ~*^pl pl;
	        ~*^pt pt;
	        ~*^ro ro;
	        ~*^ru ru;
	        ~*^sl sl;
	        ~*^fi fi;
	        ~*^sv sv;
	        ~*^th th;
	        ~*^tr tr;
	        ~*^uk uk;
	        ~*^vi vi;
	        ~*^zh zh;
	        ~*^hi hi;
	        ~*^ne ne;
	        ~*^lt lt;
	        ~*^hr hr;
	}

	map $cookie_lang $lang {
		default $header_lang;
		~*^en-US en-US;
		~*^en en-US;
	        ~*^ar ar;
	        ~*^cs cs;
	        ~*^da da;
	        ~*^de de;
	        ~*^es es;
	        ~*^fa fa;
	        ~*^fr fr;
	        ~*^ko ko;
	        ~*^it it;
	        ~*^he he;
	        ~*^ka ka;
	        ~*^hu hu;
	        ~*^mk mk;
	        ~*^nl nl;
	        ~*^ja ja;
	        ~*^nb nb;
	        ~*^pl pl;
	        ~*^pt pt;
	        ~*^ro ro;
	        ~*^ru ru;
	        ~*^sl sl;
	        ~*^fi fi;
	        ~*^sv sv;
	        ~*^th th;
	        ~*^tr tr;
	        ~*^uk uk;
	        ~*^vi vi;
	        ~*^zh zh;
	        ~*^hi hi;
	        ~*^ne ne;
	        ~*^lt lt;
	        ~*^hr hr;
	}


	server {
		listen 0.0.0.0:8080;
			access_log /var/log/nginx/access_mempool.log;
	error_log /var/log/nginx/error_mempool.log;

	root /var/www/mempool/browser;

	index index.html;

	# enable browser and proxy caching
	add_header Cache-Control "public, no-transform";

	# vary cache if user changes language preference
	add_header Vary Accept-Language;
	add_header Vary Cookie;

	# fallback for all URLs i.e. /address/foo /tx/foo /block/000
	location / {
		try_files /$lang/$uri /$lang/$uri/ $uri $uri/ /en-US/$uri @index-redirect;
		expires 10m;
	}
	location /resources {
		try_files $uri @index-redirect;
		expires 1h;
	}

	# only cache /resources/config.* for 5 minutes since it changes often
	location /resources/config. {
		try_files $uri =404;
		expires 5m;
	}
	# only cache /resources/customize.* for 5 minutes since it changes often
	location /resources/customize. {
		try_files $uri =404;
		expires 5m;
	}

	location @index-redirect {
		rewrite (.*) /$lang/index.html;
	}

	# location block using regex are matched in order

	# used for cookie override
	location ~ ^/(ar|bg|bs|cs|da|de|et|el|es|eo|eu|fa|fr|gl|ko|hr|id|it|he|ka|lv|lt|hu|mk|ms|nl|ja|nb|nn|pl|pt|pt-BR|ro|ru|sk|sl|sr|sh|fi|sv|th|tr|uk|vi|zh|hi)/ {
		try_files $uri $uri/ /$1/index.html =404;
	}

	# static API docs
	location = /api {
		try_files $uri $uri/ /en-US/index.html =404;
	}
	location = /api/ {
		try_files $uri $uri/ /en-US/index.html =404;
	}

	# address-index fix: the mempool backend runs in "electrum" mode, which does NOT serve the
	# esplora-compatible /api/address, /api/scripthash, /api/tx, /api/txs routes (they 404).
	# electrs already indexes every address/script and serves the esplora HTTP API on :3000, so
	# proxy those routes straight to it. This makes address pages, tx pages, and the outspends
	# endpoint (spent indicators + click-to-trace) work. See MEMPOOL_ADDRESS_FIX.md.
	# Longest-prefix match means these win over the generic `location /api/` below.
	location /api/address {
		rewrite ^/api(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:3000;
	}
	location /api/scripthash {
		rewrite ^/api(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:3000;
	}
	location /api/txs {
		rewrite ^/api(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:3000;
	}
	location /api/tx {
		rewrite ^/api(/.*)$ $1 break;
		proxy_pass http://127.0.0.1:3000;
	}

	# Fiat price stub: no live price feed, so the backend returns -1/0 and fiat shows $0.
	# Serve a fixed snapshot rate (see MEMPOOL_ADDRESS_FIX.md). NOTE: the frontend's price
	# service ignores the base path, so it must also be rewritten to request the prefixed
	# URL — done in the upstream image's configure-mempool-base-path.sh; a volume-mount of
	# this nginx config alone does NOT fix prices (it needs the rebuilt image too).
	location /api/v1/prices {
		default_type application/json;
		return 200 '{"time":1780876800,"USD":64224.69,"EUR":55312.94,"GBP":47822.86,"CAD":89211.95,"CHF":50797.11,"AUD":89998.45,"JPY":10271101.77,"BGN":0,"BRL":0,"CNY":0,"CZK":0,"DKK":0,"HKD":0,"HRK":0,"HUF":0,"IDR":0,"ILS":0,"INR":0,"ISK":0,"KRW":0,"MXN":0,"MYR":0,"NOK":0,"NZD":0,"PHP":0,"PLN":0,"RON":0,"RUB":0,"SEK":0,"SGD":0,"THB":0,"TRY":0,"ZAR":0}';
	}

	location /api/v1/historical-price {
		default_type application/json;
		return 200 '{"prices":[{"time":1780876800,"USD":64224.69}],"exchangeRates":{"USDEUR":0.86124,"USDGBP":0.74462,"USDCAD":1.38906,"USDCHF":0.79093,"USDAUD":1.40131,"USDJPY":159.92451,"USDBGN":0,"USDBRL":0,"USDCNY":0,"USDCZK":0,"USDDKK":0,"USDHKD":0,"USDHRK":0,"USDHUF":0,"USDIDR":0,"USDILS":0,"USDINR":0,"USDISK":0,"USDKRW":0,"USDMXN":0,"USDMYR":0,"USDNOK":0,"USDNZD":0,"USDPHP":0,"USDPLN":0,"USDRON":0,"USDRUB":0,"USDSEK":0,"USDSGD":0,"USDTHB":0,"USDTRY":0,"USDZAR":0}}';
	}

	location /api/v1/ws {
		proxy_pass http://127.0.0.1:8999;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
	}
	
location /api/v1/services {
    default_type application/json;
    return 200 '{}';
}

	location /api/v1 {
		proxy_pass http://127.0.0.1:8999/api/v1;
	}
	location /api/ {
		proxy_pass http://127.0.0.1:8999/api/v1/;
	}

	# mainnet API
	location /ws {
		proxy_pass http://127.0.0.1:8999;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
	}
	}
