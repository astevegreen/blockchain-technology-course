name: bitcoin

# Phase 8.4/8.8: per-lab nginx retired. Outer router proxies
# /labs/bitcoin/* directly to these containers.
#
# Three --internal networks:
#   bitcoin-p2p-net          — bitcoind P2P gossip. All lab containers.
#   bitcoin-student-mgmt-net — router + students + mempool. Router
#                              reaches student ttyd and mempool UI here.
#   bitcoin-instructor-mgmt-net — router + instructor only. Instructor
#                              ttyd binds to this interface via
#                              ttyd-bind-mgmt.sh. Students cannot reach
#                              this network at all.
#
# ttyd-bind-mgmt.sh dynamically finds the mgmt-net IP by resolving
# router-router-1 (Docker DNS scopes to shared networks) and binding
# to the local src IP on that route. After the split, instructor's DNS
# resolves to the router's instructor-mgmt IP, so ttyd binds there.
#
# Static-web on :8000 stays on 0.0.0.0 intentionally — wallet-address
# sharing between students traverses the router, not direct container
# cross-talk.

services:
  # Build target only — lane-service creates student containers from
  # this image on demand via `docker run`.
  student:
    build:
      context: .
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        BITCOIN_LAB_BASE: "${BITCOIN_LAB_IMAGE:-ghcr.io/astevegreen/course-labs:base-bitcoin-lab}"
    image: bitcoin-lab-student
    profiles: ["build-only"]
    networks:
      - p2p-net
      - student-mgmt-net

  instructor:
    environment:
      # Phase 9.3e: mine 11 classnet seed blocks on first boot so
      # explorer/student tools start on a non-trivial chain tip.
      # Idempotent: wrapper skips when getblockcount > 0.
      SEED_CLASSNET: "1"
    build:
      context: .
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        BITCOIN_LAB_BASE: "${BITCOIN_LAB_IMAGE:-ghcr.io/astevegreen/course-labs:base-bitcoin-lab}"
    networks:
      - p2p-net
      - instructor-mgmt-net
    # Named volume persists the instructor datadir; the lab reset (nuke)
    # empties it with a one-shot sidecar. Empty by default — bitcoind
    # regenerates regtest state on first boot.
    volumes:
      - instructor-data:/home/user/.bitcoin

  mempool:
    environment:
      BTCEXP_BASEURL: "/labs/bitcoin/btc-explorer/"
      MEMPOOL_BASE_PATH: "/labs/bitcoin/mempool"
      # Static forensics chains age past bitcoind's 24h maxtipage, pinning
      # the node in IBD forever so mempool-electrs never indexes and every
      # esplora /api/* route 502s. Keep it out of IBD. addnode points this
      # node's bitcoind at the instructor hub so a freshly-recreated mempool
      # (no persistent datadir) re-syncs the chain — without it the new node
      # sits at height 0 / 0 peers and electrs has nothing to index. Works with the pulled
      # image (entrypoint appends $BITCOIN_EXTRA_ARGS); maxtipage is also
      # baked into the rebuilt image's entrypoint.
      BITCOIN_EXTRA_ARGS: "-maxtipage=9999999999 -addnode=bitcoin-instructor-1"
    image: "${BITCOIN_MEMPOOL_IMAGE:-ghcr.io/astevegreen/course-labs:base-bitcoin-mempool}"
    networks:
      - p2p-net
      - student-mgmt-net

networks:
  p2p-net:
    name: bitcoin-p2p-net
    external: true
  student-mgmt-net:
    name: bitcoin-student-mgmt-net
    external: true
  instructor-mgmt-net:
    name: bitcoin-instructor-mgmt-net
    external: true

volumes:
  instructor-data:
    name: bitcoin-instructor-data
