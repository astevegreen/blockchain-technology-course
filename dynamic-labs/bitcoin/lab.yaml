# Lab manifest. Schema: dynamic-labs/lab.schema.json. Design: docs/student-launcher-design.md section 3.
# Measured 10 Nov 2026 on a 16 GB Windows 11 PC with student release 2026.11.10-11. memory_mb: the most Docker memory this
# lab's own containers held while in use (MiB, rounded up to 10; the router and lane-service are counted in their own files).
# approx_download_mb: compressed linux/amd64 image layers, each counted once (MiB). The launcher only shows the pull.
id: bitcoin
title: Bitcoin Lab
kind: lab
order:
  day: null
  position: 3
compose_project: bitcoin
compose_file: docker-compose.yml
student_local: true
student_compose_file: docker-compose.launcher.yml
services:
  student:
    source: build
    context: .
    platforms:
    - linux/amd64
    - linux/arm64
  instructor:
    # Same Dockerfile as student: BITCOIN_INSTRUCTOR_IMAGE may point at the same digest.
    source: build
    context: .
    platforms:
    - linux/amd64
    - linux/arm64
  mempool:
    source: upstream
    image: ghcr.io/astevegreen/course-labs:base-bitcoin-mempool-2026.11.10-5@sha256:3055a6d8321454262685f8c7b3b21fa7146a19f1cf3f92c2b307b063c7694bc6
    platforms:
    - linux/amd64
    - linux/arm64
networks:
- name: bitcoin-p2p-net
  internal: true
- name: bitcoin-student-mgmt-net
  internal: true
- name: bitcoin-instructor-mgmt-net
  internal: true
routes:
- routes/bitcoin.conf
uses_lane_service: true
entry:
  path: /labs/bitcoin/
# Re-measured 11 Nov 2026 when the Chain Graph was archived (local images, one claimed lane, same PC): mempool 525,
# instructor 79, one lane 75 MiB. Download: the lab and mempool images' layers without the graph image's 318 MiB.
memory_mb: 680
approx_download_mb: 509
data: []
keep_volumes_on_update: true
