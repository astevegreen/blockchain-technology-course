# Lab manifest. Schema: dynamic-labs/lab.schema.json. Design: docs/student-launcher-design.md section 3.
# Measured 10 Nov 2026 on a 16 GB Windows 11 PC with student release 2026.11.10-11. memory_mb: the most Docker memory this
# lab's own containers held while in use (MiB, rounded up to 10; the router and lane-service are counted in their own files).
# approx_download_mb: compressed linux/amd64 image layers, each counted once (MiB). The launcher only shows the pull.
id: tokens
title: Token Lab
kind: lab
order:
  day: 3
  position: 0
compose_project: tokens
compose_file: docker-compose.yml
student_local: true
student_compose_file: docker-compose.launcher.yml
services:
  anvil:
    source: build
    context: .
    dockerfile: launcher/anvil.Dockerfile
    platforms:
    - linux/amd64
    - linux/arm64
  gateway:
    source: build
    context: ..
    dockerfile: tokens/launcher/gateway.Dockerfile
    platforms:
    - linux/amd64
    - linux/arm64
  otterscan:
    source: build
    context: ..
    dockerfile: tokens/launcher/otterscan.Dockerfile
    platforms:
    - linux/amd64
    - linux/arm64
networks:
- name: router-net
  internal: false
routes:
- routes/tokens.conf
uses_lane_service: false
entry:
  path: /lab/
  port: 8442
memory_mb: 40
approx_download_mb: 329
data:
- path: ./chain
  into: /chain
  how: baked
- path: ../explorer/gateway/gateway.py
  into: /srv/gateway.py
  how: baked
- path: ./gateway/static/lab
  into: /srv/static/lab
  how: baked
- path: ./gateway/static/sign
  into: /srv/static/sign
  how: baked
- path: ./gateway/static/fallback
  into: /srv/static/fallback
  how: baked
- path: ../explorer/gateway/static/vendor
  into: /srv/static/vendor
  how: baked
- path: ../explorer/otterscan/default.conf
  into: /etc/nginx/conf.d/default.conf
  how: baked
- path: ./chain/sourcify
  into: /usr/share/nginx/html/sourcify
  how: baked
keep_volumes_on_update: true
