name: tokens

# The day-3 token lab: Otterscan on a frozen course chain holding a dollar token behind a
# proxy and a badge (NFT) with a shop, one copy for the whole class.
# The router sends https://tokens.<host>/ here (router/routes/tokens-host.conf):
#   /rpc, /config.json, /lab/, /sign/, /fallback/, /vendor/  -> gateway
#   everything else                                           -> otterscan
# The gateway, Otterscan's nginx settings and ethers are the explorer lab's files, mounted
# read-only, so the two labs stay the same. A restart reloads the frozen chain: the badges the
# class mints are gone and blocks 0-17 are as built.

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.8.6
    command:
      - >-
        anvil --host 0.0.0.0 --port 8545 --load-state /chain/course-chain.json
        --block-time ${TOKENS_BLOCK_TIME:-12}
    volumes:
      - ./chain:/chain:ro
    networks:
      - tokens-net
    restart: unless-stopped

  gateway:
    image: python:3.12-alpine
    command: ["python", "-u", "/srv/gateway.py"]
    environment:
      - ANVIL_URL=http://anvil:8545
      - STATIC_ROOT=/srv/static
    volumes:
      - ../explorer/gateway/gateway.py:/srv/gateway.py:ro
      # One mount per folder: Docker cannot nest the vendor mount inside a read-only one.
      - ./gateway/static/lab:/srv/static/lab:ro
      - ./gateway/static/sign:/srv/static/sign:ro
      - ./gateway/static/fallback:/srv/static/fallback:ro
      - ../explorer/gateway/static/vendor:/srv/static/vendor:ro
    networks:
      - tokens-net
      - router-net
    depends_on:
      - anvil
    restart: unless-stopped

  otterscan:
    image: otterscan/otterscan:v2.11.0
    environment:
      # The router serves /config.json from the gateway; this stops the image writing its own.
      - DISABLE_CONFIG_OVERWRITE=1
    volumes:
      - ../explorer/otterscan/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./chain/sourcify:/usr/share/nginx/html/sourcify:ro
    networks:
      - router-net
    restart: unless-stopped

networks:
  tokens-net:
  router-net:
    external: true
