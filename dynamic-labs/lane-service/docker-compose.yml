name: lane-service

services:
  lane-service:
    build:
      context: .
      network: ${DOCKER_BUILD_NETWORK:-default}
    image: lane-service:latest
    restart: unless-stopped
    stop_grace_period: 2m
    environment:
      - CONSENSUS_IMAGE=consensus-lab-student
      - CONSENSUS_NETWORK=consensus-student-net
      - P2P_TRUST_IMAGE=p2p-trust-lab-student
      - P2P_TRUST_NETWORK=p2p-trust-student-net
      - BITCOIN_IMAGE=bitcoin-lab-student
      - BITCOIN_P2P_NET=bitcoin-p2p-net
      - BITCOIN_MGMT_NET=bitcoin-student-mgmt-net
      # Ethereum on-demand. lane-service spawns a per-station container
      # from the same image as the instructor (MODE=student); the
      # instructor mgmt net is needed so it can fetch the pool/config
      # for env injection without exposing the instructor container
      # directly to student lanes.
      - ETHEREUM_IMAGE=ethereum-trainer
      - ETHEREUM_MGMT_NET=ethereum-student-mgmt-net
      - ETHEREUM_INSTRUCTOR_HOST=ethereum-trainer-instructor
      - ETHEREUM_INSTRUCTOR_PORT=8080
      - MAX_STUDENT_CAPACITY=${MAX_STUDENT_CAPACITY:-20}
      - BITCOIN_STUDENT_CAPACITY=${BITCOIN_STUDENT_CAPACITY:-}
      - CONSENSUS_STUDENT_CAPACITY=${CONSENSUS_STUDENT_CAPACITY:-}
      - P2P_TRUST_STUDENT_CAPACITY=${P2P_TRUST_STUDENT_CAPACITY:-}
      - ETHEREUM_STUDENT_CAPACITY=${ETHEREUM_STUDENT_CAPACITY:-}
      - STUDENT_WARM_POOL_SIZE=${STUDENT_WARM_POOL_SIZE:-}
      # Phase 9.3f: nuke-and-reseed needs the bitcoin compose file
      # bind-mounted so the lane-service can invoke
      # `docker compose up -d instructor mempool` after tearing
      # everything down.
      - BITCOIN_COMPOSE_FILE=/app/bitcoin-compose/docker-compose.yml
      # Phase 9.3g: forensics-deploy reads the current 3-part chain
      # snapshot from this bind mount and copies it into the
      # instructor-data named volume via a one-shot busybox container.
      - BITCOIN_FORENSICS_V3_SNAPSHOT=/app/bitcoin-forensics/forensics-lab-v3-instructor-dir
      - BITCOIN_INSTRUCTOR_VOLUME=bitcoin-instructor-data
      - STUDENT_PIDS_LIMIT=${STUDENT_PIDS_LIMIT:-256}
      - BITCOIN_STUDENT_HOME_ROOT=${BITCOIN_STUDENT_HOME_ROOT:-}
      - CONSENSUS_STUDENT_HOME_ROOT=${CONSENSUS_STUDENT_HOME_ROOT:-}
      - P2P_TRUST_STUDENT_HOME_ROOT=${P2P_TRUST_STUDENT_HOME_ROOT:-}
      - ETHEREUM_STUDENT_HOME_ROOT=${ETHEREUM_STUDENT_HOME_ROOT:-}
      - INSTRUCTOR_AUTH_URL=http://instructor-auth-service:8080/api/instructor/verify
      - LANE_SERVICE_PORT=8090
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtime:/app/runtime
      - ../bitcoin:/app/bitcoin-compose:ro
      - ../bitcoin-forensics:/app/bitcoin-forensics:ro
      - ../cryptography:/app/cryptography:ro
    pre_stop:
      - command: python /app/pre_stop_cleanup.py
        working_dir: /app
    networks:
      - router-net
      - ethereum-instructor-mgmt-net

networks:
  router-net:
    name: router-net
    external: true
  ethereum-instructor-mgmt-net:
    name: ethereum-instructor-mgmt-net
    external: true
