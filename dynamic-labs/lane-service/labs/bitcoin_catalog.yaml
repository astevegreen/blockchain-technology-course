    - chunk2 (97.84256013 BTC): `5703489a727addf95ec897b7c7c08c20e7e83b0828c7c3955793096a75effbae`
      → `38ee39bd8653c64d882e4dc8bd51905b367e6d81965f10608eefb6e4907c7ba1`
      → `b522a889ec4482a95ac5091fa9617e4b3bc04f2a5663b11b7cbd8714ddb5440f`
    - chunk3 (232.02664261 BTC): `c0bd1cd1a079f84c2f9aecbdc35ac22daaaf7af317a120bc4d2adac227816e8b`
      → `9fee52efe824691fc5cda7fb30c0702a7932668ba2ab90ff1ae049963455c44d`
      → `d0fa4668db84c03707c79613e0c59cf1f2c57aa8dc06f50c700e84c5634d53f4`
    - chunk4 (215.25363230 BTC): `7c1f68850372cf1f49f6a6e2f491c3c8023fc5426871fc4ba2d556eb76441a08`
      → `dda8fbe574c100e84a63bec0b5dda836d4095f6cd9012b23b720456bcc34dda0`
      → `53361971c9f9a3da84ba2e5f886e3fa0d910f68ddd27bd0ea2ac17e2164abce6`
  - 'Note which output carries the miner fee: the small peel, or the large remainder.'
  expected_observations:
  - Each chunk runs a **three-hop** peel chain. At every hop a small amount is peeled to a side address and the remainder continues.
  - The remainder of one hop is the sole input to the next hop — a clean single-line chain, not a tree.
  - The remainder output carries the fee burden; the peel amounts are small and consistent.
  - |-
    The five chunks start at **78.27404813, 145.36608934, 97.84256013, 232.02664261, 215.25363230 BTC**
    and end at five tips that all feed the consolidation:
    - `bc1qf33lzgm96jg2v47364dlprlqj3vgza7zm2jw9r` (76.54590381 BTC) — chunk 0
    - `bc1q4drfqcnfs793te047gm5tlq34dhrfaycmxam9j` (144.24427569 BTC) — chunk 1
