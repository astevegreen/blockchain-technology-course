    - `bc1q5g3gvqsg4luy8du23uc3xqtf3mn0fk5d8kqn5n` (213.59394580 BTC) — chunk 4
  meaning:
  - A long single-line chain that sheds a small amount at each hop is the classic **peeling** pattern. Each small peel is designed to stay under automated monitoring thresholds while the bulk slides onward.
  - 'Because the bulk-pays-the-fee and the peels stay small, a peel chain is visually identifiable even before you know who''s behind it: it looks like a string of beads, each hop dropping one bead.'
  transition: Five peel chains, five tips. Find out where they go.
  solution: |-
    Each of the five fan-out chunks runs its own three-hop peel chain; the continuing remainder is
    always the input to the next hop, and the remainder pays the fee. Chunk 0 worked fully: starts at
    `bc1qewhamkx46gxepc08xhf04lnh0vc279wx7scf83` (78.27404813 BTC) and runs hop1
