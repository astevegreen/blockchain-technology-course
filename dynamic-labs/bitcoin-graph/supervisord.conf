[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:neo4j]
command=/usr/bin/neo4j console
user=neo4j
environment=NEO4J_CONF="/etc/neo4j"
priority=10
autorestart=true
startsecs=10
stdout_logfile=/var/log/neo4j-console.log
stderr_logfile=/var/log/neo4j-console.err

[program:graph-app]
command=/opt/graph-venv/bin/uvicorn main:app --host 0.0.0.0 --port 8082 --workers 1
directory=/opt/graph-app
priority=20
autorestart=true
startsecs=5
stdout_logfile=/var/log/graph-app.log
stderr_logfile=/var/log/graph-app.err

; One-shot: build the graph on first boot if the store is empty
; (GRAPH_AUTOBUILD=1). No-op when a graph already exists.
[program:graph-autobuild]
command=/usr/local/bin/graph-rebuild --if-empty --wait-sync
priority=30
autorestart=false
startsecs=0
exitcodes=0,1
stdout_logfile=/var/log/graph-autobuild.log
stderr_logfile=/var/log/graph-autobuild.err
