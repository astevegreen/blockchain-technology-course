# Lab manifest. Schema: dynamic-labs/lab.schema.json. Design: docs/student-launcher-design.md section 3.
# Measured 10 Nov 2026 on a 16 GB Windows 11 PC with student release 2026.11.10-11. memory_mb: the most Docker memory this
# lab's own containers held while in use (MiB, rounded up to 10; the router and lane-service are counted in their own files).
# approx_download_mb: compressed linux/amd64 image layers, each counted once (MiB). The launcher only shows the pull.
id: cross-chain
title: Cross-Chain Lab
kind: lab
order:
  day: 8
  position: 0
compose_project: cross-chain
compose_file: docker-compose.yml
student_local: true
student_compose_file: docker-compose.launcher.yml
services:
  page:
    source: build
    context: .
    platforms:
    - linux/amd64
    - linux/arm64
  exploit-anvil:
    source: build
    context: .
    dockerfile: launcher/exploit-anvil.Dockerfile
    platforms:
    - linux/amd64
    - linux/arm64
  exploit-gateway:
    source: build
    context: ..
    dockerfile: cross-chain/launcher/exploit-gateway.Dockerfile
    platforms:
    - linux/amd64
    - linux/arm64
  exploit-otterscan:
    source: build
    context: ..
    dockerfile: cross-chain/launcher/exploit-otterscan.Dockerfile
    platforms:
    - linux/amd64
    - linux/arm64
networks:
- name: router-net
  internal: false
- name: exploit-net
  internal: true
routes:
- routes/cross-chain.conf
- routes/exploit-host.conf
uses_lane_service: false
entry:
  path: /labs/cross-chain/
memory_mb: 90
approx_download_mb: 170
data:
- path: ./exploit/chain/course-chain.json
  into: /chain/course-chain.json
  how: baked
- path: ./exploit/gateway/static/fallback
  into: /srv/static/fallback
  how: baked
- path: ./exploit/chain/sourcify
  into: /usr/share/nginx/html/sourcify
  how: baked
keep_volumes_on_update: true
