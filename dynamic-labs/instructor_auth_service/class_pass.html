<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Code</title>
  <style>
    :root {
      --bg: #0b0d10;
      --panel: #11151a;
      --border: #242c35;
      --border-strong: #313b46;
      --text: #edf2f7;
      --muted: #97a4b2;
      --accent: #d7e6f7;
      --accent-bg: #1a2734;
      --error: #ea7a7a;
      --ok: #7fd0a2;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           background: linear-gradient(180deg, #0b0d10 0%, #0e1216 100%); color: var(--text);
           min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px; }
    .panel { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--border); padding: 28px 32px; }
    h1 { margin: 0 0 6px; font-size: 22px; color: var(--accent); }
    p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.45; }
    form { display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    input { padding: 10px; background: var(--bg); color: var(--text); border: 1px solid var(--border-strong);
            font-family: ui-monospace, Consolas, monospace; font-size: 18px; letter-spacing: .12em; text-transform: uppercase; }
    button { padding: 10px; background: var(--accent-bg); color: var(--accent); border: 1px solid var(--border-strong);
             cursor: pointer; font-size: 14px; }
    button:hover { background: #22313f; }
    .msg { min-height: 18px; font-size: 13px; }
    .msg.error { color: var(--error); }
    .msg.ok { color: var(--ok); }
    .foot { margin: 18px 0 0; font-size: 12px; }
    .foot a { color: var(--muted); }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Enter the class code</h1>
    <p>The labs on this server are for your class. Type the code your instructor gave you;
       this browser remembers it for two weeks.</p>
    <form id="codeForm" autocomplete="off">
      <label for="code">Class code</label>
      <input id="code" name="code" type="text" inputmode="text" autocapitalize="characters"
             spellcheck="false" maxlength="40" required autofocus />
      <button type="submit">Continue</button>
      <div class="msg" id="msg" role="status" aria-live="polite"></div>
    </form>
    <p class="foot"><a href="/instructor/">Instructor sign-in</a></p>
  </main>
  <script>
    const form = document.getElementById('codeForm');
    const msg = document.getElementById('msg');

    function show(text, kind) {
      msg.textContent = text;
      msg.className = 'msg' + (kind ? ' ' + kind : '');
    }

    function safeTarget(target) {
      return typeof target === 'string' && target.startsWith('/') && !target.startsWith('//') ? target : '/';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      show('Checking...', '');
      try {
        const resp = await fetch('/api/class/enter', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: document.getElementById('code').value }),
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.ok && data.success) {
          show('You are in.', 'ok');
          window.location.assign(safeTarget(data.redirect_to));
          return;
        }
        show(data.message || 'That is not the class code.', 'error');
      } catch (err) {
        show('The server did not answer. Try again in a moment.', 'error');
      }
    });
  </script>
</body>
</html>
