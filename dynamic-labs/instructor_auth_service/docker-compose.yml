name: instructor-auth-service

services:
  instructor-auth-service:
    build:
      context: ..
      dockerfile: instructor_auth_service/Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-default}
    image: instructor-auth-service:latest
    environment:
      - SECRET_KEY=${INSTRUCTOR_AUTH_SERVICE_SECRET_KEY:?not set - run ./lab-manager.sh deploy, which writes .runtime/runtime-secrets.env}
      - INSTRUCTOR_AUTH_USER=${INSTRUCTOR_AUTH_USER:-instructor}
      - INSTRUCTOR_AUTH_KEY=${INSTRUCTOR_AUTH_KEY:?not set - run ./lab-manager.sh deploy, which writes .runtime/runtime-secrets.env}
      - HLF_WEB_SECRET_KEY=${HLF_WEB_SECRET_KEY:?not set - run ./lab-manager.sh deploy, which writes .runtime/runtime-secrets.env}
      - HLF_INSTRUCTOR_USER=${HLF_INSTRUCTOR_USER:-}
      - HLF_INSTRUCTOR_KEY=${HLF_INSTRUCTOR_KEY:-}
      - INSTRUCTOR_AUDIT_LOG_PATH=/tmp/instructor-audit.log
      # The class gate (class_gate.py): on for a cloud class (lab-manager.sh --class-gate).
      - CLASS_GATE=${CLASS_GATE:-off}
      - CLASS_CODE=${CLASS_CODE:-}
      - CLASS_PASS_COOKIE_DOMAIN=${CLASS_PASS_COOKIE_DOMAIN:-}
      - CLASS_GATE_STATE_DIR=/var/lib/class-gate
    volumes:
      # A class code changed in the portal survives a restart and is shared by both workers.
      - class-gate-state:/var/lib/class-gate
    networks:
      router-net:
        aliases:
          - instructor-auth-service

volumes:
  class-gate-state:

networks:
  router-net:
    external: true
