name: exercises

# The day-3 trust and BGP games for the student launcher (docs/student-launcher-design.md). The same lab as
# docker-compose.yml, with the same project, service and container names (the router's upstreams). The game images are
# the classroom ones (each game's Dockerfile; nothing is bind-mounted); here they come from variables the launcher fills
# with release digests, and every container carries the course.lab and course.release labels.
# The secrets come from the launcher's env file (the variables runtime-credentials.sh writes in the classroom).
# HLF_INSTRUCTOR_COOKIE_SECRET stays optional, as in the classroom: local mode has no instructor.
#
# Images the launcher fills in (lab.yaml services; context is relative to this folder, dockerfile to the context).
# regression-tests/automated/launcher-stack.sh reads these lines to build them in CI:
# launcher-build: EXERCISES_INSIDER_IMAGE l03-i3-trust-game Dockerfile
# launcher-build: EXERCISES_BGP_IMAGE l03-i3-bgp-game Dockerfile
# Platforms: linux/amd64 and linux/arm64 (python:3.12-slim-trixie publishes both, 9 Nov 2026).

services:
  # The Inner Nginx Router
  insider:
    image: ${EXERCISES_INSIDER_IMAGE:?set by the student launcher}
    environment:
      - SECRET_KEY=${TRUST_GAME_SECRET_KEY:?set by the student launcher's env file}
      # Shared secret used to verify the hlf_instructor cookie minted by
      # the HLF runner. Falls back to HLF_WEB_SECRET_KEY if unset.
      - HLF_INSTRUCTOR_COOKIE_SECRET=${HLF_INSTRUCTOR_COOKIE_SECRET:-}
      - HLF_WEB_SECRET_KEY=${HLF_WEB_SECRET_KEY:?set by the student launcher's env file}
    labels:
      course.lab: exercises
      course.release: ${COURSE_RELEASE:?set by the student launcher}
    networks:
      - router-net

  bgp:
    image: ${EXERCISES_BGP_IMAGE:?set by the student launcher}
    environment:
      - SECRET_KEY=${BGP_GAME_SECRET_KEY:?set by the student launcher's env file}
      - HLF_INSTRUCTOR_COOKIE_SECRET=${HLF_INSTRUCTOR_COOKIE_SECRET:-}
      - HLF_WEB_SECRET_KEY=${HLF_WEB_SECRET_KEY:?set by the student launcher's env file}
    labels:
      course.lab: exercises
      course.release: ${COURSE_RELEASE:?set by the student launcher}
    networks:
      - router-net

networks:
  router-net:
    external: true
