# Lab manifest. Schema: dynamic-labs/lab.schema.json. Design: docs/student-launcher-design.md section 3.
# Measured 10 Nov 2026 on a 16 GB Windows 11 PC with student release 2026.11.10-11. memory_mb: the most Docker memory this
# lab's own containers held while in use (MiB, rounded up to 10; the router and lane-service are counted in their own files).
# approx_download_mb: compressed linux/amd64 image layers, each counted once (MiB). The launcher only shows the pull.
id: exercises
title: "Social Trust Lab: The Insider"
kind: lab
order:
  day: 1
  position: 0
compose_project: exercises
compose_file: docker-compose.yml
student_local: true
student_compose_file: docker-compose.launcher.yml
services:
  insider:
    source: build
    context: l03-i3-trust-game
    platforms:
    - linux/amd64
    - linux/arm64
  bgp:
    source: build
    context: l03-i3-bgp-game
    platforms:
    - linux/amd64
    - linux/arm64
networks:
- name: router-net
  internal: false
routes:
- routes/exercises.conf
uses_lane_service: false
entry:
  path: /exercises/insider/
memory_mb: 130
approx_download_mb: 63
data: []
keep_volumes_on_update: true
